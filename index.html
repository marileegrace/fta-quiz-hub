annel, or even a reversal setup. If it does eventually break out, reduce your expectations for the measured move \u2014 the stored energy isn't what it was.","incorrectFeedback":"Flags work BECAUSE they're brief pauses. The sharp impulse (pole) creates momentum that carries through a short consolidation. At 15 days, that momentum has faded. The pattern is likely morphing into something else \u2014 a range, channel, or potential reversal. Don't force-fit a label. Reassess with fresh eyes and adjust expectations accordingly.","chart":{"symbol":"TSLA","interval":"D","candles":[[200,205.8,199.02,204.51],[204.62,211.76,204.17,210.28],[210.31,210.61,208.5,208.82],[208.69,215.09,208.02,214.94],[214.82,214.9,212.92,213.26],[213.12,215.47,209.43,210.3],[210.29,219.9,209.07,215.29],[215.29,218.95,214.28,218.74],[218.87,223.24,217.91,223.04],[223.0,234.12,221.76,230.34],[230.37,231.08,229.2,229.42],[229.59,230.21,224.66,224.71],[224.59,227.82,223.93,227.27],[227.49,233.2,226.27,232.9],[233.1,233.38,230.76,231.29],[231.34,239.64,230.88,239.6],[239.45,239.58,238.9,238.93],[238.93,239.84,237.83,237.89],[237.85,238.02,237.81,238.0],[237.98,238.36,237.15,238.26],[238.27,238.42,238.25,238.36],[238.43,238.54,238.41,238.53],[238.39,239.48,238.11,238.99],[239.06,239.08,237.7,237.97],[237.98,240.56,235.84,236.1],[236.17,236.76,236.12,236.7],[236.49,236.6,235.84,235.9],[235.95,236.96,235.77,236.76],[236.89,236.91,236.64,236.68],[236.79,237.92,236.69,237.34],[237.37,237.56,236.39,236.52],[236.7,237.1,234.95,235.33],[235.19,235.29,233.8,234.45],[234.34,234.98,233.59,234.2],[234.3,234.34,232.66,233.43],[233.56,233.58,232.84,232.89],[232.68,232.75,231.05,231.75],[231.75,232.72,230.71,231.67]]}},{"module":"Module 1","topic":"Triangles & Flags","layer":3,"id":"M1-TF-015","status":"LIVE","scenario":"On the daily chart, a descending triangle is forming with flat support at $200 and lower highs. Zooming into the 1-hour chart, you notice a small bull flag forming just above $200. A student is confused by the conflicting signals between timeframes.","question":"A daily descending triangle has support at $200, but on the 1-hour chart a small bull flag is forming just above that level. How should you interpret these conflicting signals?","options":{"A":"The hourly bull flag overrides the daily descending triangle \u2014 always trust the smaller timeframe","B":"The daily descending triangle overrides everything \u2014 ignore the hourly chart completely","C":"The hourly bull flag near daily support could produce a bounce that becomes the daily triangle's next lower high. Use the hourly for timing and the daily for overall direction \u2014 the patterns nest together","D":"Conflicting timeframes mean the stock is untradeable \u2014 move on to another chart"},"correct":"C","correctFeedback":"Correct! Multi-timeframe analysis reveals how patterns nest together. The hourly bull flag at daily support suggests a short-term bounce is possible \u2014 but that bounce may only create the descending triangle's next lower high on the daily chart. Use the hourly for entry timing and the daily for directional bias. They're not conflicting; they're telling complementary parts of the same story.","incorrectFeedback":"These signals aren't truly conflicting \u2014 they operate on different scales. The hourly bull flag suggests a short-term bounce off the $200 support. But zoom out: that bounce likely forms the next lower high in the daily descending triangle. The hourly tells you WHEN (timing); the daily tells you WHERE (direction). They nest together into one coherent picture.","chart":{"symbol":"META","interval":"D","candles":[[220,220.2,217.31,217.6],[217.51,218.39,212.5,212.79],[212.66,212.77,209.9,210.45],[210.63,210.81,208.68,209.06],[208.94,217.29,200.73,200.78],[200.97,204.4,197.68,204.33],[204.23,204.52,201.6,202.49],[202.64,215.36,202.48,208.79],[208.92,217.71,199.71,216.81],[217.0,217.02,215.28,215.66],[215.45,215.87,209.23,211.67],[211.73,211.86,207.35,207.78],[207.78,213.02,203.82,204.15],[204.29,204.76,200.39,200.52],[200.58,211.7,200.42,206.0],[206.17,211.67,205.53,209.58],[209.4,212.2,209.08,211.84],[211.74,217.07,206.99,212.79],[212.99,213.92,205.17,206.95],[206.88,208.12,205.38,207.89],[207.77,207.79,204.67,205.18],[205.21,205.56,205.2,205.55],[205.45,205.61,200.56,200.68],[200.7,205.97,200.36,203.25],[203.18,203.69,202.49,202.49],[202.48,205.08,201.05,204.96],[204.9,210.16,204.5,210.02],[209.88,210.01,205.98,206.11],[206.1,206.24,204.53,204.72],[204.83,209.19,199.6,200.2],[198.69,200.3,198.69,200.3],[200.03,202.38,197.66,202.03],[202.23,203.83,200.61,203.54],[203.57,203.7,202.22,202.86],[202.8,205.32,202.58,205.26],[205.17,205.3,203.15,203.3],[203.43,203.89,201.49,201.8],[201.61,201.78,200.89,200.91]]}},{"module":"Module 1","topic":"Candlestick Patterns","layer":1,"id":"M1-CS-C01","status":"LIVE","scenario":"","question":"What does the 'body' of a candlestick represent?","options":{"A":"The distance between the high and low of the period","B":"The distance between the open and close of the period","C":"The total volume traded during the period","D":"The average price during the period"},"correct":"B","correctFeedback":"The body shows the distance between where the candle opened and where it closed. A green/white body means the close was higher than the open (bullish), and a red/black body means the close was lower (bearish).","incorrectFeedback":"The body specifically represents the open-to-close range. The high-to-low range (including wicks) is the total range of the candle."},{"module":"Module 1","topic":"Candlestick Patterns","layer":1,"id":"M1-CS-C02","status":"LIVE","scenario":"","question":"What does a long lower wick (shadow) on a candlestick tell you?","options":{"A":"Sellers dominated the entire session","B":"Price dropped during the session but buyers pushed it back up before the close","C":"The stock gapped down at the open","D":"Volume was unusually high"},"correct":"B","correctFeedback":"A long lower wick means price moved significantly lower during the session, but buyers stepped in and pushed price back up before the close. It shows rejection of lower prices \u2014 demand appeared at those lows.","incorrectFeedback":"Wicks tell the story of intra-session battle. A long lower wick = buyers rejected those lower prices. It doesn't tell you about volume or gaps \u2014 just that price visited the low and reversed."},{"module":"Module 1","topic":"Candlestick Patterns","layer":2,"id":"M1-CS-C03","status":"LIVE","scenario":"","question":"A student says: 'I see a hammer candle, so I'm buying immediately.' What's wrong with this reasoning?","options":{"A":"Hammers are always bearish, not bullish","B":"A single candlestick pattern needs context \u2014 where it forms matters more than the pattern itself","C":"You should only buy on doji candles, not hammers","D":"Hammers only work on weekly charts"},"correct":"B","correctFeedback":"Context is everything. A hammer at the bottom of a downtrend near support is meaningful. A hammer in the middle of nowhere or at the top of a rally means almost nothing. Always ask: where is this forming, and does the surrounding structure support a reversal?","incorrectFeedback":"A hammer is a reversal signal, but it only matters if there's something to reverse. Location (at support, after a downtrend) and confirmation (follow-through buying) are what make a hammer actionable."},{"module":"Module 1","topic":"Candlestick Patterns","layer":2,"id":"M1-CS-C04","status":"LIVE","scenario":"","question":"What's the key difference between a hammer and a hanging man?","options":{"A":"They look completely different \u2014 different body/wick structure","B":"They look identical \u2014 the difference is where they form (bottom of downtrend vs top of uptrend)","C":"A hammer has a longer wick than a hanging man","D":"A hammer is always green and a hanging man is always red"},"correct":"B","correctFeedback":"Hammer and hanging man have the same shape (small body, long lower wick). The name \u2014 and the implication \u2014 depends entirely on location. Bottom of a downtrend = hammer (bullish reversal signal). Top of an uptrend = hanging man (warning of potential reversal).","incorrectFeedback":"Same candle shape, different context. Location determines whether the pattern signals a potential bottom (hammer) or a potential top (hanging man)."},{"module":"Module 1","topic":"Candlestick Patterns","layer":3,"id":"M1-CS-C05","status":"LIVE","scenario":"","question":"Put these steps in the right order for acting on a bullish engulfing candle:","options":{"A":"Buy \u2192 Check location \u2192 Look for confirmation \u2192 Set stop loss","B":"Check location (is it at support or after a pullback?) \u2192 Confirm with volume or next candle \u2192 Plan entry with a stop below the engulfing low \u2192 Execute","C":"Set stop loss \u2192 Buy \u2192 Check what the pattern is \u2192 Confirm with volume","D":"Look for confirmation \u2192 Set stop loss \u2192 Check location \u2192 Buy"},"correct":"B","correctFeedback":"Location first, always. Is this engulfing candle at a level that matters (support, demand zone, trendline)? Then look for confirmation (volume, follow-through). Then plan the trade (entry, stop below engulfing low, target). Then execute.","incorrectFeedback":"The process always starts with context (where is this forming?), then confirmation, then planning, then execution. Buying before checking location is the #1 candlestick mistake beginners make."},{"module":"Module 1","topic":"Support & Resistance","layer":1,"id":"M1-SR-C01","status":"LIVE","scenario":"","question":"What is the basic definition of a 'support' level?","options":{"A":"A price level where buying pressure has historically overwhelmed selling pressure, causing price to bounce","B":"The lowest price a stock has ever traded at","C":"A price level set by market makers to prevent stocks from falling","D":"The 200-day moving average"},"correct":"A","correctFeedback":"Support is a price level where demand (buying) has historically been strong enough to stop price from falling further. It's identified by prior bounces \u2014 the more times price bounces off a level, the more significant that support becomes.","incorrectFeedback":"Support isn't a fixed barrier or something set by institutions. It's simply a price level where buyers have shown up before. Prior swing lows, bounces, and reactions all help identify support."},{"module":"Module 1","topic":"Support & Resistance","layer":1,"id":"M1-SR-C02","status":"LIVE","scenario":"","question":"A student says: 'Support and resistance are exact prices \u2014 $50.00 is support.' What would you correct?","options":{"A":"Nothing \u2014 support and resistance are exact prices","B":"Support and resistance are zones, not exact prices. Think of them as areas where price reacts, not a single penny.","C":"Support is exact but resistance is a zone","D":"Only weekly chart levels are exact; daily levels are zones"},"correct":"B","correctFeedback":"S/R levels are zones, not lines. Price might bounce at $49.80 one time and $50.30 the next \u2014 both are 'reacting to the $50 area.' Thinking in zones prevents you from getting shaken out by a few cents of overshoot.","incorrectFeedback":"Markets aren't precise to the penny. Support and resistance are areas where buying or selling interest clusters. Treating them as rigid lines leads to premature stops and missed entries."},{"module":"Module 1","topic":"Support & Resistance","layer":2,"id":"M1-SR-C03","status":"LIVE","scenario":"","question":"What is a support / resistance flip?","options":{"A":"When a support level breaks and then acts as resistance (or vice versa)","B":"When support and resistance levels swap positions on the chart","C":"When you flip your trade from long to short at a support level","D":"When the market reverses direction at the open"},"correct":"A","correctFeedback":"A support / resistance flip is one of the most powerful concepts in technical analysis. When price breaks below support, that old support level often becomes new resistance (sellers defend it). When price breaks above resistance, that level often becomes new support (buyers defend it).","incorrectFeedback":"The flip happens because market psychology changes at key levels. Traders who bought at old support are now underwater and may sell to break even when price returns \u2014 turning that support into resistance."},{"module":"Module 1","topic":"Support & Resistance","layer":3,"id":"M1-SR-C04","status":"LIVE","scenario":"","question":"You identify support at $100 and resistance at $110. Price breaks above $110 on strong volume and pulls back to $110. What are you watching for?","options":{"A":"A break back below $110 \u2014 the breakout failed","B":"Nothing \u2014 the trade is over once price reaches resistance","C":"Whether $110 holds as new support (support / resistance flip). If it does, that confirms the breakout and gives you a defined risk entry.","D":"Whether volume increases on the pullback"},"correct":"C","correctFeedback":"This is the classic support / resistance flip test. Old resistance at $110 should now act as support. If price bounces off $110 with a reaction candle, the flip is confirmed and you have a clean entry with a stop just below $110. If $110 breaks, the breakout likely failed.","incorrectFeedback":"After a breakout, the pullback to the old resistance level is your test. If it holds as support (the flip), you have confirmation and a low-risk entry. This is one of the highest-probability setups in trading."},{"module":"Module 1","topic":"Supply & Demand","layer":1,"id":"M1-SD-C01","status":"LIVE","scenario":"","question":"What's the difference between support/resistance and supply/demand zones?","options":{"A":"They're the same thing \u2014 just different names","B":"S/R are horizontal price levels based on prior reactions. Supply/demand zones are price ranges based on where institutional orders created sharp moves away from an area.","C":"Supply/demand zones only work on forex, not stocks","D":"Support/resistance is for day trading, supply/demand is for swing trading"},"correct":"B","correctFeedback":"S/R levels are identified by repeated bounces at a price. Supply/demand zones focus on where large orders (institutional activity) caused price to move sharply away from a range \u2014 those unfilled orders may still be sitting there, ready to push price again when it returns.","incorrectFeedback":"While they overlap, the concepts are different. S/R = where has price bounced before? Supply/demand = where did aggressive buying or selling create a sharp move, suggesting unfilled orders remain?"},{"module":"Module 1","topic":"Supply & Demand","layer":2,"id":"M1-SD-C02","status":"LIVE","scenario":"","question":"A student draws a demand zone by highlighting the entire candle bodies at a swing low. What's wrong with this approach?","options":{"A":"Nothing \u2014 that's the correct way to draw demand zones","B":"Zones should be drawn around the wicks, not the bodies. The wicks show where price was rejected \u2014 that's where the unfilled orders sit.","C":"Demand zones should only include the close prices","D":"You should only use the high of the candles"},"correct":"B","correctFeedback":"Demand zones are formed by wicks, not bodies. The wicks represent where price briefly dipped before institutional buyers aggressively pushed it back up. The zone spans from the body edge to the wick tip \u2014 that's the area where unfilled buy orders likely remain.","incorrectFeedback":"The wick area is where price was rejected. That rejection is the footprint of demand. Drawing zones around bodies makes them too wide and less precise for entries."},{"module":"Module 1","topic":"Supply & Demand","layer":3,"id":"M1-SD-C03","status":"LIVE","scenario":"","question":"You see a demand zone at $95-$97 that price has already bounced off twice. Price is approaching it a third time. Is this zone stronger or weaker than on the first test?","options":{"A":"Stronger \u2014 more bounces prove the zone is solid","B":"The same \u2014 zones don't change strength","C":"Weaker \u2014 each time price visits a zone, it absorbs some of the unfilled orders. By the third test, fewer orders remain to push price away.","D":"It depends on the day of the week"},"correct":"C","correctFeedback":"Zones get consumed with each test. Those institutional orders that created the zone get filled each time price returns. By the third visit, many of those orders have been absorbed. Fresh zones (first test) are strongest. The more touches, the more likely the zone eventually breaks.","incorrectFeedback":"Think of a zone like a pool of buy orders. Each bounce 'drains' some orders from the pool. Fresh, untested zones have the most potential. Zones that have been tested multiple times are running low on fuel."},{"module":"Module 1","topic":"Market Structure","layer":1,"id":"M1-MS-C01","status":"LIVE","scenario":"","question":"What defines an uptrend in terms of market structure?","options":{"A":"Price going up in a straight line","B":"Higher highs and higher lows \u2014 each swing high exceeds the prior high, and each pullback low is above the prior low","C":"Price being above the 50-day moving average","D":"More green candles than red candles"},"correct":"B","correctFeedback":"An uptrend is defined by higher highs (HH) and higher lows (HL). This shows that buyers are willing to pay more at each peak AND that sellers can't push price as low on each pullback. Both conditions must be present \u2014 higher highs alone with lower lows is not an uptrend.","incorrectFeedback":"Market structure is about the swing points, not the color of candles or moving averages. HH + HL = uptrend. LH + LL = downtrend. This is the foundation of reading any chart."},{"module":"Module 1","topic":"Market Structure","layer":2,"id":"M1-MS-C02","status":"LIVE","scenario":"","question":"What is a 'break of structure' (BOS)?","options":{"A":"When a candle has a very long wick","B":"When price breaks below a prior swing low in an uptrend (or above a prior swing high in a downtrend), signaling a potential trend change","C":"When the chart pattern breaks down","D":"When volume spikes above average"},"correct":"B","correctFeedback":"A break of structure occurs when the sequence of HH/HL (uptrend) or LH/LL (downtrend) is violated. In an uptrend, if price makes a lower low \u2014 breaking below the previous swing low \u2014 that's a BOS and warns the uptrend may be ending. It doesn't guarantee reversal, but it demands attention.","incorrectFeedback":"BOS is about swing points being violated. In an uptrend, the key question is: did price make a lower low? If yes, the higher-low pattern is broken and the trend is in question."},{"module":"Module 1","topic":"Market Structure","layer":3,"id":"M1-MS-C03","status":"LIVE","scenario":"","question":"You're watching a stock in a clear uptrend (HH/HL). It makes a lower high but the subsequent low is still a higher low. What's the market structure telling you?","options":{"A":"The uptrend is over \u2014 sell immediately","B":"Nothing has changed \u2014 it's still an uptrend","C":"Warning sign: momentum is slowing (couldn't make a new high) but the trend isn't broken yet because the higher low pattern holds. Watch the next low carefully.","D":"Switch to a lower timeframe to find the answer"},"correct":"C","correctFeedback":"A lower high within an uptrend is an early warning, not a confirmed reversal. The trend is defined by higher lows \u2014 until that breaks, the uptrend structure is technically intact. But the lower high shows buyers are getting weaker. The next swing low is the critical test: higher low = trend continues, lower low = BOS.","incorrectFeedback":"Don't panic on a lower high alone, but don't ignore it either. The higher low is the lifeline of the uptrend. If the next low is still higher than the prior low, the trend holds. If not, structure breaks."},{"module":"Module 1","topic":"Double Tops & Bottoms","layer":1,"id":"M1-DT-C01","status":"LIVE","scenario":"","question":"What confirms a double top pattern?","options":{"A":"Two touches of the same high \u2014 the pattern is confirmed as soon as the second high forms","B":"Price breaking below the valley (neckline) between the two peaks \u2014 the pattern isn't confirmed until the support between the highs breaks","C":"The second high being exactly the same price as the first","D":"Volume increasing on the second high"},"correct":"B","correctFeedback":"A double top is NOT confirmed just because price hit the same high twice. It's confirmed when price breaks below the neckline (the low between the two peaks). Until that break, it could just be consolidation. The neckline break is what triggers the pattern and gives you your target.","incorrectFeedback":"Two touches of resistance is just resistance \u2014 it becomes a double top only when the neckline breaks. Many students jump the gun by selling at the second high before confirmation."},{"module":"Module 1","topic":"Double Tops & Bottoms","layer":2,"id":"M1-DT-C02","status":"LIVE","scenario":"","question":"Your friend says: 'The second high in a double top must be the exact same price as the first.' Is this correct?","options":{"A":"Yes \u2014 if they're not the exact same price, it's not a double top","B":"No \u2014 the second high can be slightly higher or lower. What matters is that price fails to sustain above the first high's area and reverses.","C":"The second high must be at least 5% higher","D":"Only the closing prices need to match, not the wicks"},"correct":"B","correctFeedback":"In practice, double tops rarely have the exact same high. The second peak might be $0.50 above or below the first \u2014 what matters is the failure to break decisively above resistance and the subsequent reversal. Requiring exact prices would eliminate most real-world double tops.","incorrectFeedback":"Markets don't produce perfect patterns. The concept is about rejection at the same area, not the same penny. A second high that slightly exceeds the first and then reverses is sometimes called a 'throw-over' \u2014 still a valid double top."},{"module":"Module 1","topic":"Head & Shoulders","layer":1,"id":"M1-HS-C01","status":"LIVE","scenario":"","question":"In a head and shoulders pattern, what is the 'neckline'?","options":{"A":"A horizontal line drawn at the head (highest point)","B":"A trendline connecting the two troughs between the left shoulder, head, and right shoulder","C":"The average of all three peaks","D":"A line drawn at the lowest point of the pattern"},"correct":"B","correctFeedback":"The neckline connects the two lows \u2014 the trough after the left shoulder and the trough after the head. It can be horizontal or sloped. The pattern is confirmed when price breaks below the neckline, and the measured move target equals the distance from the head to the neckline.","incorrectFeedback":"The neckline is the support connecting the two valleys in the pattern. It's the trigger line \u2014 a break below it confirms the H&S and gives you a price target equal to the head-to-neckline distance projected downward."},{"module":"Module 1","topic":"Head & Shoulders","layer":2,"id":"M1-HS-C02","status":"LIVE","scenario":"","question":"What does declining volume across the left shoulder \u2192 head \u2192 right shoulder suggest?","options":{"A":"The pattern is invalid \u2014 you need increasing volume","B":"Diminishing buying conviction: fewer participants are pushing price higher on each peak, confirming the pattern's bearish implications","C":"The stock is being delisted","D":"You should switch to a longer timeframe"},"correct":"B","correctFeedback":"Classic H&S shows volume declining from left shoulder to head to right shoulder. This tells you that each rally has less participation \u2014 buyers are drying up. The breakdown below the neckline often comes with a volume spike as sellers take control. Declining volume across the peaks strengthens the pattern's reliability.","incorrectFeedback":"Volume tells the conviction story. If each successive peak has less volume, buying interest is waning. The pattern is a visual representation of an exhausted uptrend."},{"module":"Module 1","topic":"Triangles & Flags","layer":1,"id":"M1-TF-C01","status":"LIVE","scenario":"","question":"What's the difference between a triangle and a flag?","options":{"A":"They're the same pattern with different names","B":"A triangle has converging trendlines (price compresses). A flag is a parallel channel that slopes against the prior trend \u2014 it follows a strong impulse move (the 'pole').","C":"Triangles are bullish and flags are bearish","D":"Flags only occur on daily charts"},"correct":"B","correctFeedback":"Key distinction: triangles converge (support and resistance squeeze together). Flags have parallel boundaries that slope against the prior move \u2014 they follow a sharp impulse (the pole) and represent a brief pause before continuation. Both are continuation patterns, but the structure is different.","incorrectFeedback":"A triangle compresses; a flag drifts. Flags also require a 'pole' \u2014 a sharp move preceding the pattern. Without the pole, it's just a channel, not a flag."},{"module":"Module 1","topic":"Triangles & Flags","layer":2,"id":"M1-TF-C02","status":"LIVE","scenario":"","question":"In an ascending triangle, where does the pattern typically break?","options":{"A":"To the downside \u2014 the flat resistance always holds","B":"It's completely random \u2014 50/50 either direction","C":"Typically to the upside \u2014 the higher lows show increasing buying pressure squeezing into flat resistance until it gives way","D":"Sideways \u2014 triangles don't break, they just keep compressing"},"correct":"C","correctFeedback":"Ascending triangles have a bullish bias because the higher lows demonstrate increasing demand. Buyers keep stepping in at higher prices while sellers defend the same resistance. Eventually, the buying pressure overwhelms the resistance and price breaks upward. It's not guaranteed, but the probability favors an upside break.","incorrectFeedback":"Higher lows = buyers getting more aggressive. Flat resistance = sellers defending the same level. When buyers keep raising their bids while sellers don't, the sellers eventually run out of supply to sell."},{"module":"Module 1","topic":"Triangles & Flags","layer":3,"id":"M1-TF-C03","status":"LIVE","scenario":"","question":"A bull flag breaks out but volume is declining on the breakout candle. How does this affect your confidence in the trade?","options":{"A":"Volume doesn't matter for flags","B":"It's a red flag \u2014 breakouts should ideally come with above-average volume to confirm conviction. Low-volume breakouts are more likely to fail.","C":"Declining volume is actually better \u2014 it means no one is selling","D":"You should only look at volume on daily charts"},"correct":"B","correctFeedback":"Volume confirms breakouts. A bull flag breakout on declining volume lacks conviction \u2014 there aren't enough buyers stepping in to sustain the move. Strong breakouts from flags should show a volume surge as buyers pile in. Low-volume breakouts are more prone to false breaks and fade-backs into the flag.","incorrectFeedback":"Think of volume as the fuel for the breakout. Without fuel, the move can sputter and reverse. This doesn't mean every low-volume breakout fails, but it significantly reduces your confidence and might warrant a smaller position or tighter stop."},{"module":"Module 1","topic":"Trend Lines","layer":1,"id":"M1-TL-C01","status":"LIVE","scenario":"","question":"How many touch points do you need to draw a valid trendline?","options":{"A":"One \u2014 any single point defines a trend","B":"Two points to draw the line, but three or more touches to validate it as significant","C":"Exactly five touches \u2014 no more, no less","D":"Touch points don't matter \u2014 you draw trendlines wherever they look right"},"correct":"B","correctFeedback":"Two points define any line \u2014 but that's just geometry, not a tradeable trendline. The third touch is what gives the trendline significance: it proves the market respects that angle. The more touches (3, 4, 5+), the more meaningful the trendline becomes.","incorrectFeedback":"Any two points make a line. The third touch validates it. More touches = more significance. But be careful: a trendline with many touches has also been tested many times, and each test weakens it slightly."},{"module":"Module 1","topic":"Trend Lines","layer":2,"id":"M1-TL-C02","status":"LIVE","scenario":"","question":"Should trendlines be drawn through candle bodies or wicks?","options":{"A":"Always through bodies \u2014 wicks are noise","B":"Always through wicks \u2014 they show the true extremes","C":"There's no single right answer \u2014 some traders use bodies, some use wicks. Consistency matters more than which method you choose.","D":"Through the midpoint of each candle"},"correct":"C","correctFeedback":"Both approaches have merit. Wick-to-wick captures the absolute extremes. Body-to-body captures where price actually settled. The important thing is to be consistent with your method so your trendlines are reliable and repeatable. Pick one approach and stick with it.","incorrectFeedback":"This is a genuine 'it depends' answer. Consistency is what matters \u2014 if you draw with wicks, always draw with wicks. Mixing methods makes your trendlines unreliable."},{"module":"Module 1","topic":"Impulse vs Consolidation","layer":1,"id":"M1-IC-C01","status":"LIVE","scenario":"","question":"What is the difference between an impulse move and a consolidation phase?","options":{"A":"Impulse moves are always bullish, consolidation is always bearish","B":"An impulse move is a strong directional push (large candles, clear direction). Consolidation is a pause where price moves sideways in a range as the market digests the prior move.","C":"Impulse moves happen on high timeframes, consolidation on low timeframes","D":"There is no difference \u2014 they're the same thing"},"correct":"B","correctFeedback":"Impulse moves are the trending legs \u2014 strong, directional, with big candles and momentum. Consolidation is the pause between impulses \u2014 price chops sideways in a range. Understanding which phase the market is in tells you whether to use trending strategies (ride the move) or range strategies (buy support, sell resistance).","incorrectFeedback":"Markets alternate between impulse and consolidation. Impulse = directional push (trade with momentum). Consolidation = sideways chop (trade the range or wait for breakout). Applying the wrong strategy to the wrong phase is a common mistake."},{"module":"Module 1","topic":"Impulse vs Consolidation","layer":2,"id":"M1-IC-C02","status":"LIVE","scenario":"","question":"You notice a stock has been in a tight consolidation range for 15 days after a strong rally. What does this typically set up?","options":{"A":"The stock is dead \u2014 nothing will happen","B":"A breakout in the direction of the prior trend (continuation) is more likely, because the consolidation represents a pause, not a reversal. But you should wait for the breakout and not anticipate it.","C":"A guaranteed reversal \u2014 long consolidation always means reversal","D":"You should sell immediately because consolidation means sellers are winning"},"correct":"B","correctFeedback":"Consolidation after a trend tends to resolve in the direction of the prior move (continuation). The pause represents profit-taking and digestion, not a change in direction. But never anticipate \u2014 wait for price to break out of the range with volume confirmation before entering.","incorrectFeedback":"Tight consolidation after a strong move is often a continuation pattern (think: bull flag or pennant). The energy compresses and then releases. Statistically, continuation is more likely than reversal, but confirmation is still required."},{"module":"Module 2","topic":"RSI & Divergence","layer":1,"id":"M2-RS-C01","status":"LIVE","scenario":"","question":"What does RSI measure?","options":{"A":"The stock's price relative to its 52-week high","B":"The speed and magnitude of recent price changes \u2014 it compares the average of up moves to the average of down moves over a period","C":"The total volume traded","D":"How correlated the stock is with the S&P 500"},"correct":"B","correctFeedback":"RSI (Relative Strength Index) measures momentum \u2014 specifically, the ratio of average gains to average losses over a lookback period (typically 14). It oscillates between 0 and 100. Above 70 is 'overbought,' below 30 is 'oversold' \u2014 but these are guides, not automatic signals.","incorrectFeedback":"RSI is a momentum oscillator. It tells you how strong recent up moves are relative to recent down moves. It's not about price level, volume, or correlation."},{"module":"Module 2","topic":"RSI & Divergence","layer":2,"id":"M2-RS-C02","status":"LIVE","scenario":"","question":"A student says: 'RSI is above 70, so the stock is overbought and I should sell.' What's the problem with this logic?","options":{"A":"RSI above 70 actually means you should buy more","B":"Overbought doesn't mean 'sell.' In strong uptrends, RSI can stay above 70 for extended periods. Overbought means momentum is strong \u2014 it's a warning to be cautious, not an automatic sell signal.","C":"RSI only works below 30","D":"You should wait until RSI hits exactly 100"},"correct":"B","correctFeedback":"This is one of the most common RSI mistakes. In a strong trend, RSI can remain overbought for weeks or months. Selling just because RSI is above 70 would have gotten you out of every major rally far too early. Overbought = strong momentum. Use it as context, not a trigger.","incorrectFeedback":"RSI overbought/oversold readings are most useful in ranges, not trends. In a trending market, RSI staying elevated actually confirms the trend's strength. Selling on RSI > 70 alone fights the trend."},{"module":"Module 2","topic":"RSI & Divergence","layer":3,"id":"M2-RS-C03","status":"LIVE","scenario":"","question":"What is bearish RSI divergence and why does it matter?","options":{"A":"RSI and price both making higher highs \u2014 confirms the trend","B":"Price makes a higher high but RSI makes a lower high \u2014 momentum is weakening even as price pushes higher, warning of a potential reversal","C":"RSI drops below 30 \u2014 it means the stock is oversold","D":"RSI crossing above 50 while price drops"},"correct":"B","correctFeedback":"Bearish divergence: price makes a new high but RSI can't match it (lower high on RSI). This mismatch reveals that momentum is fading behind the scenes \u2014 fewer traders are pushing with conviction. It doesn't mean sell immediately, but it's a warning that the rally may be running out of steam.","incorrectFeedback":"Divergence is about disagreement between price and momentum. When price says 'new high' but RSI says 'actually, we're weaker than last time,' something is changing under the surface. It's an early warning, not a guaranteed reversal."},{"module":"Module 2","topic":"Moving Averages","layer":1,"id":"M2-MA-C01","status":"LIVE","scenario":"","question":"What's the difference between a simple moving average (SMA) and an exponential moving average (EMA)?","options":{"A":"SMA weights all periods equally. EMA gives more weight to recent prices, making it react faster to new price data.","B":"SMA is for stocks, EMA is for options","C":"They're the same calculation with different names","D":"SMA uses closing prices, EMA uses opening prices"},"correct":"A","correctFeedback":"SMA averages all closing prices equally over the period (e.g., 20-day SMA = sum of last 20 closes \u00f7 20). EMA applies a multiplier that gives more weight to recent prices, so it responds faster to current price action. EMA is generally better for shorter-term signals, SMA for longer-term trends.","incorrectFeedback":"The key distinction is weighting. SMA treats all days equally \u2014 a price from 20 days ago has the same influence as yesterday. EMA decays older data, emphasizing recent action."},{"module":"Module 2","topic":"Moving Averages","layer":2,"id":"M2-MA-C02","status":"LIVE","scenario":"","question":"Price pulls back to the 20 EMA in an uptrend and bounces. Why do moving averages often act as support or resistance?","options":{"A":"It's a coincidence \u2014 moving averages have no real influence","B":"Because many traders watch the same MAs (20, 50, 200), their collective buying and selling at these levels creates a self-fulfilling prophecy","C":"Moving averages are set by exchanges as automatic buy/sell levels","D":"MAs create physical price barriers that price cannot cross"},"correct":"B","correctFeedback":"Moving averages work as dynamic support/resistance because of self-fulfilling prophecy. When enough traders use the same MAs, they place orders around those levels. The 20 EMA, 50 SMA, and 200 SMA are widely watched \u2014 when price approaches them, the cluster of orders creates actual support or resistance.","incorrectFeedback":"MAs have no inherent magical power. Their value comes from the number of traders watching them. The more eyes on a level, the more orders cluster there, and the more likely price reacts to it."},{"module":"Module 2","topic":"Volume","layer":1,"id":"M2-VO-C01","status":"LIVE","scenario":"","question":"Why is volume important when confirming a breakout?","options":{"A":"Volume doesn't matter for breakouts","B":"High volume on a breakout shows conviction \u2014 many participants are driving the move. Low volume breakouts lack conviction and are more likely to be false breakouts that reverse.","C":"You should only look at volume on the day before the breakout","D":"Volume confirms a breakout only if it's exactly double the average"},"correct":"B","correctFeedback":"Volume = conviction. A breakout on heavy volume means lots of traders are participating in the move \u2014 it has fuel. A breakout on light volume means few traders are behind it \u2014 the move may not sustain. Think of volume as the exclamation point (or lack thereof) on a price move.","incorrectFeedback":"Volume confirms (or denies) the validity of a price move. Strong move + high volume = real. Strong move + low volume = suspicious. This applies to breakouts, breakdowns, and reversals."},{"module":"Module 3","topic":"Wave Structure","layer":1,"id":"M3-EW-C01","status":"LIVE","scenario":"","question":"What is the basic structure of an Elliott Wave impulse pattern?","options":{"A":"3 waves up, 2 waves down","B":"5 waves in the direction of the trend (impulse), followed by 3 corrective waves \u2014 the '5-3' structure","C":"7 waves alternating up and down","D":"2 impulse waves and 1 correction"},"correct":"B","correctFeedback":"The Elliott Wave impulse pattern is 5 waves: waves 1, 3, and 5 move in the trend direction (motive waves), while waves 2 and 4 are corrections. This is followed by a 3-wave corrective structure (A-B-C). The full cycle is 5 + 3 = 8 waves.","incorrectFeedback":"The core structure is 5 motive waves followed by 3 corrective waves. Waves 1, 3, 5 are with the trend; waves 2, 4 are pullbacks. The 3-wave correction (A-B-C) retraces part of the impulse."},{"module":"Module 3","topic":"Wave Rules","layer":2,"id":"M3-EW-C02","status":"LIVE","scenario":"","question":"What are the three inviolable rules of Elliott Wave Theory?","options":{"A":"Wave 2 cannot retrace more than 100% of wave 1; wave 3 cannot be the shortest of waves 1, 3, 5; wave 4 cannot overlap wave 1's price territory","B":"All waves must be the same length; waves must alternate colors; wave 5 must be the longest","C":"Wave 1 must be bullish; wave 3 must gap up; wave 5 must have declining volume","D":"There are no rules \u2014 Elliott Wave is subjective"},"correct":"A","correctFeedback":"The three rules are absolute \u2014 if any are violated, the wave count is wrong. (1) Wave 2 can't go below the start of wave 1. (2) Wave 3 can't be the shortest impulse wave. (3) Wave 4 can't enter wave 1's territory. These rules constrain your count and eliminate invalid interpretations.","incorrectFeedback":"Elliott Wave has three non-negotiable rules that help you validate (or invalidate) a wave count. If your count violates any of these, it's wrong \u2014 go back and recount."},{"module":"Module 5","topic":"Risk-to-Reward","layer":1,"id":"M5-RR-C01","status":"LIVE","scenario":"","question":"What does a 3:1 risk-to-reward ratio mean?","options":{"A":"You risk $3 for every $1 of potential profit","B":"Your potential profit is 3 times your potential loss \u2014 for example, risking $100 to potentially make $300","C":"You need to win 3 out of every 4 trades to be profitable","D":"Your stop loss is 3% below entry"},"correct":"B","correctFeedback":"A 3:1 R:R means your target (reward) is 3x your stop (risk). If you risk $100 (stop loss), your target is $300 (profit). With a 3:1 ratio, you only need to win about 25% of your trades to break even. Good R:R lets you be wrong more often and still be profitable.","incorrectFeedback":"R:R compares potential profit to potential loss. At 3:1, you make $3 for every $1 you risk. The higher the R:R, the lower your required win rate to be profitable."},{"module":"Module 5","topic":"Risk-to-Reward","layer":2,"id":"M5-RR-C02","status":"LIVE","scenario":"","question":"A trader has a 40% win rate. Can they be profitable?","options":{"A":"Never \u2014 you need at least 50% to make money","B":"Yes \u2014 if their average winner is significantly larger than their average loser (high R:R ratio). A 40% win rate with 3:1 R:R is very profitable.","C":"Only if they trade options","D":"Only on paper \u2014 not with real money"},"correct":"B","correctFeedback":"Win rate alone doesn't determine profitability \u2014 it's win rate \u00d7 average win vs. loss rate \u00d7 average loss. At 40% win rate with 3:1 R:R: you win $3 \u00d7 40% = $1.20 per trade on average, and lose $1 \u00d7 60% = $0.60. Net positive $0.60 per trade. Many successful traders have win rates below 50%.","incorrectFeedback":"Profitability = (win rate \u00d7 avg win) - (loss rate \u00d7 avg loss). A low win rate is completely fine if your winners are substantially larger than your losers. This is why R:R and position sizing matter more than being 'right' most of the time."},{"module":"Module 5","topic":"Trade Thesis","layer":1,"id":"M5-TT-C01","status":"LIVE","scenario":"","question":"What are the three essential components of a trade thesis?","options":{"A":"Ticker symbol, date, and gut feeling","B":"Entry, stop loss, and profit target \u2014 every trade needs a defined plan for where to get in, where you're wrong, and where you take profit","C":"Buy low, sell high, repeat","D":"Moving average crossover, RSI confirmation, and volume"},"correct":"B","correctFeedback":"Every trade should have: (1) Entry \u2014 the specific price and conditions for getting in. (2) Stop loss \u2014 where the trade idea is invalidated (you're wrong). (3) Target \u2014 where you take profit. Without all three, you don't have a plan \u2014 you have a gamble.","incorrectFeedback":"A trade thesis is your written plan before entering. Entry tells you when to act, stop loss limits your downside, and target defines your reward. If you can't state all three, you're not ready to trade."},{"module":"Module 7","topic":"Confirmation Bias","layer":1,"id":"M7-CB-C01","status":"LIVE","scenario":"","question":"What is confirmation bias in trading?","options":{"A":"Waiting for a trade to be confirmed by multiple indicators before entering","B":"The tendency to seek out information that supports your existing view while ignoring evidence that contradicts it \u2014 e.g., only looking for bullish signals after you've decided to buy","C":"Confirming your trade with a mentor before executing","D":"Using two screens to confirm the same chart"},"correct":"B","correctFeedback":"Confirmation bias is one of the most dangerous psychological traps in trading. Once you form an opinion ('this stock is going up'), your brain naturally filters for evidence that agrees and dismisses evidence that disagrees. The antidote: actively look for reasons your trade is WRONG before entering.","incorrectFeedback":"Confirmation bias isn't about confirming trades with indicators \u2014 it's about your brain's tendency to only see what supports your view. The cure is to deliberately seek the bear case when you're bullish and the bull case when you're bearish."},{"module":"Module 7","topic":"Emotional Discipline","layer":2,"id":"M7-PS-C01","status":"LIVE","scenario":"","question":"You take a loss and immediately want to re-enter to 'make it back.' What is this behavior called and why is it dangerous?","options":{"A":"Smart trading \u2014 you should always re-enter after a loss","B":"Revenge trading \u2014 you're trading to recover an emotional loss rather than following your system. It usually leads to bigger losses because you're making impulsive decisions driven by frustration, not analysis.","C":"Dollar-cost averaging \u2014 a solid strategy","D":"Hedging your position"},"correct":"B","correctFeedback":"Revenge trading is when emotions (frustration, anger, the need to 'get even') override your system. The market doesn't owe you anything. Each trade is independent \u2014 the last loss has no bearing on the next setup. Step away, reset, and only re-enter when a fresh setup meets your criteria.","incorrectFeedback":"Revenge trading is driven by emotion, not edge. After a loss, take a break. Your next trade should come from your system, not from the urge to break even. The market doesn't know or care about your last trade."},{"module":"Module 7","topic":"Emotional Resilience","layer":1,"id":"M7-ER-C01","status":"LIVE","scenario":"","question":"What's the difference between a bad trade and a losing trade?","options":{"A":"They're the same thing \u2014 any trade that loses money is a bad trade","B":"A losing trade followed your plan and hit your stop \u2014 that's normal. A bad trade broke your rules (entered without a plan, moved your stop, sized too big). You can have good trades that lose and bad trades that win.","C":"A bad trade is one where you lose more than $100","D":"A losing trade is one that lasted less than a day"},"correct":"B","correctFeedback":"This distinction is crucial for long-term success. A losing trade that followed your rules is just variance \u2014 part of the game. A winning trade that broke your rules is actually dangerous because it reinforces bad habits. Judge your trades by the process, not the outcome.","incorrectFeedback":"Process over outcome. Did you follow your plan? Then it was a good trade even if it lost money. Did you break your rules? Then it was a bad trade even if it made money. This mindset shift separates amateurs from professionals."}];

var MODULES={};
var meta={module:null,topic:null};
var qzQ=[],cQ=0,score=0,ansd=false,uAns=[],view="home";
var layerFilter=null; // null=all layers, or array like [1] or [1,2]

// Build module/topic index
for(var i=0;i<Q.length;i++){
  var q=Q[i],m=q.module,t=q.topic;
  if(!MODULES[m])MODULES[m]={};

}

// Persist layer filter in localStorage
function loadLayerFilter(){layerFilter=null;} // always default to All Layers
function saveLayerFilter(){localStorage.setItem("fta_layer_filter",JSON.stringify(layerFilter))}
loadLayerFilter();

function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function shuf(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=b[i];b[i]=b[j];b[j]=tmp}return b}
function filterByLayer(arr){if(!layerFilter)return arr;return arr.filter(function(q){return layerFilter.indexOf(q.layer)!==-1})}
function flatMod(m){var arr=[];var ts=MODULES[m];for(var t in ts){for(var i=0;i<ts[t].length;i++)arr.push(ts[t][i])}return filterByLayer(arr)}

function getH(){try{return JSON.parse(localStorage.getItem("fta_quiz_history"))||[]}catch(e){return[]}}
function saveR(m,s,t,ans){var h=getH();h.push({module:m.module,topic:m.topic||null,score:s,total:t,date:new Date().toISOString(),answers:ans});localStorage.setItem("fta_quiz_history",JSON.stringify(h))}
function updStrk(){var h=getH();if(!h.length){document.getElementById("strk").textContent="0 day streak";return}
var days={};for(var i=0;i<h.length;i++){var d=h[i].date.split("T")[0];days[d]=true}
var today=new Date();var streak=0;var check=new Date(today);
for(var j=0;j<365;j++){var ds=check.toISOString().split("T")[0];if(days[ds])streak++;else if(j>0)break;check.setDate(check.getDate()-1)}
document.getElementById("strk").textContent=streak+" day streak"}

function buildSB(){
  var sb=document.getElementById("sidebar");
  var h="<div class=\"shm\" onclick=\"goHome()\">Home</div>";
  // Layer filter bar in sidebar
  h+="<div class=\"lf-bar\"><span class=\"lf-label\">Layers:</span>";
  for(var lv=1;lv<=3;lv++){
    var active=!layerFilter||layerFilter.indexOf(lv)!==-1;
    h+="<button class=\"lf-btn"+(active?" lf-on":"")+"\" onclick=\"togLayer("+lv+")\">L"+lv+"</button>";
  }
  h+="</div>";
  var mods=Object.keys(MODULES).sort();
  for(var mi=0;mi<mods.length;mi++){
    var m=mods[mi],ts=Object.keys(MODULES[m]).sort(),cnt=flatMod(m).length;
    h+="<div class=\"sbs\"><div class=\"mh\" onclick=\"togMod(this)\"><span class=\"mhn\">"+esc(m)+(MN[m]?" - "+esc(MN[m]):"")+"</span><span class=\"mha\">&#9654;</span></div>";
    h+="<div class=\"tl\">";
    h+="<div class=\"ti\" onclick=\"startFromSB('"+esc(m)+"',null)\">All Topics <span class=\"cn\">"+cnt+"</span></div>";
    for(var ti=0;ti<ts.length;ti++){
      var t=ts[ti],tc=filterByLayer(MODULES[m][t]).length;
      h+="<div class=\"ti\" onclick=\"startFromSB('"+esc(m)+"','"+esc(t).replace(/'/g,"&#39;")+"')\">"+esc(t)+" <span class=\"cn\">"+tc+"</span></div>";
    }
    h+="</div></div>";
  }
  sb.innerHTML=h;
}

function togMod(el){var a=el.querySelector(".mha");var tl=el.nextElementSibling;a.classList.toggle("op");tl.classList.toggle("op")}
function togLayer(lv){
  if(!layerFilter){
    // Currently showing all — switch to just this layer
    layerFilter=[lv];
  } else if(layerFilter.indexOf(lv)!==-1){
    // Layer is on — turn it off
    layerFilter=layerFilter.filter(function(x){return x!==lv});
    if(layerFilter.length===0) layerFilter=null; // all off = show all
  } else {
    // Layer is off — turn it on
    layerFilter.push(lv);
    layerFilter.sort();
    if(layerFilter.length===3) layerFilter=null; // all 3 on = show all
  }
  saveLayerFilter();
  buildSB();
  if(view==="home") renderHome();
  else if(view==="setup" && meta.module) pickMod(meta.module);
}
function startFromSB(m,t){meta={module:m,topic:t};startQ()}
function goHome(){destroyCharts();view="home";renderHome()}

function renderHome(){
  var mods=Object.keys(MODULES).sort();
  var h="<div class=\"hm\"><h2>Choose a Module</h2><p>Select a module to start a 10-question randomized quiz. Track your progress and build your streak.</p><div class=\"cds\">";
  for(var i=0;i<mods.length;i++){
    var m=mods[i],tpc=Object.keys(MODULES[m]).length;
    h+="<div class=\"cd\" onclick=\"pickMod('"+esc(m)+"')\"><div class=\"cn\">"+esc(m)+"</div><div class=\"ct\">"+esc(MN[m]||m)+"</div><div class=\"cm\">"+tpc+" topics</div></div>";
  }
  h+="</div></div>";
  document.getElementById("main").innerHTML=h;
}

function pickMod(m){
  meta={module:m,topic:null};view="setup";
  var ts=Object.keys(MODULES[m]).sort();
  var fcnt=flatMod(m).length;
  var h="<div class=\"su\"><h2>"+esc(MN[m]||m)+"</h2><div class=\"ss\">"+esc(m)+" &middot; "+fcnt+" questions"+(layerFilter?" (filtered)":"")+"</div>";
  // Layer filter in setup screen
  h+="<div class=\"sc\"><h3>Difficulty Layer</h3>";
  h+="<p class=\"lf-desc\">Each question is tagged by difficulty. <b>Layer 1 (Identify)</b> tests if you can recognize a concept on a chart. <b>Layer 2 (Apply)</b> asks you to use what you know to make a decision. <b>Layer 3 (Synthesize)</b> combines multiple concepts and asks you to think critically. Start with Layer 1 if you're new to a topic.</p>";
  h+="<div class=\"cps lf-setup\">";
  h+="<div class=\"cp"+((!layerFilter)?" sl":"")+"\" onclick=\"setLayers(null)\">All Layers</div>";
  for(var lv=1;lv<=3;lv++){
    var lActive=layerFilter&&layerFilter.length===1&&layerFilter[0]===lv;
    h+="<div class=\"cp"+(lActive?" sl":"")+"\" onclick=\"setLayers(["+lv+"])\">Layer "+lv+": "+LN[lv]+"</div>";
  }
  var l12=layerFilter&&layerFilter.length===2&&layerFilter.indexOf(1)!==-1&&layerFilter.indexOf(2)!==-1;
  h+="<div class=\"cp"+(l12?" sl":"")+"\" onclick=\"setLayers([1,2])\">Layers 1 &amp; 2</div>";
  h+="</div></div>";
  h+="<div class=\"sc\"><h3>Quiz Scope</h3><div class=\"cps\">";
  h+="<div class=\"cp sl\" id=\"cp-all\" onclick=\"selScope(null)\">All Topics <span class=\"cc\">"+fcnt+"</span></div>";
  for(var i=0;i<ts.length;i++){
    var t=ts[i],tc=filterByLayer(MODULES[m][t]).length;
    h+="<div class=\"cp\" id=\"cp-"+i+"\" onclick=\"selScope('"+esc(t).replace(/'/g,"&#39;")+"',"+i+")\">"+esc(t)+" <span class=\"cc\">"+tc+"</span></div>";
  }
  h+="</div></div>";
  // Add options chain reference for Module 6
  if (m === "Module 6") {
    h += optionsChainHTML();
  }
  h+="<button class=\"gb\" onclick=\"startQ()\">Start Quiz</button></div>";
  document.getElementById("main").innerHTML=h;
}
function setLayers(arr){layerFilter=arr;saveLayerFilter();buildSB();if(meta.module)pickMod(meta.module)}

      '<th colspan="7" class="header-puts">PUTS</th>' +
    '</tr>' +
    '<tr>' +
      '<th><span class="oc-anno">OI<span class="oc-tip"><b>Open Interest</b> — Total number of outstanding contracts at this strike. High OI = more liquid, tighter spreads.</span></span></th>' +
      '<th><span class="oc-anno">Vol<span class="oc-tip"><b>Volume</b> — Number of contracts traded today. Compare to OI to gauge unusual activity.</span></span></th>' +
      '<th><span class="oc-anno">Bid<span class="oc-tip"><b>Bid Price</b> — The highest price a buyer is willing to pay. This is what you get if you sell.</span></span></th>' +
      '<th><span class="oc-anno">Ask<span class="oc-tip"><b>Ask Price</b> — The lowest price a seller is asking. This is what you pay if you buy.</span></span></th>' +
      '<th><span class="oc-anno">Last<span class="oc-tip"><b>Last Price</b> — The price of the most recent trade for this contract.</span></span></th>' +
      '<th><span class="oc-anno">\u0394 Delta<span class="oc-tip"><b>Delta</b> — How much the option price moves per $1 move in the stock. Calls: 0 to 1. Puts: 0 to -1. ATM options have ~0.50 delta.</span></span></th>' +
      '<th><span class="oc-anno">\u0398 Theta<span class="oc-tip"><b>Theta</b> — Time decay: how much value the option loses per day. Accelerates as expiration approaches. Negative for buyers.</span></span></th>' +
      '<th>Strike</th>' +
      '<th><span class="oc-anno">\u0394 Delta<span class="oc-tip"><b>Delta (Puts)</b> — Negative for puts. A -0.50 delta put moves $0.50 for every $1 drop in the stock. Deeper ITM = closer to -1.</span></span></th>' +
      '<th><span class="oc-anno">\u0398 Theta<span class="oc-tip"><b>Theta (Puts)</b> — Same time decay concept. Near-expiration ATM options have the most theta decay.</span></span></th>' +
      '<th><span class="oc-anno">Last<span class="oc-tip"><b>Last Price</b> — Most recent trade price for this put contract.</span></span></th>' +
      '<th><span class="oc-anno">Bid<span class="oc-tip"><b>Bid Price</b> — What you receive if selling this put.</span></span></th>' +
      '<th><span class="oc-anno">Ask<span class="oc-tip"><b>Ask Price</b> — What you pay if buying this put.</span></span></th>' +
      '<th><span class="oc-anno">Vol<span class="oc-tip"><b>Volume</b> — Today&#39;s put trading volume at this strike.</span></span></th>' +
      '<th><span class="oc-anno">OI<span class="oc-tip"><b>Open Interest</b> — Total outstanding put contracts at this strike.</span></span></th>' +
    '</tr>' +
