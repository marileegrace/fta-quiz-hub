,164.58,164.88],[164.9,165.05,164.61,164.65],[164.71,165.29,164.21,165.21],[165.21,167.42,164.95,167.41],[167.28,167.29,166.78,166.83],[166.74,166.85,165.97,166.02],[165.97,166.17,164.89,165.05],[165.04,165.21,164.08,164.26],[164.21,164.48,163.28,163.3]],"label":"Chart B: Choppy","overlays":{"lines":[{"values":[165.53,165.59,165.7,165.76,165.87,166.04,166.18,166.37,166.42,166.06,165.92,165.9,165.93,166.07,166.06,165.99,166.07,165.79,165.59,165.59,165.57,165.63,165.75,165.9,165.95,166.04,166.09,165.81,165.64,165.53,165.47,165.39,165.37,165.56,165.68,165.71,165.65,165.52,165.31],"color":"#2196f3","label":"20 EMA","width":2}]}}},{"module":"Module 5","topic":"Choppy vs Trending","layer":2,"id":"M5-CT-002","status":"LIVE","scenario":"Scenario: you've had three consecutive losing trades \u2014 two breakout entries that reversed and one trend-following entry that whipsawed. The ADX indicator reads 15 (below 20 = no trend).","question":"Three straight losses \u2014 all from trend-based strategies. ADX reads 15 (below 20 = no trend). What's the diagnosis?","options":{"A":"You need better technical indicators since your current setup is clearly broken if you're losing three in a row","B":"ADX is an unreliable indicator that should be removed from your chart since it doesn't accurately measure trend strength","C":"Three losses is just normal variance \u2014 keep executing the same strategy since it will revert to profitability automatically","D":"The market is choppy and you're using trending strategies. ADX below 20 confirms no trend is present. Breakouts fail and trend entries whipsaw in choppy conditions. The fix: stop forcing trend trades \u2014 sit on your hands (or cut size way down) until a trend re-emerges. Chop is for preserving capital, not finding new trades."},"correct":"D","correctFeedback":"When your trend strategies keep failing, the first question isn't 'is my strategy broken?' \u2014 it's 'is the market trending?' ADX below 20 = no trend = your trend tools will keep failing. The market isn't cooperating with your approach. Sit on your hands and preserve capital until conditions change \u2014 choppy days eat traders alive, and many days zero trades is the right answer.","incorrectFeedback":"This is why market condition assessment comes first. You can have the best trend strategy in the world, but if the market isn't trending, it will lose money. ADX below 20 is your signal to stop trend-trading and step aside until the market shows real follow-through again.","chart":{"symbol":null,"candles":null}},{"module":"Module 5","topic":"Choppy vs Trending","layer":3,"id":"M5-CT-003","status":"LIVE","scenario":"Scenario: market has been choppy for 3 weeks (ADX at 14, price in a tight range), but you notice Bollinger Bands squeezing and volume declining \u2014 classic pre-breakout signals","question":"The market has been choppy for 3 weeks, but Bollinger Bands are squeezing and volume is declining. How do you prepare for the transition from choppy to trending?","options":{"A":"Stay on the sidelines permanently until the trend is clearly established with ADX above 25 and confirmed by three months of price action","B":"Jump into a large position in the direction you think the breakout will go since the squeeze guarantees a big move is coming","C":"Prepare a breakout plan for both directions. Set alerts at the range boundaries. When the breakout happens with volume confirmation, enter in that direction with a stop back inside the range. The squeeze tells you to GET READY, not to guess the direction. Let the breakout tell you which way to lean.","D":"Choppy markets cannot transition to trending markets \u2014 they're fundamentally different market regimes that don't overlap"},"correct":"C","correctFeedback":"The choppy-to-trending transition is one of the best trading opportunities. The squeeze (Bollinger + declining volume) tells you the coil is tightening. Don't guess the direction \u2014 plan both sides. When the breakout comes, the first move often has the most energy. Have your entry, stop, and target ready for both an upside and downside break.","incorrectFeedback":"Transitions are where money is made. Choppy conditions compress volatility like a spring. When it releases, the move is often sharp and directional. Your job during the choppy phase: reduce trading, preserve capital, and build your breakout plan so you're ready to act the moment the market decides its direction.","chart":{"symbol":null,"candles":null}},{"module":"Module 6","topic":"Options Basics","layer":1,"id":"M6-OPT-001","status":"LIVE","scenario":"Options chain for AAPL: calls on left, puts on right, various strike prices and expirations","question":"What does buying a call option give you the right (but not obligation) to do?","options":{"A":"Sell 100 shares of the stock at the strike price before the expiration date","B":"Buy 100 shares of the stock at the strike price before expiration \u2014 you profit if the stock rises above the strike plus the premium you paid","C":"Short the stock at the current market price with unlimited downside protection built in","D":"Collect premium income from other traders who want to buy your shares at a set price"},"correct":"B","correctFeedback":"A call = the right to BUY at the strike price. You pay a premium for this right. Your max loss is the premium. Your profit potential is unlimited above the strike + premium. Calls are bullish bets with defined risk.","incorrectFeedback":"Buying a call gives you the right to purchase the stock at a specific price (strike) before a specific date (expiration). You're betting the stock goes up. Your risk is limited to the premium you paid.","chart":{"symbol":null,"candles":null}},{"module":"Module 6","topic":"Options Basics","layer":1,"id":"M6-OPT-002","status":"LIVE","scenario":"Options chain for AAPL: calls on left, puts on right, various strike prices and expirations \u2014 Same options chain \u2014 comparison of in-the-money, at-the-money, and out-of-the-money calls","question":"AAPL is trading at $190. A $180 call, a $190 call, and a $200 call are available. Which one is 'in the money'?","options":{"A":"The $190 call \u2014 at-the-money options are considered in the money because they can be exercised immediately","B":"The $200 call \u2014 it has the highest strike and therefore commands the most premium from buyers","C":"The $180 call \u2014 it's in the money because the stock price ($190) is already above the strike price ($180), giving the option intrinsic value","D":"All three are in the money since the stock is actively trading and the options haven't expired yet"},"correct":"C","correctFeedback":"In the money = the option has intrinsic value right now. The $180 call is ITM because you could exercise it to buy at $180 and the stock is at $190 \u2014 that's $10 of built-in value. The $190 call is at the money. The $200 call is out of the money.","incorrectFeedback":"A call is 'in the money' when the stock price is above the strike price. At $190 stock price, the $180 strike call has $10 of intrinsic value \u2014 you could buy at $180 something worth $190.","chart":{"symbol":null,"candles":null}},{"module":"Module 6","topic":"Options Basics","layer":1,"id":"M6-OPT-003","status":"LIVE","scenario":"Options chain showing put options \u2014 TSLA at $250 with $240, $250, and $260 puts listed","question":"What does buying a put option give you the right to do?","options":{"A":"Buy 100 shares at the strike price and hold them until the stock recovers above your purchase price","B":"Collect dividends from the underlying stock without actually owning the shares outright","C":"Force the option seller to buy your shares back at the strike price at any time before expiration","D":"Sell 100 shares at the strike price before expiration \u2014 you profit if the stock falls below the strike minus the premium you paid"},"correct":"D","correctFeedback":"A put = the right to SELL at the strike price. Puts are bearish bets or hedges. You profit when the stock drops below your strike minus the premium. Max loss = the premium paid. Puts are the mirror image of calls.","incorrectFeedback":"Buying a put gives you the right to sell at a specific price. If the stock drops, your put becomes more valuable because you can sell at a higher price than the market. It's like insurance for your portfolio.","chart":{"symbol":null,"candles":null}},{"module":"Module 6","topic":"Options Basics","layer":1,"id":"M6-OPT-004","status":"LIVE","scenario":"Options chain showing premium prices: AAPL $190 call expiring in 1 week = $3.20, same call expiring in 6 weeks = $7.80","question":"The $190 call expiring in 1 week costs $3.20 but the same strike expiring in 6 weeks costs $7.80. Why does the longer-dated option cost more?","options":{"A":"More time until expiration = more time for the stock to move in your favor. You're paying for that extra time, which is called 'time value' or 'extrinsic value.'","B":"The longer-dated option costs more because of higher brokerage commissions on contracts with later expirations","C":"It's a pricing error \u2014 both should cost the same since they have identical strike prices and underlying stock","D":"Longer-dated options cost more because they pay higher dividends to the option holder over time"},"correct":"A","correctFeedback":"Time = money in options. More time until expiration means more opportunity for the stock to move past your strike. That extra possibility has a price \u2014 time value. As expiration approaches, time value evaporates (theta decay). This is why longer-dated options cost more.","incorrectFeedback":"The difference in price between these two options is almost entirely time value. The extra 5 weeks give the stock more time to move, which makes the option more valuable. As options approach expiration, time value shrinks \u2014 this is theta decay.","chart":{"symbol":null,"candles":null}},{"module":"Module 6","topic":"Greeks","layer":1,"id":"M6-OPT-005","status":"LIVE","scenario":"Options chain with delta values shown: ITM call delta 0.75, ATM call delta 0.50, OTM call delta 0.20","question":"What does an option's 'delta' of 0.50 tell you in practical terms?","options":{"A":"The option has a 50% probability of doubling in value before expiration based on historical averages","B":"For every $1 the stock moves, the option price changes by approximately $0.50 \u2014 delta measures how much the option moves relative to the stock","C":"The option is exactly halfway between profitable and unprofitable at this moment in time","D":"Delta of 0.50 means the option will expire in exactly 50 days from the purchase date"},"correct":"B","correctFeedback":"Delta is your options speedometer. A delta of 0.50 means the option gains ~$0.50 for every $1 the stock moves in your favor. ATM options are around 0.50, ITM options have higher delta (closer to 1.0), and OTM options have lower delta. Delta also roughly estimates the probability the option expires ITM.","incorrectFeedback":"Delta tells you how sensitive the option price is to stock movement. At 0.50, your option moves about half as much as the stock. It's also a rough probability gauge \u2014 a 0.50 delta call has roughly a 50% chance of expiring in the money.","chart":{"symbol":null,"candles":null}},{"module":"Module 6","topic":"Greeks","layer":1,"id":"M6-OPT-006","status":"LIVE","scenario":"Chart showing option value declining as expiration approaches \u2014 theta decay curve steepening in final 30 days","question":"What is theta, and why does it accelerate as expiration approaches?","options":{"A":"Theta measures how much an option's price increases each day due to compounding interest on the premium","B":"Theta is the amount of money you owe the broker each day for holding the option position open overnight","C":"Theta measures how much the stock needs to move each day for the option to be profitable at expiration","D":"Theta measures the daily time decay \u2014 how much value the option loses each day just from time passing. It accelerates near expiration because the remaining time value evaporates faster as the deadline approaches."},"correct":"D","correctFeedback":"Theta is the silent killer of option positions. Every day, your option loses a little value just from time passing \u2014 even if the stock doesn't move. In the last 30 days, this decay accelerates dramatically. This is why buying options with only a week left is dangerous \u2014 theta is working hardest against you.","incorrectFeedback":"Think of theta like an ice cube melting. It melts slowly at first, then faster and faster as expiration approaches. A $5 option might lose $0.05/day with 60 days left but $0.25/day with 5 days left. Time is the option buyer's enemy and the option seller's friend.","chart":{"symbol":null,"candles":null}},{"module":"Module 6","topic":"Greeks","layer":2,"id":"M6-OPT-007","status":"LIVE","scenario":"Scenario: NVDA earnings in 3 days, IV on weekly options is 85% vs normal IV of 35%","question":"NVDA earnings are in 3 days. Implied volatility (IV) on weekly options is 85% vs the stock's typical 35%. What does this mean for option prices?","options":{"A":"IV doesn't affect option prices \u2014 only the stock price movement determines what an option is worth","B":"High IV makes options cheaper because the uncertainty scares buyers away from the options market","C":"Options are significantly more expensive right now because the market expects a big move around earnings. The elevated IV inflates premiums \u2014 you're paying more for the same strike and expiration than you normally would.","D":"An IV of 85% guarantees the stock will move 85% in one direction or the other after the earnings release"},"correct":"C","correctFeedback":"High IV = expensive options. Before earnings, the market prices in an expected move, inflating premiums. After earnings, IV collapses ('IV crush') and those expensive premiums deflate rapidly \u2014 even if you got the direction right. This is why buying options before earnings is tricky: you need a move BIGGER than what's priced in.","incorrectFeedback":"Implied volatility is the market's forecast of how much the stock might move. When IV is elevated, options cost more because the expected move is larger. After the event, IV collapses \u2014 so your option can lose value even if the stock moves in your direction. This is IV crush.","chart":{"symbol":null,"candles":null}},{"module":"Module 6","topic":"Greeks","layer":2,"id":"M6-OPT-008","status":"LIVE","scenario":"Side-by-side: two AAPL call options, same strike/expiration. One bought when IV was 25%, other when IV was 50%","question":"Two traders buy the same AAPL $190 call with 30 days to expiration. Trader A buys when IV is 25%, Trader B buys when IV is 50%. Who paid more and why does it matter?","options":{"A":"Trader B paid significantly more because higher IV inflates the option premium. If IV drops back to 25% (IV crush), Trader B's option loses value from the IV contraction alone \u2014 even if AAPL's price doesn't change at all.","B":"Both paid the same price since they bought the same contract with identical strike prices and expiration dates","C":"Trader A paid more because low IV environments signal the stock is about to make a big move upward","D":"IV doesn't affect what you pay \u2014 premium is based solely on how far the strike is from the current stock price"},"correct":"A","correctFeedback":"This is why IV awareness matters. Trader B overpaid for the same option. If AAPL stays flat and IV drops from 50% back to 25%, Trader B's option loses roughly half its time value from IV contraction alone. Always check if IV is elevated before buying. Cheap stock + expensive options = bad entry.","incorrectFeedback":"Buying options when IV is high means you're paying a premium for expected volatility. If that volatility doesn't materialize (or IV simply contracts), the option deflates. Always know where current IV sits relative to its historical range before entering.","chart":{"symbol":null,"candles":null}},{"module":"Module 6","topic":"Greeks","layer":2,"id":"M6-OPT-009","status":"LIVE","scenario":"Delta comparison: deep ITM call (delta 0.90), ATM call (delta 0.50), far OTM call (delta 0.10)","question":"You're moderately bullish on a stock and want an option that moves roughly dollar-for-dollar with the stock. Which delta should you target?","options":{"A":"Delta 0.90 \u2014 a deep ITM option moves nearly dollar-for-dollar with the stock but costs the most. It behaves almost like owning shares but with built-in risk management (max loss = premium).","B":"Delta 0.50 \u2014 ATM options are always the best choice regardless of how bullish you are on the stock","C":"Delta 0.10 \u2014 the cheapest option gives you the most leverage and the best percentage returns on your investment","D":"Delta doesn't matter for trade selection \u2014 just pick the cheapest option available to minimize your initial cost"},"correct":"A","correctFeedback":"High delta (0.80-0.90) = stock-like behavior with defined risk. You pay more upfront, but the option tracks the stock closely. Lower delta = more leverage but more theta decay and lower probability of profit. Match delta to your conviction and how closely you want to track the stock.","incorrectFeedback":"If you want stock-like movement, buy high-delta (deep ITM) options. They're more expensive but have less time value to lose and track the stock closely. Think of delta as a dial: higher delta = more like stock, lower delta = more leverage but more risk of total loss.","chart":{"symbol":null,"candles":null}},{"module":"Module 6","topic":"Greeks","layer":2,"id":"M6-OPT-010","status":"LIVE","scenario":"Scenario: you hold a call option, stock hasn't moved in 5 days, but your option lost 8% of its value","question":"You bought a call option last week. The stock hasn't moved, but your option is down 8%. What happened?","options":{"A":"Your broker charged hidden fees that reduced the value of your option position over the holding period","B":"The stock must have moved after hours when the options market was closed, creating a gap you can't see on the chart","C":"Theta decay and/or a drop in implied volatility. Even with no stock movement, your option loses value every day from time passing (theta) and from any decrease in the market's expected volatility (vega).","D":"Options always lose exactly 8% per week \u2014 it's a built-in cost structure regardless of market conditions"},"correct":"C","correctFeedback":"Two Greeks at work here: theta (time decay eats value daily) and vega (if IV dropped, your option deflated). This is the hidden cost of holding options \u2014 the stock can do nothing and you still lose money. It's why being right on direction but wrong on timing can still be a losing trade.","incorrectFeedback":"When the stock is flat, theta is the primary culprit \u2014 your option loses time value each day. If IV also contracted (common after a news event passes), vega compounds the loss. This is why options require both direction AND timing to be right.","chart":{"symbol":null,"candles":null}},{"module":"Module 6","topic":"Options Strategy","layer":2,"id":"M6-OPT-011","status":"LIVE","scenario":"Scenario: you're bullish on MSFT for the next 2 weeks, it's at $420, you have $500 to spend","question":"You're bullish on MSFT ($420) for the next 2 weeks and have $500. Compare buying shares vs buying a call option.","options":{"A":"Buy one share at $420 \u2014 owning the stock is always safer and more reliable than trading options","B":"There's no meaningful difference between buying a call option and buying shares of the underlying stock","C":"Always buy the cheapest far out-of-the-money call to maximize your leverage and percentage return potential","D":"Buy a call option \u2014 $500 only buys you a single share, but a call lets you control 100 shares' worth of upside with defined risk. The tradeoff: if MSFT doesn't move enough before expiration, the option can expire worthless."},"correct":"D","correctFeedback":"Options give you leverage \u2014 control more upside for less capital. But the tradeoff is time decay and the possibility of losing 100% of your premium if the move doesn't happen fast enough. Shares don't expire. Both have a place \u2014 it depends on your conviction and timeframe.","incorrectFeedback":"With $500, a call option gives you exposure to MSFT's upside that you couldn't get with shares alone. But options add complexity: you need to be right about direction AND timing. That's the tradeoff.","chart":{"symbol":null,"candles":null}},{"module":"Module 6","topic":"Options Strategy","layer":2,"id":"M6-OPT-012","status":"LIVE","scenario":"Options P/L diagram: long call showing breakeven point, max loss at premium, and unlimited upside","question":"You buy a $200 call for $5 premium. At what stock price do you break even at expiration?","options":{"A":"At $200 \u2014 the breakeven is always the strike price regardless of what premium you paid for the option","B":"At $195 \u2014 you subtract the premium from the strike to calculate your breakeven point","C":"At $205 \u2014 the stock needs to be above the strike ($200) PLUS the premium you paid ($5) for you to profit at expiration","D":"At $210 \u2014 the stock needs to double the premium above the strike to cover commissions and slippage"},"correct":"C","correctFeedback":"Breakeven on a long call = strike + premium. You paid $5 for the right to buy at $200. At $205, your profit from the stock ($5) exactly offsets your premium cost ($5). Above $205 = profit. Below $205 at expiration = loss (max loss = $5 premium).","incorrectFeedback":"Strike + premium = breakeven. The stock needs to go high enough above the strike to cover what you paid for the option. At $205, you're even. Above $205, every dollar of stock price = a dollar of profit.","chart":{"symbol":null,"candles":null}},{"module":"Module 6","topic":"Options Strategy","layer":2,"id":"M6-OPT-013","status":"LIVE","scenario":"Scenario: choosing between a weekly option ($1.50 premium) and a monthly option ($4.00 premium) for the same strike","question":"You're bullish on a stock and see a $100 call for $1.50 expiring this Friday vs $4.00 expiring in 5 weeks. Your expected move could take 1-3 weeks. Which do you buy?","options":{"A":"The weekly for $1.50 \u2014 it's cheaper, so your risk is lower and your percentage return is higher if the stock moves quickly","B":"The monthly for $4.00 \u2014 give yourself enough time for the move to play out. The weekly expires before your expected move may complete, and theta decay will be brutal in those final days.","C":"Buy both options to hedge your timing risk and increase your probability of profiting from the move","D":"Neither \u2014 if the move could take 1-3 weeks, options aren't the right instrument for this particular trade setup"},"correct":"B","correctFeedback":"The weekly looks cheap but it's a trap. If your expected move takes 2 weeks, the weekly expires worthless before it happens. Buying enough time is one of the most important options decisions. A good rule: buy at least 2x the time you think you need. Overpaying for time is cheaper than being right but expired.","incorrectFeedback":"Time is your insurance policy. The weekly is cheaper upfront but gives you almost no room for error on timing. If the move happens in week 2 or 3, the weekly is worthless. Pay more for the monthly and give your thesis room to play out.","chart":{"symbol":null,"candles":null}},{"module":"Module 6","topic":"Options Strategy","layer":2,"id":"M6-OPT-014","status":"LIVE","scenario":"Options chain: ATM call strike $150 (delta 0.50, premium $6), OTM call strike $160 (delta 0.25, premium $2.50), both 30 DTE","question":"Comparing a $150 ATM call ($6, delta 0.50) vs a $160 OTM call ($2.50, delta 0.25). When would you choose the OTM option over the ATM?","options":{"A":"Always choose the OTM call because the lower premium means less risk and a higher percentage return on your capital","B":"Never buy OTM options \u2014 they have a lower probability of profit and are almost always a losing strategy","C":"Choose whichever option has the higher open interest since that indicates institutional support for the trade","D":"When you have very high conviction in a large move and want maximum leverage. The OTM option risks less capital but needs a bigger stock move to profit. It's a lower-probability, higher-reward bet."},"correct":"D","correctFeedback":"ATM vs OTM is a conviction dial. ATM (delta ~0.50) profits from smaller moves but costs more. OTM (delta ~0.25) is cheaper but needs a bigger move. If your analysis shows strong confluence for a big breakout, OTM can amplify returns. For moderate moves, ATM is more forgiving.","incorrectFeedback":"Strike selection is about matching your conviction to probability. ATM options profit from smaller moves and have higher probability. OTM options are cheaper but need bigger moves. Choose ATM when 'probably right,' OTM when 'really confident in a big move.'","chart":{"symbol":null,"candles":null}},{"module":"Module 6","topic":"Options Strategy","layer":2,"id":"M6-OPT-015","status":"LIVE","scenario":"Scenario: AMZN at $185, your S/R analysis shows strong support at $180 and resistance at $195","question":"Your chart work shows AMZN support at $180 and resistance at $195. You want to buy a call. How do your S/R levels help you choose a strike price?","options":{"A":"Your target of $195 sets the upper bound. Buy a strike at or below the current price ($185 or lower) \u2014 at the money or in the money \u2014 so you're not paying purely for a long-shot move, and use $195 resistance as your profit target. Your breakeven needs to be below $195 for the trade to make sense.","B":"S/R levels don't apply to options \u2014 strike selection is based entirely on delta and premium cost","C":"Pick the strike closest to the resistance level ($195) since that's where you expect the stock to go","D":"Always buy the strike that matches the support level ($180) to get the cheapest possible premium cost"},"correct":"A","correctFeedback":"S/R levels are your options GPS. Support ($180) = where you'd place your stop. Resistance ($195) = your target. Your option's breakeven must be achievable BELOW the resistance target, otherwise the math doesn't work. This is how technical analysis directly informs strike selection.","incorrectFeedback":"Your chart work maps directly to options decisions. $180 support tells you where the trade idea fails (mental stop). $195 resistance is your target. Work backwards: your breakeven (strike + premium) needs to be comfortably below $195 for the risk/reward to make sense.","chart":{"symbol":null,"candles":null}},{"module":"Module 6","topic":"Options Strategy","layer":3,"id":"M6-OPT-016","status":"LIVE","scenario":"Scenario: TSLA at strong support with bullish divergence, you want to trade with options","question":"Your analysis shows TSLA at support with bullish divergence and a hammer candle. You want to express this trade with options. Walk through your decision process.","options":{"A":"Buy the cheapest weekly out-of-the-money call to maximize your leverage and potential percentage return","B":"Start with your technical thesis (bullish at support), then choose strike (near or at the money for higher probability), expiration (give yourself enough time \u2014 at least 2-3 weeks beyond your expected move), and size (risk only what you'd lose on a stock stop loss). Options amplify your technical analysis but add the timing dimension.","C":"Sell a put at support \u2014 collect premium income and let theta decay work in your favor while you wait","D":"Buy both a call and a put to profit regardless of which direction TSLA moves from this support level"},"correct":"B","correctFeedback":"Your technical analysis is step one. Options are step two \u2014 the vehicle. Don't let options tail wag the analysis dog. Match your strike to your conviction (ATM for moderate, OTM for strong), give yourself enough time (don't buy weeklies for a trade that needs weeks to play out), and size based on the premium you're willing to lose entirely.","incorrectFeedback":"Options translate your analysis into a trade. The technical setup tells you WHAT to do, options tell you HOW. Match expiration to your expected time horizon and strike to your conviction level. Never risk more premium than you'd risk on a stock stop loss.","chart":{"symbol":null,"candles":null}},{"module":"Module 6","topic":"Options Strategy","layer":3,"id":"M6-OPT-017","status":"LIVE","scenario":"Scenario: you see a bearish engulfing at resistance on NVDA, RSI overbought with bearish divergence","question":"Strong bearish confluence on NVDA: bearish engulfing at resistance, RSI overbought with divergence. You want to trade the downside with options. Call or put?","options":{"A":"Buy a call option \u2014 bearish signals often reverse quickly, so it's better to position for the bounce","B":"Buy a put option \u2014 your bearish thesis calls for a decline. Buying a put profits from downside while capping your risk at the premium paid. Choose a strike near or just below the current price with enough time for the move.","C":"You can't trade bearish setups with options \u2014 options are only useful for bullish positions on stocks","D":"Sell naked calls to collect premium since the bearish signals mean the stock won't go higher anytime soon"},"correct":"B","correctFeedback":"Puts are the natural vehicle for a bearish thesis. Buy a put near or at the current price, give yourself 3-4 weeks for the move. Your max risk = the premium. If the stock drops as your analysis suggests, the put increases in value. Don't sell naked calls as a beginner \u2014 the risk is unlimited.","incorrectFeedback":"When your analysis is bearish, puts let you profit from the decline with defined risk. Match your strike to where you expect the move to reach, and give yourself enough time. Never sell naked options as a beginner \u2014 buying puts or calls keeps your risk defined.","chart":{"symbol":null,"candles":null}},{"module":"Module 6","topic":"Options Strategy","layer":3,"id":"M6-OPT-018","status":"LIVE","scenario":"Scenario: earnings in 4 days, IV on 1-week options is 90%, IV on 5-week options is 45%","question":"You're bullish into GOOGL earnings. The 1-week options (spanning earnings) have 90% IV while the 5-week options are at 45%. What's the risk of buying the weekly?","options":{"A":"No additional risk \u2014 higher IV just means the market agrees with your bullish thesis and expects a big move up","B":"The 90% IV means premiums are heavily inflated. After earnings, IV collapses ('IV crush') \u2014 even if you're right on direction, your option can lose value because the IV deflation offsets the stock's move. You need GOOGL to move MORE than what's priced in to profit.","C":"Weekly options are always safer than monthly options because you're not exposed to the market as long","D":"IV of 90% guarantees the stock will move 90% after earnings, which makes the weekly call a sure thing"},"correct":"B","correctFeedback":"IV crush is the earnings option trap. If GOOGL's weekly options price in a $15 expected move and the stock only moves $10 (in your direction!), you can still lose money because the IV collapse deflates the premium faster than the stock move inflates it. This is why many experienced traders avoid buying weeklies into earnings.","incorrectFeedback":"The gap between weekly IV (90%) and monthly IV (45%) tells you how much 'earnings premium' is baked in. After the announcement, that premium disappears instantly. Your directional bet needs to overcome the IV crush. Many traders learn this lesson the hard way.","chart":{"symbol":null,"candles":null}},{"module":"Module 6","topic":"Options Strategy","layer":3,"id":"M6-OPT-019","status":"LIVE","scenario":"Scenario: your call option is up 50% with 3 weeks left, stock is approaching resistance","question":"Your call is up 50% with 3 weeks left to expiration, and the stock is now approaching a resistance level you identified in your analysis. What do you do?","options":{"A":"Hold through resistance \u2014 options always have more upside potential and you don't want to leave money on the table","B":"Double your position by buying more calls since the trade is clearly working and showing strong momentum","C":"Take profits \u2014 resistance was your target. Your analysis identified this level before the trade. Taking a 50% gain when the stock hits your pre-planned target is disciplined trading. Don't let a winning trade turn into a loser because you got greedy.","D":"Switch to puts immediately since resistance means the stock is about to reverse and drop sharply"},"correct":"C","correctFeedback":"Resistance was your target from the beginning. Taking a 50% gain at a pre-identified level is not 'leaving money on the table' \u2014 it's executing your plan. The greediest options mistake: watching a 50% winner turn into a 50% loser because you held through resistance hoping for more.","incorrectFeedback":"Your S/R analysis gave you the entry AND the exit. Hitting resistance with a 50% gain = mission accomplished. You can always re-enter if price breaks through resistance. What you can't do is recover the gains you watched evaporate by holding too long.","chart":{"symbol":null,"candles":null}},{"module":"Module 6","topic":"Options Strategy","layer":3,"id":"M6-OPT-020","status":"LIVE","scenario":"Scenario: AAPL is between $185 support and $195 resistance, you expect it to stay range-bound for 2 weeks","question":"Your analysis shows AAPL stuck between $185-$195 for the next couple weeks. A student asks: 'Can I profit from a stock that doesn't move?' How do you explain this with options?","options":{"A":"No \u2014 options only make money when the stock moves significantly in one direction or the other","B":"Yes, but only by buying both a call and a put at the same strike, which profits when the range finally breaks","C":"Yes \u2014 by buying a deep in-the-money call and holding it until the stock eventually breaks out of the range","D":"Yes \u2014 by SELLING options. When you sell options, theta decay works in your favor. If the stock stays in the range and your sold options expire worthless, you keep the premium. The seller profits from time passing, not from movement."},"correct":"D","correctFeedback":"This is the seller's edge. Option buyers need movement. Option sellers need time to pass. If your analysis says 'range-bound,' selling options (credit spreads to define risk) profits from theta decay while the stock goes nowhere. This is how your range-bound analysis becomes a tradeable thesis.","incorrectFeedback":"When movement is your enemy (for buyers), it's the seller's friend. If you expect a range, selling premium (through defined-risk strategies like credit spreads) lets you collect income from time decay. Your analysis of 'no movement' becomes a profitable trade idea.","chart":{"symbol":null,"candles":null}},{"module":"Module 6","topic":"Greeks","layer":3,"id":"M6-OPT-021","status":"LIVE","scenario":"Scenario: complete greek analysis \u2014 call option with delta 0.45, theta -0.08, IV at 30% (normal range 20-40%)","question":"You're evaluating a call option: delta 0.45, theta -$0.08/day, IV at 30% (stock's normal range is 20-40%). Translate each Greek into a plain-English trading decision.","options":{"A":"The Greeks are too complicated for beginners \u2014 just look at the premium price and whether the stock is going up or down","B":"Delta 0.45: the option moves ~$0.45 per $1 of stock movement (moderate sensitivity). Theta -$0.08: you're losing $8/day to time decay (manageable but adds up). IV at 30%: mid-range volatility means premiums are fairly priced \u2014 not inflated, not cheap. This is a reasonable entry from a Greek perspective.","C":"Delta 0.45 means you have a 45% chance of losing money, theta means you owe $0.08 in daily fees, and IV means the stock will move 30% before expiration","D":"All three Greeks look negative \u2014 delta below 0.50 means the option is losing, theta is negative, and IV is below 50%"},"correct":"B","correctFeedback":"Reading Greeks is like reading a dashboard: delta = your speed, theta = your fuel burn rate, IV = whether you're paying retail or discount for the option. A 0.45 delta with reasonable theta and mid-range IV = a balanced entry. If theta were higher or IV inflated, you'd want to reconsider timing.","incorrectFeedback":"Each Greek tells you something specific: delta = how much you make per $1 stock move, theta = your daily cost of holding, IV = whether options are expensive or cheap right now. Reading them together gives you a complete picture before you enter.","chart":{"symbol":null,"candles":null}},{"module":"Module 6","topic":"Greeks","layer":3,"id":"M6-OPT-022","status":"LIVE","scenario":"Scenario: choosing between two trades \u2014 Trade A: high delta, high theta, high IV vs Trade B: moderate delta, low theta, low IV","question":"Trade A: delta 0.70, theta -$0.25/day, IV 65% (elevated). Trade B: delta 0.40, theta -$0.06/day, IV 22% (low). Same stock, same bullish thesis. Which is the better entry?","options":{"A":"Trade B is the better entry. Despite lower delta, the low theta means you're paying much less per day to hold the position, and low IV means the option is fairly priced. Trade A's elevated IV could crush your position even if you're right on direction.","B":"Always pick the option with the lowest theta regardless of other Greeks, since time decay is the only factor that matters","C":"Trade A \u2014 higher delta means more profit per dollar of stock movement, which is always the priority for bullish trades","D":"Neither \u2014 you should never compare Greeks between two options because each contract is unique and context-dependent"},"correct":"A","correctFeedback":"Trade A looks powerful (high delta) but it's expensive to hold ($25/day in time decay) and IV is elevated (crush risk). Trade B costs less to maintain ($6/day), is fairly priced, and gives you more room for error. Sometimes the 'slower' option is the smarter trade. Patience + lower cost basis often wins.","incorrectFeedback":"The best option isn't always the one with the highest delta. Trade B's combination of low theta and low IV means your cost of being wrong is much lower. Trade A's high IV creates a hidden cost \u2014 if IV drops from 65% to 40%, the option deflates significantly even if the stock goes your way.","chart":{"symbol":null,"candles":null}},{"module":"Module 6","topic":"Options Strategy","layer":3,"id":"M6-OPT-023","status":"LIVE","scenario":"Scenario: you've been buying weekly call options and winning 3 out of 10 trades, but your winners are big","question":"A student's trade journal shows 3 wins and 7 losses buying weekly options over the past month. They made $1,200 on winners but lost $1,800 total. What's the core issue?","options":{"A":"Weekly options are fine \u2014 they just need to improve their win rate to at least 60% by picking better chart setups","B":"The 30% win rate is expected for OTM weekly options, but the total loss shows the wins aren't big enough to offset the frequent losses. Weeklies have brutal theta decay and low probability of profit \u2014 the math needs to work harder for each winner to overcome seven losers.","C":"Nothing is wrong \u2014 a 30% win rate is excellent for options trading and the small net loss is just normal variance","D":"They should switch to selling options immediately since buying options is always a losing strategy long-term"},"correct":"B","correctFeedback":"This is the weekly options trap. Cheap premiums feel like 'low risk' but the rapid theta decay and low probability compound into consistent losses. The fix: either buy longer-dated options (higher probability, more time for thesis to play out) or make sure your winners are 3-5x your average loss. If 3 out of 10 win, each win needs to be $600+ to overcome $1,800 in losses.","incorrectFeedback":"The math reveals the problem: winning 30% of the time means each winner must be much larger than each loser. At $400/win and $257/loss, the reward-to-risk ratio isn't high enough. The student either needs longer-dated options (higher win rate) or needs to hold winners longer for bigger payoffs.","chart":{"symbol":null,"candles":null}},{"module":"Module 6","topic":"Options Strategy","layer":3,"id":"M6-OPT-024","status":"LIVE","scenario":"Full scenario: complete options trade planning from chart analysis to Greeks to position sizing","question":"Walk through the complete process of planning an options trade from start to finish. What's the order of operations?","options":{"A":"Open your brokerage app, look for stocks with the highest IV, and buy ATM calls on whichever stock has the most volatility","B":"Pick the stock first, then let the Greeks choose the best option for you automatically based on historical patterns","C":"Start by scanning the options chain for the cheapest premiums, then check if the stock chart supports the trade direction","D":"(1) Technical analysis first \u2014 identify the setup, direction, entry/stop/target. (2) Check IV \u2014 are options expensive or cheap right now? (3) Choose strike based on delta and your S/R levels. (4) Choose expiration \u2014 at least 2x your expected move duration. (5) Size the trade \u2014 risk no more than you'd risk on a stock stop. (6) Know your exit plan before you enter."},"correct":"D","correctFeedback":"Analysis drives everything. Options are just the vehicle. The biggest beginner mistake is starting with the options chain instead of the chart. Your technical work tells you WHAT, WHERE, and WHEN. The options chain tells you HOW. The Greeks tell you WHETHER the price is right. Size tells you HOW MUCH. And the exit plan keeps you disciplined.","incorrectFeedback":"The order matters: chart first, then options. Most beginners reverse this \u2014 they scan for cheap options and retrofit a thesis. Professionals identify the setup, then find the option that best expresses it. Your entry, strike, expiration, and size should all flow from the technical analysis.","chart":{"symbol":null,"candles":null}},{"module":"Module 6","topic":"Options Strategy","layer":2,"id":"M6-OPT-025","status":"LIVE","scenario":"Scenario: MSFT breaks above resistance at $430 on heavy volume. RSI confirms. You want to enter with calls.","question":"MSFT just broke above $430 resistance with strong volume and RSI confirmation. You want to buy calls. What's the first thing you check before looking at the options chain?","options":{"A":"Nothing \u2014 strong breakouts require fast action. Buy the nearest ATM call immediately before the move extends further.","B":"Check the current implied volatility relative to MSFT's normal range. If IV is already elevated from the breakout excitement, you could be overpaying for the call \u2014 the stock move is partially priced into options already.","C":"Look at the moon phase and market breadth index before making any options trade to confirm cosmic alignment","D":"Wait for the stock to pull back to $430 (old resistance becoming new support) before buying any calls at all"},"correct":"B","correctFeedback":"IV often spikes during breakouts as demand for calls surges. If you buy during the excitement, you're paying elevated IV. Two better approaches: (1) wait for a pullback to the breakout level where IV may normalize, or (2) buy the call but acknowledge the IV premium and size accordingly.","incorrectFeedback":"This is where Greeks meet technicals. The breakout is real, but the options market reacts too. An IV spike during a breakout inflates premiums. Check IV percentile before entering. If IV is in the top quartile, consider waiting for a retest of the breakout level or using a spread to offset the elevated premium.","chart":{"symbol":null,"candles":null}},{"module":"Module 7","topic":"Emotional Discipline","layer":1,"id":"M7-PSY-001","status":"LIVE","scenario":"Scenario: you just had three losing trades in a row and feel the urge to 'make it back' on the next trade","question":"After three consecutive losses, you feel the urge to size up on your next trade to recover the losses quickly. What is this behavior called?","options":{"A":"Smart risk management \u2014 increasing size after losses ensures you recover your account balance faster","B":"Revenge trading \u2014 the emotional desire to 'make it back' leads to oversized positions, abandoned rules, and usually bigger losses","C":"Dollar-cost averaging \u2014 adding to your position during drawdowns is a proven long-term wealth-building strategy","D":"Mean reversion trading \u2014 after a losing streak, the probability of your next trade being a winner increases statistically"},"correct":"B","correctFeedback":"Revenge trading is one of the fastest ways to blow up an account. After losses, your judgment is compromised by emotion. The correct move: step away, review your trades objectively, and when you return, trade SMALLER not larger. The market doesn't owe you anything.","incorrectFeedback":"This is revenge trading \u2014 acting from emotion rather than analysis. The urge to 'get it back' leads to breaking rules. After a losing streak, reduce size or take a break. The market will still be there tomorrow.","chart":{"symbol":null,"candles":null}},{"module":"Module 7","topic":"Emotional Discipline","layer":1,"id":"M7-PSY-002","status":"LIVE","scenario":"Scenario: a hot stock tip from social media \u2014 everyone is buying and the stock is up 30% today","question":"A stock is up 30% today and social media is going crazy about it. You feel intense pressure to buy before you 'miss the move.' What's happening psychologically?","options":{"A":"FOMO \u2014 Fear Of Missing Out. The social proof of others buying and the price surge creates urgency that bypasses your trading plan and analytical process.","B":"This is healthy market awareness \u2014 staying plugged into social sentiment is essential for modern trading success","C":"The stock going up 30% confirms it's a strong company with improving fundamentals worth buying at any price","D":"Buying after a 30% move is a proven momentum strategy that professional traders use consistently for reliable returns"},"correct":"A","correctFeedback":"FOMO is the market's oldest trap. By the time something is all over social media and up 30%, the easy money has been made. The people posting gains bought earlier. Ask yourself: does this fit MY trading plan? If not, it's not your trade. There will always be another opportunity.","incorrectFeedback":"FOMO causes you to buy when excitement peaks \u2014 which is often near the top. Professional traders are often selling into the excitement that retail is chasing. Stick to your process. If you didn't analyze it before the move, don't chase it during.","chart":{"symbol":null,"candles":null}},{"module":"Module 7","topic":"Trading Plan","layer":2,"id":"M7-PSY-003","status":"LIVE","scenario":"Scenario: your analysis says hold, but the stock drops 3% intraday and you're watching it in real time","question":"Your analysis says hold \u2014 your stop hasn't been hit and nothing has changed technically. But the stock drops 3% intraday and you're watching every tick. You feel the urge to sell. What should you do?","options":{"A":"Close your trading platform and check back at the end of the day. Intraday noise tests your conviction. If your thesis, stop, and target are still intact, the 3% move is just volatility \u2014 not a reason to abandon your plan.","B":"Sell immediately \u2014 a 3% intraday drop means your analysis was wrong and you should cut the loss now","C":"Move your stop loss closer to current price so the next small dip takes you out with a smaller loss","D":"Add to your position since the dip makes your entry price better on average and increases your upside"},"correct":"A","correctFeedback":"The biggest enemy of a good trade is watching it too closely. Intraday swings are noise. Your analysis happens on a timeframe \u2014 trust it. If you set your stop based on analysis, the only reason to sell before the stop is if the THESIS changes, not if the price wiggles.","incorrectFeedback":"This is where discipline separates traders from gamblers. Your plan was set before the trade. Intraday movement doesn't change your analysis. If your stop is intact and your thesis is intact, the plan is intact. Stop watching every tick.","chart":{"symbol":null,"candles":null}},{"module":"Module 7","topic":"Trading Plan","layer":2,"id":"M7-PSY-004","status":"LIVE","scenario":"Scenario: you're in a winning trade, up 8%, and your target was 10% \u2014 but you're tempted to take profits early","question":"Your plan says target 10% profit but you're up 8% and want to take it. What's the right framework for this decision?","options":{"A":"Always take profits when you have them \u2014 an 8% gain today is better than waiting for 10% that might never come","B":"Has anything changed in your technical setup? If S/R, RSI, and candle structure still support the move to your target, stick with the plan. If new resistance has appeared or momentum is weakening, taking partial profits is reasonable. Let the chart decide, not your emotions.","C":"Never sell before your target \u2014 moving the goalposts means your trading plan is meaningless and undisciplined","D":"Double your position size since the trade is working and add more exposure to maximize the winner"},"correct":"B","correctFeedback":"This is the tension between greed and discipline. The answer isn't always 'hold to target' \u2014 it's 'has anything changed?' If the chart still supports 10%, let it run. If a new resistance level or bearish candle appeared, taking partial profits is smart adaptation, not weakness.","incorrectFeedback":"Your plan is based on analysis, not emotion. Check the chart: is the path to your target still clear? If yes, hold. If new technical obstacles have appeared (resistance, divergence, reversal candle), it's reasonable to adjust. The chart, not your feelings, should guide the decision.","chart":{"symbol":null,"candles":null}},{"module":"Module 7","topic":"Self-Awareness","layer":3,"id":"M7-PSY-005","status":"LIVE","scenario":"Scenario: reviewing your trade journal, you notice you consistently exit winners too early and hold losers too long","question":"Your trade journal shows a clear pattern: you cut winners short and let losers run. What psychological bias explains this, and how do you fix it?","options":{"A":"Loss aversion \u2014 the pain of losing is psychologically stronger than the pleasure of gaining. Fix it by committing to mechanical rules: set stops and targets BEFORE entering, and journal every time you override your plan so you can see the cost of emotional decisions.","B":"It's caused by using the wrong indicators \u2014 switch from RSI to MACD and the pattern will correct itself naturally","C":"This pattern is actually optimal \u2014 protecting gains and giving losers room to recover is sound risk management","D":"You're simply not skilled enough yet \u2014 this problem goes away with more screen time and trading experience"},"correct":"A","correctFeedback":"Loss aversion is one of the most well-documented biases in behavioral finance. We feel losses ~2x more intensely than equivalent gains. The fix: mechanical rules. Pre-set stops and targets remove the emotion from the decision. Your journal is already the most powerful tool \u2014 it shows you the pattern. Now use rules to break it.","incorrectFeedback":"This is classic loss aversion. The solution is rules-based trading: set your stop and target before you enter, then let the trade play out. Your journal revealed the pattern \u2014 now build systems that prevent the emotional override. Track your 'plan adherence' rate alongside your P/L.","chart":{"symbol":null,"candles":null}},{"module":"Module 7","topic":"Confirmation Bias","layer":1,"id":"M7-CB-001","status":"LIVE","scenario":"Scenario: you're bullish on a stock and find yourself only reading bullish analyst reports while scrolling past the bearish ones","question":"You're bullish on a stock and notice you keep seeking out bullish opinions while ignoring bearish analysis. What bias is this?","options":{"A":"Confirmation bias \u2014 the tendency to seek information that supports your existing belief while ignoring contradicting evidence. This is dangerous because it creates a false sense of conviction built on one-sided research.","B":"Smart filtering \u2014 experienced traders know to focus on analysis that aligns with their thesis and ignore the noise","C":"Contrarian analysis \u2014 looking for bull cases means you're correctly positioning against the majority bearish consensus","D":"Anchoring bias \u2014 you're anchored to the stock's current price and can't see it moving in another direction"},"correct":"A","correctFeedback":"Confirmation bias is one of the most common and dangerous biases in trading. You FEEL more confident because everything you read agrees with you \u2014 but that's because you only read things that agree. The antidote: actively seek the bear case. If you can't articulate why your trade might fail, you don't understand it well enough.","incorrectFeedback":"Confirmation bias creates artificial conviction. The fix: before entering any trade, write down the three strongest arguments AGAINST your thesis. If you can't find them, you haven't done enough research. Seeking disconfirming evidence is what separates analysis from wishful thinking.","chart":{"symbol":null,"candles":null}},{"module":"Module 7","topic":"Confirmation Bias","layer":2,"id":"M7-CB-002","status":"LIVE","scenario":"Scenario: your trade thesis was a bullish breakout. Price broke out, pulled back, and is now sitting right at the breakout level. You're looking at the chart and seeing 'support holding' \u2014 but your friend sees 'a failed breakout.'","question":"You see support holding; your friend sees a failed breakout. Same chart, opposite interpretations. How does confirmation bias explain this?","options":{"A":"One of you is right and the other is wrong \u2014 the chart has only one correct interpretation that can be determined objectively","B":"Charts don't have objective interpretations \u2014 they're Rorschach tests filtered through your bias. You see support because you WANT it to hold (you're long). Your friend sees failure because they're bearish. The fix: define your invalidation level IN ADVANCE. 'If price closes below X, I'm wrong.' Remove interpretation from the equation.","C":"Your friend is always wrong because breakout traders have a statistically higher win rate than contrarian traders","D":"Both of you should ignore the chart and rely only on fundamental analysis since technical analysis is subjective"},"correct":"B","correctFeedback":"This is confirmation bias in real time. The same candle, the same level, the same chart \u2014 two traders see opposite things because of their prior beliefs. This is why pre-set invalidation levels matter. You decided 'below $X I'm wrong' BEFORE the trade. That removes the biased interpretation from the equation.","incorrectFeedback":"When you're in a trade, every chart looks like it confirms your position. That's your brain protecting your ego. The antidote isn't 'be more objective' \u2014 it's 'define your exit criteria before you enter.' A mechanical stop removes the interpretation problem entirely.","chart":{"symbol":null,"candles":null}},{"module":"Module 7","topic":"Confirmation Bias","layer":3,"id":"M7-CB-003","status":"LIVE","scenario":"Scenario: you've built a 5-point bull case for a stock. You decide to stress-test it by deliberately building the strongest possible bear case.","question":"You've built a strong bull case and now deliberately construct the best bear case you can. This exercise reveals that two of your five bull points have direct counterarguments. How does this change your approach?","options":{"A":"Discard the trade entirely since any bear case at all means the bull thesis is invalid and the trade will fail","B":"Ignore the bear case \u2014 you built it as an exercise, but your original conviction should remain unchanged since you believed it first","C":"This is the 'pre-mortem' technique. The two challenged points don't kill the trade, but they refine it. Adjust your thesis: increase your stop if the bear points could play out, reduce position size to account for the uncertainty, and define exactly what would prove the bears right. Your three unchallenged points are your real conviction. Your two challenged points are your risk factors.","D":"Add more indicators to your chart until the bull case has more supporting evidence than the bear case"},"correct":"C","correctFeedback":"The pre-mortem is one of the most powerful debiasing tools. By deliberately building the opposing case, you inoculate yourself against confirmation bias. Finding weaknesses in your thesis doesn't mean abandon it \u2014 it means UNDERSTAND it. A thesis with known risks is stronger than one with blind spots.","incorrectFeedback":"Deliberately seeking disconfirming evidence is the highest form of analytical discipline. Most traders build a thesis and then defend it. The best traders build a thesis and then try to destroy it. What survives that process is your real edge. What doesn't survive is the part that would have cost you money.","chart":{"symbol":null,"candles":null}},{"module":"Module 7","topic":"Emotional Resilience","layer":1,"id":"M7-ER-001","status":"LIVE","scenario":"Scenario: after your biggest winning trade ever ($5,000 profit), your next three trades are oversized and reckless","question":"After a huge $5,000 win, your next three trades are oversized and sloppy. What's happening psychologically?","options":{"A":"Euphoria bias. A big win floods your brain with dopamine, creating overconfidence. You feel invincible, so you abandon your rules: bigger size, looser setups, less analysis. The market doesn't care about your last trade. The fix: treat every trade as independent. After a big win, REDUCE size for 2-3 trades to recalibrate.","B":"You've finally figured out trading and your increased confidence is justified \u2014 bigger trades are the natural progression","C":"This is normal professional development \u2014 all successful traders increase position size after wins to compound returns","D":"The three losses after a win are caused by the market deliberately targeting you once it identifies you as profitable"},"correct":"A","correctFeedback":"Euphoria is as dangerous as fear. Fear makes you miss good trades. Euphoria makes you take bad ones. After a big win, the urge to trade bigger and more aggressively is your brain chasing the dopamine hit \u2014 not your analysis improving. Counter-intuitive rule: after your best trade, trade SMALLER next time.","incorrectFeedback":"This is the winner's trap. Big wins create overconfidence which leads to oversized positions which lead to big losses. The psychological cycle: big win \u2192 feel invincible \u2192 break rules \u2192 big loss \u2192 feel terrible \u2192 revenge trade \u2192 bigger loss. Break the cycle by treating every trade as independent.","chart":{"symbol":null,"candles":null}},{"module":"Module 7","topic":"Emotional Resilience","layer":2,"id":"M7-ER-002","status":"LIVE","scenario":"Scenario: you've been losing for 3 weeks straight. You notice you no longer feel anything when a trade hits your stop \u2014 but you also no longer feel excited about good setups.","question":"After 3 weeks of losses, you feel emotionally numb \u2014 no pain from losses but no excitement about setups either. Is this good or bad?","options":{"A":"This is the ideal emotional state for trading \u2014 feeling nothing means you've achieved the emotional detachment all professionals seek","B":"This is emotional numbing (burnout), not detachment. Healthy emotional control means you can acknowledge emotions without acting on them. Numbness means your emotional system has shut down to protect itself \u2014 you're no longer evaluating setups with the energy and curiosity they require. Take a break. Reset. Journal. Return when you can feel something again.","C":"Push through it \u2014 the numbness will pass on its own once you start winning again and there's no need for a break","D":"Emotional numbness is caused by using the wrong trading strategy \u2014 switch to a different system and the feelings return"},"correct":"B","correctFeedback":"There's a critical difference between emotional control and emotional shutdown. Control = feeling the emotion but choosing not to act on it. Shutdown = feeling nothing. The first is professional discipline. The second is burnout \u2014 and it's dangerous because it also kills the positive engagement you need to read the market well.","incorrectFeedback":"Emotional resilience isn't about feeling nothing \u2014 it's about feeling everything and choosing your response. When you stop feeling anything, you've crossed from discipline into burnout. A break isn't weakness \u2014 it's maintenance. You wouldn't drive a car with no fuel. Don't trade with no emotional bandwidth.","chart":{"symbol":null,"candles":null}},{"module":"Module 7","topic":"Emotional Resilience","layer":3,"id":"M7-ER-003","status":"LIVE","scenario":"Scenario: reviewing your journal, you notice your worst drawdowns always happen during personal life stress (moving, relationship issues, work deadlines)","question":"Your trade journal reveals that your biggest drawdowns correlate with personal life stress \u2014 not bad markets or bad analysis. How do you use this insight?","options":{"A":"It's a coincidence \u2014 personal life has no impact on trading performance since markets are objective and analytical","B":"Build a 'life stress' filter into your trading plan. When you identify high-stress periods (moving, deadlines, personal issues), implement automatic risk reduction: half position size, fewer trades, wider stops. You're acknowledging that YOU are part of the trading system, and when you're compromised, the system's edge is reduced.","C":"Quit trading during any personal stress since you can only trade profitably when your life is perfectly calm","D":"Hide personal problems from yourself to maintain objectivity \u2014 never let emotions from outside trading affect your analysis"},"correct":"B","correctFeedback":"Your journal just revealed your biggest edge: self-awareness. Most traders blame the market for their drawdowns. You've identified that YOU are the variable. Building a 'stress protocol' (reduced size, fewer trades) during difficult life periods is sophisticated risk management that most traders never develop.","incorrectFeedback":"Trading performance is inseparable from personal wellbeing. When you're stressed, your risk tolerance changes, your patience shortens, and your decision-making degrades \u2014 even if you don't notice in the moment. A 'personal stress = reduce risk' rule is one of the most practical additions to any trading plan.","chart":{"symbol":null,"candles":null}},{"module":"Module 1","topic":"Support & Resistance","layer":3,"id":"M1-SR-016","status":"LIVE","scenario":"AAPL daily \u2014 price breaks above $200 resistance with strong volume, pulls back to $200, and bounces higher on a successful retest.","question":"A student says: 'The $200 level has flipped from resistance to support.' Is the student correct about the level flipping?","options":{"A":"No \u2014 a level is either support or resistance permanently; it cannot change roles once established","B":"Yes \u2014 this is a support / resistance flip. Broken resistance becomes support because buyers who missed the breakout now see $200 as a buying opportunity on the pullback. The strong-volume break plus a successful retest adds conviction that the flip is real.","C":"Only if the bounce holds for at least five trading days \u2014 one bounce is not enough to confirm the flip","D":"The level flipped, but only temporarily \u2014 it will revert to resistance within a few weeks"},"correct":"B","correctFeedback":"This is a textbook support / resistance flip. When price breaks above resistance with conviction (strong volume), that old resistance often becomes new support. The pullback to $200 and bounce confirms buyers are now defending what was previously a ceiling.","incorrectFeedback":"When resistance breaks with strong volume and price pulls back to that level and bounces, it confirms a support / resistance flip. The $200 level that was a ceiling is now a floor.","chart":{"symbol":"AAPL","interval":"D","candles":[[193.23,193.69,192.77,193.23],[193.23,196.13,192.54,195.44],[195.44,196.33,195.11,196.0],[196.0,196.34,194.29,194.63],[194.63,195.31,190.54,191.22],[191.22,199.77,190.76,199.31],[199.31,199.56,189.92,190.17],[190.17,193.92,189.55,193.3],[193.3,196.04,192.72,195.46],[195.46,196.25,195.22,196.01],[196.01,196.51,194.07,194.57],[194.57,199.99,193.88,199.3],[199.3,199.59,189.97,190.26],[190.26,190.62,189.84,190.2],[190.2,194.06,189.51,193.37],[193.37,195.89,192.95,195.47],[195.47,196.29,195.2,196.02],[196.02,199.97,195.36,199.31],[199.31,199.85,190.6,191.14],[191.14,191.37,190.02,190.25],[190.25,194.07,189.72,193.54],[193.54,197.49,192.88,196.83],[196.83,200.41,196.55,200.13],[200.13,203.84,199.71,203.42],[203.42,207.45,202.68,206.71],[206.71,210.41,206.3,210.0],[210.0,210.31,207.77,208.08],[208.08,208.79,205.45,206.16],[206.16,206.7,203.7,204.24],[204.24,204.48,202.08,202.32],[202.32,202.91,199.81,200.4],[200.4,201.95,199.75,201.3],[201.3,202.47,201.03,202.2],[202.2,203.56,201.74,203.1],[203.1,204.73,202.37,204.0]]},"answer":"B","explanation":"This is a textbook support / resistance flip. When price breaks above resistance with conviction (strong volume), that old resistance often becomes new support. The pullback to $200 and bounce confirms buyers are now defending what was previously a ceiling."},{"module":"Module 1","topic":"Candlestick Patterns","layer":2,"id":"M1-CS-014","status":"LIVE","scenario":"NVDA daily \u2014 stock has been in a downtrend for several weeks, then prints a large bullish engulfing candle right at $820 support with heavy volume well above the recent average.","question":"How would you trade this bullish engulfing candle at $820 support?","options":{"A":"Enter immediately at market open the next day with a stop at $750 \u2014 the engulfing pattern guarantees a reversal so a wide stop is fine","B":"Wait for next-day follow-through, then enter near the engulfing close or on a pullback to the engulfing midpoint. Place stop below the engulfing low / $820 support. The heavy volume plus location at a key support level significantly increases the pattern's reliability.","C":"Ignore the pattern entirely \u2014 single candlestick patterns are unreliable and never worth trading","D":"Short the stock because the downtrend is still in effect \u2014 one candle cannot reverse a trend"},"correct":"B","correctFeedback":"A bullish engulfing at support with heavy volume is one of the higher-probability candlestick setups. The smart approach: wait for next-day follow-through (confirming buyers are still in control), enter near the engulfing close or on a pullback to its midpoint, and set your stop just below the engulfing low or the $820 support zone. Three factors boost reliability here: (1) the pattern appears at a key support level, (2) volume is well above average showing strong participation, and (3) the engulfing body is large, showing decisive buying. Always wait for confirmation rather than jumping in blindly.","incorrectFeedback":"Consider three things when trading candlestick patterns: location (is it at a key level?), volume (is participation strong?), and confirmation (does the next candle follow through?). This engulfing appears at support with heavy volume \u2014 that's two out of three. The missing piece is next-day follow-through. Enter after confirmation, place your stop below the pattern low, and the risk-reward setup becomes much cleaner.","chart":{"symbol":"NVDA","interval":"D","candles":[[850,854.15,845.12,845.42],[845.55,850.33,841.0,841.5],[840.91,847.21,840.44,846.49],[846.37,847.0,834.59,834.79],[835.6,835.78,830.27,830.61],[830.12,830.93,830.09,830.92],[830.39,835.68,825.97,826.63],[826.75,826.93,819.59,821.22],[820.7,829.42,819.36,828.38],[828.87,835.87,820.4,835.19],[835.25,858.93,832.84,846.04],[846.71,847.26,843.79,844.39],[843.82,851.52,839.72,839.86],[839.69,843.2,839.01,842.69],[843.43,848.32,843.4,847.97],[847.65,854.34,840.31,854.09],[854.71,860.09,854.16,854.65],[854.37,859.32,850.45,850.7],[850.99,853.31,840.92,842.57],[842.09,845.05,831.82,845.01],[844.99,846.35,844.86,846.16],[846.33,850.68,845.49,850.26],[849.67,849.9,847.83,848.03],[848.6,859.82,848.28,859.73],[860.49,860.53,859.47,859.5],[859.71,860.51,855.36,855.77],[856.44,856.98,846.61,850.26],[851.01,852.47,839.48,839.55],[839.97,840.59,835.55,837.13],[836.64,836.68,832.69,833.04],[833.85,838.68,833.7,836.09],[836.56,836.72,833.06,833.84],[833.24,833.85,825.0,825.36],[825.66,826.06,822.66,823.16],[821.16,835.06,820.66,834.06]],"volume":[1470487,916739,826225,1088389,1056787,1034053,946316,907473,1371858,891161,1419176,1242417,833326,831244,898246,1029258,1043962,1329903,1431262,827824,1388508,1008496,1481453,1371412,1239898,1031148,1271029,1417889,1091704,806814,967414,1243143,1156778,1312886,4300581],"overlays":{"lines":[{"values":[820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820],"color":"#ff9800","label":"$820 Support","width":1,"style":"dashed"}]}}},{"module":"Module 1","topic":"Candlestick Patterns","layer":3,"id":"M1-CS-015","status":"LIVE","scenario":"META daily \u2014 stock has been in a strong uptrend for weeks, making higher highs and higher lows. A doji candle forms mid-trend, away from any obvious resistance level.","question":"A student says: 'A doji means indecision, which means reversal is coming.' Is the student's reasoning sound?","options":{"A":"Yes \u2014 a doji always signals reversal regardless of where it forms, so the student should prepare to short immediately","B":"No \u2014 a doji mid-trend in a strong uptrend is often just a pause or rest day, not a reversal signal. Dojis are far more meaningful at resistance levels after extended moves, and they still require confirmation from the next candle. One doji mid-trend does not equal reversal.","C":"The student is partially right \u2014 the doji means indecision, but they should wait exactly three days to see if it becomes a reversal","D":"Dojis are only relevant on weekly charts; on the daily chart they have no significance at all"},"correct":"B","correctFeedback":"The student's mistake is applying a blanket rule ('doji = reversal') without considering context. A doji does show indecision for that single session, but context matters enormously. Mid-trend dojis in a strong uptrend are often just brief pauses \u2014 the trend resumes the next day. Dojis become much more significant when they appear: (1) at a key resistance level, (2) after an extended move, and (3) with confirmation from the next candle (e.g., a bearish candle closing below the doji's low). One doji in the middle of a healthy trend is rarely a reversal signal.","incorrectFeedback":"Context is everything with candlestick patterns. Ask: Where did the doji form? (mid-trend vs. at resistance) How extended is the move? (fresh trend vs. overextended) What does the next candle do? A doji at resistance after a long run-up is significant. A doji mid-trend during a healthy move is usually just a pause. Never apply candlestick rules as blanket statements \u2014 always consider the bigger picture.","
