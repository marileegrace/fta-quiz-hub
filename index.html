on":"How would you evaluate this student's argument?","options":{"A":"The student is correct \u2014 news-driven moves should be completely ignored when analyzing structure","B":"The student is wrong \u2014 price is price regardless of catalyst. However, news-driven spikes do have a higher reversal rate. The break of structure is real but watch the follow-through over the next 2-3 sessions for confirmation.","C":"The student is right \u2014 only count structural changes on average or below-average volume","D":"The break of structure is confirmed and the trend is now bearish \u2014 the cause doesn't matter at all"},"correct":"B","correctFeedback":"Correct. Price is price \u2014 a break of structure happened regardless of why. The structural damage is real and can't be dismissed. However, the student raises a fair nuance: single news-driven spikes with extreme volume do have a higher reversal rate than gradual structural breaks. The practical approach is to acknowledge the break, respect the warning, but watch the next 2-3 sessions for follow-through. If price reclaims the broken level quickly, the break may have been a false signal. If it holds below, the structural shift is confirmed.","incorrectFeedback":"Dismissing price moves because of their catalyst is a dangerous habit \u2014 price is price. The break of structure is real whether caused by news, earnings, or organic selling. However, context matters: news-driven moves with extreme volume are more likely to reverse than gradual structural breaks. The right approach: respect the break as real damage, then watch for follow-through over the next 2-3 sessions to see if it holds.","chart":{"symbol":"AAPL","interval":"D","candles":[[196.64,197.11,196.17,196.64],[196.64,197.84,195.94,197.14],[197.14,198.12,196.81,197.79],[197.79,199.05,197.44,198.7],[198.7,199.69,197.99,198.98],[198.98,200.6,198.52,200.14],[200.14,200.61,199.88,200.35],[200.35,202.05,199.7,201.4],[201.4,202.48,200.8,201.88],[201.88,202.8,201.63,202.55] tion":"How would you classify each phase of this price action?","options":{"A":"Both phases are impulse moves \u2014 the first is bearish impulse, the second is bullish impulse","B":"The sharp drop is an impulse move; the tight range is consolidation","C":"The sharp drop is consolidation because price was 'settling'; the tight range is the real move","D":"Neither phase is classifiable without additional indicators like RSI"},"correct":"B","correctFeedback":"The sharp drop with large candles and high volume is a textbook bearish impulse \u2014 fast, directional, and conviction-driven. The tight range that follows, with small candles and quieter volume, is consolidation \u2014 the market pausing and digesting the move. Impulse = speed + size + volume. Consolidation = tight range + small candles + pause.","incorrectFeedback":"Focus on the characteristics: impulse moves are fast, directional, with large candles and strong volume. Consolidation is a pause \u2014 tight range, small candles, low energy. The sharp drop fits impulse; the sideways range fits consolidation.","chart":{"symbol":"MSFT","interval":"D","candles":[[340,340.18,335.71,336.33],[336.48,338.17,334.95,337.97],[337.65,337.8,329.95,329.98],[329.81,330.17,324.78,327.16],[327.17,327.88,323.22,323.98],[323.98,324.31,319.65,319.87],[319.94,320.3,315.64,317.37],[317.46,318.18,312.03,313.19],[313.48,315.88,309.11,309.9],[310.14,310.22,308.56,308.66],[308.7,309.51,308.56,309.42],[309.47,309.7,305.13,305.13],[305.25,305.49,302.55,303.58],[303.58,303.84,302.56,302.58],[302.69,303.17,302.52,303.11],[302.83,303.07,302.52,303.05],[303.3,305.17,302.92,305.06],[305.03,308.02,304.72,307.93],[308.05,308.12,305.38,305.81],[305.94,306.12,303.63,303.67],[303.59,303.89,299.19,301.06],[301.13,304.42,300.59,303.83],[303.91,306.8,303.56,306.48],[306.3,306.59,305.83,305.85],[306.12,307.15,306.09,307.06],[307.1,308.52,307.0,308.21],[308.11,309.11,307.41,309.08],[309.0,309.92,304.32,305.13],[305.34,309.12,299.87,300.83],[301.04,301. question":"What typically follows a prolonged consolidation like this?","options":{"A":"The stock will continue trading sideways indefinitely until news arrives","B":"An impulse move \u2014 consolidation compresses energy like a spring, and the longer the compression the more powerful the eventual move","C":"A slow, gradual drift in the direction of the prior trend with no clear impulse","D":"Consolidation always ends with a gap down because low volume means sellers are in control"},"correct":"B","correctFeedback":"Prolonged consolidation acts like a compressed spring. The tight range shows supply and demand are in balance, but eventually one side wins. The longer the consolidation, the more energy builds \u2014 and the resulting impulse breakout (or breakdown) tends to be more powerful. This is why traders watch extended consolidation zones closely for the next directional move.","incorrectFeedback":"Extended consolidation doesn't last forever \u2014 it builds pressure. Think of it as a spring compressing: the tighter and longer the range, the more energy is stored. When it finally breaks, the resulting impulse move tends to be powerful. Low volume during consolidation is normal and doesn't indicate seller control.","chart":{"symbol":"AMD","interval":"D","candles":[[505,506.69,504.77,506.6],[507.03,508.7,506.86,508.36],[508.42,508.61,507.92,507.95],[507.56,507.65,506.0,506.03],[506.31,508.59,506.19,508.29],[508.44,508.64,502.06,502.06],[501.6,505.14,501.07,504.4],[504.0,506.22,503.55,505.83],[505.74,508.17,505.67,507.01],[507.11,507.7,504.55,504.74],[505.04,505.23,502.28,502.3],[502.72,503.08,500.88,501.05],[501.06,505.32,500.81,504.72],[505.11,505.82,504.4,505.78],[505.34,508.96,504.81,508.94],[509.24,509.49,504.24,506.85],[506.38,507.04,505.91,506.93],[506.75,506.89,503.02,503.05],[503.03,504.47,502.99,504.19],[504.13,506.34,503.96,505.87],[505.89,506.02,505.87,505.98],[505.49,505.78,500.46,502.54],[502.59,508.59,498.04,498.05],[497.55,500.05,496.29,500.04],[500. the candles are small and mixed. The faster, higher-volume bearish move is the dominant impulse. Corrections move against the impulse direction with less energy \u2014 exactly what you see here. Don't confuse 'price going up' with 'bullish impulse.'","incorrectFeedback":"Not every price rise is a bullish impulse. Compare the two moves: the drop was fast, with large candles and heavy volume \u2014 that's impulse energy. The rise is slow, taking far longer to retrace less ground, with small candles and declining volume \u2014 that's corrective energy. The dominant move is the one with speed, size, and volume behind it.","chart":{"symbol":"NVDA","interval":"D","candles":[[245,247.3,243.15,247.01],[246.92,248.84,246.77,248.04],[248.04,248.16,248.01,248.11],[248.0,248.66,247.14,247.15],[246.97,248.07,245.03,245.27],[245.23,246.08,244.25,246.07],[246.26,248.09,245.98,247.68],[247.5,248.22,247.39,248.1],[248.04,251.0,246.83,250.06],[250.08,250.19,249.59,249.64],[249.39,249.48,248.59,248.98],[248.79,249.03,248.66,249.0],[248.92,250.78,248.88,250.42],[250.39,250.97,250.34,250.91],[251.01,251.18,250.96,251.11],[251.21,251.25,249.73,249.86],[249.88,250.11,248.28,248.6],[248.62,249.53,247.82,247.89],[247.93,249.03,246.67,248.91],[248.7,249.32,248.64,249.18],[249.35,249.97,249.24,249.97],[250.19,250.75,247.58,247.78],[247.94,248.77,242.72,243.52],[243.52,244.04,243.3,243.94],[243.76,251.63,237.08,237.44],[237.35,237.87,234.71,235.19],[235.39,237.94,231.73,237.9],[237.68,238.22,232.76,233.3],[233.28,234.67,233.01,234.53],[234.69,235.26,230.86,230.94],[231.16,231.2,230.63,230.66],[230.56,231.04,227.82,228.42],[228.3,228.49,224.88,224.94],[224.73,225.97,224.72,225.84],[225.98,226.01,225.79,225.8],[225.75,227.91,225.02,227.88],[228.06,228.07,227.74,227.76],[227.54,227.75,227.53,227.74],[227.8,227.93,225.87,225.9],[225.75,227.19,225.49,227.03],[226.85,230.83,226.57,230.21],[230.39,230.6,229.96,229.97],[230.0,230.04,229.53,229.6],[229.41,230.36,228.56,228.69],[228.66,228.71,228.06,228 ver buy near highs"},"correct":"B","correctFeedback":"Consolidation near the highs is a bullish signal \u2014 sellers can't push price down despite the big run-up. The setup: alert for breakout above $860 with volume confirmation. Entry above $860, stop below $845 (consolidation low), and target the impulse distance ($60) projected from the breakout point. This keeps risk tight while capturing the next impulse leg.","incorrectFeedback":"When price consolidates near highs after an impulse, it shows buyers are holding their ground \u2014 that's bullish, not bearish. The proper approach is to watch for a breakout above the consolidation range ($860) with volume. Stop goes below the consolidation ($845) for tight risk, and your target uses the impulse distance projected from the breakout.","chart":{"symbol":"NVDA","interval":"D","candles":[[800,807.4,799.64,803.78],[803.63,807.4,800.98,806.78],[807.32,814.84,807.12,814.62],[815.1,815.84,811.89,812.61],[811.9,812.94,811.79,812.82],[813.53,814.02,807.72,810.09],[809.81,822.78,809.37,821.1],[820.32,820.61,817.3,817.49],[817.58,830.1,816.74,830.09],[830.43,830.45,830.02,830.07],[830.5,830.53,829.94,830.15],[830.15,830.42,824.6,824.87],[824.05,831.29,823.44,831.13],[831.01,836.57,830.16,835.82],[836.26,844.93,833.89,844.83],[844.94,845.2,842.72,843.07],[842.95,843.22,842.03,842.05],[841.98,842.32,839.37,839.71],[839.93,844.55,839.36,844.03],[843.3,867.16,837.82,862.78],[863.01,864.58,860.11,860.21],[860.1,860.22,858.76,859.06],[858.24,858.51,855.22,855.91],[855.81,857.48,850.15,852.11],[851.85,859.75,846.8,858.46],[859.06,860.51,858.89,860.38],[860.27,862.23,858.02,858.02],[857.85,865.09,845.69,847.62],[848.41,848.5,847.77,847.82],[847.79,848.83,846.16,846.66],[846.27,847.18,846.23,847.07],[847.81,848.03,847.0,847.01],[847.21,855.2,846.55,855.08],[854.74,855.27,851.96,852.31],[852.53,853.89,851.72,853.75],[853.36,853.88,849.27,849.35],[849.34,851.63,848.76,851.4],[851.97,858.83,851.86,858.42],[858.43,861.92,855.69,855.92],[8 lses ($20, $15, $8) show sellers are running out of ammunition. This is a trend maturation signal, not trend health.","chart":{"symbol":"META","interval":"D","candles":[[200,200.01,198.63,198.91],[198.93,199.67,198.04,198.09],[198.22,198.44,197.98,198.03],[197.89,197.9,197.69,197.69],[197.82,198.32,197.53,198.26],[198.13,198.28,195.87,195.89],[195.93,196.0,195.59,195.65],[195.64,195.72,195.63,195.71],[195.82,195.85,192.0,192.06],[192.2,192.26,189.04,190.51],[190.35,191.87,187.69,187.83],[187.69,188.21,184.62,185.93],[185.86,185.88,182.85,183.2],[183.23,183.8,180.21,180.32],[180.43,180.57,179.74,180.03],[179.98,180.81,179.81,180.64],[180.78,181.2,180.68,181.18],[181.26,183.02,181.11,182.98],[183.06,183.72,179.98,180.29],[180.22,180.59,177.66,178.18],[178.11,178.33,176.01,177.04],[176.94,185.12,175.06,183.38],[183.23,186.93,182.49,186.11],[186.28,188.35,184.01,184.08],[183.9,183.96,182.92,183.31],[183.17,183.47,181.96,182.11],[182.14,182.96,174.88,178.02],[177.97,178.29,175.46,175.92],[175.92,176.9,175.23,176.81],[176.86,177.04,173.09,173.1],[172.99,173.04,170.84,171.08],[171.22,171.86,171.09,171.85],[171.91,172.17,168.9,168.9],[168.92,169.87,168.75,169.76],[169.79,170.0,168.82,168.92],[168.98,173.03,168.79,173.03],[173.16,173.49,171.19,171.44],[171.54,171.59,169.19,170.31],[170.28,170.9,166.18,166.99],[167.12,169.29,166.56,169.26],[169.43,172.8,165.53,172.57],[172.4,174.59,172.25,174.07],[173.99,174.27,172.5,172.59],[172.61,172.94,170.23,170.46],[170.52,170.92,170.3,170.9],[171.07,172.03,170.37,170.38],[170.4,170.8,167.77,168.0],[167.95,168.32,167.88,168.11],[168.05,168.54,167.35,167.43],[167.4,167.53,166.15,166.76],[166.91,166.95,165.91,165.97],[166.05,168.0,165.49,167.94],[168.02,169.1,167.39,168.99],[168.88,171.57,168.73,170.12],[170.22,170.57,167.42,167.48],[167.32,167.43,166.89,166.93],[166.97,167.1,163.69,164.1]]}},{"module":"Module 1","topic":"Impulse vs Consolidation","layer":2,"id":"M1-IC-010","status":"LIVE","scenario":"After a strong bullish impulse, a stock forms a flag pattern: price drifts slightly downward in a narrow channel on declining volume.","question":"What would you be watching for in order to get into a continuation trade long?","options":{"A":"Watching for increasing volume as well as a break above the bearish trend line and market structure shifting bullish on smaller time frames","B":"Only watching for a single large green candle \u2014 that alone confirms continuation","C":"Waiting for price to retrace 100% of the impulse before entering long","D":"Ignoring volume entirely and just buying at the flag support with no confirmation"},"correct":"A","correctFeedback":"Continuation confirmation has three parts: volume expanding again after drying up during the flag, a break above the flag's descending trend line, and market structure turning bullish on the smaller time frames (higher highs and higher lows resuming). When those line up after a healthy low-volume flag, the odds favor the next impulse leg in the trend's direction. Stop goes below the flag low.","incorrectFeedback":"Flags are continuation patterns that form after an impulse (the 'pole'). The declining volume and slight drift against the trend is healthy consolidation \u2014 but you still need confirmation before entering: expanding volume, a break above the flag's descending trend line, and structure shifting bullish on smaller time frames. One green candle alone, or buying with no confirmation at all, is not a plan.","chart":{"symbol":"TSLA","interval":"D","candles":[[175,175.47,174.87,175.47],[175.41,175.48,175.4,175.48],[175.39,176.09,175.31,176.02],[175.99,176.19,175.75,176.17],[176.27,176.27,175.71,175.73],[175.74,178.1,175.32,178.06],[177.91,177.93,177.32,177.45],[177.46,177.52,177.1,177.16],[177.24,177.28,176.96,176.97],[176.83,176.92,176.45,176.51],[176.67,176.89,176.66,176.87],[176.97,177.1,175.05,175.96],[176.09,177.35,175.75,177.22],[177.35,178.23,176.62,178.08],[177.97,179.66,177.34,178.95],[179.08,179.81,178.35,178.49],[178.55,178 s were brief. Now, after the third impulse, the current consolidation has stretched significantly with no breakout.","question":"What does this extended consolidation signal compared to the previous shorter ones?","options":{"A":"Nothing different \u2014 consolidation length is random and meaningless","B":"A character change in the trend. Previous quick consolidations showed eager buyers ready to push higher. The extended pause signals fading urgency and possible trend exhaustion. Reduce position size or wait for a clear directional signal","C":"The longer consolidation guarantees a bigger breakout \u2014 always add to your position during extended consolidation","D":"Extended consolidation means the stock is broken and will crash \u2014 exit all positions immediately"},"correct":"B","correctFeedback":"When consolidation character changes within a trend, pay attention. The first two brief pauses showed eager buyers quickly absorbing supply. A consolidation stretching roughly three times longer than those is a behavior change \u2014 buying urgency is fading. This doesn't guarantee reversal, but it's a maturation signal. The prudent response: reduce position size, tighten stops, or simply wait for the market to show its hand before committing more capital.","incorrectFeedback":"Consolidation length within a trend carries important information. Quick consolidations show eager buyers who can't wait to buy more. When the current consolidation stretches several times longer than the earlier ones, it signals a character change \u2014 the urgency is fading. This is a caution signal, not a reason to add size or panic sell, but rather to respect the shift and adjust your approach.","chart":{"symbol":"AMZN","interval":"D","candles":[[200,200.66,199.89,200.57],[200.4,200.57,198.79,199.04],[198.94,207.15,198.09,207.09],[206.94,210.04,206.4,209.61],[209.53,213.53,209.13,212.94],[212.8,214.85,212.19,213.94],[213.95,215.76,213.89,215.63],[215.42,215.42,214.9,214.98],[215.14,220.03, and $560.","question":"A student says: 'I missed the impulse move from $540 to $560, so I shouldn't buy now.' How would you evaluate this student's reasoning?","options":{"A":"The student is correct \u2014 once you miss an impulse, the opportunity is gone and chasing leads to losses","B":"The student should buy at the current price immediately regardless of the consolidation pattern","C":"The consolidation IS the entry opportunity. Impulse-consolidation-impulse is the market's rhythm. Enter near consolidation support (~$553-$554) or on a breakout above $560 with a stop below the consolidation range","D":"The student should wait for price to return to $540 before buying, as that was the impulse origin"},"correct":"C","correctFeedback":"This is one of the most important concepts: you don't trade the impulse \u2014 you trade the consolidation that follows it. Impulse-consolidation-impulse is the market's natural rhythm. The consolidation at $553-$560 IS your entry zone. Buy near support (~$553-$554) for better risk/reward, or buy a breakout above $560 for confirmation. Missing the impulse doesn't mean missing the trade \u2014 the consolidation hands you the opportunity on a silver platter.","incorrectFeedback":"The student has a common misconception. You rarely catch impulse moves from the start \u2014 and you don't need to. The market's rhythm is impulse \u2192 consolidation \u2192 impulse. The consolidation phase IS your entry opportunity. Waiting for consolidation gives you a defined risk level (consolidation support) and positions you for the next impulse leg.","chart":{"symbol":"AAPL","interval":"D","candles":[[540,542.25,539.53,542.12],[541.89,547.08,541.43,544.18],[543.74,546.98,543.56,546.96],[547.25,547.34,546.33,546.43],[546.42,546.44,545.55,545.66],[545.77,545.91,544.7,545.02],[545.4,549.64,545.16,548.87],[548.48,551.77,548.24,551.23],[551.39,553.49,550.89,553.04],[552.97,553.13,552.31,552.41],[552.28,552.32,551.5,551.96],[552.31,552.45,549.91,551.08],[551.5 e is actually bullish for the bearish thesis. It means: no significant buying is stepping in to oppose the move. This 'volume void' signals that the path of least resistance remains in the impulse direction. Heavy impulse volume + quiet consolidation = continuation setup. The silence during consolidation is a feature, not a bug.","incorrectFeedback":"Low volume during consolidation doesn't mean 'nobody's interested.' After a high-volume impulse, you want to see quiet consolidation \u2014 it means no opposing force is stepping in. If buyers were genuinely interested in reversing the move, you'd see volume increase during the consolidation. The absence of counter-trend volume is a continuation signal.","chart":{"symbol":"MSFT","interval":"D","candles":[[300,301.02,294.36,295.31],[295.3,295.52,292.87,293.07],[293.01,293.34,287.97,288.01],[288.16,289.48,288.01,289.19],[289.24,291.34,289.07,290.91],[290.88,291.55,290.1,290.11],[290.39,291.57,279.71,283.77],[283.51,285.51,283.45,285.21],[285.05,285.74,274.8,274.87],[274.93,275.76,274.81,275.64],[275.83,275.99,275.7,275.98],[276.22,278.13,276.17,278.12],[278.19,278.46,273.77,275.79],[275.81,276.04,275.79,276.02],[275.87,275.99,269.93,269.96],[270.04,271.78,269.93,271.52],[271.54,273.78,271.54,273.45],[273.2,275.44,272.76,274.1],[274.25,274.96,267.56,271.15],[270.98,271.55,270.32,271.53],[271.79,271.96,266.92,266.92],[267.04,274.27,266.45,273.8],[273.93,276.14,271.56,272.0],[271.89,273.3,271.74,273.04],[273.23,273.47,271.63,271.86],[271.76,276.36,267.71,268.49],[268.35,268.92,265.59,266.03],[266.21,266.78,266.18,266.68],[266.7,269.53,266.44,269.27],[269.37,271.96,269.22,271.92],[271.94,272.49,270.0,270.12],[270.27,270.44,262.32,266.62],[266.44,267.33,264.48,265.14],[265.02,265.88,264.93,265.7],[265.68,265.72,263.06,263.65],[263.41,271.03,262.34,270.96],[271.01,271.03,270.51,270.79],[271.03,271.28,268.73,269.52],[269.7,269.87,268.01,268.06],[268.06,269.02,266.91,268.97],[269.09,269.93,268.91,269.88],[269.66,270.12,269.56,270.08]],"volume":[2950724,3267721,3138352,3552027,3448027,3163763,3630167,3996749,3977585,2870892,2112760,2114608,1627267,1101770,686720,471157,466545,643914,554228,600229,618859,376765,468355,481581,562825,668718,655584,615717,670398,277117,455370,465588,539655,671038,759775,639495,565268,506427,430776,566754,563481,581455]}},{"module":"Module 1","topic":"Impulse vs Consolidation","layer":3,"id":"M1-IC-014","status":"LIVE","scenario":"A stock completes a bullish impulse from $120 to $160 ($40 move), consolidates between $143-$152, then breaks out above $152. A student projects the full $40 measured move from the breakout: $152 + $40 = $192 target.","question":"Is the student's measured move projection of $192 valid?","options":{"A":"Yes, measured moves are exact \u2014 $192 is guaranteed","B":"No, measured moves never work \u2014 targets are useless and you should just hold forever","C":"It's a reasonable starting estimate, but not guaranteed. Later impulse legs often diminish in size. Use $192 as an initial target but adjust based on real-time momentum, volume, and nearby support/resistance levels","D":"The projection should be doubled ($152 + $80 = $232) because second legs are always bigger than first legs"},"correct":"C","correctFeedback":"Measured moves provide useful estimates, not guarantees. The $192 target ($152 + $40) is a reasonable starting point. However, later impulse legs in a trend often produce diminishing moves as momentum fades. Use $192 as your initial target, but actively manage the trade: watch for weakening momentum, declining volume, or significant resistance levels that might cap the move. Rigid targets get traders in trouble \u2014 flexible targets based on live market feedback produce better results.","incorrectFeedback":"Measured moves are a valuable tool, but they're estimates, not guarantees. The $40 projection from the $152 breakout gives $192 as a starting target. However, second and third impulse legs often produce smaller moves than harp departure and high volume on the original bounce","C":"The zone has been tested multiple times, proving buyers are committed","D":"The zone is narrow, which means buyers are concentrated in a tight range"},"correct":"B","correctFeedback":"Freshness is the key factor. A zone that has never been retested still has unfilled buy orders sitting at those prices. The sharp departure and high volume confirm strong institutional demand was present. First tests of quality zones have the highest probability of holding.","incorrectFeedback":"Multiple tests actually weaken a zone by absorbing the orders that created it. What makes a zone powerful is being untested (fresh) \u2014 the original buy orders are still there waiting to be filled. Combined with a sharp move away and high volume, this is a high-quality demand zone.","chart":{"symbol":"TSLA","interval":"D","candles":[[200,200.04,197.73,198.98],[199.1,199.63,199.0,199.57],[199.58,201.83,196.85,196.88],[197.06,197.15,195.63,196.38],[196.51,196.75,195.5,195.67],[195.81,195.84,194.09,194.1],[194.23,194.25,191.09,192.92],[193.03,193.16,190.32,190.84],[190.95,191.05,189.37,189.99],[190.07,190.3,188.38,189.07],[188.88,189.14,186.03,187.42],[187.45,187.49,185.96,186.03],[186.05,186.14,184.27,184.31],[184.17,184.41,182.19,182.63],[182.74,182.87,181.4,181.98],[181.81,181.93,180.8,180.85],[180.68,181.18,178.31,178.73],[178.63,178.72,177.54,177.99],[176.75,177.84,172.13,177.51],[177.95,177.96,177.84,177.86],[177.77,177.95,175.92,175.93],[175.81,176.45,175.79,176.33],[176.36,179.53,176.15,177.89],[177.93,180.2,176.02,180.11],[179.95,180.81,179.48,180.72],[180.57,180.58,179.71,179.83],[179.95,184.15,178.21,184.14],[184.25,184.87,184.17,184.61],[184.6,185.03,184.6,184.95],[185.12,188.13,184.92,186.91],[186.86,187.31,186.49,186.49],[186.54,186.58,186.39,186.39],[186.32,186.36,184.85,184.94],[185.0,185.17,184.87,185.15],[185.32,186.26,185.16,186.23],[186.29,188.44,185.93,188.09],[187.96,188.42,184.08,184.98],[184.82,184.83,184.25,184 7],[487.42,488.17,487.28,488.14],[487.68,488.2,487.64,488.14],[487.99,490.1,487.91,490.1]],"overlays":{"zones":[{"top":480,"bottom":475,"color":"rgba(76,175,80,0.6)","fill":"rgba(76,175,80,0.15)","label":"Demand Zone"}]}},"answer":"B","explanation":"Each time price dips into the $475-$480 demand zone, some of the resting buy orders get filled. The rallies getting progressively weaker \u2014 from $506 to $500 to $490 \u2014 shows that fewer unfilled buy orders remain each time. The zone is being eroded and is at increasing risk of breaking."},{"module":"Module 1","topic":"Supply & Demand","layer":"L2","id":"M1-SD-008","status":"LIVE","scenario":"You identify a fresh demand zone at $163-$165 formed by a lower wick that reached into that range during a selloff. Price rallied sharply away \u2014 a $15 move \u2014 and the zone has never been retested. Price is currently at $168 and declining back toward the zone.","question":"How would you set up a trade using this demand zone?","options":{"A":"Buy immediately at $168 before price reaches the zone \u2014 you don't want to miss the move","B":"Set an alert at $165 and watch how price reacts to the zone. If buyers step in a second time and create a hammer candle or a bullish engulfing candle pattern (or something similar), place a buy order with a stop below the zone and a target of the most recent previous high","C":"Wait for price to break below $163 and buy the breakout, stop at $155","D":"Buy at $163 with no stop \u2014 fresh zones always hold so a stop is unnecessary"},"correct":"B","correctFeedback":"The best approach is to set an alert at $165 and wait for price to reach the zone. You want confirmation that buyers are stepping in \u2014 look for a hammer candle, bullish engulfing, or similar reversal pattern. Once you see that confirmation, place a buy order with your stop below the zone and target the most recent previous high. This gives you a defined risk (stop below zone) and a logical profit target.","incorrectFeedback":"Don't chase price above the zone, and never skip your stop. Let price come back to the $163-$165 zone and show you buyers are stepping in \u2014 a hammer, bullish engulfing, or similar reversal candle. Then enter with a stop just below the zone (the thesis is invalidated if price breaks through) and target the most recent previous high. Fresh zones with sharp departures are high probability, but no zone is guaranteed.","chart":{"symbol":"AAPL","interval":"D","candles":[[178,178.11,176.77,176.96],[176.96,177.01,176.03,176.41],[176.5,176.64,174.87,176.09],[176.02,176.03,175.74,175.88],[175.76,176.84,175.68,176.21],[176.3,176.33,173.86,173.91],[173.74,173.77,173.21,173.22],[173.39,173.42,172.79,172.92],[173.01,173.37,171.45,171.96],[172.13,172.27,170.7,170.93],[170.85,172.03,170.81,171.35],[171.39,171.57,169.94,169.95],[170.0,170.01,169.49,169.59],[169.58,169.6,169.37,169.4],[167.0,168.38,163.87,167.96],[167.95,168.59,167.87,168.34],[168.44,168.68,168.43,168.63],[168.71,170.07,168.52,170.01],[170.05,172.02,169.61,171.64],[171.78,171.85,170.15,170.93],[170.84,173.08,170.83,173.07],[173.0,175.2,172.8,174.72],[174.65,175.21,174.63,175.19],[175.18,176.98,174.88,176.07],[176.15,176.38,175.97,176.36],[176.29,176.41,176.16,176.17],[176.28,179.02,176.27,179.01],[178.92,179.39,178.43,179.36],[179.39,179.45,179.11,179.13],[178.96,181.4,178.27,181.05],[180.87,181.07,178.89,179.14],[179.03,179.22,178.34,178.35],[178.44,179.7,177.47,178.99],[179.08,179.27,177.76,178.02],[178.01,178.05,176.76,176.94],[176.93,177.09,175.74,176.07],[176.17,176.72,174.97,175.18],[175.28,176.93,175.27,176.7],[176.68,176.91,172.95,172.96],[172.86,173.18,171.31,171.43],[171.5,171.65,170.69,170.8],[170.71,171.01,169.32,169.95],[169.86,169.87,169.73,169.74],[169.83,170.67,169.79,170.21],[170.3,170.37,167.91,167.96]],"overlays":{"zones":[{"top":165,"bottom":163,"color":"rgba(76,175,80,0.6)","fill":"rgba(76,175,80,0.15)","label":"Demand Zone"}]}},"answer":"B","explanation":"The best approach is to set an alert at $165 and wait for price to reach the zone. You want confirmation that buyers are stepping in \u2014 look for a hammer candle, bullish engulfing, or similar reversal pattern. Once you see that confirmation, place a buy order with your stop below the zone and target the most recent previous high. This gives you a defined risk (stop below zone) and a logical profit target."},{"module":"Module 1","topic":"Supply & Demand","layer":"L2","id":"M1-SD-009","status":"LIVE","scenario":"A supply zone from $191-$195 formed when upper wicks reached into that range during a rally \u2014 candle bodies stayed below $191 but wicks pushed higher before sellers drove price back down. Price dropped to $179 and is now rallying back toward the zone.","question":"How should you use this supply zone in your trading plan?","options":{"A":"Ignore it \u2014 supply zones only matter on the way down, not when price is rising","B":"Buy aggressively as price enters the zone \u2014 momentum will carry it through","C":"If long: trim your position and move stops up after a higher low forms. If looking for a short: wait for a bearish rejection candle in the zone, stop above it, target demand below","D":"Place a market sell order at $191 immediately \u2014 supply zones guarantee reversals"},"correct":"C","correctFeedback":"A supply zone is where sellers previously overwhelmed buyers, shown by upper wicks reaching into $191-$195 then rejecting. If you are long, the smart play is to trim your position and tighten stops at the zone since sellers may step in again. If looking to short, wait for a bearish rejection candle (like a shooting star or bearish engulfing) in the zone for confirmation before entering.","incorrectFeedback":"Supply zones are critical whether price is rising or falling \u2014 they represent areas where sellers previously overwhelmed buyers. For longs, they are profit targets. For shorts, they are potential entries. But always wait for confirmation before shorting \u2014 hort, wait for a bearish rejection candle (like a shooting star or bearish engulfing) in the zone for confirmation before entering."},{"module":"Module 1","topic":"Supply & Demand","layer":"L2","id":"M1-SD-010","status":"LIVE","scenario":"A demand zone at $181-$183 formed when a lower wick reached into that range during a selloff. Price rallied away to $191, then pulled back to retest the zone \u2014 you entered long at $183 with a stop at $180. Price bounced to $190 but has now pulled back to $184. Your stop has not been hit.","question":"What should you do with this position?","options":{"A":"Close the trade immediately \u2014 the pullback means the demand zone has failed","B":"Move your stop up to $183 (breakeven) immediately to lock in zero loss","C":"Hold the position \u2014 your stop at $180 defines your risk and the thesis is intact as long as the zone holds. Consider moving to breakeven on the next bounce","D":"Double your position size at $184 \u2014 the zone held once so it will hold again"},"correct":"C","correctFeedback":"Your entry was based on the demand zone retest at $183 and your stop at $180 is below the zone. The zone has not been violated \u2014 price pulling back to $184 is normal. The trade thesis is intact. Moving to breakeven too early risks getting stopped out on noise before the move plays out. Consider moving stops to breakeven after the next clear bounce.","incorrectFeedback":"A pullback within the trade does not mean failure \u2014 your stop loss defines when the thesis is wrong. At $184, you are still above your $180 stop and the zone has not been violated, so the demand zone thesis holds. Don't exit prematurely or double down recklessly. Manage the trade with your predefined stop and consider adjusting to breakeven on strength.","chart":{"symbol":"GOOGL","interval":"D","candles":[[195,195.0,193.47,194.11],[194.16,194.6,194.15,194.57],[194.72,194.84,193.11,193.11],[193.03,193.04,192.83,192.87],[192.8,193.9,191.34,191.59],[191.72,191.84, pper wicks reached during rallies. Price has been oscillating between these two zones and is currently at $402, sitting in the middle of the range.","question":"What is the best way to trade this setup?","options":{"A":"Buy immediately at $402 \u2014 price is below the supply zone so it must go up","B":"Short immediately at $402 \u2014 price is above the demand zone so it must go down","C":"Wait for price to reach a zone and look for confirmation: buy at the demand zone ($390-$396) with stops below, or short at the supply zone ($412-$416) with stops above \u2014 the zones define entries, stops, and targets for range trading","D":"Do nothing until price breaks above $416 or below $390 \u2014 trading between zones is impossible"},"correct":"C","correctFeedback":"In a range, the zones define the edges where you look for trades. Wait for price to reach the demand zone ($390-$396) and look for a bullish confirmation candle to go long, or wait for price to reach the supply zone ($412-$416) and look for a bearish rejection to go short. Trading from the middle of the range at $402 offers poor risk/reward since you have no nearby zone for a stop.","incorrectFeedback":"The middle of the range ($402) offers poor risk-reward \u2014 you are too far from both zones. Instead, let price come to you. Buy at the demand zone ($390-$396) targeting supply, or short at the supply zone ($412-$416) targeting demand. The zones define everything: entry, stop, and target.","chart":{"symbol":"AMD","interval":"D","candles":[[405,405.15,403.93,404.05],[404.21,404.41,397.47,401.06],[401.01,401.96,398.88,401.95],[401.83,401.84,401.43,401.51],[401.61,401.87,400.29,400.42],[400.65,400.92,398.46,398.87],[398.9,399.27,398.39,398.42],[398.15,398.37,398.14,398.34],[396.0,397.25,390.66,396.8],[397.33,398.28,397.11,398.14],[398.07,398.82,397.95,398.79],[398.96,400.97,398.71,398.92],[398.88,401.63,398.2,401.16],[400.87,402.73,399.93,402.54],[402.17,403.36,401.79,401.9],[401.57,404.91,401.24,403.09],[403.41 u."},{"module":"Module 1","topic":"Trend Lines","layer":1,"id":"M1-TL-004","status":"LIVE","scenario":"A stock chart shows three consecutive lower highs over six weeks. A descending line connects all three peaks. Each rally attempt stalls and reverses right at the line.","question":"What type of trend line is this, and what does it tell you about the market?","options":{"A":"Ascending trend line showing buyers are in control and pushing prices higher","B":"Descending trend line acting as dynamic resistance where sellers keep stepping in at lower prices","C":"A horizontal resistance level that will eventually break because price always goes up","D":"A random pattern with no real meaning \u2014 three points isn't enough to draw conclusions"},"correct":"B","correctFeedback":"Correct. A descending trend line connects lower highs and acts as dynamic resistance. Each rally fails at a progressively lower price, showing sellers are consistently stepping in and maintaining control of the trend.","incorrectFeedback":"Look at the direction of the line and the highs it connects. The peaks are getting lower \u2014 that's a descending trend line. It acts as a moving ceiling (dynamic resistance) where sellers keep pushing price back down.","chart":{"symbol":"AMZN","interval":"D","candles":[[280,280.39,278.22,278.37],[278.1,281.41,277.34,280.9],[280.67,280.74,278.28,278.71],[278.84,281.05,276.63,276.7],[276.49,278.86,274.38,274.52],[274.62,274.8,272.16,272.57],[272.8,273.96,272.65,273.71],[273.98,274.48,264.77,264.79],[264.73,270.2,264.65,268.23],[268.07,275.14,267.25,271.38],[271.52,274.48,270.88,271.85],[271.78,271.82,269.3,269.74],[269.83,269.99,264.87,265.38],[265.31,265.35,262.79,262.9],[262.95,263.24,259.16,259.89],[259.76,264.05,253.41,254.51],[254.67,255.77,249.87,250.54],[250.77,254.78,248.18,254.73],[254.74,258.51,253.76,258.04],[258.27,258.4,257.48,257.57],[257.72,262.12,257.32,262.06],[262.06,262.25,259.86,260.31],[260.19,260.24,259.65,259.67],[259.9,262.26,259.75,261.3 ne because it represents the larger trend; the steep line will likely break first during normal pullbacks","D":"Neither is significant \u2014 you should only use horizontal support and resistance levels"},"correct":"C","correctFeedback":"Correct. The longer, gentler trend line represents the broader market trend and is more significant. Steep trend lines are unsustainable and tend to break during normal pullbacks. Both lines are useful \u2014 the steep one for short-term timing, the gentle one for the bigger picture.","incorrectFeedback":"Think about sustainability. Can a market keep rising at a steep angle forever? Longer, gentler trend lines reflect the true underlying trend. Steep lines break more easily during routine pullbacks. The 3-month line with 5 touches carries more weight.","chart":{"symbol":"GOOGL","interval":"D","candles":[[400,405.45,399.51,402.58],[402.65,402.73,402.1,402.11],[402.16,408.92,401.87,406.24],[406.03,409.24,406.02,409.01],[408.64,412.35,408.48,410.58],[410.98,411.15,409.26,409.55],[409.16,413.9,408.97,411.78],[411.57,419.95,411.22,419.74],[420.05,420.12,417.8,418.27],[418.06,418.62,409.67,414.44],[414.4,414.87,400.29,412.31],[412.26,415.11,411.91,415.04],[415.28,415.28,414.26,414.87],[415.23,419.84,414.76,419.03],[419.33,422.71,414.95,422.67],[422.38,423.62,420.13,420.51],[420.24,423.38,420.04,423.05],[422.92,439.61,421.31,439.53],[439.95,440.1,437.88,438.31],[438.23,442.2,435.22,435.3],[435.52,435.84,430.97,431.47],[431.76,442.58,431.17,440.96],[441.18,448.14,440.29,447.04],[446.6,456.37,446.13,452.11],[452.01,458.76,451.11,458.57],[458.3,458.85,455.57,456.02],[455.9,461.85,454.8,461.19],[461.35,465.8,457.95,458.05],[457.94,458.64,453.99,454.66],[455.09,455.7,448.6,452.25],[452.46,452.69,448.8,450.16],[450.55,459.54,448.75,457.52],[457.53,464.43,455.81,463.59],[463.71,466.38,463.58,466.33],[466.73,467.52,461.5,462.34],[462.66,467.21,462.51,466.81],[466.98,471.94,466.58,471.71],[471.67,481.08,470.86,480.16]]}},{"module":"Module 1","topic":"Trend Lines","layer":2,"id":"M1-TL-008","status":"LIVE","scenario":"A stock has a well-established rising trend line with 4 validated touches over 2 months. Price is currently sitting right on the trend line. Volume is below average and RSI reads 40, well above oversold territory.","question":"How would you approach a trade at this trend line?","options":{"A":"Sell immediately \u2014 price touching the trend line means it's about to break through","B":"Buy at the trend line with a stop just below it, targeting upper range or next resistance level; the 4-touch line is well-established and RSI has room to bounce","C":"Wait for RSI to reach 80 before doing anything \u2014 40 is too low to buy","D":"Ignore the trend line entirely and only trade based on news headlines"},"correct":"B","correctFeedback":"Correct. A 4-touch trend line is well-established support. Buying at support with a tight stop just below gives a favorable risk-reward. RSI at 40 has plenty of room to rise, and low volume near support often precedes a bounce. Target the upper range or known resistance.","incorrectFeedback":"Think about what a trend line with 4 touches represents \u2014 proven support. When price returns to proven support, that's generally a buying opportunity, not a selling one. RSI at 40 means there's room for upside. Place your stop just below the line to manage risk.","chart":{"symbol":"NVDA","interval":"D","candles":[[300,303.41,299.57,302.07],[301.93,304.22,301.66,304.03],[304.21,306.08,302.32,305.82],[305.66,309.59,305.2,308.79],[308.62,308.66,306.88,307.68],[307.55,308.59,307.52,308.44],[308.31,311.78,307.98,310.17],[310.39,319.85,309.92,319.78],[319.56,325.15,313.88,314.5],[314.55,316.42,312.13,312.26],[312.07,312.11,311.44,311.46],[311.38,311.45,310.06,310.67],[310.92,311.63,308.55,309.45],[309.35,313.04,309.04,312.71],[312.4,313.63,310.64,313.59],[313.86,316.93,313.49,316.92],[316.78,316.92,316.01,316.09],[316.33,323.38,314.89,322.94],[323.08,323.13,322.8,322.8],[322.7,339. ","chart":{"symbol":"META","interval":"D","candles":[[280,280.23,277.32,277.63],[277.84,278.04,276.58,276.62],[276.79,278.08,275.17,275.41],[275.39,276.56,275.16,276.29],[276.02,276.73,269.12,273.02],[272.84,273.1,271.51,271.78],[272.01,275.2,271.95,273.37],[273.23,273.47,264.84,264.93],[265.11,265.84,264.95,265.77],[265.75,266.59,265.7,266.48],[266.4,272.22,266.34,272.01],[271.92,272.01,268.25,269.02],[268.76,268.9,264.61,266.77],[266.91,268.1,265.64,268.08],[267.96,268.05,259.85,261.59],[261.85,262.91,261.73,262.71],[262.79,264.57,262.7,264.44],[264.65,265.2,256.66,256.75],[256.93,258.51,256.76,257.75],[257.66,260.09,255.84,260.05],[260.22,262.96,259.88,262.91],[263.14,263.5,254.59,257.88],[257.8,258.99,257.6,258.76],[258.59,258.64,258.15,258.16],[258.01,264.56,257.93,261.05],[261.17,264.18,258.8,259.16],[259.05,259.54,256.8,257.29],[257.34,257.64,244.8,244.98],[245.03,246.93,243.46,246.6],[246.65,252.3,246.06,249.11],[249.18,253.09,248.72,250.12],[250.17,250.96,246.46,246.89],[246.69,247.2,246.67,247.19],[247.29,248.82,246.99,248.69],[248.66,249.91,248.43,249.67],[249.72,250.2,246.9,247.07]]}},{"module":"Module 1","topic":"Trend Lines","layer":2,"id":"M1-TL-010","status":"LIVE","scenario":"A rising trend line recently broke on above-average volume. After a sharp drop, price is now pulling back up toward the broken trend line from below.","question":"What does a successful retest of the broken trend line look like?","options":{"A":"Price blasts right through the line going back up \u2014 that means the break was fake","B":"Price reaches the old trend line and gets rejected with a bearish candle on declining volume \u2014 old support acting as new resistance confirms the break","C":"Price hovers exactly on the line for several weeks without moving in either direction","D":"The retest doesn't matter \u2014 once a line breaks it has no further use on the chart"},"correct":"B","correctFeedback":"Correct. A successful retest means price rallies back to the broken trend line and gets rejected \u2014 ideally with a bearish candle and declining volume. This confirms the polarity flip: old support has become new resistance. This is a common short entry point with a tight stop just above the line.","incorrectFeedback":"After a trend line breaks, traders watch for a retest where price comes back to the broken line. If the old support now acts as resistance (price gets rejected), that confirms the break. Look for a bearish candle and declining volume at the line as confirmation.","chart":{"symbol":"TSLA","interval":"D","candles":[[200,204.83,199.4,204.17],[204.25,207.5,201.47,202.02],[201.96,202.27,201.95,202.25],[202.42,206.02,201.47,205.75],[205.9,205.98,204.66,204.86],[205.03,209.64,205.01,208.82],[208.93,209.57,204.82,205.26],[205.15,219.95,203.07,219.85],[220.01,220.12,215.35,215.94],[215.96,216.95,209.8,211.13],[211.18,214.96,207.81,211.88],[211.99,214.85,211.33,214.39],[214.48,214.97,213.82,213.87],[213.81,213.82,213.01,213.15],[212.96,217.71,206.4,217.53],[217.32,229.95,215.99,229.8],[229.58,231.07,228.46,228.53],[228.7,229.22,225.69,225.94],[226.14,227.4,219.86,222.37],[222.2,225.2,221.65,224.52],[224.68,225.86,224.64,225.29],[225.07,229.22,224.54,229.14],[229.05,229.11,228.63,228.69],[228.48,230.7,228.11,230.67],[230.54,232.26,230.36,232.25],[232.24,240.18,231.8,240.05],[240.18,240.3,236.49,237.12],[237.33,237.68,232.36,233.17],[233.23,235.42,223.63,224.26],[224.42,224.69,221.24,221.5],[221.34,221.46,216.07,217.18],[217.02,217.98,216.86,217.93],[217.98,219.66,213.31,219.66],[219.51,220.44,219.32,220.25],[220.42,220.73,219.09,219.21],[219.36,222.78,215.43,222.56],[222.43,223.14,222.3,223.1],[222.92,232.48,222.75,232.39]]}},{"module":"Module 1","topic":"Trend Lines","layer":2,"id":"M1-TL-011","status":"LIVE","scenario":"You drew a rising trend line connecting 3 swing lows. A new swing low just formed, but it's slightly above the trend line \u2014 it doesn't quite touch the line.","question":"Should you redraw the trend line to include the new swing low?","options":{"A":"Never \u2014 once you draw a trend line you must keep it exactly where it is forever","B":"Yes \u2014 trend lines are tools, not fixed rules; if the new swing low gives a better fit to the current price action, adjust the line accordingly","C":"Delete all your trend lines and start over from scratch every single day","D":"Only redraw if a financial news channel tells you to adjust it"},"correct":"B","correctFeedback":"Correct. Trend lines are analytical tools, not permanent fixtures. If a new swing low provides a better fit to the evolving price action, adjust your line. Markets don't know where you drew your lines \u2014 your job is to keep your analysis aligned with what price is actually doing.","incorrectFeedback":"Trend lines should evolve with price action. If a new swing low gives a better fit, it's smart to adjust. Being rigid about where you originally drew a line means ignoring what the market is telling you. Flexibility is a strength, not a weakness.","chart":{"symbol":"AMD","interval":"D","candles":[[250,253.6,249.34,252.83],[252.59,257.09,251.44,256.67],[256.84,258.05,255.47,258.05],[258.1,258.2,256.66,257.43],[257.22,258.55,257.16,258.33],[258.47,260.29,258.07,260.2],[260.07,263.04,259.22,262.96],[262.8,265.31,262.24,265.16],[265.3,266.06,261.97,262.48],[262.27,262.76,259.95,260.13],[260.25,260.49,256.32,257.57],[257.78,263.35,257.23,262.63],[262.79,263.67,262.75,263.64],[263.63,264.36,260.72,261.17],[261.31,269.25,260.57,265.64],[265.52,265.6,264.02,264.33],[264.23,264.54,260.7,262.63],[262.8,277.84,261.97,277.83],[277.97,278.31,276.02,276.21],[276.22,276.26,275.06,275.56],[275.52,276.26,271.56,271.73],[271.68,273.64,271.5,273.49],[273.25,276.71,272.91,276.2],[276.34,277.61,275.38,277.5],[277.47,277.66,274.8,275.25],[275.42,276.05,272.77,272.81],[272.94,272.98,271.71,272.44],[272.38,292.44,271.83,292.43],[292.51,293.1,288.83,289.33],[289.57,290.7,288.08,290.57],[290.6,290.64,285.47,285.64],[285.64,290.23,284.78,289.59],[289.81,290.14,287.66,288.47],[288.4,297.42,286.79,295.79],[295.53,300.21,295.19,299.58],[299.78,304.38,299.45,303.36],[303.64,304.05,298.05,299.22],[299.04,311.65,298.47,310.39]]}},{"module":"Module 1","topic":"Trend Lines","layer":3,"id":"M1-TL-012","status":"LIVE","scenario":"A stock had a steep 3-week rising trend line that just broke to the downside. However, a shallower rising trend line spanning 4 months is still intact below current price. Price is now between the two lines.","question":"What is this pattern telling you about the trend?","options":{"A":"The entire uptrend is over \u2014 sell everything immediately and go short","B":"The break of the steep line signals a pace change, not a reversal \u2014 the steep ascent was unsustainable and price is resetting to a more sustainable trajectory on the longer trend line","C":"Both trend lines are broken \u2014 if one breaks, they all break simultaneously","D":"The steep line was the only one that mattered so the shallower line is irrelevant"},"correct":"B","correctFeedback":"Correct. Breaking a steep short-term trend line while a shallower long-term line holds is a pace change, not a reversal. The steep ascent was unsustainable \u2014 the market is shifting from a sprint to a jog. The longer line represents the real structural support of the trend.","incorrectFeedback":"Not all trend line breaks are equal. A steep short-term line breaking is normal \u2014 steep angles are unsustainable. Check if a longer-term line still holds below. If it does, the broader uptrend is intact \u2014 the market is just slowing down, not reversing.","chart":{"symbol":"AMZN","interval":"D","candles":[[200,203.68,199.67,203.14],[203.34,212.88,201.27,211.31],[211.28,217.66,210.71,214.8],[214.73,214.98,213.58,213.63],[213.66,215.08,212.74,214.93],[215.13,220.5,214.4,219.52],[219.46,219.58,217.92,218.04],[217.9,225.12,217.52,225.07],[225.05,225.11,223.92,224.14],[224.34,226.68,220.75,221.12],[221.04,221.73,215.7,215.7],[215. r the added uncertainty, then waiting for confirmation before committing fully.","incorrectFeedback":"Each touch of a trend line happens under different conditions. When those conditions are notably different \u2014 like much higher selling volume and lower RSI \u2014 you should adjust your approach. Don't blindly repeat what worked before. Reduce risk and wait for confirmation.","chart":{"symbol":"AAPL","interval":"D","candles":[[350,350.68,349.97,350.59],[350.47,354.04,349.77,353.92],[354.23,354.44,352.84,352.85],[353.07,354.55,352.92,354.28],[354.6,359.09,353.55,358.19],[357.93,361.38,357.14,361.13],[361.1,365.63,360.41,365.6],[365.64,375.37,365.37,374.99],[375.29,376.09,367.17,370.84],[371.13,372.03,361.53,366.62],[366.28,367.8,361.19,364.73],[364.51,366.88,361.45,366.6],[366.82,374.58,365.94,373.12],[373.0,373.33,370.71,370.97],[370.71,371.18,365.51,368.44],[368.45,373.73,363.97,373.55],[373.24,373.84,370.7,370.92],[371.0,395.39,370.33,395.2],[395.44,396.05,393.05,393.31],[393.16,395.03,383.6,385.06],[385.04,386.8,379.3,384.75],[384.62,395.36,384.52,390.18],[389.8,396.76,389.78,396.71],[396.43,401.09,395.36,400.3],[400.6,401.33,394.08,396.85],[396.79,400.99,395.92,400.65],[400.88,407.52,399.22,406.55],[406.88,415.46,405.65,415.1],[414.97,415.14,413.79,414.04],[414.38,414.72,409.08,411.56],[411.72,412.85,404.55,404.6],[404.67,424.33,403.39,420.47],[420.35,429.92,418.57,428.13],[427.73,433.58,426.56,432.47],[432.75,432.96,426.31,426.77],[426.7,432.24,425.21,432.15],[430.3,431.0,421.5,423.0],[423.0,424.0,415.5,417.5]],"volume":[900000,1070915,727427,903329,1069210,725820,906657,1067457,724261,909983,1065657,722752,913307,1063810,721294,916626,1061917,719885,919941,1059978,718528,923251,1057994,717222,926554,1055965,715968,929849,1053892,714766,933136,1051776,713616,936413,1049616,712519,1600000,1850000]}},{"module":"Module 1","topic":"Trend Lines","layer":3,"id":"M1-TL-014","status":"LIVE","scenario":"A student proudly shows their chart with 7 different trend lines drawn across various timeframes and swing points. They say they're 'being thorough' to catch every possible move.","question":"Is drawing more trend lines always better for trading decisions?","options":{"A":"Yes \u2014 the more lines you draw, the more opportunities you'll spot and the better your trading will be","B":"No \u2014 too many lines creates paralysis by analysis where every level seems significant; focus on 2-3 of the most obvious, well-validated lines for cleaner decision-making","C":"You should draw exactly 7 lines on every chart \u2014 no more, no less","D":"Trend lines are useless, so drawing zero is the correct number"},"correct":"B","correctFeedback":"Correct. Cluttering a chart with too many trend lines causes paralysis by analysis. When every level looks significant, you can't make clear decisions. Focus on 2-3 of the most obvious, well-validated lines. Clean charts lead to better decisions. You can always add more if needed.","incorrectFeedback":"More isn't always better. With 7 trend lines, almost every price move hits some line, making it impossible to distinguish what's actually significant. The best traders keep their charts clean with only the most important levels. Focus beats thoroughness here.","chart":{"symbol":"MSFT","interval":"D","candles":[[400,403.75,399.73,402.95],[403.09,406.17,402.37,405.96],[406.34,416.81,403.76,416.25],[416.16,419.9,415.79,419.28],[419.06,419.19,418.26,418.43],[418.37,422.19,418.31,422.11],[422.41,427.32,421.67,426.4],[426.31,428.77,424.09,424.42],[424.06,424.38,421.55,421.59],[421.75,421.83,421.31,421.34],[420.97,421.11,415.06,415.49],[415.49,427.08,413.01,425.57],[425.85,426.77,424.21,424.34],[424.32,427.2,424.28,427.0],[427.34,434.1,426.54,431.33],[431.02,439.41,430.62,437.59],[437.98,438.09,435.61,435.97],[435.54,445.31,435.0,444.99],[444.89,445.04,433.49,440.07],[440.49,440.59,439.69,439.7],[439.62,440.29,433.1,435.22],[435.57,438.43,433.01,438.07],[437.81,442.31,437.6,441.57],[441.22,446.03,441.09,444.04],[444.43,446.17,444.34,446.16],[446.13,446.26,443.75,444.14],[443.84,448.43,439.46,447.69],[447.48,466.31,446.04,465.07],[464.65,464.72,462.01,462.4],[462.71,464.56,462.52,464.24],[464.7,465.17,455.44,455.49],[455.62,471.49,454.89,467.83],[467.82,476.25,459.66,474.8],[475.2,476.28,475.15,476.17],[476.47,476.92,475.48,475.66],[475.54,484.55,475.1,483.13],[483.57,492.53,481.52,490.7],[490.37,499.86,489.83,499.34]]}},{"module":"Module 1","topic":"Trend Lines","layer":3,"id":"M1-TL-015","status":"LIVE","scenario":"Two students draw rising trend lines on the same chart but get different slopes. One connects candle bodies (closing prices) for swing lows. The other connects the lowest wicks (absolute lows). They argue about which method is correct.","question":"When is it appropriate to use candle bodies versus wicks for drawing trend lines?","options":{"A":"Always use wicks only \u2014 bodies are meaningless in technical analysis","B":"Always use bodies only \u2014 wicks are just noise and should be completely ignored","C":"Both methods have merit: wick-based lines are more conservative and useful for stop placement, while close-based lines filter intraday noise and are better for confirming trend breaks \u2014 many traders use both, and consistency in your method matters most","D":"Neither is correct \u2014 trend lines should only be drawn with a ruler on a printed chart"},"correct":"C","correctFeedback":"Correct. Both approaches are valid and serve different purposes. Wick-based trend lines capture the full range and are useful for setting stops. Close-based lines filter out intraday noise and are better for confirming whether a trend line is truly broken. Many experienced traders draw both. The key is being consistent with your chosen method.","incorrectFeedback":"This isn't an either/or situation. Wick-based lines give you the full price range (great for stops), while close-based lines filter noise (great for confirming breaks). Professional traders often use both  to pay more each time, squeezing price into the ceiling. This is typically a bullish pattern \u2014 the flat resistance eventually gives way as buying pressure builds.","incorrectFeedback":"Focus on the two defining trendlines: one flat (resistance at $250) and one rising (the higher lows). When buyers keep stepping in at higher prices while resistance stays fixed, that's an ascending triangle \u2014 a bullish continuation pattern.","chart":{"symbol":"NVDA","interval":"D","candles":[[235,238.93,234.31,238.64],[238.86,239.1,236.61,236.91],[236.84,242.24,231.26,241.35],[241.44,242.81,241.39,242.76],[242.91,248.82,242.51,248.82],[248.91,250.21,243.26,243.84],[243.88,250.3,236.35,237.71],[237.78,242.65,237.53,240.43],[240.61,241.03,231.71,231.78],[231.56,232.62,231.34,232.49],[232.3,239.04,231.15,238.41],[238.59,244.92,238.08,242.19],[242.4,243.52,241.59,241.63],[241.8,250.18,238.87,249.6],[249.6,250.3,243.71,244.79],[245.03,245.32,243.61,243.8],[243.67,246.56,241.39,246.21],[246.43,246.6,236.17,236.29],[236.13,239.86,235.7,239.04],[238.87,241.13,238.68,241.03],[241.0,245.02,240.44,244.73],[244.77,248.04,244.19,247.44],[247.68,250.3,246.44,249.6],[249.49,249.83,245.32,246.21],[246.32,250.21,243.16,243.35],[243.5,244.64,243.33,244.49],[244.61,245.17,239.88,239.93],[239.95,247.3,239.93,246.37],[246.49,247.95,246.33,247.75],[247.6,250.2,247.41,249.6],[249.6,250.02,247.9,248.13],[248.29,250.3,247.3,249.6],[249.6,250.3,249.6,249.6],[249.6,250.25,249.15,249.23],[249.17,249.58,243.87,243.9],[244.1,247.17,243.49,246.49],[246.71,248.89,246.52,248.53],[248.42,250.3,247.91,248.8]],"trendline":[[2,231.26],[35,243.49]]}},{"module":"Module 1","topic":"Triangles & Flags","layer":1,"id":"M1-TF-005","status":"LIVE","scenario":"A stock rallied sharply from $800 to $880 on strong volume. It then drifts slightly downward in a tight channel ($880\u2192$870) on declining volume.","question":"After a sharp rally from $800 to $880 followed by a tight, slightly downward-drifting channel on declining volume, what pattern is this?","options":{"A":"Double top \u2014 the price is falling from the high so it's reversing","B":"Bear flag \u2014 the downward drift means sellers are taking over","C":"Descending triangle \u2014 price is making lower highs after the peak","D":"Bull flag \u2014 sharp rally (pole) followed by a slight counter-trend drift (flag) on declining volume"},"correct":"D","correctFeedback":"Correct! A bull flag has two parts: the pole (sharp rally $800\u2192$880) and the flag (slight downward drift on low volume). The declining volume during the flag shows it's just a pause, not a reversal. Bull flags resolve upward roughly 65-70% of the time.","incorrectFeedback":"Look at the structure: a strong, fast move up (the pole) followed by a gentle, low-volume pullback (the flag). This slight drift against the trend is healthy consolidation \u2014 not a reversal. The declining volume in the flag confirms buyers are resting, not exiting.","chart":{"symbol":"NVDA","interval":"D","candles":[[800,809.8,794.93,807.93],[808.27,817.7,807.37,816.77],[816.38,817.06,805.47,811.8],[811.58,830.03,811.18,829.8],[830.39,834.35,826.04,826.11],[825.88,826.67,806.39,819.41],[818.6,830.29,816.85,830.15],[830.04,845.33,829.42,839.44],[840.12,847.78,838.83,846.24],[846.95,858.89,845.19,854.36],[854.51,855.22,851.13,851.2],[850.69,851.49,844.49,844.56],[845.27,855.39,836.33,853.46],[853.86,866.83,844.93,865.72],[865.33,866.04,858.59,860.08],[860.1,884.07,856.93,879.79],[879.1,879.37,877.96,878.08],[877.88,878.52,877.86,878.4],[878.84,880.62,877.4,877.4],[876.56,877.54,874.54,875.05],[874.45,877.52,874.06,877.13],[876.67,876.68,876.34,876.54],[876.88,878.34,876.63,878.24],[877.88,877.96,877.16,877.21],[877.53,878.93,877.43,878.66],[879.46,879.55,876.25,876.28],[875.77,876.21,869.59,869.96],[869.19,870.14,869.15,870.09],[870.95,871.03,870.53,870.54],[869.78,873.79,868.59,873.34],[872.82,873.09,871.75,871.79],[871.22,872.29,871.11,872.1],[872.6,873.04,872.15,872.98],[872.66,874.96,867.97,868.64],[868.35,868.42,868.04,868.1],[867.24,867.33,866.87,866.92],[867.7,867.73,865.43,866.65],[866.82,866.97,865.23,865.9]]}},{"module":"Module 1","topic":"Triangles & Flags","layer":1,"id":"M1-TF-006","status":"LIVE","scenario":"A stock's highs are getting lower ($310, $305, $300) while its lows are getting higher ($280, $285, $290). Both trendlines converge symmetrically toward an apex, compressing the trading range.","question":"When both highs and lows are converging \u2014 lower highs AND higher lows forming a symmetrical shape \u2014 what type of triangle is this?","options":{"A":"Ascending triangle \u2014 the higher lows make it bullish","B":"Symmetrical triangle \u2014 both sides converging with no built-in directional bias","C":"Descending triangle \u2014 the lower highs make it bearish","D":"Pennant \u2014 any converging pattern after a trend is always a pennant"},"correct":"B","correctFeedback":"Correct! A symmetrical triangle has both lower highs AND higher lows converging. Unlike ascending (bullish bias) or descending (bearish bias) triangles, symmetrical triangles are structurally neutral \u2014 they can break either direction. The tightening range represents building tension between buyers and sellers.","incorrectFeedback":"When BOTH trendlines angle inward \u2014 highs dropping AND lows rising \u2014 neither buyers nor sellers have the upper hand. That's what makes it symmetrical and directionally neutral. An ascending triangle would need flat resistance; a descending triangle would need flat support.","chart":{"symbol":"META","interval":"D","candles":[[295,297.61,294.44,297.03],[297.31,300.48,294.53,300.07],[300.32,304.09,300.14,303.66],[303.83,303.9,301.4,301.94],[302.2,310.18,301.83,310.16],[309.93,310.73,296.19,302.67],[302.72,303.21,295.17,295.97],[295.69,307.4,287.19,287.19],[287.24,291.16,286.67,290.32],[290.27,290.85,279.7,280.27],[280.23,284.0,277.71,283.44],[283.52,307.04,281.65,293.02],[293.05,293.46,289.71,290.98],[290.8  volume is just sellers resting before the next leg down. The pole defines the trend; the flag is a temporary pause.","chart":{"symbol":"TSLA","interval":"D","candles":[[180,180.13,178.81,179.03],[179.13,179.24,178.24,178.39],[178.5,179.21,178.46,179.06],[179.19,179.27,177.3,177.67],[177.82,177.93,176.73,176.88],[177.02,177.36,175.43,175.44],[175.27,175.49,172.7,174.17],[174.27,174.49,173.0,173.07],[173.15,174.05,173.12,173.98],[174.0,175.87,172.29,172.48],[172.59,172.59,171.8,172.22],[172.29,174.11,171.34,173.83],[173.78,173.93,173.46,173.51],[173.49,173.6,172.12,172.27],[172.12,172.83,171.53,171.58],[171.62,172.15,171.58,172.05],[171.92,172.8,171.51,172.67],[172.5,172.8,170.95,171.27],[171.31,172.95,169.69,170.0],[169.97,169.97,167.87,168.06],[167.98,168.78,167.86,168.6],[168.74,168.81,154.88,154.91],[154.95,155.97,154.87,155.57],[155.69,158.47,155.23,158.12],[158.04,159.78,157.95,159.61],[159.57,162.49,158.74,162.42],[162.33,162.37,162.03,162.08],[162.02,162.11,161.01,161.19],[161.14,161.36,159.44,160.23],[160.13,160.33,160.13,160.29],[160.17,160.33,159.43,159.46],[159.59,159.62,159.33,159.37],[159.35,159.52,159.31,159.49],[159.56,159.7,159.56,159.69],[159.62,159.69,157.05,157.07],[156.94,161.33,156.53,158.88],[158.9,159.01,158.06,158.42],[158.37,161.99,158.26,161.95],[161.86,161.98,161.17,161.32],[161.37,161.57,159.86,160.21],[160.18,161.05,155.98,156.95]]}},{"module":"Module 1","topic":"Triangles & Flags","layer":2,"id":"M1-TF-008","status":"LIVE","scenario":"An ascending triangle has formed with flat resistance at $195 and higher lows ($182, $185, $188). This is the 4th test of $195 approaching. Volume has been declining during the formation. You're planning a breakout trade.","question":"With flat resistance at $195, the latest higher low at $188, and a 4th test approaching on declining volume, how should you trade the breakout?","options":{"A":"Buy immediately before the 4th test \u2014 more tests means guaranteed breakout, so front-run it","B":"Enter on a close above $195 with a volume spike, stop below the recent higher low at $188, target the pattern height projected from breakout","C":"Wait for price to reach $210 to confirm the breakout is 'real' before entering","D":"Short at $195 because the 4th test will reject again \u2014 resistance always holds"},"correct":"B","correctFeedback":"Correct! The textbook entry is a close above $195 confirmed by a volume spike \u2014 volume validates the breakout. Stop goes below the most recent higher low ($188) to protect against a false break. Target uses the measured move: pattern height ($195 - $182 = $13) projected from breakout. An alternative is buying at the higher-low trendline with a tighter stop.","incorrectFeedback":"Breakout trading requires confirmation, not anticipation. You need price to actually close above resistance AND volume to spike (proving real demand). Your stop should sit below the last higher low ($188), and your target comes from projecting the pattern's height from the breakout point.","chart":{"symbol":"AMZN","interval":"D","candles":[[183.5,183.89,183.11,183.5],[183.5,186.9,182.92,186.32],[186.32,189.43,186.04,189.15],[189.15,192.27,188.86,191.98],[191.98,195.41,191.37,194.8],[194.8,195.19,192.41,192.8],[192.8,193.02,190.58,190.8],[190.8,191.33,188.27,188.8],[188.8,189.29,186.31,186.8],[186.8,187.0,184.6,184.8],[184.8,185.21,182.39,182.8],[182.8,185.43,182.24,184.87],[184.87,187.18,184.62,186.93],[186.93,189.31,186.62,189.0],[189.0,191.67,188.4,191.07],[191.07,193.49,190.71,193.13],[193.13,195.44,192.89,195.2],[195.2,195.8,192.6,193.16],[193.16,193.63,190.65,191.12],[191.12,191.32,188.88,189.08],[189.08,189.53,186.59,187.04],[187.04,187.59,184.45,185.0],[185.0,186.88,184.77,186.65],[186.65,188.64,186.31,188.3],[188.3,190.55,187.7,189.95],[189.95,191.93,189.62,191.6],[191.6,193.5,191.35,193.25],[193.25,195.49,192.66,194.9],[194.9,195.35,192.62,193.07],[193.07,193.27,191.05,191.25],[191.25,191.73,188.95,189.43],[189.43,189.96,187.07,187.6],[187.6,190  trade whichever direction it breaks whenever it breaks"},"correct":"C","correctFeedback":"Correct! The ideal breakout occurs in the last third of the triangle (roughly 2/3 to 3/4 of the way from the base to the apex) but BEFORE the apex. A breakout right at the apex is often weak because the compression has gone on too long and energy has dissipated. If no breakout happens soon, the pattern may fail entirely.","incorrectFeedback":"Triangle breakouts have a timing sweet spot. Too early means the pattern isn't mature; too late (at or past the apex) means the compression has drained the energy. The ideal zone is the last third before the apex \u2014 enough build-up for power, but not so long that momentum fades.","chart":{"symbol":"MSFT","interval":"D","candles":[[250,265.58,249.08,256.29],[256.05,256.12,254.95,255.15],[254.9,261.33,253.69,260.42],[260.49,261.24,260.41,261.16],[260.91,270.16,260.25,270.09],[270.15,270.16,268.13,268.29],[268.31,270.88,239.98,245.22],[245.26,248.1,244.94,247.95],[248.04,249.34,242.94,243.22],[243.33,249.28,220.4,235.04],[235.15,245.21,235.02,240.47],[240.32,242.99,239.73,242.43],[242.29,258.55,239.6,258.49],[258.57,277.4,235.06,275.14],[274.94,278.15,264.97,265.14],[265.4,266.81,257.36,258.35],[258.48,259.06,252.0,254.32],[254.57,254.62,248.55,248.88],[248.67,253.29,244.36,252.67],[252.78,253.29,239.88,240.01],[240.1,245.78,239.88,245.36],[245.5,250.61,244.86,248.26],[248.41,255.43,248.02,254.15],[254.36,258.54,253.2,258.36],[258.52,264.2,257.65,260.16],[260.19,261.0,250.39,255.44],[255.28,256.25,251.47,251.68],[251.92,252.21,246.75,247.64],[247.52,248.48,247.51,248.29],[248.37,249.95,242.0,244.82],[245.06,249.93,244.46,249.39],[249.58,251.59,246.85,247.34],[247.59,261.29,244.85,254.76],[254.93,255.23,252.33,252.86],[252.92,253.01,250.4,250.84],[250.74,251.38,244.32,248.26],[248.05,251.39,247.88,249.43],[249.27,252.25,249.13,252.09]]}},{"module":"Module 1","topic":"Triangles & Flags","layer":2,"id":"M1-TF-011","status":"LIVE","scenario":"A descending triangle has flat support at $170 and lower highs ($185, $182, $178, $175). On the 5th test of $170, price breaks below on significantly higher volume. You need a trade plan.","question":"The descending triangle's $170 support breaks on the 5th test with a high-volume candle. What's the trade plan?","options":{"A":"Buy the dip at $170 \u2014 support has held 4 times so it will bounce again","B":"Wait for price to return to $185 before making any decision \u2014 need more data","C":"Short aggressively at the break or conservatively on a retest of $170 as resistance. Stop above the recent lower high. Target = pattern height projected downward","D":"Do nothing \u2014 descending triangles are unreliable and the breakout could be fake"},"correct":"C","correctFeedback":"Correct! Two valid approaches: aggressive (short at the break below $170) or conservative (wait for a retest of $170, which should now act as resistance). Stop above the recent lower high ($175). Target = pattern height ($185 - $170 = $15) projected down from $170 = $155. The 5th test breaking shows the buy orders at $170 are finally exhausted.","incorrectFeedback":"When support breaks after multiple tests, the buy orders are exhausted \u2014 don't buy the dip. The 5th test breaking on high volume is a clear signal. You can short at the break (aggressive) or wait for $170 to be retested as resistance (conservative). Stop above the last lower high; target is the pattern height projected downward.","chart":{"symbol":"GOOGL","interval":"D","candles":[[184.0,184.39,183.61,184.0],[184.0,184.56,180.8,181.36],[181.36,181.62,178.46,178.72],[178.72,178.99,175.81,176.08],[176.08,176.62,172.9,173.44],[173.44,173.79,170.45,170.8],[170.8,173.24,170.6,173.04],[173.04,175.77,172.55,175.28],[175.28,177.98,174.82,177.52],[177.52,179.95,177.33,179.76],[179.76,182.41,179.35,182.0],[182.0,182.54,179.14,179.68],[179.68,179.92,177.12,177.36],[177.36,177.65,174.75,175.04],[175.04,175.58,172.18,172.72],[172.72,173.  hit their stops, that wave of selling adds fuel to the downside. The ascending triangle's original bullish bias flips \u2014 the rising support line now becomes the next critical battleground.","incorrectFeedback":"A breakout that immediately fails is not just noise \u2014 it's a significant reversal signal. Traders who bought above $920 are now trapped. Their stop-loss orders create a cascade of selling pressure. The pattern's bullish thesis is invalidated, and the support line of the ascending triangle becomes the next level to watch for a potential breakdown.","chart":{"symbol":"NVDA","interval":"D","candles":[[900,903.07,899.58,902.76],[902.66,902.91,901.53,901.57],[902.23,905.06,899.36,904.57],[905.18,905.27,902.64,902.66],[902.73,911.15,902.03,910.51],[910.76,920.37,910.0,919.93],[919.12,919.24,916.22,916.67],[915.97,921.74,910.44,911.23],[911.59,912.35,907.33,908.29],[908.87,909.53,905.18,907.83],[907.1,908.66,905.41,908.4],[907.71,909.54,907.69,909.31],[908.86,912.71,908.6,912.48],[912.9,921.42,911.91,917.06],[916.9,922.07,916.78,920.31],[919.89,919.96,918.69,918.81],[918.22,920.48,917.73,920.06],[919.15,921.69,911.35,912.15],[912.6,914.94,912.13,914.59],[915.35,918.79,915.08,918.17],[918.39,918.44,917.25,917.92],[918.39,918.62,918.34,918.58],[918.48,920.27,916.19,920.05],[919.79,920.07,917.91,918.28],[917.55,918.21,917.39,918.18],[918.81,918.87,915.15,915.18],[915.29,918.12,914.87,917.78],[918.16,920.48,917.7,920.4],[920.77,923.29,918.54,922.94],[922.21,924.28,922.15,923.86],[924.35,926.2,924.01,924.58],[923.79,924.0,922.4,922.64],[922.41,922.99,919.63,919.73],[920.49,920.65,916.73,918.62],[918.49,922.79,914.31,915.07],[914.79,915.59,914.76,915.5],[915.48,917.91,915.37,917.44],[918.15,921.39,905.1,905.29]]}},{"module":"Module 1","topic":"Triangles & Flags","layer":3,"id":"M1-TF-013","status":"LIVE","scenario":"After a strong 3-month bullish trend, a symmetrical triangle has formed over the past 2 weeks. A student argues: 'Symmetrical triangles are 50/50 \u2014 there's no directional bias, so I'll just wait and trade whichever way it breaks.'","question":"Is the student correct that this symmetrical triangle is truly a 50/50 coin flip with no directional bias?","options":{"A":"Yes \u2014 symmetrical triangles are always exactly 50/50 regardless of context or prior trend","B":"No \u2014 symmetrical triangles always break in the direction of the prior trend, so this is guaranteed bullish","C":"Structurally the pattern is neutral, but the strong prior bullish trend tilts the odds roughly 60/40 toward continuation. Plan for both, but size position favoring upside","D":"No \u2014 symmetrical triangles are actually bearish patterns because the lower highs show weakening momentum"},"correct":"C","correctFeedback":"Correct! The student is partially right \u2014 the pattern structure IS neutral (unlike ascending or descending triangles). But context matters: the prior 3-month bullish trend tilts the odds roughly 60/40 toward a bullish continuation. Smart approach: plan for both directions, but allocate more size to the continuation scenario. Pattern structure = neutral; market context = lean bullish.","incorrectFeedback":"The student understands the pattern's structure but ignores context. Yes, symmetrical triangles have no built-in bias from their shape alone. But patterns don't form in a vacuum \u2014 the prior trend influences the probabilities (~60/40 toward continuation). The nuanced approach: respect the structural neutrality but lean with the trend when sizing positions.","chart":{"symbol":"AMD","interval":"D","candles":[[180,185.82,179.92,184.88],[184.9,192.86,183.13,192.25],[192.35,204.48,190.95,202.06],[202.15,214.58,201.04,208.16],[208.07,212.29,205.6,211.7],[211.63,221.15,199.68,199.73],[199.79,200.89,199.28,200.72],[200.91,204.13,200.32,203.72],[203.92,205.13,203.74,204.92],[204.96,205.1,204.28,204.31],[204.17,208.97,203.9,206.52],[206.39,209.19,206.28,207.85],[207.99,208.34,205.24,206.58],[206.59,215.13,206.42,21
