action lows show sellers are already gaining ground. Both upward and downward slopes can produce valid patterns.","chart":{"symbol":"GOOGL","interval":"D","candles":[[172,173.7,171.79,173.32],[173.41,175.01,173.19,174.86],[174.91,177.68,174.29,176.97],[177.04,183.24,176.54,182.31],[182.47,182.7,180.56,181.48],[181.56,183.91,180.38,183.91],[183.97,184.76,183.93,184.72],[184.8,187.6,184.75,187.5],[187.42,189.94,187.41,189.9],[189.89,189.99,188.89,189.25],[189.25,189.47,189.25,189.45],[189.62,190.38,185.02,185.1],[184.95,185.53,182.78,182.88],[182.74,185.02,182.34,184.5],[184.66,185.37,178.99,179.05],[179.18,179.2,177.28,177.53],[177.68,177.77,175.8,175.89],[175.9,176.25,173.88,173.89],[173.87,176.58,173.31,176.03],[176.01,179.38,175.27,179.16],[178.98,180.62,178.94,179.95],[179.79,185.24,179.02,185.21],[185.11,190.22,184.01,189.4],[189.26,189.75,186.99,187.01],[186.92,189.93,186.3,189.5],[189.51,191.66,189.22,191.39],[191.22,192.58,190.92,192.38],[192.39,194.1,191.97,194.03],[194.07,194.18,192.24,192.56],[192.37,193.03,189.77,190.09],[189.95,189.97,188.91,188.93],[188.78,189.25,186.31,186.39],[186.27,186.7,183.85,184.51],[184.41,184.63,182.14,182.95],[183.13,183.34,181.85,181.93],[182.08,183.38,181.87,183.27],[183.35,183.83,175.99,175.99],[175.9,176.65,172.76,173.35],[173.29,173.31,170.8,170.99],[171.12,171.42,169.64,170.05],[170.1,170.51,170.06,170.47],[170.5,172.23,170.21,171.84],[171.79,174.98,171.66,174.94],[174.8,178.65,174.74,177.95],[177.87,177.92,177.43,177.51],[177.41,182.05,177.1,182.05],[181.93,184.72,181.56,184.17],[184.11,184.66,184.04,184.41],[184.59,187.91,183.92,187.91],[187.75,188.02,184.26,185.01],[184.84,184.94,183.93,184.12],[183.97,184.59,182.53,183.08],[182.98,183.32,180.94,181.15],[181.23,182.02,181.03,181.93],[182.01,182.6,177.0,177.09],[177.25,177.47,174.7,174.85],[174.68,175.25,171.39,171.55],[171.71,171.83,169.92,169.94],[169.95,170.24,168.62,168.82],[168.71,168.8,168.11,168.14],[168.27,168.66,164.93,164.99]],"overlays":{},"trendline":[[18,173.31],[39,169.64]]}},{"module":"Module 1","topic":"Head & Shoulders","layer":1,"id":"M1-HS-007","status":"NEW","scenario":"A stock has been falling from $90 to $55 over several months. It then forms three troughs: Trough A dips to $50, Trough B drops to $40, and Trough C dips to $48. Price then rallies above the line connecting the peaks between the troughs.","question":"In this inverse Head & Shoulders pattern, which trough represents the 'head'?","options":{"A":"Trough A ($50) \u2014 because the head always comes first in the pattern sequence","B":"Trough C ($48) \u2014 because the head is the last trough to form before the breakout","C":"Trough B ($40) \u2014 because the head is always the deepest (lowest) trough in an inverse H&S","D":"There is no clear head \u2014 the troughs are too close in price to distinguish the components"},"correct":"C","correctFeedback":"In an inverse Head & Shoulders, the head is always the lowest trough. Trough B at $40 is the deepest point, making it the head. Trough A ($50) is the left shoulder and Trough C ($48) is the right shoulder. The peaks between the troughs form the neckline \u2014 once price breaks above that neckline, the pattern is confirmed.","incorrectFeedback":"The head in an inverse H&S is always the lowest (deepest) trough. In this pattern, Trough B at $40 is clearly the lowest point, so it's the head. The shoulders (A at $50 and C at $48) are higher than the head.","chart":{"symbol":"AMD","interval":"D","candles":[[65,65.29,62.19,62.46],[62.48,62.78,59.78,60.14],[60.14,60.9,59.56,60.04],[60.1,60.64,58.58,58.72],[58.7,59.08,56.57,56.63],[56.68,57.17,54.79,55.02],[54.97,55.21,54.42,55.01],[55.03,55.35,53.62,53.72],[53.68,53.69,52.95,53.09],[53.14,53.72,53.04,53.62],[53.63,53.8,49.95,49.96],[49.99,50.4,49.92,50.33],[50.29,50.36,49.11,49.26],[49.28,54.04,49.23,54.0],[53.95,54.3,53.9,54.29],[54.24,55.43,53.59,55.3],[55.3,57.14,55.2,56.92],[56.89,57.0,56.32,56.39],[56.4,56.41,56.08,56.15],[56.18,56.38,52.03,52.07],[52.05 can place your stop just below the neckline \u2014 a tighter stop that still respects the pattern's structure.","incorrectFeedback":"The measured move formula is: target = neckline + (neckline - head) = $75 + $15 = $90. For stop placement, below the right shoulder is preferred over below the head. The right shoulder stop is tighter, giving you a better risk-to-reward ratio. If price falls below the right shoulder after a neckline break, the pattern is likely failing anyway.","chart":{"symbol":"TSLA","interval":"D","candles":[[80,80.35,78.01,78.32],[78.29,79.0,78.15,78.85],[78.88,79.18,76.45,76.86],[76.9,78.28,76.78,77.5],[77.53,77.95,74.96,75.45],[75.43,76.03,72.05,72.08],[72.09,72.12,71.16,71.28],[71.22,71.47,69.8,70.03],[69.99,70.07,69.98,70.07],[70.07,70.28,68.23,68.34],[68.41,68.77,68.37,68.7],[68.71,68.84,64.82,64.86],[64.82,70.27,64.39,69.25],[69.22,71.42,68.16,71.12],[71.08,74.86,70.8,74.12],[74.14,74.79,71.39,71.42],[71.4,71.52,68.88,69.11],[69.04,69.46,69.03,69.39],[69.33,69.88,64.98,65.36],[65.38,65.59,60.04,60.09],[60.1,65.78,59.3,64.89],[64.86,65.01,63.55,63.71],[63.72,74.8,63.02,73.91],[73.88,73.91,72.87,72.99],[73.03,73.25,71.03,71.82],[71.89,72.69,69.75,70.12],[70.18,70.2,69.36,69.48],[69.46,70.41,65.65,65.76],[65.79,68.15,65.66,67.95],[67.93,68.14,66.72,66.92],[66.86,67.9,66.81,67.81],[67.87,70.41,67.32,70.19],[70.23,75.03,69.56,75.01],[74.99,75.2,74.99,75.16],[75.12,77.46,74.74,77.18],[77.14,77.14,76.67,76.93],[76.92,80.06,76.32,79.48],[79.56,80.49,79.24,79.93]]}},{"module":"Module 1","topic":"Head & Shoulders","layer":2,"id":"M1-HS-009","status":"NEW","scenario":"A Head & Shoulders top has confirmed \u2014 the neckline at $156 broke decisively on heavy volume. Two days later, price is rallying back up toward the $156 level from below. Volume on this rally is notably lighter than the breakdown volume.","question":"How should you use this pullback to the broken neckline?","options":{"A":"This rally invalidates the breakdown \u2014 close any short positions because the pattern has failed","B":"Wait and watch \u2014 if the old neckline ($156) acts as new resistance and price gets rejected there, this is a classic retest entry for a short position","C":"Go long immediately because the pullback shows buyers are regaining control and the pattern was a false breakdown","D":"Ignore the pullback entirely \u2014 retests are random noise and have no significance after a confirmed breakdown"},"correct":"B","correctFeedback":"A pullback to the broken neckline on lighter volume is one of the most reliable re-entry setups in technical analysis. Old support becomes new resistance. If price gets rejected at $156, it confirms the role reversal and gives you a high-probability short entry with a tight stop just above the neckline. The light rally volume suggests this is a weak bounce, not a true reversal.","incorrectFeedback":"After a neckline breaks, it's very common for price to pull back and retest that level. This isn't pattern failure \u2014 it's actually an opportunity. The key is watching whether the old support ($156) now acts as resistance. Light volume on the pullback is a good sign for shorts. If the neckline rejects price, it's a textbook short entry with a tight stop.","chart":{"symbol":"NVDA","interval":"D","candles":[[158,159.37,157.62,159.31],[159.39,161.91,158.88,161.43],[161.47,163.14,160.76,163.12],[163.19,164.39,161.93,163.13],[163.04,165.24,162.98,164.15],[164.12,165.35,163.98,165.19],[165.27,165.98,165.27,165.97],[166.05,166.07,164.08,164.18],[164.29,169.92,164.19,169.91],[169.76,170.03,166.23,166.82],[166.84,167.23,158.84,159.9],[159.77,160.38,157.14,157.53],[157.55,159.87,157.2,159.85],[159.88,160.39,157.94,158.26],[158.19,158.39,156.4,156.68],[156.69,156.95,155.21,156.07],[156.17,158.15,155.65,158.02],[157.99,159.76,157.82,159.39],[159.48,160.12,159.43,159.84],[159.77,164.95,159.58,164.91],[164.83,168.02,164.56,167.16],[167.16,167.35,163.88,165.0],[164.84,168.4,164.51,168.15],[168.12,175.01,168.07,175.0] ight shoulder taking much longer to form than the left?","options":{"A":"Yes \u2014 a valid H&S requires approximate time symmetry between the shoulders; a 2x difference is too much","B":"Yes \u2014 the extended right shoulder means it's morphing into a different pattern, likely a rectangle or range","C":"No \u2014 time asymmetry between shoulders is common. A longer right shoulder can actually be more bearish, as it shows buyers are struggling and failing to make progress over a longer period","D":"No \u2014 but you must wait for the right shoulder to match the left shoulder's duration before you can trade it"},"correct":"C","correctFeedback":"Perfect time symmetry is a textbook ideal, not a market requirement. Many valid H&S patterns have asymmetric shoulders. A longer-forming right shoulder can actually be more bearish \u2014 extended time spent below the head without making a new high shows that buying pressure is exhausted. The key validation is still the neckline break, not shoulder duration.","incorrectFeedback":"Markets don't follow textbook timing precisely. Asymmetric shoulders are common in real H&S patterns. A right shoulder that takes longer can indicate buyers are trying harder but still failing to push price higher \u2014 which is actually a bearish sign. The pattern is validated by the neckline break, not by shoulder symmetry.","chart":{"symbol":"META","interval":"D","candles":[[153.5,153.78,153.5,153.77],[153.75,154.17,153.71,154.15],[154.08,156.17,153.88,156.16],[156.28,156.31,155.16,155.72],[155.67,156.68,155.5,156.65],[156.52,158.29,155.13,158.05],[157.99,158.37,155.82,155.84],[155.93,159.54,154.58,159.35],[159.44,161.19,159.43,160.79],[160.71,166.4,159.97,164.05],[164.17,164.37,163.08,163.09],[163.2,170.02,161.86,170.0],[169.84,170.95,156.4,156.82],[156.97,157.72,148.86,150.76],[150.9,155.84,148.61,155.7],[155.62,156.16,155.58,156.05],[155.95,158.13,155.4,158.04],[158.11,161.63,157.91,159.52],[159.38,159.66,158.24,158.32],[158.26,161.21,158.08,1 ickly recover \u2014 this is actually a buying opportunity"},"correct":"C","correctFeedback":"This is the textbook-ideal volume pattern for an H&S top. Declining volume on each rally shows fading buying enthusiasm \u2014 fewer buyers at each higher price. The surge on the neckline break confirms that sellers have taken control. This sequence (declining rally volume + expanding breakdown volume) is the strongest volume confirmation of an H&S pattern.","incorrectFeedback":"In an H&S top, declining volume on successive rallies is actually a confirming signal, not a weakness. It shows that each push higher attracts fewer buyers \u2014 classic distribution. The volume surge on the neckline break is the final confirmation that sellers have overwhelmed buyers. This declining-then-surging volume sequence is the ideal H&S volume signature.","chart":{"symbol":"AMZN","interval":"D","candles":[[488,490.42,487.6,490.0],[489.68,491.04,489.54,490.3],[490.34,491.73,490.04,490.04],[489.81,490.06,489.76,490.06],[489.71,490.19,488.68,488.83],[488.68,494.07,488.51,494.02],[493.67,497.83,492.66,497.14],[497.45,499.1,497.3,498.4],[498.86,499.5,497.93,498.01],[498.31,500.61,497.64,500.22],[500.29,500.36,500.04,500.05],[500.4,502.38,499.86,501.88],[501.45,501.65,499.1,500.3],[500.46,500.67,499.48,499.56],[499.85,500.11,497.92,499.12],[498.67,498.83,497.68,497.83],[497.73,498.28,495.5,495.87],[495.64,496.08,494.68,495.98],[496.11,496.42,494.41,494.69],[494.27,494.53,491.73,492.21],[492.0,492.84,491.01,491.95],[491.46,492.94,491.27,492.93],[492.78,493.05,492.48,493.02],[493.23,495.02,492.97,495.02],[495.23,497.29,494.34,497.07],[496.96,497.09,496.04,496.11],[496.33,498.93,495.9,498.9],[498.44,500.16,497.95,500.08],[499.89,504.09,499.06,503.74],[504.21,505.16,503.78,504.05],[504.49,506.09,504.35,505.74],[505.27,506.73,504.75,506.65],[506.34,508.15,506.04,507.93],[508.32,508.77,508.29,508.6],[508.75,508.79,508.28,508.37],[507.94,510.12,507.82,510.08],[509.62,509.72,509.17,509.21],[509.21,509.4 ve target is $120, so I'll hold my short position through $130 all the way to $120 for the full profit.'","question":"Refer to the scenario above. How would you evaluate this student's plan to hold through the $130 support level to the $120 target?","options":{"A":"The student is correct \u2014 measured move targets are mathematically derived and price will reach them before any meaningful bounce occurs at prior support","B":"The student should move the target to $130 and abandon the $120 target entirely, since support always holds","C":"The student should consider taking partial profits at the $130 support level. Measured move targets are estimates, not guarantees, and strong prior support can cause significant bounces or reversals that erode open profits","D":"The student should ignore both levels and instead set the target at 2x the measured move ($95) because H&S patterns typically overshoot their targets"},"correct":"C","correctFeedback":"Measured move targets are guidelines, not guaranteed price levels. Strong prior support at $130 (tested 3 times) is a real obstacle that could halt or reverse the decline. The smart approach is to take partial profits at $130, then trail a stop on the remaining position. This locks in gains while still allowing profit if price continues to the $120 target. Never assume any target will be hit with certainty.","incorrectFeedback":"Measured move targets are useful estimates, but they are not guaranteed destinations. When a strong support level like $130 (triple-tested) sits between the current price and your target, you need to respect it. Taking partial profits at $130 protects gains while keeping some exposure if price continues lower. Rigid adherence to calculated targets ignores the reality of how support and resistance work.","chart":{"symbol":"MSFT","interval":"D","candles":[[128,129.52,127.93,129.29],[129.25,131.74,128.54,131.05],[130.97,134.77,130.41,134.27],[134.14,137.05,133.86,136.09],[135.98,136.31,131.82,131.95],[131 trong fundamentals. The pattern will fail.'","question":"A Head & Shoulders top is forming on a stock that just reported a strong earnings beat and raised forward guidance. Student A says 'The H&S is clear \u2014 I'm shorting the neckline break.' Student B says 'You can't short a stock with great fundamentals, the pattern will fail.' Who has the better analysis, and why?","options":{"A":"Student A is correct \u2014 chart patterns always override fundamentals, and strong earnings are already priced in","B":"Student B is correct \u2014 you should never trade against strong fundamentals. H&S patterns on fundamentally strong stocks always fail","C":"Neither is fully correct. The answer depends on timeframe: short-term technicals can override fundamentals for a swing trade, but shorting against strong fundamentals carries higher risk and warrants smaller position size and tighter risk management","D":"Both are wrong \u2014 you should wait for the next earnings report before making any decision, since patterns don't matter near earnings"},"correct":"C","correctFeedback":"This is a classic technicals-vs-fundamentals tension. Short-term price action can diverge from fundamentals \u2014 even great companies have pullbacks. An H&S on a strong stock might produce a valid short-term trade, but the fundamental tailwind increases the risk of pattern failure. The nuanced approach: if you take the trade, use smaller size, tighter stops, and don't expect the full measured move. Timeframe matters enormously.","incorrectFeedback":"Neither extreme is correct. Charts don't always override fundamentals, and fundamentals don't always override charts. The resolution is timeframe-dependent: a swing trader might successfully short the neckline break for a brief move, but the strong fundamentals create headwinds for the short thesis. The prudent approach is smaller position sizing and tighter stops when trading against the fundamental backdrop.","chart":{"symbol":"AAPL","interval":"D","candle ading well above its rising 200-day moving average. The daily H&S would represent only a minor pullback on the weekly timeframe.","question":"How should you weigh the bearish daily H&S against the bullish weekly trend?","options":{"A":"The daily H&S should be traded aggressively short \u2014 the pattern is clear and confirmed, so the weekly trend doesn't matter","B":"The weekly uptrend dominates. The daily H&S is more likely a correction within the larger uptrend rather than a major top. Expect limited downside and treat any decline as a potential buying opportunity on the higher timeframe","C":"The two timeframes cancel each other out, making the setup untradeable \u2014 skip it entirely and wait for both timeframes to align","D":"Always trade the smallest timeframe because it shows the most recent and therefore most relevant information"},"correct":"B","correctFeedback":"Higher timeframes carry more weight than lower timeframes. A daily H&S within a strong weekly uptrend is more likely a healthy correction than a major reversal. The weekly rising 200-day MA acts as a structural floor. You might see a short-term dip from the daily pattern, but the weekly context suggests limited downside. Multi-timeframe analysis is essential \u2014 always check the bigger picture before trading a pattern.","incorrectFeedback":"When timeframes conflict, the higher timeframe generally wins. A strong weekly uptrend above the 200-day MA is a powerful bullish structure. A daily H&S within that context is likely just a correction, not a major top. The smart approach is to recognize the daily pattern but weigh it against the bullish weekly backdrop, expecting limited downside and looking to buy the dip rather than aggressively shorting.","chart":{"symbol":"GOOGL","interval":"D","candles":[[397,405.4,396.32,404.3],[404.39,405.51,404.36,405.29],[405.26,405.88,404.86,404.91],[404.76,407.75,404.33,407.3],[407.04,407.95,402.42,403.2],[403.43,415.02,403.06,414.89],[414.95,417.33,414.67,416.16] ,392.1,392.11]]}},{"module":"Module 1","topic":"Head & Shoulders","layer":3,"id":"M1-HS-015","status":"NEW","scenario":"A potential Head & Shoulders top is forming. You run additional technical analysis and find: (1) MACD showed bearish divergence at the head \u2014 price made a higher high but MACD made a lower high, (2) RSI reached overbought at the head and has been declining since, printing lower values at each shoulder, and (3) the overall H&S price structure is well-defined. A student asks: 'How do these indicators relate to the H&S pattern? Are they redundant or do they add value?'","question":"Refer to the scenario above \u2014 what is the best explanation of how these indicators relate to the Head & Shoulders structure?","options":{"A":"The indicators are redundant \u2014 the H&S pattern alone provides all the information you need. Adding indicators just creates analysis paralysis","B":"The indicators contradict the pattern \u2014 bearish divergence means the H&S will fail because divergences indicate trend continuation","C":"This is confluence: the MACD divergence, declining RSI from overbought, and H&S structure all confirm the same bearish thesis from different angles. Multiple independent signals pointing the same direction increases the probability that the reversal is real","D":"You should only use one tool at a time. Pick either the H&S pattern or the indicators, but combining them leads to false confidence"},"correct":"C","correctFeedback":"This is a textbook example of confluence. The H&S shows the price structure weakening. The MACD bearish divergence confirms that momentum is declining even as price made new highs. The RSI declining from overbought shows buying pressure fading. Each signal independently suggests bearish reversal, and together they create a higher-probability setup. Confluence \u2014 multiple independent signals confirming the same thesis \u2014 is one of the most powerful concepts in technical analysis.","incorrectFeedback":"When multiple independent technical signals point in the same direction, that's called confluence, and it's extremely valuable. The H&S provides the price structure, MACD divergence confirms weakening momentum, and declining RSI confirms fading buying pressure. These aren't redundant \u2014 they measure different things (price, momentum, relative strength) that all agree. Confluence increases the probability that a setup will work.","chart":{"symbol":"NVDA","interval":"D","candles":[[174,174.87,173.8,174.68],[174.62,176.57,174.55,176.39],[176.51,177.35,176.07,176.08],[176.2,176.41,176.18,176.31],[176.43,177.59,176.25,177.49],[177.5,178.0,177.45,177.92],[177.79,178.0,177.76,177.95],[177.98,179.59,176.89,179.27],[179.13,180.99,179.1,180.95],[181.09,184.0,181.05,182.61],[182.57,182.99,182.21,182.26],[182.37,184.08,182.21,184.06],[184.17,184.83,183.58,184.8],[184.95,185.47,184.45,184.54],[184.42,185.94,183.96,185.92],[185.79,185.87,183.09,184.59],[184.73,184.76,183.7,183.9],[183.97,184.11,182.95,183.0],[182.84,183.71,181.68,181.9],[181.8,183.24,181.62,183.02],[182.93,182.99,179.86,179.93],[179.77,179.97,177.99,178.94],[178.86,178.9,178.19,178.34],[178.24,179.49,176.57,177.0],[177.07,178.51,176.74,178.18],[178.05,178.49,176.07,176.46],[176.57,179.97,175.76,179.94],[179.89,181.42,179.25,181.12],[181.04,181.3,180.7,180.73],[180.9,183.99,180.64,183.98],[184.04,185.99,183.5,185.77],[185.76,187.72,185.49,187.51],[187.44,188.05,187.39,188.04],[187.87,189.35,186.69,189.19],[189.24,191.08,189.12,190.08],[190.19,191.96,190.16,191.94],[191.91,194.78,191.63,193.64],[193.77,193.81,193.14,193.17],[193.36,195.5,193.29,195.06],[195.07,195.23,192.48,193.94],[193.75,193.93,192.15,192.18],[192.06,192.15,191.56,192.06],[192.08,192.16,191.49,191.57],[191.61,191.76,189.14,189.68],[189.81,190.01,187.47,187.96],[188.12,189.26,186.79,186.95],[187.13,187.14,185.3,185.51],[185.58,186.07,183.77,184.0],[183.98,184.04,183.21,183.53],[183.44,183.56,182.12,182.41],[182.25,182.3,179.09,179.09],[179.04,179. 92,671942,1114590,910403,858042,825379,562050,652496,790621,779669,1019158,905548,819274,744696,575048,711603,754089,779632,995106,949560,712892,749779]}},{"module":"Module 1","topic":"Impulse vs Consolidation","layer":1,"id":"M1-IC-005","status":"NEW","scenario":"A stock rallies with consecutive green candles. Each candle body is larger than the last \u2014 the first is $2, growing to $3, $4, $5, then $6. Volume increases with each candle.","question":"What does the expanding candle body size and rising volume tell you about this impulse move?","options":{"A":"The move is overextended and about to reverse \u2014 expanding candles mean exhaustion","B":"Increasing buying conviction and healthy impulse with growing momentum \u2014 each day more participants commit","C":"Volume doesn't matter during impulse moves; only price direction matters","D":"Expanding candles indicate a consolidation phase is forming within the uptrend"},"correct":"B","correctFeedback":"Expanding candle bodies with rising volume shows increasing conviction. Each day, more buyers are committing with larger positions. This is the hallmark of a healthy, accelerating impulse \u2014 momentum is growing, not fading. When both size and volume expand together, it confirms genuine directional strength.","incorrectFeedback":"Expanding candles with rising volume actually signal growing strength, not exhaustion. Exhaustion typically shows as large candles on climactic volume followed by reversal. Here, the steady expansion shows progressive conviction building \u2014 a healthy impulse signature.","chart":{"symbol":"GOOGL","interval":"D","candles":[[94,96.87,92.74,96.37],[96.29,96.4,95.73,95.77],[95.69,97.73,95.56,95.95],[95.93,96.04,93.76,94.24],[94.24,94.98,90.89,91.65],[91.74,93.08,91.1,93.08],[93.15,93.57,93.13,93.55],[93.46,94.23,93.33,94.13],[94.08,95.07,94.01,94.97],[94.89,95.0,93.94,93.94],[93.99,94.04,93.58,93.64],[93.62,93.95,91.88,92.05],[91.98,93.27,91.69,93.01],[92.97,94.57,92.88,93.93],[93.99,1 lidation, the more energy builds \u2014 and the resulting impulse breakout (or breakdown) tends to be more powerful. This is why traders watch extended consolidation zones closely for the next directional move.","incorrectFeedback":"Extended consolidation doesn't last forever \u2014 it builds pressure. Think of it as a spring compressing: the tighter and longer the range, the more energy is stored. When it finally breaks, the resulting impulse move tends to be powerful. Low volume during consolidation is normal and doesn't indicate seller control.","chart":{"symbol":"AMD","interval":"D","candles":[[505,508.39,504.91,508.11],[508.47,508.83,508.45,508.8],[508.63,509.09,507.92,507.94],[508.0,508.19,507.21,507.35],[507.53,509.4,507.09,509.29],[509.32,509.56,501.95,502.0],[502.44,504.72,501.91,504.25],[503.8,506.44,503.33,506.15],[506.03,507.43,505.72,507.0],[506.85,509.44,504.71,504.95],[505.0,505.21,504.65,504.7],[504.52,504.93,500.99,501.01],[500.71,503.18,500.7,502.72],[502.9,504.84,500.99,504.71],[505.0,508.98,504.46,508.93],[508.92,511.48,506.58,506.89],[506.94,507.17,505.56,505.78],[505.57,507.34,502.35,502.92],[502.9,504.82,502.83,504.71],[505.01,505.87,504.5,505.8],[505.53,506.19,505.36,505.93],[505.78,505.8,503.91,503.99],[503.71,505.65,503.32,505.33],[505.42,506.29,499.98,499.99],[500.38,505.89,499.28,504.72],[504.46,504.53,504.17,504.18],[503.82,510.96,502.88,508.02],[508.49,509.0,506.4,506.64],[506.44,507.75,504.9,504.99],[505.38,505.55,502.66,504.07],[503.83,504.25,503.77,504.24],[504.6,504.96,504.17,504.24],[503.9,506.96,503.67,506.94],[506.49,506.92,504.49,504.94],[505.35,505.54,501.36,503.47],[503.38,503.7,501.36,502.02],[501.65,502.09,501.55,502.01],[501.79,503.9,499.86,503.79],[503.57,505.98,503.45,505.95],[505.48,505.63,502.56,504.28],[504.12,504.45,502.83,503.01],[502.81,503.13,502.75,503.05],[502.92,503.83,502.84,503.66],[503.56,504.92,502.94,504.65],[504.15,505.29,503.01,504.95]],"volume":[800189,951346,969826,870899,791442,625210,775354,761975,780 rom the breakout.","chart":{"symbol":"NVDA","interval":"D","candles":[[800,803.62,799.38,803.53],[803.24,818.81,801.11,815.38],[815.58,815.72,815.13,815.28],[815.18,815.33,813.45,813.78],[813.6,814.0,809.52,811.35],[812.06,812.18,810.09,810.14],[810.0,829.19,807.67,828.82],[828.82,828.97,828.21,828.3],[827.86,832.2,827.3,830.22],[829.77,831.46,827.31,827.62],[827.28,827.58,825.27,825.29],[824.94,825.0,824.73,824.79],[823.98,825.3,822.95,825.06],[824.31,833.35,822.16,831.84],[832.16,844.87,831.04,844.6],[844.22,844.28,843.94,844.01],[844.68,844.75,842.78,842.97],[842.2,842.39,839.98,840.02],[839.73,874.17,836.68,856.06],[856.53,858.66,852.72,853.22],[853.13,860.42,852.54,860.4],[860.0,860.7,858.41,858.66],[857.84,858.06,857.81,858.02],[858.86,859.52,851.57,851.65],[851.39,852.16,851.34,852.15],[852.78,860.63,851.63,859.79],[859.86,861.27,857.8,857.86],[858.0,858.06,856.04,857.07],[857.16,858.55,848.83,848.91],[848.83,850.48,845.84,847.12],[847.81,850.61,847.28,850.51],[850.69,850.82,846.51,846.94],[846.19,855.44,845.22,855.33],[856.07,856.54,852.36,853.1],[853.13,853.24,846.76,846.76],[846.49,848.97,842.87,848.92],[849.12,850.77,849.11,850.68],[850.79,855.09,850.5,852.58],[852.36,855.63,852.2,855.56],[855.93,858.22,854.03,854.29],[853.46,853.8,851.26,851.7],[851.93,852.58,847.82,849.6],[850.25,851.71,849.99,851.39],[850.81,850.84,850.37,850.47],[849.91,853.31,849.72,853.25]],"volume":[1453402,1405988,1377806,1182879,1228076,1336544,1286183,1513165,1735602,1920423,1469502,1482862,1746431,1902669,1833048,1993606,2307710,1898126,1909273,1431368,1202998,1158223,1325877,1080746,1111824,1402040,1265124,1126622,1179956,953887,839581,1206180,993474,1447717,1241344,1161798,1188335,921223,594957,1128463,972770,914189,1181994,937906,680366]}},{"module":"Module 1","topic":"Impulse vs Consolidation","layer":2,"id":"M1-IC-009","status":"NEW","scenario":"A stock in a downtrend has made three bearish impulse legs. The first dropped $20, the second dropped $15, and the third dropped only $8. Each impulse was followed by a brief consolidation.","question":"What does the shrinking size of each impulse leg tell you?","options":{"A":"Nothing \u2014 impulse sizes are random and don't provide useful information","B":"The trend is accelerating and the next impulse will be even larger","C":"Selling pressure is exhausting \u2014 each wave is weaker than the last, the trend is maturing, and you should begin watching for reversal setups","D":"The shrinking impulses confirm the downtrend is healthy because controlled selling is more sustainable"},"correct":"C","correctFeedback":"Shrinking impulse legs are a classic sign of trend exhaustion. Each successive wave produces less movement, meaning the dominant side (sellers here) is losing steam. The trend is maturing. While it doesn't guarantee an immediate reversal, it's a warning to tighten stops on shorts and start watching for reversal setups. Diminishing impulses + momentum divergence = high-probability exhaustion.","incorrectFeedback":"When each impulse leg gets smaller, it means the driving force is weakening. Think of it like a bouncing ball \u2014 each bounce (impulse) is lower than the last as energy dissipates. Shrinking bearish impulses ($20, $15, $8) show sellers are running out of ammunition. This is a trend maturation signal, not trend health.","chart":{"symbol":"META","interval":"D","candles":[[200,200.16,199.33,199.36],[199.5,199.62,199.41,199.61],[199.55,199.59,198.03,198.04],[197.96,197.96,197.29,197.43],[197.56,197.84,196.03,196.34],[196.53,196.65,195.94,195.96],[195.77,196.47,191.55,192.03],[191.88,192.4,183.06,188.22],[188.11,191.96,187.14,191.94],[191.88,192.17,191.41,191.48],[191.6,192.74,186.52,186.92],[187.0,187.26,185.62,186.05],[185.89,186.05,182.71,182.83],[182.81,185.01,179.76,184.93],[185.03,185.08,179.93,179.96],[180.14,180.58,180.08,180.55],[180.55,181.51,180.52,181.41],[181.5,183.0,180.3,182.96],[183.05,183.17,181.5,181.69],[181.68,181.91,178.39,179.61],[179.53,179.8,176.86,17 g could break down. Conservative: wait for the breakout above the flag with volume confirmation for higher probability. Both use a stop below the flag low. The measured move target equals the pole distance ($12) projected from the breakout point \u2014 giving you a clear profit target.","incorrectFeedback":"Flags are continuation patterns that form after an impulse (the 'pole'). The declining volume and slight drift against the trend is healthy consolidation. You have two valid entries: aggressive (buy flag support) or conservative (buy breakout with volume). Stop goes below the flag, and the target is the pole distance from the breakout.","chart":{"symbol":"TSLA","interval":"D","candles":[[175,176.1,174.91,175.47],[175.44,176.72,175.41,176.24],[176.28,176.5,175.93,175.93],[175.96,176.33,175.91,176.26],[176.29,176.48,175.92,175.98],[176.1,178.07,176.05,178.02],[177.87,177.88,177.82,177.82],[177.64,177.71,177.64,177.7],[177.87,178.23,177.05,177.07],[176.95,176.97,176.65,176.67],[176.52,176.77,176.47,176.73],[176.86,176.9,175.94,175.98],[175.94,177.82,175.94,177.47],[177.64,178.44,177.59,178.4],[178.26,179.3,177.91,179.04],[178.93,178.96,178.01,178.51],[178.6,178.67,178.31,178.33],[178.24,178.29,177.9,177.95],[178.11,179.26,177.0,179.06],[179.17,179.18,177.96,178.62],[178.8,180.4,178.62,179.99],[180.05,183.63,179.92,183.16],[183.01,184.94,181.51,184.56],[184.48,184.68,184.04,184.04],[183.92,185.6,183.65,185.46],[185.29,186.64,183.94,186.52],[186.63,188.82,186.02,188.05],[188.11,188.58,188.06,188.55],[188.53,188.53,187.95,188.03],[188.04,192.1,187.7,192.09],[192.19,192.28,190.8,190.85],[190.94,190.98,189.56,189.77],[189.68,189.75,188.53,189.01],[188.88,189.35,188.84,189.25],[189.12,190.2,189.03,190.02],[189.91,194.11,189.85,193.06],[192.99,193.26,191.89,191.92],[192.11,192.98,192.1,192.79],[192.92,194.37,185.66,186.94],[186.89,189.83,186.51,189.38],[189.56,190.5,189.48,190.46],[190.58,191.33,190.22,191.09],[191.05,191.11,190.27,190.43],[190.43,190.57,189.08,189.18],[18 n consolidation character changes within a trend, pay attention. The first two quick pauses (3-5 days) showed eager buyers quickly absorbing supply. A 15-day consolidation is a behavior change \u2014 buying urgency is fading. This doesn't guarantee reversal, but it's a maturation signal. The prudent response: reduce position size, tighten stops, or simply wait for the market to show its hand before committing more capital.","incorrectFeedback":"Consolidation length within a trend carries important information. Quick consolidations (3-5 days) show eager buyers who can't wait to buy more. When consolidation suddenly stretches to 15 days, it signals a character change \u2014 the urgency is fading. This is a caution signal, not a reason to add size or panic sell, but rather to respect the shift and adjust your approach.","chart":{"symbol":"AMZN","interval":"D","candles":[[200,201.89,199.75,201.68],[201.69,204.61,201.2,204.59],[204.69,207.83,204.15,207.06],[207.21,208.63,207.17,207.96],[208.08,208.16,206.58,206.77],[206.82,214.1,206.51,214.07],[214.07,215.61,213.97,215.51],[215.59,216.42,215.41,216.37],[216.38,220.44,215.37,220.11],[220.18,220.89,216.32,216.44],[216.48,217.12,215.93,215.94],[215.94,215.95,215.92,215.92],[216.05,228.32,214.84,221.05],[221.22,225.13,220.49,224.26],[224.26,225.4,220.98,221.0],[220.98,222.3,220.82,222.29],[222.38,225.29,221.83,224.64],[224.5,227.59,224.33,226.05],[225.91,232.47,224.76,231.98],[232.16,232.82,232.07,232.77],[232.84,233.04,231.2,232.12],[232.34,234.89,232.08,234.36],[234.3,237.11,233.82,236.55],[236.73,238.56,236.43,238.12],[238.24,238.31,237.26,237.39],[237.4,238.78,235.55,235.64],[235.81,237.01,233.84,233.9],[233.89,235.44,233.5,235.2],[235.14,240.41,234.24,239.67],[239.87,240.13,239.11,239.12],[239.15,240.8,238.72,240.72],[240.65,241.32,240.6,240.98],[240.93,244.72,240.62,243.07],[243.25,244.73,243.12,244.54],[244.42,246.4,244.09,246.38],[246.24,248.12,245.61,248.12],[248.26,249.09,247.76,249.04],[249.0,252.42,248.28,252.3], -consolidation-impulse is the market's natural rhythm. The consolidation at $556-$560 IS your entry zone. Buy near support (~$556) for better risk/reward, or buy a breakout above $560 for confirmation. Missing the impulse doesn't mean missing the trade \u2014 the consolidation hands you the opportunity on a silver platter.","incorrectFeedback":"The student has a common misconception. You rarely catch impulse moves from the start \u2014 and you don't need to. The market's rhythm is impulse \u2192 consolidation \u2192 impulse. The consolidation phase IS your entry opportunity. Waiting for consolidation gives you a defined risk level (consolidation support) and positions you for the next impulse leg.","chart":{"symbol":"AAPL","interval":"D","candles":[[540,541.98,539.69,541.54],[541.49,545.51,540.55,545.05],[544.5,547.01,544.14,546.97],[547.46,547.47,547.26,547.35],[547.82,547.88,547.07,547.21],[547.64,547.7,544.64,545.04],[544.75,547.07,544.62,546.67],[546.23,548.7,546.21,548.28],[548.54,553.1,548.46,552.96],[553.31,553.4,552.75,552.81],[552.49,553.0,550.65,550.74],[550.82,551.03,550.73,551.02],[551.37,557.36,550.21,556.02],[555.76,558.53,555.19,558.25],[558.62,560.31,557.1,560.01],[560.0,560.2,558.95,558.99],[558.48,558.5,557.82,557.9],[557.42,557.73,555.47,555.95],[556.07,566.34,555.95,561.28],[561.23,564.16,560.98,563.49],[563.36,563.86,561.95,561.96],[562.27,562.79,559.23,559.63],[559.2,560.24,558.96,560.14],[559.69,559.89,553.94,553.94],[553.57,555.63,552.19,555.57],[555.18,556.72,554.8,556.65],[556.19,559.97,555.48,559.97],[559.87,559.98,559.34,559.43],[559.57,559.88,554.15,554.92],[555.31,555.56,555.0,555.07],[554.99,555.91,554.77,555.8],[555.78,555.85,555.06,555.09],[554.57,561.11,554.17,561.09],[561.45,564.73,556.3,557.19],[557.13,558.73,549.75,551.07],[551.45,553.08,551.13,552.94],[553.31,557.43,553.06,556.61],[556.91,562.49,556.04,561.48],[561.61,564.06,558.95,558.96],[558.56,558.68,556.44,556.76],[557.04,557.09,556.61,556.7],[556.91,557.07,555.96,556.08]]}},{"module":"Module 1","topic":"Impulse vs Consolidation","layer":3,"id":"M1-IC-013","status":"NEW","scenario":"A stock had a bearish impulse on enormous volume. Now it's consolidating in a tight range, but volume has dropped to almost nothing \u2014 well below average.","question":"A student says: 'The low volume worries me. Nobody's interested in this stock anymore.' How would you correct this student's interpretation of the low consolidation volume?","options":{"A":"The student is right \u2014 extremely low volume means the stock is dead and you should avoid it","B":"Low consolidation volume after a high-volume impulse is actually an ideal setup. The absence of counter-trend buying pressure creates a 'volume void' that often precedes the next impulse in the same direction (bearish continuation)","C":"Volume is irrelevant during consolidation \u2014 only price pattern matters","D":"Low volume always means the consolidation will break in the opposite direction of the impulse"},"correct":"B","correctFeedback":"The student has it backwards. After a high-volume bearish impulse, low consolidation volume is actually bullish for the bearish thesis. It means: no significant buying is stepping in to oppose the move. This 'volume void' signals that the path of least resistance remains in the impulse direction. Heavy impulse volume + quiet consolidation = continuation setup. The silence during consolidation is a feature, not a bug.","incorrectFeedback":"Low volume during consolidation doesn't mean 'nobody's interested.' After a high-volume impulse, you want to see quiet consolidation \u2014 it means no opposing force is stepping in. If buyers were genuinely interested in reversing the move, you'd see volume increase during the consolidation. The absence of counter-trend volume is a continuation signal.","chart":{"symbol":"MSFT","interval":"D","candles":[[300,300.08,294.9,295.55],[295.49,297.43,295.03,297.11],[297.04,297.61,287.86,287.9],[287.69,288.33,287.51,288.27],[288.48, }

function togMod(el){var a=el.querySelector(".mha");var tl=el.nextElementSibling;a.classList.toggle("op");tl.classList.toggle("op")}
function togLayer(lv){
  if(!layerFilter){
    // Currently showing all — switch to just this layer
    layerFilter=[lv];
  } else if(layerFilter.indexOf(lv)!==-1){
    // Layer is on — turn it off
    layerFilter=layerFilter.filter(function(x){return x!==lv});
    if(layerFilter.length===0) layerFilter=null; // all off = show all
  } else {
    // Layer is off — turn it on
    layerFilter.push(lv);
    layerFilter.sort();
    if(layerFilter.length===3) layerFilter=null; // all 3 on = show all
  }
  saveLayerFilter();
  buildSB();
  if(view==="home") renderHome();
  else if(view==="setup" && meta.module) pickMod(meta.module);
}

// ========== LIGHTWEIGHT CHARTS ==========
var _activeCharts = [];

function destroyCharts() {
  for (var i = 0; i < _activeCharts.length; i++) {
    try { _activeCharts[i].remove(); } catch(e) {}
  }
  _activeCharts = [];
}

function createChart(containerId, candles, symbol, interval, highlightLast, trendline, overlays, volumeData) {
  var el = document.getElementById(containerId);
  if (!el || !candles || candles.length === 0) return;

  var chart = LightweightCharts.createChart(el, {
    width: el.clientWidth,
    height: el.clientHeight,
    layout: {
      background: { type: "solid", color: "#131722" },
      textColor: "rgba(255,255,255,0.5)",
      fontSize: 11
    },
    grid: {
      vertLines: { color: "rgba(255,255,255,0.04)" },
      horzLines: { color: "rgba(255,255,255,0.04)" }
    },
    crosshair: {
      mode: 0,
      vertLine: { color: "rgba(255,255,255,0.3)", width: 1, style: 2, labelVisible: false },
      horzLine: { color: "rgba(255,255,255,0.3)", width: 1, style: 2, labelBackgroundColor: "#3a3f4b" }
    },
    rightPriceScale: {
      borderColor: "rgba(255,255,255,0.08)",
      scaleMargins: { top: 0.08, bottom: 0.08 },
      minimumWidth: 80
    },
    timeScale: {
      borderColor: "rgba(255,255,255,0.08)",
      timeVisible: false,
      rightOffset: 2,
      visible: false
    }
  });

  var series = chart.addCandlestickSeries({
    upColor: "#26a69a",
    downColor: "#ef5350",
    borderUpColor: "#26a69a",
    borderDownColor: "#ef5350",
    wickUpColor: "#26a69a",
    wickDownColor: "#ef5350"
  });

  // Convert [O,H,L,C] arrays to Lightweight Charts format — consecutive UTC timestamps (no gaps)
  var chartData = [];
  var t0 = 1704067200;
  for (var i = 0; i < candles.length; i++) {
    chartData.push({
      time: t0 + i,
      open: candles[i][0],
      high: candles[i][1],
      low: candles[i][2],
      close: candles[i][3]
    });
  }
  series.setData(chartData);

  // Highlight pattern candles if specified
  if (highlightLast && highlightLast > 0 && chartData.length >= highlightLast) {
    var markers = [];
    var startIdx = chartData.length - highlightLast;
    for (var m = startIdx; m < chartData.length; m++) {
      var d = chartData[m];
      var isUp = d.close >= d.open;
      markers.push({
        time: d.time,
        position: "belowBar",
        color: "#ff9800",
        shape: "arrowUp",
        text: m === startIdx ? "Pattern" : ""
      });
    }
    series.setMarkers(markers);
  }

  // Volume as separate histogram series
  var volSeries = chart.addHistogramSeries({
    priceFormat: { type: "volume" },
    priceScaleId: "vol",
    color: "#26a69a"
  });
  chart.priceScale("vol").applyOptions({
    scaleMargins: { top: 0.85, bottom: 0 },
    visible: false
  });
  var volData = [];
  for (var j = 0; j < chartData.length; j++) {
    var vol = (volumeData && volumeData[j]) ? volumeData[j] : (candles[j][1] - candles[j][2]) * 100000;
    var isUp = candles[j][3] >= candles[j][0];
    volData.push({
      time: chartData[j].time,
      value: vol,
      color: isUp ? "rgba(38,166,154,0.2)" : "rgba(239,83,80,0.2)"
    });
  }
  volSeries.setData(volData);


  // Trendline overlay (straight line: first point to last point only)
  if (trendline && trendline.length >= 2) {
    var lineSeries = chart.addLineSeries({
      color: "#ffeb3b", lineWidth: 2, lineStyle: 0,
      crosshairMarkerVisible: false, priceLineVisible: false, lastValueVisible: false
    });
    var first = trendline[0], last = trendline[trendline.length - 1];
    var lineData = [];
    if (first[0] >= 0 && first[0] < chartData.length) lineData.push({ time: chartData[first[0]].time, value: first[1] });
    if (last[0] >= 0 && last[0] < chartData.length) lineData.push({ time: chartData[last[0]].time, value: last[1] });
    lineSeries.setData(lineData);
  }

  // Overlays: MA lines, Bollinger Bands, Fibonacci, S/R lines
  if (overlays) {
    // MA / EMA lines
    if (overlays.lines) {
      for (var li = 0; li < overlays.lines.length; li++) {
        var lineSpec = overlays.lines[li];
        var maSeries = chart.addLineSeries({
          color: lineSpec.color || "#ff9800", lineWidth: lineSpec.width || 2, lineStyle: 0,
          crosshairMarkerVisible: false, priceLineVisible: false, lastValueVisible: false,
          title: lineSpec.label || ""
        });
        var maData = [];
        for (var mi = 0; mi < lineSpec.values.length; mi++) {
          if (lineSpec.values[mi] !== null && mi < chartData.length) {
            maData.push({ time: chartData[mi].time, value: lineSpec.values[mi] });
          }
        }
        maSeries.setData(maData);
      }
    }
    // Bollinger Bands
    if (overlays.bb) {
      var bbColors = { upper: "rgba(33,150,243,0.4)", middle: "rgba(33,150,243,0.7)", lower: "rgba(33,150,243,0.4)" };
      var bbKeys = ["upper", "middle", "lower"];
      for (var bi = 0; bi < bbKeys.length; bi++) {
        var bk = bbKeys[bi];
        var bbSeries = chart.addLineSeries({
          color: bbColors[bk], lineWidth: bk === "middle" ? 2 : 1, lineStyle: bk === "middle" ? 0 : 2,
          crosshairMarkerVisible: false, priceLineVisible: false, lastValueVisible: false,
          title: bk === "middle" ? "BB Mid" : ""
        });
        var bbData = [];
        var vals = overlays.bb[bk];
        for (var bj = 0; bj < vals.length; bj++) {
          if (vals[bj] !== null && bj < chartData.length) {
            bbData.push({ time: chartData[bj].time, value: vals[bj] });
          }
        }
        bbSeries.setData(bbData);
      }
    }
    // Fibonacci levels
    if (overlays.fib) {
      var fibColors = { "0%": "#ef5350", "23.6%": "#ff9800", "38.2%": "#ffeb3b", "50%": "#4caf50", "61.8%": "#2196f3", "100%": "#ef5350" };
      var fibKeys = Object.keys(overlays.fib);
      for (var fi = 0; fi < fibKeys.length; fi++) {
        var fk = fibKeys[fi];
        series.createPriceLine({
          price: overlays.fib[fk], color: fibColors[fk] || "#888", lineWidth: 1, lineStyle: 2,
          axisLabelVisible: true, title: fk
        });
      }
    }
    // S/R horizontal lines
    if (overlays.srLines) {
      for (var si = 0; si < overlays.srLines.length; si++) {
        var sr = overlays.srLines[si];
        series.createPriceLine({
          price: sr.price, color: sr.color || "#ef5350", lineWidth: 2, lineStyle: 2,
          axisLabelVisible: true, title: sr.label || ""
        });
      }
    }
  }

  // Symbol watermark
  if (symbol) {
    var tf = interval === "W" ? "Weekly" : interval === "5" ? "5min" : "Daily";
    chart.applyOptions({
      watermark: {
        visible: true,
        text: symbol + "  " + tf,
        fontSize: 14,
        color: "rgba(255,255,255,0.12)",
        horzAlign: "left",
        vertAlign: "top"
      }
    });
  }

  _activeCharts.push(chart);

  // Fit content then widen bars to fill the chart
  requestAnimationFrame(function() {
    var spacing = Math.max(8, Math.floor(el.clientWidth / candles.length * 0.85));
    chart.timeScale().applyOptions({ barSpacing: spacing });
    chart.timeScale().fitContent();
  });

  // Handle resize
  var ro = new ResizeObserver(function() {
    chart.applyOptions({ width: el.clientWidth, height: el.clientHeight });
    chart.timeScale().fitContent();
  });
  ro.observe(el);

  // ===== RSI SUB-PANEL =====
  if (overlays && overlays.rsi && overlays.rsi.values) {
    var rsiId = containerId + "_rsi";
    var rsiEl = document.getElementById(rsiId);
    if (rsiEl) {
      var rsiChart = LightweightCharts.createChart(rsiEl, {
        width: rsiEl.clientWidth, height: rsiEl.clientHeight,
        layout: { background: { type: "solid", color: "#131722" }, textColor: "rgba(255,255,255,0.5)", fontSize: 10 },
        grid: { vertLines: { color: "rgba(255,255,255,0.04)" }, horzLines: { color: "rgba(255,255,255,0.04)" } },
        crosshair: { mode: 0, vertLine: { color: "rgba(255,255,255,0.3)", width: 1, style: 2, labelVisible: false }, horzLine: { color: "rgba(255,255,255,0.3)", width: 1, style: 2, labelBackgroundColor: "#3a3f4b" } },
        rightPriceScale: { borderColor: "rgba(255,255,255,0.08)", scaleMargins: { top: 0.05, bottom: 0.05 }, minimumWidth: 80 },
        timeScale: { borderColor: "rgba(255,255,255,0.08)", timeVisible: false, rightOffset: 2, visible: false }
      });

      // RSI line
      var rsiSeries = rsiChart.addLineSeries({
        color: "#a855f7", lineWidth: 2, crosshairMarkerVisible: true,
        priceLineVisible: false, lastValueVisible: false, title: "RSI"
      });
      var rsiData = [];
      for (var ri = 0; ri < overlays.rsi.values.length; ri++) {
        if (overlays.rsi.values[ri] !== null && ri < chartData.length) {
          rsiData.push({ time: chartData[ri].time, value: overlays.rsi.values[ri] });
        }
      }
      rsiSeries.setData(rsiData);
      // Anchor series to force 20-80 range visibility
      var rsiAnchor = rsiChart.addLineSeries({ color: "transparent", lineWidth: 0, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
      if (rsiData.length > 1) { rsiAnchor.setData([{ time: chartData[0].time, value: 20 }, { time: chartData[chartData.length-1].time, value: 80 }]); }

      // Overbought (70), oversold (30), and midline (50) reference lines
      rsiSeries.createPriceLine({ price: 70, color: "rgba(239,83,80,0.5)", lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: "70" });
      rsiSeries.createPriceLine({ price: 30, color: "rgba(38,166,154,0.5)", lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: "30" });
      rsiSeries.createPriceLine({ price: 50, color: "rgba(150,150,150,0.6)", lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: "50" });

      // RSI label
      rsiChart.applyOptions({ watermark: { visible: true, text: "RSI(14)", fontSize: 11, color: "rgba(168,85,247,0.3)", horzAlign: "left", vertAlign: "top" } });

      _activeCharts.push(rsiChart);

      // Sync crosshair between main chart and RSI
      chart.subscribeCrosshairMove(function(param) {
        if (param.time) rsiChart.timeScale().scrollToPosition(chart.timeScale().scrollPosition(), false);
      });

      requestAnimationFrame(function() {
        var rsiSpacing = Math.max(8, Math.floor(rsiEl.clientWidth / candles.length * 0.85));
        rsiChart.timeScale().applyOptions({ barSpacing: rsiSpacing });
        rsiChart.timeScale().fitContent();
      });
      var rsiRo = new ResizeObserver(function() {
        rsiChart.applyOptions({ width: rsiEl.clientWidth, height: rsiEl.clientHeight });
        rsiChart.timeScale().fitContent();
      });
      rsiRo.observe(rsiEl);
    }
  }

  // ===== MACD SUB-PANEL =====
  if (overlays && overlays.macd) {
    var macdId = containerId + "_macd";
    var macdEl = document.getElementById(macdId);
    if (macdEl) {
      var macdChart = LightweightCharts.createChart(macdEl, {
        width: macdEl.clientWidth, height: macdEl.clientHeight,
        layout: { background: { type: "solid", color: "#131722" }, textColor: "rgba(255,255,255,0.5)", fontSize: 10 },
        grid: { vertLines: { color: "rgba(255,255,255,0.04)" }, horzLines: { color: "rgba(255,255,255,0.04)" } },
        crosshair: { mode: 0, vertLine: { color: "rgba(255,255,255,0.3)", width: 1, style: 2, labelVisible: false }, horzLine: { color: "rgba(255,255,255,0.3)", width: 1, style: 2, labelBackgroundColor: "#3a3f4b" } },
        rightPriceScale: { borderColor: "rgba(255,255,255,0.08)", scaleMargins: { top: 0.15, bottom: 0.15 }, minimumWidth: 80 },
        timeScale: { borderColor: "rgba(255,255,255,0.08)", timeVisible: false, rightOffset: 2, visible: false }
      });

      // MACD line (blue)
      var macdLineSeries = macdChart.addLineSeries({
        color: "#2196f3", lineWidth: 2, crosshairMarkerVisible: true,
        priceLineVisible: false, lastValueVisible: false, title: "MACD"
      });
      var macdLineData = [];
      for (var mi = 0; mi < overlays.macd.macdLine.length; mi++) {
        if (overlays.macd.macdLine[mi] !== null && mi < chartData.length) {
          macdLineData.push({ time: chartData[mi].time, value: overlays.macd.macdLine[mi] });
        }
      }
      macdLineSeries.setData(macdLineData);

      // Signal line (orange)
      var sigSeries = macdChart.addLineSeries({
        color: "#ff9800", lineWidth: 1, crosshairMarkerVisible: false,
        priceLineVisible: false, lastValueVisible: false, title: "Signal"
      });
      var sigData = [];
      for (var si2 = 0; si2 < overlays.macd.signalLine.length; si2++) {
        if (overlays.macd.signalLine[si2] !== null && si2 < chartData.length) {
          sigData.push({ time: chartData[si2].time, value: overlays.macd.signalLine[si2] });
        }
      }
      sigSeries.setData(sigData);

      // Histogram (green/red bars)
      var histSeries = macdChart.addHistogramSeries({
        priceFormat: { type: "price", precision: 4 },
        priceLineVisible: false, lastValueVisible: false
      });
      var histData = [];
      for (var hi2 = 0; hi2 < overlays.macd.histogram.length; hi2++) {
        if (overlays.macd.histogram[hi2] !== null && hi2 < chartData.length) {
          histData.push({
            time: chartData[hi2].time,
            value: overlays.macd.histogram[hi2],
            color: overlays.macd.histogram[hi2] >= 0 ? "rgba(38,166,154,0.6)" : "rgba(239,83,80,0.6)"
          });
        }
      }
      histSeries.setData(histData);

      // Zero line
      macdLineSeries.createPriceLine({ price: 0, color: "rgba(255,255,255,0.2)", lineWidth: 1, lineStyle: 2, axisLabelVisible: false, title: "" });

      // MACD label
      macdChart.applyOptions({ watermark: { visible: true, text: "MACD", fontSize: 11, color: "rgba(33,150,243,0.3)", horzAlign: "left", vertAlign: "top" } });

      _activeCharts.push(macdChart);

      requestAnimationFrame(function() {
        var macdSpacing = Math.max(8, Math.floor(macdEl.clientWidth / candles.length * 0.85));
        macdChart.timeScale().applyOptions({ barSpacing: macdSpacing });
        macdChart.timeScale().fitContent();
      });
      var macdRo = new ResizeObserver(function() {
        macdChart.applyOptions({ width: macdEl.clientWidth, height: macdEl.clientHeight });
        macdChart.timeScale().fitContent();
      });
      macdRo.observe(macdEl);
    }
  }
}

function chartHTML(q) {
  if (!q.chart || !q.chart.candles || q.chart.candles.length === 0) return "";
  var isDual = q.chart2 && q.chart2.candles && q.chart2.candles.length > 0;
  if (!window._pendingCharts) window._pendingCharts = [];

  var html = "";
  if (isDual) {
    // Side-by-side layout
    var cidA = "lc_" + Math.random().toString(36).substr(2, 8);
    var cidB = "lc_" + Math.random().toString(36).substr(2, 8);
    var ovA = q.chart.overlays || null;
    var ovB = q.chart2.overlays || null;
    window._pendingCharts.push({
      id: cidA, candles: q.chart.candles, symbol: q.chart.symbol || "",
      interval: q.chart.interval || "D", hl: q.chart.highlightLast || 0,
      tl: q.chart.trendline || null, ov: ovA, vol: q.chart.volume || null
    });
    window._pendingCharts.push({
      id: cidB, candles: q.chart2.candles, symbol: q.chart2.symbol || "",
      interval: q.chart2.interval || "D", hl: q.chart2.highlightLast || 0,
      tl: q.chart2.trendline || null, ov: ovB, vol: q.chart2.volume || null
    });
    html += "<div class='dual-charts'>";
    html += "<div class='dual-col'>";
    if (q.chart.label) html += "<div class='chart-label'>" + esc(q.chart.label) + "</div>";
    html += "<div class='cw cw-dual' id='" + cidA + "'></div>";
    if (ovA && ovA.rsi) html += "<div class='cw-sub cw-sub-dual' id='" + cidA + "_rsi'></div>";
    if (ovA && ovA.macd) html += "<div class='cw-sub cw-sub-dual' id='" + cidA + "_macd'></div>";
    html += "</div><div class='dual-col'>";
    if (q.chart2.label) html += "<div class='chart-label'>" + esc(q.chart2.label) + "</div>";
    html += "<div class='cw cw-dual' id='" + cidB + "'></div>";
    if (ovB && ovB.rsi) html += "<div class='cw-sub cw-sub-dual' id='" + cidB + "_rsi'></div>";
    if (ovB && ovB.macd) html += "<div class='cw-sub cw-sub-dual' id='" + cidB + "_macd'></div>";
    html += "</div></div>";
  } else {
    // Single chart
    var cid = "lc_" + Math.random().toString(36).substr(2, 8);
    var ov = q.chart.overlays || null;
    window._pendingCharts.push({
      id: cid, candles: q.chart.candles, symbol: q.chart.symbol || "",
      interval: q.chart.interval || "D", hl: q.chart.highlightLast || 0,
      tl: q.chart.trendline || null, ov: ov, vol: q.chart.volume || null
    });
    html += "<div class='cw' id='" + cid + "'></div>";
    if (ov && ov.rsi) html += "<div class='cw-sub' id='" + cid + "_rsi'></div>";
    if (ov && ov.macd) html += "<div class='cw-sub' id='" + cid + "_macd'></div>";
  }
  return html;
}

function renderPendingCharts() {
  if (!window._pendingCharts || window._pendingCharts.length === 0) return;
  // Use rAF to ensure container has dimensions before creating chart
  var pending = window._pendingCharts.slice();
  window._pendingCharts = [];
  requestAnimationFrame(function() {
    for (var i = 0; i < pending.length; i++) {
      var p = pending[i];
      createChart(p.id, p.candles, p.symbol, p.interval, p.hl, p.tl, p.ov, p.vol);
    }
  });
}

function renderQn(){
  destroyCharts();
  window._pendingCharts = [];
  var q=qzQ[cQ],tot=qzQ.length,pct=((cQ)/tot*100).toFixed(0);
  var h="<div class=\"qz\"><div class=\"pg\"><div class=\"pgb\"><div class=\"pgf\" style=\"width:"+pct+"%\"></div></div><span class=\"pgt\">"+(cQ+1)+" / "+tot+"</span></div>";
  h+="<div class=\"qc\"><div class=\"qm\"><span class=\"qt tp\">"+esc(q.topic)+"</span><span class=\"qt ly\">Layer "+q.layer+": "+(LN[q.layer]||"")+"</span></div>";
  h+=chartHTML(q);
  var scenLabel=(q.chart&&q.chart.candles&&q.chart.candles.length>0)?"Scenario:":"Chart Setup:";
  h+="<div class=\"scn\"><b>"+scenLabel+"</b> "+esc(q.scenario)+"</div>";
  h+="<div class=\"qx\">"+esc(q.question)+"</div>";
  h+="<div class=\"os\">";
  var letters=["A","B","C","D"];
  for(var i=0;i<4;i++){
    var l=letters[i];
    h+="<div class=\"op\" id=\"o-"+l+"\" onclick=\"pick('"+l+"')\"><span class=\"lt\">"+l+"</span><span>"+esc(q.options[l])+"</span></div>";
  }
  h+="</div><div class=\"fb\" id=\"fb\"></div>";
  // Add options chain reference during Module 6 quiz
  if (meta.module === "Module 6") {
    h += optionsChainHTML();
  }
  h+="</div>";
  h+="<button class=\"nx\" id=\"nxb\" onclick=\"nxt()\">"+(cQ<tot-1?"Next Question":"See Results")+"</button></div>";
  document.getElementById("main").innerHTML=h;
  ansd=false;
  // Render charts after DOM is updated
  setTimeout(renderPendingCharts, 0);
}

function pick(l){
  if(ansd)return;ansd=true;
  var q=qzQ[cQ],ok=l===q.correct;
  if(ok)score++;
  uAns.push({qid:q.id,sel:l,cor:q.correct,ok:ok});
  var letters=["A","B","C","D"];
  for(var i=0;i<4;i++){
    var x=letters[i],e=document.getElementById("o-"+x);
    e.classList.add("ds");
    if(x===q.correct)e.classList.add("ok");
    else if(x===l&&!ok)e.classList.add("no");
    else e.classList.add("dm");
  }
  var fb=document.getElementById("fb");
  fb.className="fb "+(ok?"ok":"no");
  fb.innerHTML="<div class=\"fl\">"+(ok?"Correct!":"Not quite.")+"</div>"+(ok?q.correctFeedback:q.incorrectFeedback);
  fb.style.display="block";
  document.getElementById("nxb").style.display="inline-block";
}

function nxt(){if(cQ<qzQ.length-1){cQ++;renderQn()}else showRes()}

function showRes(){
  view="results";var tot=qzQ.length,pct=Math.round(score/tot*100);
  saveR(meta,score,tot,uAns);
  logToSheet({module:meta.module,topic:meta.topic,score:score,total:tot,answers:uAns});
  var msg="";
  if(pct===100)msg="Perfect score. You crushed it.";
  else if(pct>=80)msg="Strong work. You clearly know this material.";
  else if(pct>=60)msg="Solid foundation. Review the ones you missed and try again.";
  else if(pct>=40)msg="Getting there. Focus on the feedback for missed questions.";
  else msg="Tough module. Review the material and give it another shot.";
  var h="<div class=\"rs\"><h2>"+(meta.topic||MN[meta.module]||meta.module)+"</h2>";
  h+="<div class=\"rs-s\">"+pct+"%</div><div class=\"rs-l\">"+score+" out of "+tot+" correct</div><div class=\"rs-m\">"+msg+"</div>";
  h+="<div class=\"rs-b\"><h3>Question Breakdown</h3>";
  for(var i=0;i<uAns.length;i++){
    var a=uAns[i],q=qzQ[i];
    h+="<div class=\"rr\"><span style=\"font-size:15px\">"+(a.ok?"&#10003;":"&#10007;")+"</span><span style=\"color:var(--tl);min-width:85px\">"+a.qid+"</span><span style=\"flex:1\">"+esc(q.topic)+" (L"+q.layer+")</span>";
    if(!a.ok)h+="<span style=\"color:var(--no);font-size:11px\">You: "+a.sel+" | Answer: "+a.cor+"</span>";
    h+="</div>";
  }
  h+="</div><div class=\"rs-a\"><button class=\"br\" onclick=\"startQ()\">Try Again</button><button class=\"bh\" onclick=\"goHome()\">Back to Modules</button></div></div>";
  document.getElementById("main").innerHTML=h;
}

function openStats(){
  var h=getH(),m=document.getElementById("sModal");m.classList.add("open");
  var tQ=h.length,tA=0,tC=0;
  for(var i=0;i<h.length;i++){tA+=h[i].total;tC+=h[i].score}
  var avg=tA?Math.round(tC/tA*100):0;
  var html="<div class=\"sg\"><div class=\"sx\"><div class=\"n\">"+tQ+"</div><div class=\"l\">Quizzes Taken</div></div><div class=\"sx\"><div class=\"n\">"+tA+"</div><div class=\"l\">Questions Answered</div></div><div class=\"sx\"><div class=\"n\">"+avg+"%</div><div class=\"l\">Average Score</div></div><div class=\"sx\"><div class=\"n\">"+tC+"</div><div class=\"l\">Total Correct</div></div></div>";
  if(h.length){
    html+="<h3 style=\"font-size:13px;color:var(--tl);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px\">Recent Quizzes</h3>";
    var recent=h.slice(-10).reverse();
    for(var i=0;i<recent.length;i++){
      var x=recent[i],d=new Date(x.date).toLocaleDateString("en-US",{month:"short",day:"numeric"});
      html+="<div class=\"hi\"><span style=\"font-weight:600;color:var(--tx)\">"+(x.topic||x.module)+"</span><span style=\"color:var(--gm);font-weight:700\">"+Math.round(x.score/x.total*100)+"%</span><span style=\"color:var(--tl);font-size:10px\">"+d+"</span></div>";
    }
    html+="<button class=\"cl\" onclick=\"if(confirm('Clear all progress?')){localStorage.removeItem('fta_quiz_history');closeSt();updStrk()}\">Clear History</button>";
  }else{
    html+="<p style=\"color:var(--tl);font-size:13px;text-align:center;padding:16px\">No quizzes taken yet!</p>";
  }
  document.getElementById("stC").innerHTML=html;
}
function closeSt(){document.getElementById("sModal").classList.remove("open")}

// Handle window resize to re-render charts
buildSB();renderHome();updStrk();
document.getElementById("sModal").addEventListener("click",function(e){if(e.target===this)closeSt()});

// ========== STUDENT NAME + LOGGING ==========
// Google Apps Script URL — replace with your deployed script URL
var SHEET_URL = "https://script.google.com/macros/s/AKfycbw8s2QlSQAMrM-L6U2BS0hIXY53RXLDv9VkKts52f9BP0Eun51S2aBX1w1EHa1_FSCO/exec";

var studentName = "";

function toTitleCase(s) {
  return s.replace(/\s+/g, " ").trim().toLowerCase().replace(/\b\w/g, function(c){ return c.toUpperCase(); });
}

function showNameModal() {
  var last = "";
  try { last = localStorage.getItem("fta_student_name") || ""; } catch(e) {}
  var overlay = document.createElement("div");
  overlay.className = "nm-overlay";
  overlay.id = "nameModal";
  overlay.innerHTML = '<div class="nm-box">' +
    '<h2>Welcome to FTA Pop Quiz</h2>' +
    '<p>Enter your name to get started. Your quiz results will be tracked so your instructor can follow your progress.</p>' +
    '<input class="nm-input" id="nmInput" type="text" placeholder="Your full name" value="' + last.replace(/"/g, '&quot;') + '" autocomplete="name" />' +
    '<div class="nm-err" id="nmErr"></div>' +
    '<button class="nm-go" id="nmGo" onclick="submitName()">Start Quizzing</button>' +
    '</div>';
  document.body.appendChild(overlay);
  var inp = document.getElementById("nmInput");
  inp.focus();
  inp.select();
  inp.addEventListener("keydown", function(e) { if (e.key === "Enter") submitName(); });
  // Disable button if empty
  function checkEmpty() {
    document.getElementById("nmGo").disabled = inp.value.trim().length < 2;
  }
  inp.addEventListener("input", checkEmpty);
  checkEmpty();
}

function submitName() {
  var raw = document.getElementById("nmInput").value.trim();
  if (raw.length < 2) {
    document.getElementById("nmErr").textContent = "Please enter your name (at least 2 characters)";
    return;
  }
  studentName = toTitleCase(raw);
  try { localStorage.setItem("fta_student_name", studentName); } catch(e) {}
  // Remove modal
  var m = document.getElementById("nameModal");
  if (m) m.remove();
  // Show name in header
  updateHeaderName();
}

function updateHeaderName() {
  var existing = document.getElementById("hdName");
  if (existing) existing.remove();
  if (!studentName) return;
  var span = document.createElement("span");
  span.className = "hd-name";
  span.id = "hdName";
  span.textContent = studentName;
  span.style.cursor = "pointer";
  span.title = "Click to change name";
  span.onclick = function() {
    studentName = "";
    span.remove();
    showNameModal();
  };
  document.querySelector(".hd-r").insertBefore(span, document.querySelector(".hd-r").firstChild);
}

function logToSheet(data) {
  if (!SHEET_URL || SHEET_URL.indexOf("script.google.com") === -1) return;
  try {
    var payload = {
      name: studentName,
      module: data.module,
      topic: data.topic || "All Topics",
      score: data.score,
      total: data.total,
      percent: Math.round(data.score / data.total * 100),
      layer: layerFilter ? layerFilter.join(",") : "All",
      date: new Date().toISOString(),
      details: JSON.stringify(data.answers.map(function(a) {
        return { qid: a.qid, picked: a.sel, correct: a.cor, ok: a.ok };
      }))
    };
    navigator.sendBeacon(SHEET_URL, new Blob([JSON.stringify(payload)], { type: "text/plain" }));
  } catch(e) { /* silent fail — don't disrupt quiz */ }
}

// Show name modal on load
showNameModal();
