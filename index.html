3,454.27,445.33,449.21],[449.47,454.4,448.92,454.39],[454.57,458.06,454.42,457.89],[457.93,458.4,455.85,455.98],[455.72,462.27,455.37,462.17],[462.17,462.54,459.37,459.91],[460.31,460.75,455.23,455.25],[454.93,458.54,454.41,458.43],[458.54,468.05,458.13,462.98],[463.41,469.96,461.78,469.51],[469.85,474.87,469.19,473.92],[474.16,480.93,471.8,471.81]],"pattern":"range_sr"}},{"module":"Module 4","topic":"Macro Drivers","layer":2,"id":"M4-MAC-003","status":"NEW","scenario":"Fed announcement: rate held steady at 5.25%, statement suggests potential cuts in coming meetings","question":"The Fed holds rates steady but hints at future cuts. How would you expect the market to react?","options":{"A":"Markets usually rally on dovish Fed signals \u2014 the expectation of lower rates ahead is bullish for equities because cheaper borrowing boosts corporate earnings and makes stocks more attractive vs bonds","B":"Markets sell off because holding rates means the Fed thinks the economy is too strong","C":"No impact \u2014 markets only react to actual rate changes, not forward guidance or dot plots","D":"Markets crash because rate cuts signal the economy is in serious trouble and recession is imminent"},"correct":"A","correctFeedback":"Markets are forward-looking. The hint of future cuts is often more powerful than the cut itself. Lower rates = cheaper borrowing, higher valuations, and money flowing from bonds into equities. 'Don't fight the Fed' works both ways.","incorrectFeedback":"The market prices in expectations, not just actions. Dovish language from the Fed signals easier monetary policy ahead, which typically supports equity valuations \u2014 even before the first cut happens.","chart":{"symbol":"AAPL","interval":"D","range":"6","candles":[[460,460.37,459.99,460.21],[460.64,463.39,460.62,463.05],[462.78,464.63,462.63,463.12],[463.43,463.58,461.33,462.44],[462.87,463.32,459.43,460.96],[461.05,462.8,460.76,462.43],[462.36,463.43,456.02,456.08],[456.52,458.1,456.2,457.86],[457.87,459.12,456.42,458.98],[458.67,458.72,458.43,458.48],[458.22,459.72,457.88,459.39],[459.75,462.58,458.07,462.43],[462.77,462.86,462.39,462.47],[462.82,463.08,461.21,461.57],[461.41,462.5,461.4,462.09],[462.45,462.53,458.17,459.02],[459.0,459.33,456.56,456.62],[456.9,460.59,456.65,459.86],[460.08,463.57,459.68,463.03],[463.43,465.92,463.43,465.4],[465.3,468.69,465.04,466.74],[467.17,469.59,463.59,463.69],[463.55,464.6,458.89,459.42],[459.31,459.74,453.08,453.86],[453.99,454.39,451.8,451.85],[451.42,455.78,449.96,455.71]],"pattern":"range_sr"}},{"module":"Module 4","topic":"Macro Drivers","layer":2,"id":"M4-MAC-004","status":"NEW","scenario":"CPI report: inflation comes in hotter than expected at 3.5% vs 3.2% consensus","question":"CPI (inflation) prints hotter than expected. What's the typical market reaction and why?","options":{"A":"Stocks rally because higher inflation means the economy is strong and growing robustly","B":"No impact \u2014 CPI data is backward-looking and the market has already priced it in before the release","C":"Stocks tend to sell off initially because hotter inflation reduces the likelihood of near-term rate cuts, keeping monetary policy tighter for longer","D":"Only bond markets react to CPI data \u2014 equities are completely driven by earnings, not inflation"},"correct":"C","correctFeedback":"Hot CPI = rates stay higher for longer = headwind for stocks. The market's reaction to CPI is really about what it means for Fed policy. Higher inflation delays rate cuts, which keeps borrowing costs elevated and makes bond yields more competitive vs equities.","incorrectFeedback":"The market cares about inflation because of its impact on Fed policy. Hotter-than-expected CPI pushes back rate cut expectations, which is bearish for equities in the near term. Watch the bond market's reaction for confirmation.","chart":{"symbol":"AAPL","interval":"D","range":"6","candles":[[475,475.7,470.31,471.27],[471.15,471.62,468.99,469.1],[469.2,469.32,467.34,467.59],[467.75,468.27,467.06,467.16],[467.38,468.26,467.36,468.24],[468.57,468.72,464.47,465.45],[465.72,466.71,465.65,466.52],[466.62,470.93,466.4,469.79],[469.8,470.73,459.43,465.58],[465.34,465.62,461.14,463.19],[463.41,464.42,458.75,459.5],[459.85,459.89,457.11,457.12],[457.48,458.07,457.47,458.04],[457.67,462.68,456.98,461.29],[461.16,461.4,456.84,457.22],[457.04,457.59,452.96,453.42],[453.55,453.99,448.56,450.32],[449.89,452.45,447.48,447.63],[447.73,448.77,445.32,448.69]],"pattern":"range_sr"}},{"module":"Module 4","topic":"Macro Drivers","layer":3,"id":"M4-MAC-005","status":"NEW","scenario":"Scenario: unemployment rising, inflation falling, Fed signaling rate cuts, earnings declining","question":"You see unemployment rising, inflation falling, the Fed signaling cuts, and earnings declining. What phase of the economic cycle does this suggest, and how does it affect your trading?","options":{"A":"This describes late-cycle or early recession conditions. Defensive positioning: reduce risk exposure, favor quality over speculation, and watch for the eventual pivot to recovery when the Fed's cuts start stimulating growth.","B":"This is early recovery \u2014 start buying aggressively since the worst is behind us","C":"This is peak expansion \u2014 load up on growth stocks because all the signals are bullish","D":"Ignore macro entirely \u2014 just follow the technical levels on your charts and trade what you see"},"correct":"A","correctFeedback":"Macro context frames your risk appetite. Rising unemployment + falling inflation + Fed cuts + declining earnings = late cycle. This doesn't mean stop trading \u2014 it means favor quality, reduce size, and be selective. The opportunity comes when the cycle turns, and being aware of where you are helps you catch it.","incorrectFeedback":"These macro signals together suggest a slowing economy. The Fed cutting into declining earnings is typical of late-cycle dynamics. Adjust position sizing, favor defensive sectors, and start watching for signs of a macro bottom.","chart":{"symbol":null,"candles":null}},{"module":"Module 4","topic":"Seasonality & Cycles","layer":3,"id":"M4-MAC-006","status":"NEW","scenario":"Chart showing VIX term structure and SPX during October \u2014 historically volatile month","question":"October historically has higher volatility. How should this seasonal awareness change your approach?","options":{"A":"Avoid trading entirely in October since the risk of a crash is too high based on historical precedent","B":"Trade exactly the same as any other month \u2014 seasonality has no impact on individual stock setups","C":"Double your position sizes because October dips are always buying opportunities that recover quickly","D":"Adjust position sizing slightly smaller, tighten stops, and be prepared for wider swings \u2014 don't avoid the market, but respect the seasonal tendency for increased volatility"},"correct":"D","correctFeedback":"Seasonality is about adjusting your approach, not sitting out. October's higher volatility means wider daily ranges, more gap risk, and sharper reversals. Trade with smaller size, tighter risk, and expect the unexpected. Some of the best opportunities come from October panic.","incorrectFeedback":"Seasonal awareness is risk management. October volatility doesn't mean don't trade \u2014 it means be prepared for larger swings. Tighter stops, smaller size, and mental preparation for whipsaw moves will serve you well.","chart":{"symbol":"AAPL","interval":"D","range":"6","candles":[[435,436.36,434.76,436.29],[436.44,436.78,436.42,436.74],[436.44,436.46,436.23,436.25],[435.92,437.34,435.78,437.07],[437.37,439.16,436.19,439.12],[439.24,439.32,437.7,438.56],[438.73,439.11,437.18,437.44],[437.66,437.76,436.92,436.94],[436.57,437.03,429.53,429.59],[429.5,430.25,429.44,430.21],[430.19,433.66,429.84,433.3],[433.16,441.44,432.58,441.16],[440.77,441.24,437.49,437.61],[437.88,440.23,437.71,439.87],[439.45,440.24,428.01,428.05],[428.3,437.54,422.81,436.89],[436.88,446.13,436.84,445.66],[445.28,453.99,438.57,438.58],[438.58,438.61,431.17,432.28],[432.54,432.88,429.04,429.23],[429.56,430.47,425.53,428.28]],"pattern":"range_sr"}},{"module":"Module 5","topic":"Multi-Tool Analysis","layer":1,"id":"M5-MTA-001","status":"NEW","scenario":"NVDA daily: price at resistance ($947), RSI showing bearish divergence after peaking at 72, bearish engulfing candle forming","question":"Look at this chart carefully. How many bearish signals are present?","options":{"A":"One \u2014 only the candlestick pattern counts since it's the most recent data point on the chart","B":"Two \u2014 the bearish engulfing and resistance, but RSI doesn't matter here","C":"Four \u2014 each signal is independent and there's also a fourth signal from the volume profile","D":"Three \u2014 price at resistance, RSI bearish divergence (RSI made a lower high while price made a higher high), and a bearish engulfing candle are all converging at the same time"},"correct":"D","correctFeedback":"Confluence \u2014 three independent bearish signals at once. Price is stalling at resistance, the RSI peaked earlier and is now making a lower high even as price pushes higher (bearish divergence \u2014 momentum is fading), and a bearish engulfing candle confirms sellers stepping in. Each one alone is moderate. Together, they stack conviction.","incorrectFeedback":"Count the signals: (1) price at resistance, (2) RSI bearish divergence \u2014 RSI peaked at the earlier high and is now lower even though price is higher, meaning momentum is weakening, (3) bearish engulfing candle. When multiple independent tools agree, the probability of a reversal goes up.","chart":{"symbol":"NVDA","interval":"D","range":"6","candles":[[880,881.56,878.58,881.31],[882.03,888.08,882.02,885.18],[885.68,887.11,884.55,887.08],[886.25,894.25,886.05,888.05],[887.71,888.09,884.26,884.37],[885.03,886.57,879.73,884.22],[883.97,891.68,883.01,890.0],[889.65,889.65,888.1,888.91],[888.09,891.8,888.05,891.67],[892.19,898.25,891.77,897.09],[897.53,900.44,897.19,899.58],[899.9,900.14,897.28,897.88],[897.46,897.83,894.5,894.58],[894.15,895.58,894.13,895.33],[894.71,902.12,894.01,900.86],[900.91,907.11,900.07,906.13],[906.81,906.86,906.06,906.45],[905.98,915.39,904.73,915.29],[914.95,915.02,911.0,911.72],[911.78,912.93,907.61,907.85],[908.14,908.39,907.15,908.35],[909.0,913.38,908.88,912.96],[913.08,913.3,907.76,910.82],[911.08,914.93,910.52,914.67],[915.15,915.5,912.64,912.94],[913.43,929.93,910.2,929.92],[929.51,929.94,926.55,927.11],[926.48,929.31,925.92,928.66],[928.65,929.2,922.11,922.11],[922.58,923.86,922.4,923.57],[923.86,927.58,920.53,927.44],[926.7,931.29,924.48,931.15],[930.57,937.95,930.39,937.78],[937.98,947.2,937.68,946.7],[947.0,947.3,934.44,934.94]],"pattern":"bullish_engulfing","overlays":{"srLines":[{"price":947,"label":"Resistance","color":"#ef5350"}],"rsi":{"values":[40.0,44.0,48.0,45.0,42.0,45.37,51.63,55.0,51.0,47.0,49.85,55.15,58.0,54.0,50.0,50.37,51.4,52.97,54.97,57.26,59.73,62.27,64.74,67.03,69.03,70.6,71.63,72.0,66.0,60.0,61.3,63.7,65.0,66.0,58.0],"period":14}},"highlightLast":2}},{"module":"Module 5","topic":"Multi-Tool Analysis","layer":2,"id":"M5-MTA-002","status":"NEW","scenario":"TSLA daily: price approaching resistance (~$258), RSI neutral around 52, small green candle on below-average volume","question":"Price is approaching resistance but RSI is neutral around 52 and volume is below average. How do you read this setup?","options":{"A":"Buy immediately \u2014 price is near resistance so it must be about to break through","B":"This move up lacks conviction. RSI isn't confirming strong momentum and volume is weak. Without those confirmations, this push toward resistance is more likely to stall or fail. Wait for follow-through before committing.","C":"Sell short because the move will definitely fail without volume support behind it","D":"RSI at 52 is bullish enough to confirm the move since it's above the 50 midline"},"correct":"B","correctFeedback":"Not all moves toward resistance are worth trading. This one lacks conviction \u2014 volume is below average and RSI is neutral, meaning momentum isn't behind the move. The strongest pushes through resistance have a volume surge, RSI trending higher, and strong candle bodies. Missing those = watch and wait, don't chase.","incorrectFeedback":"Quality matters. Price approaching resistance is step one, but confirmation from volume and momentum is what makes it tradeable. Without those, you're buying into a move that's more likely to stall. Patience pays.","chart":{"symbol":"TSLA","interval":"D","range":"6","candles":[[235,235.35,231.41,233.26],[233.47,233.79,233.4,233.78],[233.96,234.38,229.51,232.04],[231.82,232.28,229.81,230.06],[229.84,230.74,229.81,230.28],[230.45,230.67,228.08,228.44],[228.42,231.33,228.2,231.15],[231.38,235.64,230.34,235.63],[235.75,240.6,232.81,239.77],[239.92,248.23,238.3,248.12],[248.07,248.8,244.71,245.34],[245.16,245.54,237.38,242.04],[241.9,242.1,231.21,232.8],[232.59,237.01,232.13,236.93],[236.98,238.57,226.14,232.93],[232.74,241.36,231.55,240.42],[240.51,246.19,239.88,245.01],[245.17,245.22,243.71,243.89],[243.98,246.81,243.77,246.29],[246.18,251.29,246.12,246.25],[246.48,246.66,242.81,243.2],[243.34,244.27,236.18,236.51],[236.72,237.02,232.25,233.0],[233.23,234.84,229.62,234.79],[234.88,243.75,234.8,243.02],[243.23,243.73,239.08,239.29],[239.1,239.2,237.86,238.05],[237.97,243.77,236.81,242.86],[242.95,250.75,242.6,249.95],[250.1,250.3,245.24,247.8],[247.66,249.22,245.02,245.32],[245.13,245.21,242.33,242.35],[242.58,243.89,242.45,243.87],[244.03,245.16,243.14,244.93],[245.0,248.84,241.27,248.56],[248.46,248.53,247.48,247.68],[247.84,254.13,247.09,254.09],[254.17,255.03,254.01,254.86],[254.67,255.45,254.52,255.25]],"pattern":"uptrend","overlays":{"srLines":[{"price":257.7,"label":"Resistance","color":"#ef5350"},{"price":230,"label":"Support","color":"#26a69a"}],"rsi":{"values":[52.0,54.07,57.93,60.0,54.0,48.0,51.89,59.11,63.0,58.59,50.41,46.0,49.11,54.89,58.0,54.63,48.37,45.0,49.41,57.59,62.0,58.11,50.89,47.0,49.07,52.93,55.0,54.79,54.22,53.42,52.5,51.58,50.78,50.21,50.0,53.0,56.0,54.0,52.0],"period":14}}}},{"module":"Module 5","topic":"Risk Management","layer":2,"id":"M5-MTA-003","status":"NEW","scenario":"Scenario: student has $10,000 account, wants to risk 5% per trade on a volatile biotech stock","question":"A student with a $10,000 account wants to risk 5% ($500) per trade on a volatile biotech. What guidance would you give them about position sizing?","options":{"A":"5% per trade is fine for a small account since you need larger positions to grow the account quickly","B":"Risk 10% per trade instead \u2014 with a small account, you need to be aggressive to see meaningful returns","C":"The 1-2% rule is standard: risk no more than 1-2% of your account per trade. At $10K, that's $100-$200 max risk. On a volatile biotech, that means an even smaller position size to account for wider stop placement.","D":"Position sizing doesn't matter as long as you have a stop loss in place to limit your downside"},"correct":"C","correctFeedback":"The 1-2% rule exists for a reason: survival. At 5% risk per trade, 10 consecutive losers (which happens) = 50% drawdown. At 1% per trade, the same losing streak = 10% drawdown. You can recover from 10%. Recovering from 50% requires a 100% return. Risk management IS the edge.","incorrectFeedback":"Risking 5% per trade on a volatile stock can destroy an account fast. The 1-2% rule ensures you survive losing streaks. Position sizing based on volatility (wider stops = smaller position) keeps your dollar risk consistent.","chart":{"symbol":null,"candles":null}},{"module":"Module 5","topic":"Risk Management","layer":3,"id":"M5-MTA-004","status":"NEW","scenario":"Full analysis scenario: AMZN daily with all tools available \u2014 S/R, RSI, candlesticks, and macro context","question":"Walk through how you'd analyze AMZN for a potential trade using everything you've learned. What's your checklist?","options":{"A":"Start with macro context (is the broad market bullish?), then identify S/R levels on the chart, check RSI for momentum and potential divergence, look for candlestick confirmation at key levels, then set your entry, stop, and target based on risk management rules.","B":"Only look at candlestick patterns since they contain all the information you need about buyer/seller dynamics","C":"Just check RSI \u2014 if it's oversold, buy. If it's overbought, sell. Keep it simple and don't overcomplicate the process.","D":"Start with the 1-minute chart for precision entries, then zoom out to confirm with the daily chart afterward"},"correct":"A","correctFeedback":"The complete checklist: (1) Macro \u2014 is the environment favorable? (2) S/R \u2014 where are the key levels? (3) RSI \u2014 what's momentum doing? Any divergence? (4) Candlesticks \u2014 is there a confirming pattern at a key level? (5) Risk management \u2014 entry, stop, target, position size. This is how you layer every module together into a complete trading process.","incorrectFeedback":"This is where it all comes together. You don't use these tools in isolation \u2014 you build a case. Each tool either confirms or contradicts. The more tools that agree, the higher your conviction. And risk management is ALWAYS the final step before execution.","chart":{"symbol":null,"candles":null}},{"module":"Module 5","topic":"Multi-Tool Analysis","layer":3,"id":"M5-MTA-005","status":"NEW","scenario":"Scenario: your technical analysis says buy, but the macro environment is deteriorating (rising rates, earnings declining)","question":"Your chart setup looks perfect \u2014 bullish divergence at support with a hammer candle. But the macro picture is bearish (rising rates, falling earnings). What do you do?","options":{"A":"Always trust your charts over macro \u2014 technicals are real-time while macro data is lagging and already priced in","B":"Never trade against the macro environment regardless of how good the technical setup looks on your chart","C":"Take the trade but with reduced conviction \u2014 smaller position size, tighter stop, quicker profit target. The technical setup is valid but the macro headwind means you should expect less follow-through.","D":"Wait exactly 30 days for the macro picture to improve before considering any new long positions"},"correct":"C","correctFeedback":"This is the art of trading. A great technical setup in a bad macro environment can still work \u2014 but the odds are lower and the reward may be capped. Reduce size, take quicker profits, and respect that the wind is in your face. You don't need to choose one or the other \u2014 you adjust.","incorrectFeedback":"When technicals and macro conflict, adjust your expectations and risk. The setup may work, but treat it as a lower-probability trade. Smaller size and tighter management account for the macro headwind.","chart":{"symbol":null,"candles":null}},{"module":"Module 6","topic":"Options Basics","layer":1,"id":"M6-OPT-001","status":"NEW","scenario":"Options chain for AAPL: calls on left, puts on right, various strike prices and expirations","question":"What does buying a call option give you the right (but not obligation) to do?","options":{"A":"Sell 100 shares of the stock at the strike price before the expiration date","B":"Buy 100 shares of the stock at the strike price before expiration \u2014 you profit if the stock rises above the strike plus the premium you paid","C":"Short the stock at the current market price with unlimited downside protection built in","D":"Collect premium income from other traders who want to buy your shares at a set price"},"correct":"B","correctFeedback":"A call = the right to BUY at the strike price. You pay a premium for this right. Your max loss is the premium. Your profit potential is unlimited above the strike + premium. Calls are bullish bets with defined risk.","incorrectFeedback":"Buying a call gives you the right to purchase the stock at a specific price (strike) before a specific date (expiration). You're betting the stock goes up. Your risk is limited to the premium you paid.","chart":{"symbol":null,"candles":null}},{"module":"Module 6","topic":"Options Basics","layer":1,"id":"M6-OPT-002","status":"NEW","scenario":"Options chain for AAPL: calls on left, puts on right, various strike prices and expirations \u2014 Same options chain \u2014 comparison of in-the-money, at-the-money, and out-of-the-money calls","question":"AAPL is trading at $190. A $180 call, a $190 call, and a $200 call are available. Which one is 'in the money'?","options":{"A":"The $190 call \u2014 at-the-money options are considered in the money because they can be exercised immediately","B":"The $200 call \u2014 it has the highest strike and therefore commands the most premium from buyers","C":"The $180 call \u2014 it's in the money because the stock price ($190) is already above the strike price ($180), giving the option intrinsic value","D":"All three are in the money since the stock is actively trading and the options haven't expired yet"},"correct":"C","correctFeedback":"In the money = the option has intrinsic value right now. The $180 call is ITM because you could exercise it to buy at $180 and the stock is at $190 \u2014 that's $10 of built-in value. The $190 call is at the money. The $200 call is out of the money.","incorrectFeedback":"A call is 'in the money' when the stock price is above the strike price. At $190 stock price, the $180 strike call has $10 of intrinsic value \u2014 you could buy at $180 something worth $190.","chart":{"symbol":null,"candles":null}},{"module":"Module 6","topic":"Options Basics","layer":1,"id":"M6-OPT-003","status":"NEW","scenario":"Options chain showing put options \u2014 TSLA at $250 with $240, $250, and $260 puts listed","question":"What does buying a put option give you the right to do?","options":{"A":"Buy 100 shares at the strike price and hold them until the stock recovers above your purchase price","B":"Collect dividends from the underlying stock without actually owning the shares outright","C":"Force the option seller to buy your shares back at the strike price at any time before expiration","D":"Sell 100 shares at the strike price before expiration \u2014 you profit if the stock falls below the strike minus the premium you paid"},"correct":"D","correctFeedback":"A put = the right to SELL at the strike price. Puts are bearish bets or hedges. You profit when the stock drops below your strike minus the premium. Max loss = the premium paid. Puts are the mirror image of calls.","incorrectFeedback":"Buying a put gives you the right to sell at a specific price. If the stock drops, your put becomes more valuable because you can sell at a higher price than the market. It's like insurance for your portfolio.","chart":{"symbol":null,"candles":null}},{"module":"Module 6","topic":"Options Basics","layer":1,"id":"M6-OPT-004","status":"NEW","scenario":"Options chain showing premium prices: AAPL $190 call expiring in 1 week = $3.20, same call expiring in 6 weeks = $7.80","question":"The $190 call expiring in 1 week costs $3.20 but the same strike expiring in 6 weeks costs $7.80. Why does the longer-dated option cost more?","options":{"A":"More time until expiration = more time for the stock to move in your favor. You're paying for that extra time, which is called 'time value' or 'extrinsic value.'","B":"The longer-dated option costs more because of higher brokerage commissions on contracts with later expirations","C":"It's a pricing error \u2014 both should cost the same since they have identical strike prices and underlying stock","D":"Longer-dated options cost more because they pay higher dividends to the option holder over time"},"correct":"A","correctFeedback":"Time = money in options. More time until expiration means more opportunity for the stock to move past your strike. That extra possibility has a price \u2014 time value. As expiration approaches, time value evaporates (theta decay). This is why longer-dated options cost more.","incorrectFeedback":"The difference in price between these two options is almost entirely time value. The extra 5 weeks give the stock more time to move, which makes the option more valuable. As options approach expiration, time value shrinks \u2014 this is theta decay.","chart":{"symbol":null,"candles":null}},{"module":"Module 6","topic":"Greeks","layer":1,"id":"M6-OPT-005","status":"NEW","scenario":"Options chain with delta values shown: ITM call delta 0.75, ATM call delta 0.50, OTM call delta 0.20","question":"What does an option's 'delta' of 0.50 tell you in practical terms?","options":{"A":"The option has a 50% probability of doubling in value before expiration based on historical averages","B":"For every $1 the stock moves, the option price changes by approximately $0.50 \u2014 delta measures how much the option moves relative to the stock","C":"The option is exactly halfway between profitable and unprofitable at this moment in time","D":"Delta of 0.50 means the option will expire in exactly 50 days from the purchase date"},"correct":"B","correctFeedback":"Delta is your options speedometer. A delta of 0.50 means the option gains ~$0.50 for every $1 the stock moves in your favor. ATM options are around 0.50, ITM options have higher delta (closer to 1.0), and OTM options have lower delta. Delta also roughly estimates the probability the option expires ITM.","incorrectFeedback":"Delta tells you how sensitive the option price is to stock movement. At 0.50, your option moves about half as much as the stock. It's also a rough probability gauge \u2014 a 0.50 delta call has roughly a 50% chance of expiring in the money.","chart":{"symbol":null,"candles":null}},{"module":"Module 7","topic":"Emotional Discipline","layer":1,"id":"M7-PSY-001","status":"NEW","scenario":"Scenario: you just had three losing trades in a row and feel the urge to 'make it back' on the next trade","question":"After three consecutive losses, you feel the urge to size up on your next trade to recover the losses quickly. What is this behavior called?","options":{"A":"Smart risk management \u2014 increasing size after losses ensures you recover your account balance faster","B":"Revenge trading \u2014 the emotional desire to 'make it back' leads to oversized positions, abandoned rules, and usually bigger losses","C":"Dollar-cost averaging \u2014 adding to your position during drawdowns is a proven long-term wealth-building strategy","D":"Mean reversion trading \u2014 after a losing streak, the probability of your next trade being a winner increases statistically"},"correct":"B","correctFeedback":"Revenge trading is one of the fastest ways to blow up an account. After losses, your judgment is compromised by emotion. The correct move: step away, review your trades objectively, and when you return, trade SMALLER not larger. The market doesn't owe you anything.","incorrectFeedback":"This is revenge trading \u2014 acting from emotion rather than analysis. The urge to 'get it back' leads to breaking rules. After a losing streak, reduce size or take a break. The market will still be there tomorrow.","chart":{"symbol":null,"candles":null}},{"module":"Module 7","topic":"Emotional Discipline","layer":1,"id":"M7-PSY-002","status":"NEW","scenario":"Scenario: a hot stock tip from social media \u2014 everyone is buying and the stock is up 30% today","question":"A stock is up 30% today and social media is going crazy about it. You feel intense pressure to buy before you 'miss the move.' What's happening psychologically?","options":{"A":"FOMO \u2014 Fear Of Missing Out. The social proof of others buying and the price surge creates urgency that bypasses your trading plan and analytical process.","B":"This is healthy market awareness \u2014 staying plugged into social sentiment is essential for modern trading success","C":"The stock going up 30% confirms it's a strong company with improving fundamentals worth buying at any price","D":"Buying after a 30% move is a proven momentum strategy that professional traders use consistently for reliable returns"},"correct":"A","correctFeedback":"FOMO is the market's oldest trap. By the time something is all over social media and up 30%, the easy money has been made. The people posting gains bought earlier. Ask yourself: does this fit MY trading plan? If not, it's not your trade. There will always be another opportunity.","incorrectFeedback":"FOMO causes you to buy when excitement peaks \u2014 which is often near the top. Professional traders are often selling into the excitement that retail is chasing. Stick to your process. If you didn't analyze it before the move, don't chase it during.","chart":{"symbol":null,"candles":null}},{"module":"Module 7","topic":"Trading Plan","layer":2,"id":"M7-PSY-003","status":"NEW","scenario":"Scenario: your analysis says hold, but the stock drops 3% intraday and you're watching it in real time","question":"Your analysis says hold \u2014 your stop hasn't been hit and nothing has changed technically. But the stock drops 3% intraday and you're watching every tick. You feel the urge to sell. What should you do?","options":{"A":"Close your trading platform and check back at the end of the day. Intraday noise tests your conviction. If your thesis, stop, and target are still intact, the 3% move is just volatility \u2014 not a reason to abandon your plan.","B":"Sell immediately \u2014 a 3% intraday drop means your analysis was wrong and you should cut the loss now","C":"Move your stop loss closer to current price so the next small dip takes you out with a smaller loss","D":"Add to your position since the dip makes your entry price better on average and increases your upside"},"correct":"A","correctFeedback":"The biggest enemy of a good trade is watching it too closely. Intraday swings are noise. Your analysis happens on a timeframe \u2014 trust it. If you set your stop based on analysis, the only reason to sell before the stop is if the THESIS changes, not if the price wiggles.","incorrectFeedback":"This is where discipline separates traders from gamblers. Your plan was set before the trade. Intraday movement doesn't change your analysis. If your stop is intact and your thesis is intact, the plan is intact. Stop watching every tick.","chart":{"symbol":null,"candles":null}},{"module":"Module 7","topic":"Trading Plan","layer":2,"id":"M7-PSY-004","status":"NEW","scenario":"Scenario: you're in a winning trade, up 8%, and your target was 10% \u2014 but you're tempted to take profits early","question":"Your plan says target 10% profit but you're up 8% and want to take it. What's the right framework for this decision?","options":{"A":"Always take profits when you have them \u2014 an 8% gain today is better than waiting for 10% that might never come","B":"Has anything changed in your technical setup? If S/R, RSI, and candle structure still support the move to your target, stick with the plan. If new resistance has appeared or momentum is weakening, taking partial profits is reasonable. Let the chart decide, not your emotions.","C":"Never sell before your target \u2014 moving the goalposts means your trading plan is meaningless and undisciplined","D":"Double your position size since the trade is working and add more exposure to maximize the winner"},"correct":"B","correctFeedback":"This is the tension between greed and discipline. The answer isn't always 'hold to target' \u2014 it's 'has anything changed?' If the chart still supports 10%, let it run. If a new resistance level or bearish candle appeared, taking partial profits is smart adaptation, not weakness.","incorrectFeedback":"Your plan is based on analysis, not emotion. Check the chart: is the path to your target still clear? If yes, hold. If new technical obstacles have appeared (resistance, divergence, reversal candle), it's reasonable to adjust. The chart, not your feelings, should guide the decision.","chart":{"symbol":null,"candles":null}},{"module":"Module 7","topic":"Self-Awareness","layer":3,"id":"M7-PSY-005","status":"NEW","scenario":"Scenario: reviewing your trade journal, you notice you consistently exit winners too early and hold losers too long","question":"Your trade journal shows a clear pattern: you cut winners short and let losers run. What psychological bias explains this, and how do you fix it?","options":{"A":"Loss aversion \u2014 the pain of losing is psychologically stronger than the pleasure of gaining. Fix it by committing to mechanical rules: set stops and targets BEFORE entering, and journal every time you override your plan so you can see the cost of emotional decisions.","B":"It's caused by using the wrong indicators \u2014 switch from RSI to MACD and the pattern will correct itself naturally","C":"This pattern is actually optimal \u2014 protecting gains and giving losers room to recover is sound risk management","D":"You're simply not skilled enough yet \u2014 this problem goes away with more screen time and trading experience"},"correct":"A","correctFeedback":"Loss aversion is one of the most well-documented biases in behavioral finance. We feel losses ~2x more intensely than equivalent gains. The fix: mechanical rules. Pre-set stops and targets remove the emotion from the decision. Your journal is already the most powerful tool \u2014 it shows you the pattern. Now use rules to break it.","incorrectFeedback":"This is classic loss aversion. The solution is rules-based trading: set your stop and target before you enter, then let the trade play out. Your journal revealed the pattern \u2014 now build systems that prevent the emotional override. Track your 'plan adherence' rate alongside your P/L.","chart":{"symbol":null,"candles":null}},{"module":"Module 1","topic":"Support & Resistance","layer":3,"id":"M1-SR-016","status":"NEW","scenario":"AAPL daily \u2014 price breaks above $200 resistance with strong volume, pulls back to $200, and bounces higher on a successful retest.","question":"A student says: 'The $200 level has flipped from resistance to support.' Is the student correct about the level flipping?","options":{"A":"No \u2014 a level is either support or resistance permanently; it cannot change roles once established","B":"Yes \u2014 this is called polarity (or role reversal). Broken resistance becomes support because buyers who missed the breakout now see $200 as a buying opportunity on the pullback. The strong-volume break plus a successful retest adds conviction that the flip is real.","C":"Only if the bounce holds for at least five trading days \u2014 one bounce is not enough to confirm the flip","D":"The level flipped, but only temporarily \u2014 it will revert to resistance within a few weeks"},"correct":"B","correctFeedback":"This is a textbook example of polarity (role reversal). When price breaks above resistance with conviction (strong volume), that old resistance often becomes new support. Why? Buyers who missed the breakout see the pullback as a second chance to enter, creating demand at the level. The successful retest \u2014 price touching $200 and bouncing \u2014 confirms the flip. The combination of a high-volume breakout and a successful retest is the strongest confirmation of polarity.","incorrectFeedback":"Think about who's buying at $200 after the breakout. Traders who missed the move up now see $200 as a deal \u2014 their buying creates new support at the old resistance. This concept is called polarity or role reversal, and it's one of the most reliable patterns in technical analysis. Look for strong volume on the break and a successful retest to confirm the flip.","chart":{"symbol":"AAPL","interval":"D","candles":[[190,190.45,189.94,190.35],[190.3,191.87,190.29,191.12],[190.93,191.13,190.93,191.09],[191.06,191.21,190.47,190.53],[190.52,190.62,190.09,190.11],[189.99,190.4,189.94,190.36],[190.2,191.13,190.18,191.07],[191.12,194.97,191.01,194.89],[194.73,195.03,194.09,194.17],[193.98,194.01,192.66,192.95],[193.08,194.63,191.77,192.0],[192.09,192.28,190.82,192.19],[192.17,194.57,191.82,194.1],[194.17,194.18,193.82,193.9],[193.92,195.96,193.87,195.61],[195.57,195.68,194.77,194.94],[195.12,197.71,194.75,197.7],[197.65,197.72,197.22,197.26],[197.33,197.94,195.96,196.15],[196.27,196.77,192.41,193.8],[193.66,195.09,193.53,194.54],[194.45,197.49,194.21,195.87],[195.99,197.99,194.0,197.72],[197.77,197.78,196.98,197.03],[196.86,200.83,196.61,198.57],[198.6,200.17,198.43,199.96],[200.1,202.29,199.89,201.97],[202.02,206.2,201.92,204.68],[204.73,206.15,204.33,206.06],[205.97,207.14,204.61,204.75],[204.94,204.99,203.71,204.43],[204.52,204.65,203.82,203.97],[204.09,204.28,201.49,202.88],[203.04,203.49,202.52,203.42],[203.53,205.05,200.45,200.5],[200.55,200.83,200.54,200.77],[200.79,202.11,200.71,201.6],[201.63,203.39,201.4,203.24]]}},{"module":"Module 1","topic":"Candlestick Patterns","layer":2,"id":"M1-CS-014","status":"NEW","scenario":"NVDA daily \u2014 stock has been in a downtrend for several weeks, then prints a large bullish engulfing candle right at $820 support with heavy volume well above the recent average.","question":"How would you trade this bullish engulfing candle at $820 support?","options":{"A":"Enter immediately at market open the next day with a stop at $750 \u2014 the engulfing pattern guarantees a reversal so a wide stop is fine","B":"Wait for next-day follow-through, then enter near the engulfing close or on a pullback to the engulfing midpoint. Place stop below the engulfing low / $820 support. The heavy volume plus location at a key support level significantly increases the pattern's reliability.","C":"Ignore the pattern entirely \u2014 single candlestick patterns are unreliable and never worth trading","D":"Short the stock because the downtrend is still in effect \u2014 one candle cannot reverse a trend"},"correct":"B","correctFeedback":"A bullish engulfing at support with heavy volume is one of the higher-probability candlestick setups. The smart approach: wait for next-day follow-through (confirming buyers are still in control), enter near the engulfing close or on a pullback to its midpoint, and set your stop just below the engulfing low or the $820 support zone. Three factors boost reliability here: (1) the pattern appears at a key support level, (2) volume is well above average showing strong participation, and (3) the engulfing body is large, showing decisive buying. Always wait for confirmation rather than jumping in blindly.","incorrectFeedback":"Consider three things when trading candlestick patterns: location (is it at a key level?), volume (is participation strong?), and confirmation (does the next candle follow through?). This engulfing appears at support with heavy volume \u2014 that's two out of three. The missing piece is next-day follow-through. Enter after confirmation, place your stop below the pattern low, and the risk-reward setup becomes much cleaner.","chart":{"symbol":"NVDA","interval":"D","candles":[[850,850.52,846.35,847.04],[847.4,847.55,844.53,845.09],[844.47,849.85,843.31,849.34],[850.06,851.21,834.92,835.22],[835.96,836.7,832.76,832.91],[832.29,834.46,821.69,822.37],[821.63,826.39,816.71,826.2],[826.95,827.43,820.39,820.6],[820.5,823.4,820.42,822.82],[822.31,826.46,821.36,825.7],[825.08,827.9,822.48,827.6],[826.86,830.77,826.48,830.65],[831.19,839.67,830.47,839.45],[840.01,840.89,839.95,840.87],[840.73,842.5,838.61,838.98],[838.99,841.59,838.79,840.06],[840.73,855.63,839.43,855.38],[856.13,856.71,851.21,852.24],[851.78,852.39,845.58,846.94],[846.97,848.01,839.23,844.5],[844.66,846.91,844.61,846.82],[846.4,849.93,846.25,849.64],[849.4,855.02,848.59,854.8],[854.98,860.52,854.65,860.41],[860.3,860.67,826.51,843.94],[844.7,848.11,844.62,848.01],[847.46,847.93,842.24,844.13],[843.35,844.09,837.65,839.95],[840.06,840.63,837.07,837.21],[836.5,837.74,835.67,837.7],[837.06,837.25,833.63,834.02],[834.67,835.22,831.52,831.56],[831.36,832.31,824.61,824.84],[825.14,825.54,822.14,822.64],[820.64,834.54,820.14,833.54]],"volume":[1470487,916739,826225,1088389,1056787,1034053,946316,907473,1371858,891161,1419176,1242417,833326,831244,898246,1029258,1043962,1329903,1431262,827824,1388508,1008496,1481453,1371412,1239898,1031148,1271029,1417889,1091704,806814,967414,1243143,1156778,1312886,4300581],"overlays":{"lines":[{"values":[820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820,820],"color":"#ff9800","label":"$820 Support","width":1,"style":"dashed"}]}}},{"module":"Module 1","topic":"Candlestick Patterns","layer":3,"id":"M1-CS-015","status":"NEW","scenario":"META daily \u2014 stock has been in a strong uptrend for weeks, making higher highs and higher lows. A doji candle forms mid-trend, away from any obvious resistance level.","question":"A student says: 'A doji means indecision, which means reversal is coming.' Is the student's reasoning sound?","options":{"A":"Yes \u2014 a doji always signals reversal regardless of where it forms, so the student should prepare to short immediately","B":"No \u2014 a doji mid-trend in a strong uptrend is often just a pause or rest day, not a reversal signal. Dojis are far more meaningful at resistance levels after extended moves, and they still require confirmation from the next candle. One doji mid-trend does not equal reversal.","C":"The student is partially right \u2014 the doji means indecision, but they should wait exactly three days to see if it becomes a reversal","D":"Dojis are only relevant on weekly charts; on the daily chart they have no significance at all"},"correct":"B","correctFeedback":"The student's mistake is applying a blanket rule ('doji = reversal') without considering context. A doji does show indecision for that single session, but context matters enormously. Mid-trend dojis in a strong uptrend are often just brief pauses \u2014 the trend resumes the next day. Dojis become much more significant when they appear: (1) at a key resistance level, (2) after an extended move, and (3) with confirmation from the next candle (e.g., a bearish candle closing below the doji's low). One doji in the middle of a healthy trend is rarely a reversal signal.","incorrectFeedback":"Context is everything with candlestick patterns. Ask: Where did the doji form? (mid-trend vs. at resistance) How extended is the move? (fresh trend vs. overextended) What does the next candle do? A doji at resistance after a long run-up is significant. A doji mid-trend during a healthy move is usually just a pause. Never apply candlestick rules as blanket statements \u2014 always consider the bigger picture.","chart":{"symbol":"META","interval":"D","candles":[[450,453.21,449.7,452.61],[452.29,452.41,451.79,451.86],[451.53,452.33,450.74,452.26],[451.9,452.09,449.73,449.94],[450.27,458.14,449.86,456.86],[456.7,457.21,454.42,454.87],[455.26,465.15,454.64,465.01],[464.57,464.58,464.02,464.06],[464.21,464.33,461.03,461.1],[460.7,461.66,442.97,457.82],[457.67,466.6,455.74,464.74],[464.95,465.68,464.27,464.35],[464.22,470.35,462.66,470.3],[470.62,472.39,469.51,472.34],[472.64,474.46,471.27,471.41],[471.58,472.0,468.56,468.93],[469.29,476.48,468.97,473.08],[473.27,479.78,473.12,479.69],[479.56,480.05,476.34,476.6],[477.04,478.13,469.45,471.13],[471.59,471.74,469.8,469.91],[470.06,471.95,468.01,471.73],[472.09,475.52,472.09,474.93],[474.7,480.64,474.5,477.64],[477.49,477.62,474.79,475.4],[475.78,479.78,475.56,477.51],[477.21,477.49,475.19,475.52],[475.19,480.75,474.3,480.1],[480.02,489.09,477.91,489.08],[489.52,495.19,486.57,494.92],[494.67,494.91,491.89,491.9],[491.72,491.91,489.26,489.47],[489.09,489.25,488.82,488.84],[488.73,489.26,486.6,488.09],[488.3,495.0,488.26,494.0],[494.39,504.57,494.24,502.32],[502.77,504.51,494.08,494.8],[494.61,519.62,493.23,519.54],[519.74,522.44,517.24,519.94],[520.24,522.64,519.94,522.24]]}},{"module":"Module 1","topic":"Double Tops & Bottoms","layer":1,"id":"M1-DT-004","status":"NEW","scenario":"TSLA daily \u2014 price declines to $150, bounces to $170, pulls back to $150 again, then rallies. The resulting shape on the chart looks like the letter 'W'.","question":"What chart pattern does this 'W' shape represent?","options":{"A":"A double top \u2014 the two peaks at $170 form an 'M' shape signaling a bearish reversal","B":"A head and shoulders pattern \u2014 the two lows and one high form a reversal structure","C":"A double bottom \u2014 the two lows at $150 form a 'W' shape, which is a bullish reversal pattern","D":"A descending triangle \u2014 the flat bottom at $150 with lower highs signals continuation"},"correct":"C","correctFeedback":"A 'W' shape on the chart is a double bottom \u2014 two lows at roughly the same price level ($150) separated by a bounce. It signals that sellers tried twice to push the price lower but buyers defended the level both times. The pattern is confirmed when price breaks above the peak between the two lows (the neckline at $170). Remember: 'W' = double bottom (bullish), 'M' = double top (bearish).","incorrectFeedback":"Focus on the shape: price hits a low, bounces, returns to that same low, and bounces again \u2014 forming a 'W'. Two matching lows = double bottom. This is a bullish reversal pattern because sellers failed twice at the same level. The easy memory aid: W = double bottom (bullish), M = double top (bearish).","chart":{"symbol":"TSLA","interval":"D","candles":[[162,162.04,161.55,161.62],[161.47,162.44,161.28,162.38],[162.48,162.81,160.74,161.03],[161.05,161.7,153.15,157.85],[157.95,159.52,155.93,156.12],[156.14,157.15,156.12,156.75],[156.88,157.67,152.97,153.25],[153.1,153.3,150.51,150.86],[151.0,152.98,150.93,152.62],[152.62,157.01,150.12,156.42],[156.37,158.12,156.33,158.1],[158.2,160.06,157.81,159.65],[159.8,161.94,158.72,161.69],[161.7,162.14,161.69,162.09],[162.09,162.16,159.95,161.18],[161.25,165.22,161.2,163.31],[163.44,171.8,162.35,167.94],[167.97,170.87,167.88,169.7],[169.72,170.4,166.5,167.05],[166.9,167.5,164.45,164.5],[164.43,165.03,156.22,157.57],[157.54,157.66,156.0,156.3],[156.31,164.15,149.76,149.81],[150.01,150.10999999999999,149.91,149.96],[149.91,150.19,149.81,149.86],[149.7,150.76,149.6,150.64],[150.65,158.0,149.56,157.09],[157.18,157.35,156.12,156.27],[156.31,156.43,154.96,155.22],[155.12,157.72,155.1,157.7],[157.74,158.26,157.29,157.37],[157.23,163.22,155.89,161.93],[161.9,170.74,161.52,170.73],[170.63,172.59,170.58,171.42],[171.57,171.69,170.56,171.04],[170.98,171.98,170.85,171.95],[171.91,171.92,171.55,171.56],[171.45,175.0,171.13,174.95]]}},{"module":"Module 1","topic":"Double Tops & Bottoms","layer":1,"id":"M1-DT-005","status":"NEW","scenario":"GOOGL daily \u2014 price rallies to $180, pulls back to $165, rallies again to $180, then starts declining. A double top appears to be forming.","question":"In this double top pattern, what is the neckline and where is it located?","options":{"A":"The neckline is at $180 \u2014 it connects the two peaks","B":"The neckline is at $165 \u2014 it is the trough (lowest point) between the two peaks, and a break below it confirms the pattern","C":"The neckline is at $172.50 \u2014 it is always the midpoint between the peaks and the trough","D":"There is no neckline in a double top \u2014 necklines only apply to head and shoulders patterns"},"correct":"B","correctFeedback":"The neckline in a double top is drawn at the trough between the two peaks \u2014 here that's $165. Think of it as the support level that held between the two failed rallies. The pattern is only confirmed when price breaks below this neckline. Until then, it's just a potential double top. The neckline also serves as the reference point for calculating the measured move target (distance from peaks to neckline, projected downward from the break).","incorrectFeedback":"The neckline is not at the peaks \u2014 it's at the valley between them. In a double top, look for the lowest point between the two highs. That trough acts as support, and the pattern is confirmed only when price breaks below it. Here, the trough at $165 is the neckline.","chart":{"symbol":"GOOGL","interval":"D","candles":[[171.0,175.57,170.66,173.11],[173.24,174.42,173.03,174.21],[174.29,176.74,173.72,176.28],[176.45,177.41,176.27,177.31],[177.32,180.72,177.17,179.03],[178.94,181.68,176.25,181.29],[181.12,182.01,181.12,181.84],[182.01,182.26,181.57,181.59],[181.73,184.91,179.51,179.52],[179.56,179.66,178.4,178.47],[178.57,178.79,176.32,176.56],[176.48,177.24,176.48,177.11],[177.12,177.7,170.27,174.14],[174.1,174.31,172.34,172.35],[172.22,175.34,170.06,170.11],[170.22,170.82,163.55,166.85],[166.68,172.08,166.64,169.92],[169.84,169.93,169.49,169.56],[169.58,170.62,169.49,170.42],[170.4,172.32,170.37,172.03],[172.07,174.08,171.68,173.92],[173.94,173.95,173.55,173.6],[173.59,173.68,171.65,171.73],[171.72,172.88,171.68,172.74],[172.85,179.91,172.61,179.86],[179.97,180.01,178.26,178.4],[178.43,178.72,176.61,176.63],[176.58,177.14,176.57,177.03],[177.12,177.24,175.95,176.6],[176.42,176.95,171.27,171.82],[171.89,172.54,168.96,169.56],[169.73,170.04,168.15,168.47],[168.37,169.4,163.89,163.91],[163.97,164.18,162.17,162.29],[162.22,163.29,162.17,162.71],[162.7,162.93,160.93,161.76],[161.86,161.98,161.84,161.96],[161.91,162.16,160.45,160.46]]}},{"module":"Module 1","topic":"Double Tops & Bottoms","layer":1,"id":"M1-DT-006","status":"NEW","scenario":"AMZN daily \u2014 price declines and tests the $160 support level three separate times over several weeks before finally bouncing. Each test holds at approximately the same price.","question":"A trader labels this a double bottom. Is that correct?","options":{"A":"Yes \u2014 any pattern with lows near the same price is a double bottom regardless of how many times it tests","B":"No \u2014 this is a triple bottom, not a double bottom. The price tested $160 three times, not two. A double bottom has exactly two tests of support.","C":"No \u2014 this is a falling wedge pattern since the price keeps returning to the same level","D":"Yes \u2014 the first and last touches count as the double bottom; the middle touch is just noise"},"correct":"B","correctFeedback":"Counting touches matters. A double bottom has two tests of support (W shape), while three tests make it a triple bottom. Both are bullish reversal patterns, but they're distinct. The triple bottom actually shows even stronger support \u2014 sellers tried three times and failed all three. Accurate pattern identification leads to better analysis and communication with other traders.","incorrectFeedback":"Count the number of times price tests the support level. Two tests = double bottom (W shape). Three tests = triple bottom. Here AMZN tested $160 three times, making it a triple bottom. Being precise with pattern names ensures accurate analysis.","chart":{"symbol":"AMZN","interval":"D","candles":[[170,171.83,168.37,168.57],[168.46,170.44,166.5,166.86],[166.79,166.96,164.35,164.64],[164.59,164.99,162.69,164.99],[165.1,165.11,163.25,164.25],[164.4,166.85,161.88,162.37],[162.22,163.05,161.24,161.32],[161.35,161.58,161.23,161.57],[161.46,163.48999999999998,159.88,160.41],[160.26,161.37,160.19,161.21],[161.19,163.93,161.08,163.54],[163.41,167.68,159.82,167.21],[167.16,170.65,164.56,169.96],[170.06,171.81,167.96,168.01],[168.11,168.45,165.98,166.37],[166.48,166.5,164.4,164.66],[164.68,164.76,164.33,164.35],[164.48,164.53,164.11,164.14],[164.3,164.37,160.38,160.38],[160.35,160.61,160.34,160.56],[160.71,162.4,160.51,162.33],[162.38,162.47,162.02,162.06],[162.08,162.87,162.06,162.52],[162.61,167.04,162.52,166.95],[167.08,167.13,166.18,166.64],[166.81,169.58,164.15,164.48],[164.59,164.94,162.8,163.18],[163.27,163.93,163.18,163.79],[163.66,164.0,160.39,160.41],[160.51,163.07,160.24,162.95],[163.07,165.54,162.86,165.03],[165.07,165.69,164.94,165.61],[165.63,166.31,165.58,166.29],[166.43,166.54,165.69,165.77],[165.64,169.94,162.28,169.91]]}},{"module":"Module 1","topic":"Double Tops & Bottoms","layer":1,"id":"M1-DT-007","status":"NEW","scenario":"COIN daily \u2014 price rallies to $260 on heavy volume (first peak), pulls back, then rallies again to $258 (second peak) but on noticeably lower volume than the first peak.","question":"What does the declining volume on the second peak suggest about this potential double top?","options":{"A":"Lower volume on the second peak is irrelevant \u2014 only price matters for pattern identification","B":"Lower volume means the pattern has failed and price will break out higher","C":"Declining volume on the second peak suggests buying interest is fading. Fewer buyers are willing to push price to the highs, which supports the double top thesis that the rally is losing momentum.","D":"Lower volume always means manipulation by market makers and the pattern should be ignored"},"correct":"C","correctFeedback":"Volume tells you about conviction. When the second peak forms on lower volume than the first, it means fewer buyers are participating at the highs \u2014 buying interest is fading. This is a classic confirmation signal for a double top: the market tried to rally again but with less enthusiasm. Volume divergence (price at similar highs but declining volume) supports the idea that the uptrend is losing steam and a reversal may follow.","incorrectFeedback":"Volume adds important context to price patterns. If the second peak reaches similar prices but with less volume, it means fewer traders are willing to buy at those levels \u2014 enthusiasm is waning. This declining volume supports the bearish double top interpretation by showing fading buying pressure.","chart":{"symbol":"COIN","interval":"D","candles":[[251,252.51,250.72,252.44],[252.27,252.97,252.1,252.92],[252.67,254.34,252.44,254.14],[254.0,254.09,253.89,253.89],[253.9,254.34,253.87,254.31],[254.09,254.71,254.01,254.7],[254.88,255.64,254.86,255.56],[255.72,256.02,255.24,255.27],[255.39,259.61,254.83,259.57],[259.62,259.79,258.44,258.6],[258.68,260.58,256.79,256.99],[256.81,256.85,254.8,255.21],[255.37,256.37,254.24,256.26],[256.46,256.66,254.95,255.06],[254.89,255.02,251.33,251.64],[251.82,251.96,246.95,246.95],[247.15,248.63,246.99,248.44],[248.61,251.34,248.03,250.76],[250.84,250.93,249.8,249.97],[249.88,250.23,249.83,250.19],[250.06,250.72,250.05,250.58],[250.34,250.45,249.46,249.66],[249.51,250.49,249.42,249.93],[250.12,250.43,250.07,250.38],[250.23,257.61,249.91,257.59],[257.8,258.3,251.97,253.28],[253.32,253.4,251.73,251.82],[251.86,253.71,251.81,253.36],[253.39,253.49,252.39,252.44],[252.27,252.73,250.28,250.67],[250.64,251.23,250.21,251.22],[251.46,252.17,251.32,252.16],[252.23,252.66,244.91,244.91],[245.05,245.07,244.02,244.61],[244.41,244.81,241.3,241.82],[241.59,241.74,240.92,240.95],[240.98,241.07,240.98,241.03],[241.02,241.25,240.06,240.13]],"volume":[859251,1025831,1119855,1479647,1793100,1901022,2515446,2876551,2520626,3256105,4021438,1178982,1177416,1454378,1474434,1336163,1559606,1336688,1909393,1728665,1393937,1403520,1271098,921325,966404,901140,1500302,1530749,1544693,1208329,1782115,1686740,1322846,1583796,1282674,1778390,1715843,1717788]}},{"module":"Module 1","topic":"Double Tops & Bottoms","layer":2,"id":"M1-DT-008","status":"NEW","scenario":"NVDA daily \u2014 double top formed at $950 with a neckline at $900. Price just broke below $900 on increased volume.","question":"What is the trade plan after this neckline break?","options":{"A":"Buy the dip at $900 \u2014 the stock was just at $950 so this is a discount","B":"Wait for price to reach $800 before doing anything \u2014 let the dust settle completely","C":"Short aggressively with stop at $960 and no target \u2014 ride it as far as it goes since double tops lead to crashes","D":"Aggressive approach: short at the break with stop above $950 (pattern high) and target $850 (measured move = $950 - $900 = $50, projected below $900). Conservative approach: wait for a retest of $900 as resistance before entering short. Both are valid trade plans."},"correct":"D","correctFeedback":"After a double top neckline break, you have two valid approaches. Aggressive: short at the break, stop above the double top high ($950), target the measured move ($850 = neckline $900 minus the $50 pattern height). Conservative: wait for price to pull back and retest $900 as resistance (polarity), then short with a tighter stop. The measured move ($50 below the neckline = $850) gives you a clear profit target. Always have a defined stop and target before entering.","incorrectFeedback":"When a double top neckline breaks, the pattern signals a potential move lower. Calculate the measured move: pattern height ($950 - $900 = $50) projected below the neckline ($900 - $50 = $850). You can enter aggressively at the break or conservatively on a retest of $900 as resistance. Either way, your stop goes above the pattern high and your target is the measured move.","chart":{"symbol":"NVDA","interval":"D","candles":[[905,913.62,899.52,911.97],[912.04,912.19,906.7,909.82],[910.42,913.92,910.32,913.54],[914.02,914.39,911.66,911.85],[911.38,919.59,910.59,919.56],[918.76,919.14,917.3,917.43],[917.19,918.71,916.9,918.65],[918.13,918.91,911.5,911.67],[912.37,926.26,909.35,925.35],[925.81,937.53,922.84,936.15],[936.87,937.01,935.14,935.2],[935.23,944.96,935.16,944.83],[945.16,950.2,934.42,934.74],[934.99,936.27,933.78,933.84],[934.35,934.35,931.47,933.05],[933.4,934.4,924.62,924.63],[924.07,929.67,923.23,929.06],[929.87,931.87,928.28,931.86],[932.07,932.32,930.44,930.47],[930.13,935.44,929.22,934.37],[934.23,947.6,933.53,947.55],[947.29,947.54,935.6,936.94],[937.62,939.8,919.63,926.91],[927.59,932.07,927.54,929.53],[929.4,930.47,915.11,917.96],[918.05,923.91,908.12,910.0],[910.67,910.86,904.55,904.68],[905.35,915.17,895.63,914.93],[914.69,926.4,914.35,923.95],[924.18,931.92,922.58,930.98],[930.86,950.99,930.36,939.82],[939.99,943.88,939.49,943.05],[942.36,949.58,940.57,947.76],[947.86,949.73,932.32,935.58],[934.89,936.28,924.16,925.86],[926.62,926.74,920.3,921.18],[921.71,927.93,921.12,927.04],[927.24,928.98,917.77,919.12],[918.23,919.59,894.95,895.09],[894.85,895.4,891.45,891.68],[892.04,892.09,888.91,889.11],[888.25,890.32,888.14,890.16],[889.38,891.03,880.69,885.32]]}},{"module":"Module 1","topic":"Double Tops & Bottoms","layer":2,"id":"M1-DT-009","status":"NEW","scenario":"AAPL daily \u2014 double bottom formed with both lows at $165. Neckline is at $175. Price broke above the neckline and has now pulled back to $173.","question":"If you're long from the neckline breakout, where should your stop-loss be placed?","options":{"A":"Just below $173 \u2014 since price is at $173, a tight stop protects quick profits","B":"At $170 \u2014 splitting the difference between the neckline and the pattern low is the standard approach","C":"Below the pattern low at $165 \u2014 that is where the double bottom fails. If price drops below $165, the entire bullish thesis is invalidated and you should exit.","D":"No stop needed \u2014 double bottoms are very reliable patterns so just hold through any pullback"},"correct":"C","correctFeedback":"Your stop goes below the pattern low ($165) because that's where the double bottom thesis completely fails. If price breaks below both lows, the pattern is invalidated and the expected bullish reversal is off the table. The pullback to $173 (near the neckline) is normal and healthy \u2014 many breakouts retest the neckline before continuing higher. A stop at $165 gives the trade enough room to breathe while protecting you if the pattern fails entirely.","incorrectFeedback":"Your stop should go below the double bottom lows ($165) \u2014 that's the level where the entire pattern fails. Stops too tight (at $173 or $170) will get you stopped out on normal pullbacks. No stop at all is reckless. The pattern low is the logical invalidation point.","chart":{"symbol":"AAPL","interval":"D","candles":[[172,172.15,170.65,171.3],[171.16,171.19,170.14,170.31],[170.46,170.76,168.02,169.07],[168.91,169.1,167.66,167.93],[167.94,168.39,167.67,168.32],[168.15,168.96,167.24,167.26],[167.12,167.32,164.84,165.2],[165.22,166.2,164.97,166.15],[166.27,166.6,165.98,166.01],[166.15,167.15,165.86,167.12],[167.1,167.12,166.32,166.33],[166.24,167.44,164.81,167.35],[167.41,167.8,165.3,165.72],[165.8,165.96,164.96,165.01000000000002],[165.06,175.26,164.96,175.1],[174.93,174.93,173.69,173.96],[173.83,174.05,172.44,172.57],[172.4,172.68,172.16,172.64],[172.7,172.71,170.7,170.99],[170.94,171.79,170.72,171.72],[171.58,171.9,169.97,170.01],[169.9,170.39,165.23,165.27],[165.4,166.98999999999998,164.82,166.84],[166.86,168.21,166.61,168.14],[168.05,170.98,165.86,170.57],[170.41,170.65,169.35,169.58],[169.45,171.17,169.07,171.05],[171.12,176.11,167.83,176.1],[175.98,177.3,175.94,176.57],[176.47,176.54,176.14,176.17],[176.06,176.65,175.97,176.52],[176.36,178.0,176.19,177.99],[177.99,178.05,177.66,177.7],[177.58,177.59,177.41,177.43],[177.41,177.53,177.23,177.25],[177.07,177.6,172.91,172.91]]}},{"module":"Module 1","topic":"Double Tops & Bottoms","layer":2,"id":"M1-DT-010","status":"NEW","scenario":"META daily \u2014 a double bottom formed with lows holding at $450. The neckline is at $480. Price is currently consolidating just below $480 but hasn't broken through yet.","question":"What is the best approach for trading this setup?","options":{"A":"Enter long now at $478 \u2014 the double bottom is obvious and the breakout is inevitable","B":"Wait for a clear break above $480 with above-average volume \u2014 the pattern is not confirmed until the neckline breaks. Entering before confirmation means you are trading a thesis, not a confirmed pattern.","C":"Short the stock at $480 \u2014 double bottoms near resistance usually fail","D":"Place a buy order at $450 \u2014 if it drops back to the lows, you get a better price on the third test"},"correct":"B","correctFeedback":"Patience is key. A double bottom is NOT confirmed until price breaks above the neckline ($480) \u2014 until then, it's just a potential pattern. Many double bottoms stall at the neckline and reverse, trapping premature longs. Wait for a decisive close above $480 with volume expansion as confirmation. Then enter long with a stop below $450 (pattern lows) and target the measured move ($480 + ($480 - $450) = $510). Volume on the breakout validates that buyers are committing capital, not just drifting into resistance.","incorrectFeedback":"The critical concept here is confirmation. A double bottom pattern exists only in potential until price breaks above the neckline. Consolidating just below resistance doesn't guarantee a breakout \u2014 many patterns fail at this exact stage. Wait for a clear neckline break with strong volume before committing capital.","chart":{"symbol":"META","interval":"D","candles":[[468,468.13,467.21,467.28],[467.09,467.76,466.49,467.66],[467.63,468.0,459.75,463.85],[463.39,463.51,462.33,462.77],[462.8,463.27,462.76,463.21],[463.64,463.68,462.81,462.98],[462.58,462.99,461.02,461.18],[460.88,461.19,450.94,451.01],[451.26,454.26,450.45,454.18],[454.52,458.44,453.72,458.23],[458.61,458.65,457.92,458.26],[458.13,466.71,456.04,465.46],[465.31,471.01,464.73,470.1],[470.55,473.79,466.83,473.18],[473.11,473.15,472.85,472.91],[472.95,473.27,471.49,471.82],[472.14,476.98,466.2,476.58],[476.56,482.06,476.07,479.11],[478.81,486.02,473.41,473.64],[473.93,478.47,468.7,469.22],[468.83,468.84,466.94,467.63],[468.06,469.18,467.92,469.09],[468.75,471.57,457.18,457.68],[457.56,457.83,454.55,454.83],[454.38,455.32,453.31,453.44],[453.7,455.45,450.27,452.29],[452.66,455.51,452.57,455.43],[455.77,471.32,455.44,468.33],[468.58,470.56,466.41,470.51],[470.49,471.31,470.48,471.28],[471.25,476.57,471.09,476.39],[476.06,480.0,475.11,479.36],[478.88,490.35,466.01,480.8],[480.72,480.77,479.02,479.79],[479.33,479.52,477.51,477.67],[477.24,477.6,477.22,477.54],[477.09,477.23,475.82,475.97],[475.94,476.34,472.63,474.7]]}},{"module":"Module 1","topic":"Double Tops & Bottoms","layer":2,"id":"M1-DT-011","status":"NEW","scenario":"AMD daily \u2014 a double top was identified with peaks at $150 and neckline at $130. The measured move target was $110 ($130 - $20 = $110). Price has just reached $110.","question":"Price has hit the measured move target at $110. What should you do?","options":{"A":"Hold the short \u2014 the stock is crashing and will likely go much lower since momentum is in your favor","B":"Double your position size \u2014 hitting the target proves the trend is strong and you should add more","C":"Take profit at $110 \u2014 the measured move target is a planned exit. Alternatively, book partial profits and trail your stop into profit, watching for market structure to shift back bullish to confirm the selling is done.","D":"Move your stop to breakeven and ignore the target \u2014 targets are just suggestions, not real levels"},"correct":"C","correctFeedback":"Measured move targets are planned exits. When you entered, the target was $110 \u2014 and price has delivered. You have two solid options: (1) take full profit at the target, or (2) book partial profits and trail your stop into profit, watching for a break in market structure back to the upside as confirmation the move down is over. Either way, you're managing the trade with discipline rather than hoping for more.","incorrectFeedback":"When a measured move target is reached, the pattern has done its job. The disciplined approach is to take profits at pre-defined levels. Holding beyond the target without a new plan turns a calculated trade into gambling. Successful trading is about following your plan consistently, not chasing every extra dollar.","chart":{"symbol":"AMD","interval":"D","candles":[[125,126.41,124.7,126.32],[126.41,126.72,126.29,126.66],[126.71,129.86,126.52,129.48],[129.57,129.68,128.73,128.9],[128.78,132.46,127.79,132.16],[132.11,137.05,127.56,128.29],[128.28,129.18,123.79,124.44],[124.52,127.96,123.36,127.88],[127.94,133.79,127.8,130.38],[130.4,130.52,128.85,129.16],[129.06,133.73,129.06,132.89],[132.78,137.08,132.71 other for a valid double bottom","D":"Yes \u2014 the second low being lower actually makes it a stronger double bottom because it shakes out weak holders"},"correct":"B","correctFeedback":"A textbook double bottom has both lows at approximately the same price level \u2014 the whole point is that the same support level holds twice. A 5% difference ($200 vs $190) is too much variance to call this a valid double bottom. When the second low undercuts the first by that much, the original support level clearly failed. Rather than forcing a pattern label, focus on what price is actually doing at key levels.","incorrectFeedback":"A double bottom requires both lows to be at nearly identical price levels \u2014 that's what makes it a 'double' bottom. With $200 and $190, the second low is 5% below the first, which means the $200 support didn't actually hold. That's too much variance for a valid double bottom pattern.","chart":{"symbol":"TSLA","interval":"D","candles":[[215,215.83,210.37,211.38],[211.39,213.07,211.18,212.81],[212.97,213.04,211.48,211.63],[211.61,211.75,209.64,210.61],[210.58,211.15,207.82,208.37],[208.44,208.45,207.78,208.04],[208.01,209.12,200.14,200.23],[200.19,204.2,200.06,203.52],[203.5,206.62,202.91,206.36],[206.17,206.74,203.36,203.6],[203.55,209.57,203.05,206.31],[206.2,215.39,205.53,215.29],[215.36,218.49,212.55,212.88],[212.73,212.96,211.89,211.95],[211.88,211.98,210.13,210.47],[210.65,212.12,210.62,211.99],[211.89,212.18,209.68,209.78],[209.95,210.37,202.48,205.67],[205.67,206.05,199.72,200.86],[200.73,205.8,195.06,196.19],[196.37,197.06,187.46,192.44],[192.27,193.6,192.22,193.37],[193.4,193.72,189.89,190.46],[190.42,191.72,184.88,190.33],[190.27,192.59,189.86,192.28],[192.25,195.88,191.55,195.16],[194.99,195.5,193.1,193.3],[193.25,202.69,191.79,201.65],[201.67,206.51,200.91,205.84],[205.69,205.7,203.95,204.24],[204.24,210.07,203.5,209.96],[209.98,210.57,209.97,210.44],[210.43,211.22,210.42,210.84],[211.03,211.06,210.35,210.46],[210.61,212.99,210.38,211.62],[211.48,216.13,210.57,215.69],[215.49,217.63,213.57,217.37],[217.43,221.84,217.05,221.76]]}},{"module":"Module 1","topic":"Double Tops & Bottoms","layer":3,"id":"M1-DT-013","status":"NEW","scenario":"AMZN \u2014 on the weekly chart, a double top is forming. But zooming into the daily chart, a double bottom is forming right at the neckline area of the weekly double top.","question":"A student is confused: 'The weekly chart says bearish (double top) but the daily chart says bullish (double bottom). Which one do I follow?'","options":{"A":"Always follow the daily chart \u2014 it has more data points and is more accurate than the weekly","B":"Ignore both patterns \u2014 when they conflict, neither is valid and you should stay flat","C":"The higher timeframe dominates. The daily double bottom could produce a short-term bounce, but the weekly double top is the dominant structure. A daily bounce into weekly resistance often creates a short opportunity, not a trend reversal. Multi-timeframe analysis means respecting the bigger picture while using the lower timeframe for entry timing.","D":"Average the two signals \u2014 go half-size long as a compromise between the bullish and bearish readings"},"correct":"C","correctFeedback":"Higher timeframes dominate lower timeframes. The weekly double top is the larger structure \u2014 a daily double bottom at the neckline may produce a bounce, but it likely stalls at weekly resistance. Use the daily for entry timing, not to override the weekly direction. This is also an ideal moment to check where macro drivers (economic data, sector trends, earnings) are pointing \u2014 if they align with the weekly bearish structure, conviction increases significantly.","incorrectFeedback":"When patterns on different timeframes conflict, the higher timeframe wins. A daily double bottom within a weekly double top might bounce, but that bounce occurs within a larger bearish structure. Also consider whether macro drivers support the weekly direction \u2014 alignment there adds conviction.","chart":{"symbol":"AMZN","interval":"W","candles":[[191.0,192.19,189.44,192.09],[192.24,192.87,192.16,192.81],[192.86,192.86,192.83,192.83],[192.71,194.46,192.42,194.22],[194.27,194.3,193.77,193.82],[193.98,195.59,193.9,194.8],[194.96,195.05,194.46,194.57],[194.55,194.55,192.6,193.74],[193.7,199.41,193.38,199.39],[199.48,200.09,197.13,197.33],[197.25,197.88,197.11,197.87],[197.74,198.2,195.69,196.05],[196.23,196.94,193.0,193.45],[193.38,193.54,191.77,192.41],[192.52,193.45,192.42,193.02],[193.0,193.32,186.7,186.73],[186.91,188.29,186.82,188.23],[188.27,188.74,188.2,188.65],[188.5,188.62,187.98,188.09],[188.24,188.8,188.15,188.78],[188.88,190.04,187.44,189.95],[189.84,191.38,189.77,191.18],[191.12,191.24,189.75,189.91],[190.06,190.16,188.99,189.16],[189.01,199.82,188.9,199.82],[199.88,201.28,196.97,197.25],[197.09,197.12,196.44,196.54],[196.6,196.62,192.39,193.2],[193.2,193.81,193.15,193.72],[193.82,195.36,193.51,195.14],[195.32,195.74,194.45,194.6],[194.55,195.19,192.33,192.4],[192.54,193.72,183.62,183.73],[183.89,184.05,182.97,183.03],[183.05,183.52,183.02,183.43],[183.29,183.54,182.87,182.88],[182.97,183.26,181.77,181.96],[181.85,181.92,180.23,180.35]]}},{"module":"Module 1","topic":"Double Tops & Bottoms","layer":3,"id":"M1-DT-014","status":"NEW","scenario":"MSFT daily \u2014 a double top formed with peaks at $420, neckline at $400. The pattern completed and price hit the measured move target at $380. Then price rallied all the way back above the $400 neckline to $405.","question":"A student says: 'The double top pattern is now canceled because price went back above the neckline.' Is the student correct?","options":{"A":"Yes \u2014 returning above the neckline means the double top was a false signal and should be erased from analysis","B":"A completed pattern that already hit its measured move target is not 'canceled' \u2014 it worked. The move to $380 fulfilled the pattern's objective. The subsequent rally back above $400 is a new development that requires fresh analysis \u2014 perhaps a V-bottom or failed breakdown. Past patterns are historical events, not ongoing conditions.","C":"The pattern is partially canceled \u2014 only half of it is still valid since price recovered some of the move","D":"Yes \u2014 double tops are only valid while price stays below the neckline forever after the break"},"correct":"B","correctFeedback":"This is an important conceptual point. A pattern that completes and hits its target has fulfilled its purpose \u2014 it's a historical event, not an ongoing condition. The double top 'worked': it predicted a move from $400 to $380, and that move happened. A trader who shorted the neckline break and took profit at $380 had a successful trade. Price rallying back above $400 afterward doesn't retroactively invalidate that trade. The new rally is a fresh development requiring fresh analysis \u2014 maybe it's a V-bottom, a failed breakdown, or the start of a new trend. Treat each setup on its own merits rather than looking backward at completed patterns.","incorrectFeedback":"Think of completed patterns as historical events. The double top predicted a move from the neckline ($400) to the measured target ($380), and it delivered. That's a completed, successful pattern. Price action after the target is hit is a new chapter \u2014 it requires fresh analysis. Patterns don't get 'canceled' retroactively after they've already worked.","chart":{"symbol":"MSFT","interval":"D","candles":[[405,410.37,403.78,409.81],[410.21,410.22,409.38,409.49],[409.46,415.9,408.74,412.32],[412.32,413.17,411.32,411.5],[411.88,414.41,411.23,414.27],[414.23,417.1,413.8,416.78],[416.79,420.28,416.21,419.75],[419.9,421.07,407.68,414.74],[414.94,418.83,410.64,411.3],[411.46,418.29,405.2,406.15],[406.08,406.52,402.62,403.32],[403.36,404.32,394.41,399.89],[400.27,402.53,399.75,402.24],[402.21,411.18,400.26,409.6],[409.3,410.14,409.29,409.97],[409.6,410.49,408.53,408.71],[408.76,410.2,406.46,  in this case). Institutional players and algorithms know where retail stops are clustered and may push price through those levels to trigger stops (a 'stop hunt' or 'liquidity sweep') before the real move begins. The pattern can absolutely still work, but you need to be smarter about execution: consider wider stops, partial position sizing, or waiting for the stop-hunt to happen before entering. Awareness of market structure and positioning is just as important as the pattern itself.","incorrectFeedback":"Think about what happens when thousands of traders see the same setup and act on it simultaneously. They all enter at the same price and place stops at the same obvious level. This clustering creates an opportunity for larger players to 'hunt' those stops before the real move happens. The pattern isn't invalidated \u2014 but execution becomes trickier when everyone is positioned the same way.","chart":{"symbol":"NFLX","interval":"D","candles":[[518,518.18,516.8,516.87],[517.04,517.49,514.74,514.94],[514.71,515.3,514.68,515.22],[515.22,515.48,512.58,513.52],[513.48,517.74,508.72,509.34],[509.35,509.59,506.04,506.35],[506.5,506.82,506.41,506.79],[507.1,508.29,501.44,501.47],[501.65,504.32,501.65,504.26],[504.48,504.76,502.72,503.12],[503.29,505.99,503.09,505.58],[505.91,508.59,505.55,508.06],[508.34,508.51,500.5,505.0],[505.47,509.73,504.45,509.67],[509.4,509.43,506.86,507.37],[507.74,515.79,505.97,514.12],[514.05,517.91,513.75,517.24],[517.14,529.35,516.53,529.31],[529.34,529.86,526.63,526.85],[526.72,530.35,526.71,528.78],[528.52,528.9,524.96,525.23],[525.53,526.14,520.29,520.78],[520.42,520.78,514.03,517.74],[517.28,519.91,514.51,519.46],[519.46,524.62,515.74,515.93],[516.16,517.2,502.38,502.41],[502.23,509.63,501.83,505.23],[504.92,505.52,504.77,505.51],[505.73,517.07,503.44,516.69],[516.93,517.63,512.41,513.43],[513.62,513.86,512.52,512.52],[512.54,515.93,510.93,515.29],[515.39,530.96,514.78,530.91],[530.94,531.95,529.96,531.84],[531.68,531.79,530.45,530.53],[5 ssure, which reinforces the bearish thesis","D":"No \u2014 but only if the difference is less than 0.5%; anything more disqualifies the pattern"},"correct":"C","correctFeedback":"Perfect symmetry is rare in real markets. A right shoulder that peaks slightly lower than the left is common and actually strengthens the bearish case \u2014 it shows that buyers couldn't push price as high on the second attempt, indicating fading momentum.","incorrectFeedback":"Real-world patterns are rarely perfectly symmetrical. A slightly lower right shoulder actually reinforces the bearish signal because it shows buyers are losing steam \u2014 they couldn't even reach the same level as the left shoulder. There is no fixed percentage rule for shoulder symmetry.","chart":{"symbol":"MSFT","interval":"D","candles":[[232,235.77,231.4,235.66],[235.43,235.77,233.62,233.89],[234.04,237.88,233.55,237.85],[237.93,238.85,237.7,238.69],[238.81,238.88,238.29,238.38],[238.3,244.97,237.91,244.89],[244.96,245.58,244.89,245.47],[245.45,247.69,245.15,247.32],[247.32,250.59,246.18,250.07],[249.97,250.34,248.5,248.76],[248.63,248.86,248.6,248.83],[248.98,249.1,244.91,244.94],[245.07,245.6,241.76,242.43],[242.3,245.48,241.97,244.89],[244.81,245.21,237.96,238.01],[237.92,239.34,237.28,239.14],[238.99,241.91,238.83,241.3],[241.07,245.13,240.42,245.1],[245.23,249.71,244.14,249.04],[248.85,249.7,248.71,249.55],[249.59,256.16,248.39,254.9],[255.0,259.34,253.96,258.7],[258.92,258.98,258.63,258.68],[258.76,262.99,257.97,262.95],[262.86,264.98,262.56,264.87],[265.06,267.31,264.91,267.1],[267.16,268.58,266.64,268.08],[267.84,268.26,262.59,262.99],[263.03,263.67,258.7,259.38],[259.28,259.92,258.5,259.86],[259.67,259.79,258.29,258.97],[258.72,258.81,258.23,258.32],[258.21,258.71,251.88,251.89],[252.11,252.89,249.36,249.9],[249.88,250.07,249.64,250.07],[249.88,250.01,244.99,245.03],[245.2,245.63,241.17,241.68],[241.82,243.97,241.05,243.79],[243.8,244.1,238.03,238.04],[237.83,241.21,237.59,240.33],[240.29,240.89,240.19
