end analysis","D":"The upper band is meaningless \u2014 only the lower band provides actionable trading signals"},"correct":"B","correctFeedback":"The 'band walk' is a common misunderstanding. In trending markets, price hugging the upper band is bullish, not overbought. The sell signal comes when price STOPS riding the upper band and pulls back to the middle. Selling the band touch in a trend means selling strength \u2014 the opposite of what you want.","incorrectFeedback":"Band walking = trend strength. When price repeatedly closes at or above the upper band, the trend is powerful. The mistake is treating the upper band as a ceiling. In a strong trend, it's a rail that price rides. The warning comes when price breaks away from the band and retreats to the 20 SMA (middle band).","chart":{"symbol":"SPY","interval":"D","range":"6","candles":[[470,470.58,469.94,470.57],[470.73,472.49,470.6,472.34],[472.39,473.68,472.33,473.4],[473.46,473.47,472.29,472.88],[473.26,475.14,473.25,474.32],[474.09,475.6,473.98,475.57],[475.79,476.09,475.66,476.03],[476.26,479.1,476.13,479.02],[479.17,479.44,475.39,477.03],[477.19,477.93,474.08,474.67],[474.47,474.76,469.27,473.86],[473.54,473.83,473.16,473.8],[473.94,475.95,473.41,475.79],[475.56,477.65,475.05,477.54],[477.91,478.01,475.69,476.12],[476.49,476.81,475.19,475.38],[475.17,481.15,469.4,479.95],[480.21,486.44,479.71,486.33],[486.27,486.45,483.7,484.14],[484.06,484.13,483.36,483.5],[483.98,484.04,481.5,481.54],[481.44,482.95,479.64,482.84],[483.22,486.76,480.4,486.73],[486.97,490.67,486.65,490.24],[489.75,496.28,482.92,495.65],[495.46,497.39,495.16,497.17],[497.05,500.15,494.01,494.01],[493.81,493.9,492.79,492.98],[492.53,492.6,490.06,491.37],[491.0,491.67,490.97,491.42],[491.3,491.92,491.3,491.64],[491.65,491.77,488.64,488.74],[488.89,491.5,488.81,490.95],[491.3,492.93,491.15,492.71],[492.76,502.48,492.32,496.86],[496.57,501.19,496.35,500.38],[500.41,503.19,500.33,502.89],[502.72,505.51,502.38,505.14],[505.15,507.92,501.34,501.35 trong trend). The 50% is moderate. The 61.8% (the 'golden ratio') is a deep pullback \u2014 if it holds, the trend is still alive. Below 61.8%, the trend may be failing.","incorrectFeedback":"Fibonacci retracements measure how far a pullback goes relative to the prior move. 38.2% = shallow retracement (strong momentum). 50% = moderate. 61.8% = deep (last line of defense for the trend). They work because enough traders watch them to create self-fulfilling reactions.","chart":{"symbol":"NVDA","interval":"D","range":"6","candles":[[700,713.07,689.03,711.92],[711.72,722.17,711.29,720.46],[720.81,720.98,713.15,717.16],[716.52,725.92,715.83,722.76],[722.5,737.31,704.93,736.93],[736.44,737.66,736.36,737.54],[737.64,738.21,735.33,735.6],[736.07,755.37,734.75,755.32],[754.65,755.22,749.7,750.67],[750.41,760.35,741.1,742.44],[742.55,742.95,737.9,738.72],[738.04,738.06,732.45,733.26],[733.27,735.4,719.9,735.33],[735.68,739.99,732.83,739.44],[740.02,748.84,732.64,747.87],[747.95,757.61,746.83,756.97],[757.6,759.75,757.22,759.47],[759.15,759.54,753.36,754.27],[754.15,763.46,753.65,758.59],[758.88,769.81,757.64,767.58],[767.3,771.81,766.37,771.61],[771.98,800.17,763.86,799.83],[800.57,808.08,793.4,793.84],[793.81,799.59,786.75,787.93],[788.38,791.7,788.22,791.21],[791.9,792.22,787.22,788.13],[787.99,788.6,785.8,788.17],[788.83,790.27,780.24,781.13],[781.0,781.14,775.15,776.48],[776.49,777.29,772.75,773.37],[772.63,773.91,771.52,773.75],[774.35,774.74,771.37,771.48],[771.75,772.57,762.12,763.42],[763.73,763.84,756.51,759.67],[759.21,764.37,753.54,764.09]],"pattern":"range_sr","overlays":{"fib":{"0%":808.08,"23.6%":779.98,"38.2%":762.6,"50%":748.56,"61.8%":734.51,"100%":689.03}}}},{"module":"Module 2","topic":"Fibonacci Retracements","layer":2,"id":"M2-FIB-002","status":"LIVE","scenario":"AAPL daily: uptrend pullback, 61.8% Fibonacci retracement level coincides exactly with horizontal support and the 50-day SMA","question":"The 61.8% Fibonacci retracement level lines up with a horizontal support zone AND the 50-day SMA. Why is this significant?","options":{"A":"It's a coincidence \u2014 Fibonacci levels, support zones, and moving averages are unrelated tools that can't confirm each other","B":"This alignment means you should use the Fibonacci level but ignore the support and moving average since they're redundant","C":"When three indicators point to the same level, it means the stock is oversold and will definitely reverse upward","D":"A confluence zone. When multiple independent tools identify the same price area as support, the probability of a bounce increases significantly. This level has triple confirmation: Fibonacci, horizontal support, and dynamic MA support. Trade entries near confluence zones offer the highest conviction."},"correct":"D","correctFeedback":"Confluence is one of the most important concepts in technical analysis. Any single tool can fail. When Fibonacci, horizontal S/R, and a moving average all point to the same zone, you have three independent reasons to expect a reaction. This is where the best risk/reward setups live.","incorrectFeedback":"Think of each tool as a 'vote' for a level. One vote = worth watching. Three votes (Fibonacci + support + MA) = high-conviction zone. Confluence doesn't guarantee a bounce, but it dramatically improves the odds and tightens your risk (clear invalidation if all three fail).","chart":{"symbol":"AAPL","interval":"D","range":"6","candles":[[159.86,160.24,159.48,159.86],[159.86,161.77,159.29,161.2],[161.2,162.96,160.93,162.69],[162.69,164.73,162.4,164.44],[164.44,166.16,163.85,165.57],[165.57,167.95,165.18,167.56],[167.56,168.83,167.34,168.61],[168.61,171.05,168.06,170.5],[170.5,172.33,169.99,171.82],[171.82,173.54,171.61,173.33],[173.33,175.52,172.88,175.07],[175.07,176.81,174.46,176.2],[176.2,178.47,175.93,178.2],[178.2,179.58,177.86,179.24],[179.24,181.8,178.59,181.15],[181.15,182.83,180.76,182.44],[182.44,184.23,182.19,183.98],[183.98,186.31,183.36,185.69],[185.69,187.37,185.16,186.84],[186.84,189.06,186.61,188.83],[188.83,190.39,188.31,189.87],[189.87,190.74,189.23,190.1],[190.1,190.37,187.25,187.52],[187.52,187.9,185.94,186.32],[186.32,186.99,184.57,185.24],[185.24,185.6,183.28,183.64],[183.64,183.91,182.58,182.85],[182.85,183.47,180.49,181.11],[181.11,181.59,179.8,180.28],[180.28,180.5,178.54,178.76],[178.76,179.28,177.06,177.58],[177.58,178.15,175.9,176.47],[176.47,176.7,174.66,174.89],[174.89,175.28,173.71,174.1],[174.1,174.72,171.78,172.4]],"pattern":"uptrend","overlays":{"fib":{"0%":190.1,"23.6%":182.93,"38.2%":178.49,"50%":174.91,"61.8%":171.33,"100%":159.72},"lines":[{"values":[166.5,166.64,166.78,166.92,167.06,167.2,167.34,167.48,167.62,167.76,167.9,168.04,168.18,168.32,168.46,168.6,168.74,168.88,169.02,169.16,169.3,169.44,169.58,169.72,169.86,170.0,170.14,170.28,170.42,170.56,170.7,170.84,170.98,171.12,171.26],"color":"#ff9800","label":"50 SMA","width":2}],"srLines":[{"price":171.3,"label":"Support","color":"#26a69a"}]}}},{"module":"Module 2","topic":"Fibonacci Retracements","layer":3,"id":"M2-FIB-003","status":"LIVE","scenario":"GOOGL daily: rally from $140 to $180, now pulling back. 50% Fib at $160 with no other confluence. 61.8% Fib at $155 coincides with prior breakout level and rising 200-day SMA","question":"GOOGL is pulling back from $180. The 50% Fib ($160) has no other support nearby. The 61.8% Fib ($155) lines up with a prior breakout level and the 200 SMA. Where do you set your buy order and why?","options":{"A":"Buy at the 50% level ($160) because it's the first major Fib level and you want to enter as early as possible","B":"Skip both levels and wait for price to drop to $140 (the full retracement) for maximum discount","C":"Set your primary buy zone at $155 (the 61.8% confluence level) \u2014 the alignment with horizontal support and the 200 SMA gives it triple confirmation. Set an alert at $160 (50% Fib) to watch for a bounce, but the better risk/reward entry is where you have confluence, not just a standalone Fib level.","D":"Fibonacci levels can't be used for entry planning since they only work for measuring moves after the fact"},"correct":"C","correctFeedback":"The 61.8% at $155 is the higher-conviction entry because of confluence. The 50% at $160 is a standalone Fib \u2014 it may bounce, but without supporting evidence, it's lower probability. Better to wait for the confluence zone even though it means accepting a lower entry. Your stop below $155 is tighter and your thesis is clearer.","incorrectFeedback":"This illustrates why confluence matters more than any single Fib level. The 50% Fib alone is interesting but not compelling. The 61.8% with two other confirmations is a trade setup. Sometimes patience for the better level means missing the entry \u2014 but that's better than taking a low-conviction trade.","chart":{"symbol":"GOOGL","interval":"D","range":"6","candles":[[140.06,140.4,139.72,140.06],[140.06,142.39,139.56,141.89],[141.89,144.11,141.65,143.87],[143.87,146.36,143.62,146.11],[146.11,148.26,145.58,147.73],[147.73,150.57,147.38,150.22],[150.22,151.96,150.02,151.76],[151.76,154.63,151.27,154.14],[154.14,156.41,153.67,155.94],[155.94,158.14,155.75,157.95],[157.95,160.58,157.54,160.17],[160.17,162.36,159.61,161.8],[161.8,164.53,161.55,164.28],[164.28,166.13,163.97,165.82],[165.82,168.81,165.22,168.21],[168.21,170.36,167.85,170.0],[170.0,172.27,169.76,172.03],[172.03,174.81,171.45,174.23],[174.23,176.37,173.73,175.87],[175.87,178.56,175.66,178.35],[178.35,180.38,177.85,179.88],[179.88,180.72,179.27,180.11],[180.11,180.36,177.37,177.62],[177.62,177.98,176.09,176.45],[176.45,177.08,174.78,175.41],[175.41,175.75,173.52,173.86],[173.86,174.12,172.85,173.11],[173.11,173.7,170.83,171.42],[171.42,171.87,170.18,170.63],[170.63,170.83,168.95,169.15],[169.15,169.64,167.52,168.01],[168.01,168.55,166.41,166.95],[166.95,167.17,165.19,165.41],[165.41,165.78,164.28,164.65],[164.65,165.23,162.42,163.0]],"pattern":"uptrend","overlays":{"fib":{"0%":180.11,"23.6%":170.63,"38.2%":164. h for a volume spike on a down day as the confirmation of a shift.","D":"Volume always declines during uptrends because all the buying happened at the beginning of the move"},"correct":"C","correctFeedback":"Volume-price divergence: rising price + falling volume = weakening trend. It's similar to RSI divergence \u2014 the move continues but the conviction behind it fades. This doesn't mean 'sell now,' but it does mean tighten stops and be alert for a reversal. The trend is running on fumes.","incorrectFeedback":"Healthy uptrends show volume expanding on rallies and contracting on pullbacks. When the pattern flips \u2014 volume shrinking on rallies \u2014 it's a warning. Each new high is being achieved with less buying power. The trend isn't broken yet, but it's losing steam.","chart":{"symbol":"AAPL","interval":"D","range":"3","candles":[[180.11,180.54,179.68,180.11],[180.11,181.43,179.47,180.79],[180.79,181.88,180.49,181.58],[181.58,182.91,181.26,182.59],[182.59,183.74,181.94,183.09],[183.09,184.72,182.66,184.29],[184.29,184.97,184.05,184.73],[184.73,186.45,184.13,185.85],[185.85,187.06,185.29,186.5],[186.5,187.55,186.27,187.32],[187.32,188.8,186.83,188.31],[188.31,189.47,187.66,188.82],[188.82,189.11,188.33,188.62],[188.62,188.98,187.29,187.65],[187.65,188.32,186.71,187.38],[187.38,187.78,186.22,186.62],[186.62,186.88,185.79,186.05],[186.05,186.67,185.0,185.62],[185.62,186.69,185.1,186.17],[186.17,187.62,185.95,187.4],[187.4,188.38,186.88,187.86],[187.86,189.68,187.22,189.04],[189.04,189.96,188.77,189.69],[189.69,190.96,189.3,190.57],[190.57,192.25,189.88,191.56],[191.56,192.51,191.18,192.13],[192.13,193.64,191.84,193.35],[193.35,194.48,192.68,193.81],[193.81,194.32,192.76,193.27],[193.27,193.5,191.95,192.18],[192.18,192.74,190.8,191.36],[191.36,191.98,189.98,190.6],[190.6,191.73,190.35,191.48],[191.48,193.41,191.05,192.98],[192.98,194.43,192.29,193.74],[193.74,195.57,193.39,195.22],[195.22,196.45,194.9,196.13],[196.13,198.04,195.44,197.35],[197.35,199.08,196.86,1 eclining on the bounce. The selling had institutional weight. The buying doesn't. This asymmetry suggests the sellers' thesis (bad earnings) is the dominant force. Until you see heavy-volume buying, the path of least resistance is still down.","chart":{"symbol":"TSLA","interval":"D","range":"6","candles":[[206.06,206.55,205.57,206.06],[206.06,206.79,205.09,205.82],[205.82,206.16,205.3,205.64],[205.64,206.0,205.21,205.57],[205.57,206.3,204.51,205.24],[205.24,205.74,204.77,205.27],[205.27,205.54,204.64,204.91],[204.91,205.57,204.23,204.89],[204.89,205.5,204.04,204.65],[204.65,204.9,204.23,204.48],[186.5,187.2,179.89,180.4],[180.4,181.25,179.77,180.62],[180.62,181.44,180.34,181.16],[181.16,181.52,180.82,181.18],[181.18,182.37,180.53,181.72],[181.72,182.28,181.33,181.89],[181.89,182.46,181.64,182.21],[182.21,183.24,181.6,182.63],[182.63,183.24,182.11,182.72],[182.72,183.53,182.5,183.31],[183.31,183.84,182.8,183.33],[183.33,184.5,182.71,183.88],[183.88,184.29,183.62,184.03],[184.03,184.75,183.65,184.37],[184.37,185.43,183.71,184.77],[184.77,185.23,184.41,184.87],[184.87,185.74,184.59,185.46],[185.46,186.11,184.82,185.47],[185.47,186.52,184.98,186.03],[186.03,186.4,185.8,186.17],[186.17,187.07,185.62,186.52],[186.52,187.52,185.91,186.91],[186.91,187.27,186.66,187.02],[187.02,188.02,186.6,187.6],[187.6,188.29,186.93,187.62],[187.62,188.52,187.28,188.18],[188.18,188.61,187.88,188.31],[188.31,189.34,187.65,188.68],[188.68,189.52,188.21,189.05],[189.05,189.41,188.81,189.17],[189.17,190.33,188.59,189.75]],"pattern":"uptrend","volume":[6000000,6567780,5632885,5669588,6580751,5954909,5448402,6401741,6291839,5409560,31000000,6337084,7211979,7823730,5862101,6683134,7207508,5388551,6151551,6592632,4916374,5617233,5979159,4445507,5080181,5367147,3975889,4540403,4756653,3507459,3997903,4147732,3040152,3452690,3540440,2573907,2904773,2934830,2108657,2354164,2441952]}},{"module":"Module 3","topic":"Wave Structure","layer":1,"id":"M3-EWT-001","status":"LIVE","scenario":"SPY daily: clear 5-wave impulse move up from $440 to $480 with labeled waves 1-5","question":"How many waves make up a complete impulse move in Elliott Wave Theory?","options":{"A":"Three waves moving in the direction of the trend with two corrections in between","B":"Five \u2014 three motive waves (1, 3, 5) in the trend direction and two corrective waves (2, 4) against it","C":"Seven waves alternating between impulse and correction throughout the full cycle","D":"Two waves \u2014 one impulse and one correction make up the complete move"},"correct":"B","correctFeedback":"A complete impulse has 5 waves: waves 1, 3, and 5 move WITH the trend (motive), while waves 2 and 4 move AGAINST the trend (corrective). 5-3 structure is the backbone of Elliott Wave.","incorrectFeedback":"Count the waves in the trend direction and the pullbacks between them. An impulse move always has 5 waves: 3 moving with the trend and 2 pulling back.","chart":{"symbol":"SPY","interval":"D","range":"6","candles":[[440,445.0,438.67,444.88],[445.21,445.79,444.22,444.23],[443.88,444.05,443.11,443.21],[443.13,445.62,442.8,445.61],[445.42,450.98,444.28,450.11],[450.32,455.06,449.85,455.01],[455.1,455.22,454.89,454.91],[454.71,455.3,451.38,451.63],[451.22,451.58,448.24,449.73],[449.3,449.92,447.08,448.12],[447.89,458.17,446.05,456.74],[457.09,457.85,456.25,457.75],[458.1,461.48,457.45,461.11],[461.09,464.37,460.67,464.14],[463.76,467.42,463.57,466.61],[466.95,473.94,465.28,472.75],[473.16,476.92,472.3,476.31],[476.58,480.69,470.09,470.12],[469.79,470.38,467.09,467.7],[467.29,468.52,467.03,468.32],[468.21,468.26,467.74,467.82],[468.19,468.44,461.95,461.95],[462.27,467.5,461.34,466.32],[466.27,468.2,466.18,468.11],[468.17,468.62,466.54,466.63],[466.79,471.67,465.77,471.35],[471.42,480.13,471.2,480.12]],"pattern":"range_sr"}},{"module":"Module 3","topic":"Wave Structure","layer":1,"id":"M3-EWT-002","status":"LIVE","scenario":"SPY daily: clear 5-wave impulse move up from $440 to $480 with labeled waves 1-5 \u2014 Same chart \u2014 corrective ABC pattern follows the 5-wave impulse","question":"After the 5-wave impulse completes, what corrective pattern typically follows?","options":{"A":"A 3-wave corrective pattern labeled A-B-C that moves against the prior trend","B":"A single sharp reversal candle that signals the trend is over","C":"Another 5-wave impulse in the opposite direction to fully retrace the move","D":"A sideways consolidation with no identifiable wave structure"},"correct":"A","correctFeedback":"After a 5-wave impulse, expect a 3-wave ABC correction. A moves against the trend, B retraces part of A (a counter-trend bounce), C completes the correction. 5 waves up, 3 waves down = one full cycle.","incorrectFeedback":"The correction after an impulse follows an ABC structure \u2014 three waves moving against the prior trend. This is the other half of the Elliott Wave cycle.","chart":{"symbol":"SPY","interval":"D","range":"6","candles":[[440,442.86,439.63,442.64],[442.43,443.39,442.37,443.19],[443.4,447.69,443.19,446.1],[446.27,448.84,446.14,448.4],[448.22,448.32,447.64,447.69],[447.55,455.14,447.19,455.1],[455.47,455.64,452.33,452.86],[452.91,454.38,452.57,454.06],[453.64,453.86,451.44,451.76],[451.78,451.83,447.85,447.89],[448.01,450.86,447.61,450.68],[450.74,450.91,449.71,449.81],[450.17,453.83,449.43,453.31],[453.34,461.26,451.83,460.26],[460.16,464.09,459.63,463.27],[462.81,462.83,460.18,460.71],[460.55,465.67,460.1,465.22],[465.09,470.04,464.8,470.0],[469.66,469.97,463.16,466.65],[466.25,466.59,462.79,463.58],[463.73,463.73,458.98,461.66],[462.12,462.41,458.85,462.02],[461.81,462.68,460.75,462.54],[462.85,463.68,462.83,463.67],[463.37,468.34,462.13,467.98],[468.36,469.5,468.32,468.95],[469.34,480.14,469.13,480.13],[480.13,481.81,474.45,476.13],[476.13,476.92,471.34,472.13],[472.13,472.94,467.32,468.13],[468.13,469.78,462.48,464.13],[464.13,467.54,463.05,466.46],[466.46,469.41,465.85,468.8],[468.8,472.64,467.29,471.13],[471.13,472.52,465.74,467.13],[467.13,467.69,462.57, .1],[135.03,142.41,131.41,135.1]],"pattern":"uptrend"}},{"module":"Module 3","topic":"Wave Rules","layer":2,"id":"M3-EWT-004","status":"LIVE","scenario":"Chart with labeled waves \u2014 Wave 2 retraces roughly 61.8% of Wave 1, Wave 4 retraces roughly 38.2% of Wave 3","question":"What is the key rule about Wave 2 in relation to Wave 1?","options":{"A":"Wave 2 must retrace exactly 50% of Wave 1 \u2014 any other retracement invalidates the count","B":"Wave 2 can never retrace more than 100% of Wave 1 \u2014 if it drops below where Wave 1 started, your count is wrong","C":"Wave 2 must be shorter in time than Wave 1 but can retrace any percentage","D":"Wave 2 typically retraces 38.2% of Wave 1 and no other Fibonacci level is valid"},"correct":"B","correctFeedback":"This is an absolute rule: Wave 2 CANNOT retrace beyond the start of Wave 1. If it does, your wave count is wrong. Common Wave 2 retracements are 50-61.8% of Wave 1, but 100% is the hard limit.","incorrectFeedback":"If Wave 2 drops below the starting point of Wave 1, the count is invalid. This is a hard rule, not a guideline. Wave 2 often retraces 50-61.8% of Wave 1 via Fibonacci levels.","chart":{"symbol":"AAPL","interval":"D","range":"6","candles":[[200.0,200.36,199.64,200.0],[200.0,203.87,199.46,203.33],[203.33,206.93,203.07,206.67],[206.67,210.27,206.4,210.0],[210.0,213.9,209.43,213.33],[213.33,217.05,212.95,216.67],[216.67,220.21,216.46,220.0],[220.0,220.52,216.48,217.0],[217.0,217.48,213.52,214.0],[214.0,214.19,210.81,211.0],[211.0,211.4,207.6,208.0],[208.0,213.8,207.45,213.25],[213.25,218.75,213.0,218.5],[218.5,224.07,218.18,223.75],[223.75,229.62,223.13,229.0],[229.0,234.62,228.63,234.25],[234.25,239.75,234.0,239.5],[239.5,245.36,238.89,244.75],[244.75,250.53,244.22,250.0],[250.0,250.22,245.79,246.01],[246.01,246.51,241.52,242.02],[242.02,242.62,237.43,238.03],[238.03,238.28,233.79,234.04],[234.04,239.07,233.67,238.7],[238.7,244.02,238.04,243.36],[243.36,248.38,243.0,248.02],[248.02,252.96,247.74,252.68],[252.68,258.0,252.02,257.34],[257.34,262.52,256.82,262.0]],"pattern":"range_sr"}},{"module":"Module 3","topic":"Wave Rules","layer":2,"id":"M3-EWT-005","status":"LIVE","scenario":"Chart where Wave 4 overlaps into Wave 1 territory \u2014 potential rule violation","question":"Wave 4 has pulled back into the price territory of Wave 1. What does this tell you?","options":{"A":"This is normal \u2014 waves frequently overlap as price moves in zig-zag patterns","B":"It's only a problem if Wave 4 retraces more than 61.8% of Wave 3 based on Fibonacci","C":"Wave 4 overlapping Wave 1 confirms the trend is accelerating and the count is strong","D":"Your wave count is likely wrong. In a standard impulse, Wave 4 should not overlap the price territory of Wave 1."},"correct":"D","correctFeedback":"Wave 4 overlapping Wave 1 price territory is a violation of EWT rules for a standard impulse. It means either your count is wrong, or the structure is a different pattern (like a diagonal). This rule helps you validate or invalidate your wave labels. Keep in mind there can always be nuance since Elliott Wave isn't an exact science, but generally this rule stands.","incorrectFeedback":"In a textbook impulse, Wave 4 cannot enter Wave 1's price territory. If it does, reconsider your wave count \u2014 it may be a diagonal pattern, an ABC correction, or your labels may need adjusting.","chart":{"symbol":"AAPL","interval":"D","range":"6","candles":[[150,151.14,149.87,150.89],[150.8,153.12,148.8,152.81],[152.81,153.93,147.53,148.65],[148.77,154.05,147.46,153.17],[153.19,153.28,152.2,152.37],[152.45,164.97,152.3,164.93],[164.92,165.0,161.88,162.16],[162.11,162.85,157.77,158.43],[158.58,159.01,154.84,156.86],[156.89,157.01,154.9,155.06],[155.05,158.1,154.6,157.78],[157.67,160.41,157.37,160.17],[160.02,164.2,158.18,163.65],[163.77,174.91,163.31,172.85],[172.78,177.07,169.0,176.87],[176.99,179.45,174.44,174.72],[174.6,193.54,173.56,182.78],[182.74,183.85,180.06,180.1],[180.16,181.59,174.5,174.69], 0%, or 61.8%). Combine the wave count with S/R and candlestick confirmation for a high-probability entry.","incorrectFeedback":"Patience is key after a completed impulse. The ABC correction offers a better entry than chasing. Wait for Wave C to finish near a support zone and look for confirmation before re-entering.","chart":{"symbol":"MSFT","interval":"D","range":"6","candles":[[370,373.97,369.85,372.15],[372.12,375.89,371.96,375.28],[375.4,383.71,374.7,379.63],[379.44,381.84,377.9,381.66],[381.55,383.97,381.17,383.56],[383.38,387.58,383.23,384.89],[384.96,385.1,383.64,384.39],[384.55,384.96,378.83,382.09],[382.15,383.62,381.39,383.35],[383.52,384.09,378.08,378.08],[378.18,382.29,377.95,382.15],[382.44,382.58,381.46,381.64],[381.39,384.65,380.71,384.22],[384.18,388.95,383.82,388.03],[387.92,392.84,387.76,390.89],[390.84,391.36,382.41,387.16],[387.05,390.55,386.85,390.28],[390.54,400.09,389.08,400.08],[400.01,400.63,396.78,397.41],[397.59,398.35,397.54,398.29],[398.05,398.41,395.9,396.26],[396.28,396.51,392.9,392.91],[393.23,396.51,392.93,396.33],[395.95,401.49,395.05,400.48],[400.56,407.76,399.5,406.19],[405.99,410.45,405.36,410.22],[410.58,411.18,409.97,409.98],[409.68,411.86,408.27,408.42],[408.72,408.98,404.55,405.51],[405.2,405.21,404.56,404.6],[404.38,404.81,399.97,400.18]],"pattern":"range_sr"}},{"module":"Module 3","topic":"Wave Application","layer":3,"id":"M3-EWT-008","status":"LIVE","scenario":"You count 5 waves on a 1-hour chart but the daily chart shows a different structure","question":"Your 1-hour chart shows a completed 5-wave impulse, but the daily chart suggests you're only in Wave 3 of a larger impulse. How do you reconcile this?","options":{"A":"The 1-hour chart is more accurate since it shows more detail and granularity","B":"Waves are fractal \u2014 the 5-wave impulse on the 1-hour chart could be a single wave within the larger daily structure. Always prioritize the higher timeframe's wave count for the bigger picture.","C":"Ignore the daily chart \u2014 only trade the timeframe you're looking at to avoid analysis paralysis","D":"Both counts are wrong if they don't match \u2014 start over on a weekly chart instead"},"correct":"B","correctFeedback":"Waves nest inside waves. Your 1-hour 5-wave impulse might be Wave 1 (or 3, or 5) of the larger daily impulse. The higher timeframe gives context \u2014 if the daily says Wave 3 is still unfolding, there's likely more upside even though the shorter-term structure completed a micro-impulse. Use smaller timeframes for entries on shorter-term trades.","incorrectFeedback":"Elliott waves are fractal: smaller waves nest inside larger waves. A complete 5-wave move on a lower timeframe often represents just one wave on a higher timeframe. Always check the larger structure for context.","chart":{"symbol":"SPY 1H","interval":"D","range":"6","candles":[[300,301.92,299.94,301.6],[301.68,301.83,300.2,300.44],[300.15,304.15,300.12,303.34],[303.53,305.04,303.25,304.71],[304.48,306.91,304.03,305.91],[306.14,306.26,305.29,305.41],[305.24,305.37,304.04,304.26],[304.22,304.48,301.88,302.94],[303.11,304.52,303.1,304.35],[304.06,304.82,303.94,304.73],[304.52,304.56,304.34,304.37],[304.32,306.21,304.09,305.34],[305.13,312.22,304.76,308.5],[308.22,311.88,307.9,311.78],[312.07,312.22,308.83,309.46],[309.32,310.21,308.24,308.35],[308.06,308.82,307.3,308.8],[308.62,311.29,308.09,310.8],[310.74,312.75,310.62,312.52],[312.66,312.88,311.73,311.91],[312.16,314.78,311.15,314.78]],"pattern":"range_sr","label":"Chart A: 1-Hour"},"chart2":{"symbol":"SPY Daily","interval":"D","candles":[[280,287.58,279.23,285.89],[285.65,289.72,284.59,289.54],[289.77,292.22,287.21,287.29],[287.07,288.99,286.86,288.98],[288.98,289.34,286.48,286.81],[286.8,286.95,286.02,286.11],[286.08,286.91,286.04,286.88],[286.81,290.02,286.49,288.93],[289.07,289.16,287.97,288.14],[288.06,309.66,287.47,309.62],[309.73,309.93,305.21,307.2],[307.46,307.7,305.72,305.95],[306.11,306.84,303.59,303.87],[303.7,308.32,298.57,299.17],[298.  direction in January often predicts the direction for the full year. It's a broad macro signal to add context, not a standalone trading strategy.","chart":{"symbol":"SPX","interval":"M","range":"6","candles":[[4400.0,4625.59,4400.0,4598.0],[4598.0,4694.13,4556.87,4653.0],[4653.0,4672.22,4596.78,4616.0],[4616.0,4728.47,4595.53,4708.0],[4708.0,4797.34,4665.66,4755.0],[4755.0,4782.33,4704.67,4732.0],[4732.0,4818.57,4716.43,4803.0],[4803.0,4879.77,4764.23,4841.0],[4841.0,4876.75,4757.25,4793.0],[4793.0,4893.87,4778.13,4879.0],[4879.0,5018.16,4846.84,4986.0],[4986.0,5104.84,4942.16,5061.0]],"pattern":"range_sr"}},{"module":"Module 4","topic":"Macro Drivers","layer":2,"id":"M4-MAC-003","status":"LIVE","scenario":"Fed announcement: rate held steady at 5.25%, statement suggests potential cuts in coming meetings","question":"The Fed holds rates steady but hints at future cuts. How would you expect the market to react?","options":{"A":"Markets usually rally on dovish Fed signals \u2014 the expectation of lower rates ahead is bullish for equities because cheaper borrowing boosts corporate earnings and makes stocks more attractive vs bonds","B":"Markets sell off because holding rates means the Fed thinks the economy is too strong","C":"No impact \u2014 markets only react to actual rate changes, not forward guidance or dot plots","D":"Markets crash because rate cuts signal the economy is in serious trouble and recession is imminent"},"correct":"A","correctFeedback":"Markets are forward-looking. The hint of future cuts is often more powerful than the cut itself. Lower rates = cheaper borrowing, higher valuations, and money flowing from bonds into equities. 'Don't fight the Fed' works both ways.","incorrectFeedback":"The market prices in expectations, not just actions. Dovish language from the Fed signals easier monetary policy ahead, which typically supports equity valuations \u2014 even before the first cut happens.","chart":{"symbol":"AAPL","interval":"D","range":"6","candles" tter-than-expected CPI pushes back rate cut expectations, which is bearish for equities in the near term. Watch the bond market's reaction for confirmation.","chart":{"symbol":"AAPL","interval":"D","range":"6","candles":[[475,475.7,470.31,471.27],[471.15,471.62,468.99,469.1],[469.2,469.32,467.34,467.59],[467.75,468.27,467.06,467.16],[467.38,468.26,467.36,468.24],[468.57,468.72,464.47,465.45],[465.72,466.71,465.65,466.52],[466.62,470.93,466.4,469.79],[469.8,470.73,459.43,465.58],[465.34,465.62,461.14,463.19],[463.41,464.42,458.75,459.5],[459.85,459.89,457.11,457.12],[457.48,458.07,457.47,458.04],[457.67,462.68,456.98,461.29],[461.16,461.4,456.84,457.22],[457.04,457.59,452.96,453.42],[453.55,453.99,448.56,450.32],[449.89,452.45,447.48,447.63],[447.73,448.77,445.32,448.69]],"pattern":"range_sr"}},{"module":"Module 4","topic":"Macro Drivers","layer":3,"id":"M4-MAC-005","status":"LIVE","scenario":"Scenario: unemployment rising, inflation falling, Fed signaling rate cuts, earnings declining","question":"You see unemployment rising, inflation falling, the Fed signaling cuts, and earnings declining. What phase of the economic cycle does this suggest, and how does it affect your trading?","options":{"A":"This describes late-cycle or early recession conditions. Defensive positioning: reduce risk exposure, favor quality over speculation, and watch for the eventual pivot to recovery when the Fed's cuts start stimulating growth.","B":"This is early recovery \u2014 start buying aggressively since the worst is behind us","C":"This is peak expansion \u2014 load up on growth stocks because all the signals are bullish","D":"Ignore macro entirely \u2014 just follow the technical levels on your charts and trade what you see"},"correct":"A","correctFeedback":"Macro context frames your risk appetite. Rising unemployment + falling inflation + Fed cuts + declining earnings = late cycle. This doesn't mean stop trading \u2014 it means favor quality, reduce size, and be selective. The opportunity comes when the cycle turns, and being aware of where you are helps you catch it.","incorrectFeedback":"These macro signals together suggest a slowing economy. The Fed cutting into declining earnings is typical of late-cycle dynamics. Adjust position sizing, favor defensive sectors, and start watching for signs of a macro bottom.","chart":{"symbol":null,"candles":null}},{"module":"Module 4","topic":"Seasonality & Cycles","layer":3,"id":"M4-MAC-008","status":"LIVE","scenario":"Chart showing VIX term structure and SPX during October \u2014 historically volatile month","question":"October historically has higher volatility. How should this seasonal awareness change your approach?","options":{"A":"Avoid trading entirely in October since the risk of a crash is too high based on historical precedent","B":"Trade exactly the same as any other month \u2014 seasonality has no impact on individual stock setups","C":"Double your position sizes because October dips are always buying opportunities that recover quickly","D":"Adjust position sizing slightly smaller, tighten stops, and be prepared for wider swings \u2014 don't avoid the market, but respect the seasonal tendency for increased volatility"},"correct":"D","correctFeedback":"Seasonality is about adjusting your approach, not sitting out. October's higher volatility means wider daily ranges, more gap risk, and sharper reversals. Trade with smaller size, tighter risk, and expect the unexpected. Some of the best opportunities come from October panic.","incorrectFeedback":"Seasonal awareness is risk management. October volatility doesn't mean don't trade \u2014 it means be prepared for larger swings. Tighter stops, smaller size, and mental preparation for whipsaw moves will serve you well.","chart":{"symbol":"AAPL","interval":"D","range":"6","candles":[[435,436.36,434.76,436.29],[436.44,436.78,436.42,436.74],[436.44,436.46,436.23,436.25],[435.92,437.34,435.78,437.07],[437.37,439.16,436.19,439.12],[439.24,439.32,437.7,438.56],[438.73,439.11,437.18,437.44],[437.66,437.76,436.92,436.94],[436.57,437.03,429.53,429.59],[429.5,430.25,429.44,430.21],[430.19,433.66,429.84,433.3],[433.16,441.44,432.58,441.16],[440.77,441.24,437.49,437.61],[437.88,440.23,437.71,439.87],[439.45,440.24,428.01,428.05],[428.3,437.54,422.81,436.89],[436.88,446.13,436.84,445.66],[445.28,453.99,438.57,438.58],[438.58,438.61,431.17,432.28],[432.54,432.88,429.04,429.23],[429.56,430.47,425.53,428.28]],"pattern":"range_sr"}},{"module":"Module 4","topic":"Business Cycle","layer":1,"id":"M4-BC-001","status":"LIVE","scenario":"Diagram of the 4-stage business cycle: expansion, peak, contraction, trough \u2014 with GDP growth and stock market overlays","question":"The business cycle has four stages. In which stage do stock markets typically peak \u2014 and why is it NOT at the same time as economic peak?","options":{"A":"Markets peak at the same time as the economy because stocks reflect current economic conditions perfectly","B":"Markets don't follow the business cycle at all \u2014 stock prices are completely random and unpredictable","C":"Markets peak during the trough stage because that's when all the bad news is priced in and valuations are lowest","D":"Markets typically peak BEFORE the economic peak because they are forward-looking. Stocks price in future earnings, so by the time the economy is at its strongest, the market has already begun discounting the coming slowdown. This lead time is why 'the market is not the economy.'"},"correct":"D","correctFeedback":"The market is a leading indicator \u2014 it looks 6-12 months ahead. By the time GDP peaks, corporate earnings growth is already slowing. Smart money sees the deceleration coming and sells into the strength. This is why buying when the economy 'feels great' is often late.","incorrectFeedback":"Markets lead the economy by 6-12 months on average. They peak before the economic peak because they discount future earnings. When everyone feels optimistic about the economy, the market has often already priced in that optimism \u2014 and is looking at the next chapter.","chart":{"symbol":null,"candles":null}},{"module":"Module 4","topic":"Business Cycle","layer":2,"id":"M4-BC-002","status":"LIVE","scenario":"Scenario: GDP growth is slowing from 3% to 1%, unemployment ticking up from 3.5% to 4%, Fed starting to cut rates","question":"GDP is decelerating, unemployment is rising, and the Fed is cutting rates. Where are we in the business cycle, and what does this mean for your portfolio positioning?","options":{"A":"Early expansion \u2014 rate cuts and rising unemployment always signal the beginning of a new bull market immediately","B":"Economic data is useless for trading \u2014 only technical analysis matters for making portfolio decisions","C":"This is the economic peak \u2014 the strongest possible environment for aggressive stock buying and maximum leverage","D":"This combination signals late contraction or early trough. The economy is weakening, but rate cuts suggest the Fed is responding. Historically, the period around the first rate cuts is volatile but often marks the BEGINNING of the next bull market \u2014 not the end. Sectors like utilities, healthcare, and bonds tend to outperform during this stage."},"correct":"D","correctFeedback":"Late contraction/early trough is uncomfortable but historically rewarding for forward-looking investors. Rate cuts signal the Fed is easing, which eventually stimulates growth. The market often bottoms before the economy does \u2014 so by the time the recession is official, the bottom may already be in.","incorrectFeedback":"This stage of the cycle is where most investors are fearful. But rate cuts + pessimism is often the cocktail that precedes the next bull market. The key: you don't need to time the exact bottom. Knowing where you are in the cycle helps you position defensively now while preparing for the recovery.","chart":{"symbol":null,"candles":null}},{"module":"Module 4","topic":"Business Cycle","layer":3,"id":"M4-BC-003","status":"LIVE","scenario":"Scenario: you're in mid-expansion \u2014 GDP growing 2.5%, unemployment at 3.8%, earnings growing, Fed on hold","question":"Mid-expansion: economy growing, earnings solid, Fed on hold. How should this macro backdrop influence your TECHNICAL trading decisions?","options":{"A":"Ignore the macro environment completely \u2014 it has no influence on chart patterns or technical setups","B":"Only trade macro events like Fed meetings and GDP releases since technical analysis is irrelevant during expansion","C":"Use the macro backdrop as a directional bias. In mid-expansion, lean bullish \u2014 favor long setups over shorts, hold winners longer, and be more aggressive on pullback entries. The rising economic tide supports your technical setups. Macro provides the 'wind direction,' technicals provide the specific entry.","D":"Go 100% into growth stocks with maximum leverage since mid-expansion guarantees continued upside for all equities"},"correct":"C","correctFeedback":"Macro + technicals = complete picture. The business cycle tells you which direction to lean. Mid-expansion = bullish bias. This doesn't mean every trade should be long, but when your technical analysis shows a bullish setup AND the macro environment supports it, your conviction should be higher.","incorrectFeedback":"Think of macro analysis as setting the table for your technical trades. In mid-expansion, the economic wind is at your back for long positions. Your technical analysis finds the specific entries \u2014 but knowing the macro environment helps you size positions, choose direction, and manage risk more effectively.","chart":{"symbol":null,"candles":null}},{"module":"Module 4","topic":"Sector Rotation","layer":1,"id":"M4-SR-001","status":"LIVE","scenario":"Sector rotation diagram showing which sectors lead during each business cycle phase: early expansion (tech, consumer discretionary), late expansion (energy, materials), contraction (utilities, healthcare, staples)","question":"According to sector rotation theory, which sectors typically lead during early expansion and why?","options":{"A":"Technology and consumer discretionary tend to lead early expansion because consumers regain confidence and start spending. Companies invest in growth. These 'risk-on' sectors benefit most from the acceleration in economic activity and earnings growth.","B":"Energy and utilities lead early expansion because fuel and power demand recover before anything else in the economy","C":"Defensive sectors like utilities and healthcare lead early expansion because investors are still cautious from the prior recession","D":"All sectors perform equally during early expansion since the rising tide lifts all boats uniformly"},"correct":"A","correctFeedback":"Sector rotation follows a logical pattern: early expansion favors growth-sensitive sectors (tech, discretionary) because they have the most earnings leverage to improving conditions. Late expansion favors commodity-linked sectors. Contraction favors defensives. Knowing which sectors SHOULD lead helps you allocate capital.","incorrectFeedback":"The business cycle creates predictable leadership shifts. Early expansion = growth and consumer sectors lead. Late expansion = energy and materials lead. Contraction = defensives lead. This isn't a rigid rule, but it's a framework for understanding why certain sectors outperform at certain times.","chart":{"symbol":null,"candles":null}},{"module":"Module 4","topic":"Sector Rotation","layer":2,"id":"M4-SR-002","status":"LIVE","scenario":"Scenario: XLK (tech) has been leading for 18 months, but XLE (energy) and XLB (materials) are starting to outperform while XLK stalls","question":"Tech has led for 18 months but is now stalling while energy and materials start outperforming. What might this rotation signal about the business cycle?","options":{"A":"Nothing \u2014 sector leadership changes are random and don't reflect business cycle positioning at all","B":"This rotation means tech will never lead again and you should permanently avoid the sector going forward","C":"Tech stalling means a recession is starting and you should move entirely to cash immediately","D":"A potential shift from mid to late expansion. When leadership rotates from growth sectors (tech) to cyclical commodity sectors (energy, materials), it often signals the economy is heating up. Late expansion is when inflation picks up and commodity demand peaks \u2014 which benefits energy/materials but pressures growth stocks."},"correct":"D","correctFeedback":"Sector rotation is like a relay race through the business cycle. When the baton passes from tech/growth to energy/materials, it suggests we're moving from mid to late cycle. This doesn't mean sell everything \u2014 but it means adjust your allocations. Reduce growth overweight, add commodity exposure, and watch for signs of the peak.","incorrectFeedback":"Leadership transitions reveal where we are in the cycle. Tech \u2192 energy/materials is a classic mid-to-late rotation. The economy is strong enough to drive commodity demand, but the growth-sensitive sectors are losing steam. Use this information to tilt your portfolio, not to make dramatic all-or-nothing bets.","chart":{"symbol":"XLK","interval":"D","range":"6","candles":[[200,200.85,199.82,200.75],[200.56,200.69,200.05,200.07],[200.16,201.56,200.11,201.53],[201.58,202.57,199.36,199.78],[199.66,199.84,197.54,197.99],[198.14,198.2,195.78,197.68],[197.6,202.91,196.82,202.19],[202.03,203.35,201.83,203.14],[203.01,203.19,202.23,202.26],[202.29,205.39,201.98,202.92],[203.08,203.13,201.46,201.66],[201.59,202.42,201.4,202.41],[202.24,202.72,199.61,199.99],[200.02,200.21,196.55,197.05],[197.03,197.39,196.64,197.35],[197.48,199.29,197.29,199.17],[199.23,199.24,198.17,198.33],[198.33,200.48,198.32,199.25],[199.05,202.85,198.72,202.84],[202.89,203.38,200.45,200.79],[200.85,201.57,200.73,201.47],[201.29,201.34,196.31,199.16],[199.33,199.67,193.43,197.16]],"pattern":"range_sr"}},{"module":"Module 4","topic":"Sector Rotation","layer":3,"id":"M4-SR-003","status":"LIVE","scenario":"Scenario: economic data is weakening, Fed starts cutting rates, and you notice utilities (XLU) and healthcare (XLV) breaking out to new highs while SPY is flat","question":"The economy is weakening, the Fed is cutting, and defensive sectors (utilities, healthcare) are breaking out while the broad market is flat. How do you position?","options":{"A":"Buy SPY aggressively since rate cuts always lead to a broad market rally immediately and without exception","B":"Ignore sector rotation and trade only individual stock setups based on technical analysis without any sector-level considerations","C":"Rotate defensively. Utilities and healthcare outperforming during economic weakness is textbook late-cycle positioning. Increase allocation to defensives, reduce exposure to cyclicals and high-beta growth, and consider adding bond exposure. The market is telling you where the smart money is hiding.","D":"Short all defensive sectors since their breakout is a false signal caused by algorithmic trading errors"},"correct":"C","correctFeedback":"When defensive sectors lead while the broad market stalls, institutional money is repositioning for a downturn. Follow the money: utilities and healthcare outperforming = risk-off. Rate cuts during weakness = Fed trying to prevent recession. Your portfolio should reflect this reality \u2014 lean defensive, reduce risk, protect capital.","incorrectFeedback":"Sector rotation provides real-time clues about institutional positioning. Defensives leading + weakening economy + rate cuts = late cycle. This is where capital preservation becomes more important than capital growth. You don't have to sell everything, but your allocation should tilt toward safety.","chart":{"symbol":"SPY","interval":"D","range":"6","candles":[[558.42,559.43,557.41,558.42],[558.42,563.23,556.93,561.74],[561.74,562.44,559.15,559.85],[559.85,560.57,555.03,555.75],[555.75,557.23,552.3,553.78],[553.78,560.58,552.81,559.61],[559.61,561.88,559.06,561.33],[561.33,562.67,558.39,559.73],[559.73,560.97,553.29,554.53],[554.53,555.29,554.02,554.78],[554.78,561.23,553.7,560.15],[560.15,562.73,558.69,561.27],[561.27,561.91,558.54,559.18],[559.18,559.97,552.81,553.6],[553.6,557.56,552.1,556.06],[556.06,561.13,555.16,560.23],[560.23,562.16,559.65,561.58],[561.58,562.97,556.61,558.0],[558.0,559.17,552.23,553.4],[553.4,557.57,552.9,557.07]],"pattern":"uptrend"},"chart2":{"symbol":"XLU","interval":"D","candles":[[71.04,71.21,70.87,71.04],[71.04,71.35,70.79,71.1],[71.1,71.32,70.98,71.2],[71.2,71.5,71.08,71.38],[71.38,71.63,71.12,71.37],[71.37,71.79,71.2,71.62],[71.62,71.71,71.5,71.59],[71.59,72.04,71.36,71.81],[71.81,72.07,71.6,71.86],[71.86,72.05,71.77,71.96],[71.96,72.33,71.77,72.14],[72.14,72.39,71.88,72.13],[72.13,72.96,72.02,72.85],[72.85,73.42,72.71,73.28],[73.28,74.24,73.01,73.97],[73.97,74.64,73.81,74.48],[74.48,75.16,74.38,75.06],[75.06,75.94,74.81,75.69],[75.69,76.37,75.48,76.16],[76.16,76.99,76.07,76.9]],"label":"XLU \u2014 breaking out to new highs"}},{"module":"Module 4","topic":"Dollar Index (DXY)","layer":1,"id":"M4-DXY-001","status":"LIVE","scenario":"Chart of the US Dollar Index (DXY) alongside an inverse chart of gold (GLD) \u2014 showing the inverse relationship","question":"The DXY (US Dollar Index) tends to move inversely to gold and many commodities. Why does a stronger dollar pressure commodity prices?","options":{"A":"Commodities are priced in US dollars globally. When the dollar strengthens, the same commodity costs more in foreign currencies, reducing demand. Additionally, a strong dollar often reflects tighter monetary policy, which cools economic activity and commodity consumption.","B":"The relationship is a myth \u2014 the dollar and commodities move independently with no consistent correlation","C":"A strong dollar is always bullish for commodities because it means the US economy is strong and consuming more raw materials","D":"Commodities and the dollar only correlate during recessions \u2014 during expansions they move in the same direction"},"correct":"A","correctFeedback":"The dollar-commodity inverse relationship exists because commodities are globally priced in USD. A stronger dollar = more expensive for international buyers = lower demand. This isn't a perfect 1:1 inverse, but it's a persistent enough relationship to incorporate into your macro analysis.","incorrectFeedback":"Understanding the dollar's impact on commodities helps you anticipate moves. A surging DXY often pressures gold, oil, and emerging market stocks. A weakening DXY tends to support commodities and international stocks. This is one of the most important macro correlations to monitor.","chart":{"symbol":"DXY","interval":"D","range":"6","candles":[[100.27,100.39,100.15,100.27],[100.27,100.67,100.09,100.49],[100.49,100.86,100.41,100.78],[100.78,101.29,100.69,101.2],[101.2,101.49,101.02,101.31],[101.31,101.97,101.19,101.85],[101.85,101.99,101.78,101.92],[101.92,102.57,101.76,102.41],[102.41,102.76,102.26,102.61],[102.61,102.98,102.55,102.92],[102.92,103.46,102.79,103.33],[103.33,103.62,103.15,103.44],[103.44,104.06,103.36,103.98],[103.98,104.15,103.88,104.05],[104.05,104.74,103.86,104.55],[104.55,104.85,104.44,104.74],[104.74,105.13,104.67,105.06],[105.06,105.64,104.88,105.46],[105.46,105.73,105.31,105.58],[105.58,106.18,105.52,106.12],[106.12,106.33,105.97,106.18]],"pattern":"range_sr"},"chart2":{"symbol":"GLD","interval":"D","candles":[[186.14,186.48,185.8,186.14],[186.14,186.63,184.98,185.47],[185.47,185.7,184.72,184.95],[184.95,185.19,184.46,184.7],[184.7,185.19,183.32,183.81],[183.81,184.13,183.48,183.8],[183.8,183.98,182.66,182.84],[182.84,183.28,182.28,182.72],[182.72,183.13,181.62,182.03],[182.03,182.2,181.36,181.53],[181.53,181.88,180.91,181.26],[181.26,181.73,179.92,180.39],[180.39,180.6,180.16,180.37],[180.37,180.63,179.14,179.4],[179.4,179.88,178.82,179.3],[179.3,179.59,178.3,178.59],[178.59,178.77,177.93,178.11],[178.11,178.55,177.38,177.82],[177.82,178.19,176.59,176.96],[176.96,177.12,176.78,176.94],[176.94,177.3,175.61,175.97]],"label":"GLD \u2014 moving inversely to the dollar"}},{"module":"Module 4","topic":"Dollar Index (DXY)","layer":2,"id":"M4-DXY-002","status":"LIVE","scenario":"DXY chart breaking out to new highs alongside SPY chart beginning to show weakness","question":"The DXY is breaking out to new highs while SPY is showing relative weakness. How does a strengthening dollar put pressure on equities?","options":{"A":"They're unrelated \u2014 currency markets and stock markets operate in completely separate universes","B":"When the dollar rises, all stocks decline equally since the dollar is the world's reserve currency","C":"A strong dollar is always bullish for US stocks because it shows confidence in the American economy","D":"A rising dollar means money is flowing into the dollar and out of other assets \u2014 that tightens liquidity and puts pressure on stocks. It also hurts big US companies that sell overseas, because their foreign revenue is worth less when converted back to dollars. Both of these weigh on SPY."},"correct":"D","correctFeedback":"When the dollar strengthens, it's pulling money toward itself and away from stocks and other risk assets \u2014 think of it like a vacuum on liquidity. On top of that, a lot of S&P 500 companies make money overseas. When the dollar is strong, that foreign revenue shrinks when they convert it back to USD. So a rising DXY hits equities from two angles: less liquidity and weaker earnings for companies with global sales.","incorrectFeedback":"A strong dollar affects stocks in two ways. First, money flowing into the dollar means less money available for stocks \u2014 tighter liquidity. Second, companies that earn money overseas see those earnings shrink when converted back to a stronger dollar. That's why you'll often see SPY weaken when DXY is breaking higher \u2014 the dollar strength is working against equities on both fronts.","chart":{"symbol":"DXY","interval":"D","range":"6","candles":[[103,103.04,102.99,103.04],[102.96,103.08,102.94,103.07],[103.16,103.44,103.14,103.43],[103.4,103.54,103.37,103.51],[103.52,103.53,103.5,103.5],[103.52,103.77,103.19,103.23],[103.29,103.33,103.09,103.28],[103.36,103.55,103.35,103.52],[103.44,104.19,103.27,104.03],[104.05,104.27,104.01,104.25],[104.19,104.34,104.06,104.08],[104.09,104.1,103.97,104.02],[104.06,104.1,103.69,103.91],[103.95,104.01,103.69,103.72],[103.63,103.66,103.62,103.66],[103.6,103.62,103.52,103.53],[103.54,103.57,103.53,103.57],[103.66,104.58,103.62,104.54],[104.48,104.55,104.24,104.24],[104.31,104.34,104.09,104.11],[104.01,104.35,103.94,104.3],[104.37,104.82,104.3,104.63],[104.54,105.02,104.47,104.83],[104.84,105.6,104.68,104.97],[104.87,105.12,104.87,105.07],[105.0,105.01,104.77,104.9],[104.97,105.55,104.93,105.51]],"pattern":"range_sr","label":"Chart A: US Dollar (DXY)"},"chart2":{"symbol":"SPY","interval":"D","candles":[[450,450.78,449.98,450.77],[450.53,452.85,450.47,451.59],[451.53,453.5,451.37,453.09],[452.97,455.41,452.28,455.3],[455.46,456.62,454.62,454.81],[454.44,454.68,453.23,453.33],[453.12,453.97,452.98,453.81],[454.04,454.19,452.15,452.26],[452.14,453.31,452.09,453.17],[453.56,454.19,453.25,454.13],[454.33,455.62,454.12,455.4],[455.68,456.71,455.53,455.77],[455.96,456.9,447.36,451.18],[451.15,451.27,450.64,450.69],[450.56,451.44,450.46,451.34],[451.36,451.58,448.44,450.34],[450.05,450.1,449.45,449.52],[449.31,449.48,448.45,448.61],[449.01,449.45,447.72,447.73],[447.71,448.04,447.64,448.04],[448.17,450.2,447.79,450.12],[449.97,453.16,447.98,453.14],[453.15,454.5,451.87,452.1],[452.15,452.24,450.2,450.37],[450.03,450.7,448.43,448.73],[448.92,449.13,446.96,447.16],[447.48,448.2,444.02,444.8],[445.09,446.06,444.52,445.93],[446.07,449.4,442.85,443.74]],"label":"Chart B: S&P 500 (SPY)"}},{"module":"Module 5","topic":"Multi-Tool Analysis","layer":1,"id":"M5-MTA-001","status":"LIVE","scenario":"NVDA daily: price at resistance ($947), RSI showing bearish divergence after peaking at 72, bearish engulfing candle forming","question":"Look at this chart carefully. How many bearish signals are present?","options":{"A":"One \u2014 only the candlestick pattern counts since it's the most recent data point on the chart","B":"Two \u2014 the bearish engulfing and resistance, but RSI doesn't matter here","C":"Four \u2014 each signal is independent and there's also a fourth signal from the volume profile","D":"Three \u2014 price at resistance, RSI bearish divergence (RSI made a lower high while price made a higher high), and a bearish engulfing candle are all converging at the same time"},"correct":"D","correctFeedback":"Confluence \u2014 three independent bearish signals at once. Price is stalling at resistance, the RSI peaked earlier and is now making a lower high even as price pushes higher (bearish divergence \u2014 momentum is fading), and a bearish engulfing candle confirms sellers stepping in. Each one alone is moderate. Together, they stack conviction.","incorrectFeedback":"Count the signals: (1) price at resistance, (2) RSI bearish divergence \u2014 RSI peaked at the earlier high and is now lower even though price is higher, meaning momentum is weakening, (3) bearish engulfing candle. When multiple independent tools agree, the probability of a reversal goes up.","chart":{"symbol":"NVDA","interval":"D","range":"6","candles":[[880,883.92,879.25,883.77],[883.17,883.92,879.81,880.55],[880.7,884.51,880.05,883.84],[883.74,888.22,882.98,888.07],[888.38,888.72,887.16,887.17],[887.46,889.83,884.22,884.25],[883.7,884.98,883.55,884.77],[885.33,885.48,884.08,884.12],[883.55,896.17,870.41,893.82],[894.39,898.05,894.27,897.98],[898.33,901.73,897.98,900.02],[899.39,899.41,898.88,898.93],[898.55,900.66,894.73,894.86],[894.07,908.25,891.95,905.42],[905.81,925.56,904.85,915.37],[914.78,914.79,914.18,914.26],[913.67,914.39,906.34,907.79],[908.53,915.94,907.91,915.03],[915.28,915.59,909.39,910.02],[909.97,911.12,904.22,905.52],[905.94,907.75,902.47,907.67],[906.78,912.12,905.81,911.71],[912.56,913.77,912.28,913.75],[913.36,913.46,910.53,911.15],[910.51,912.26,910.1,912.22],[911.87,930.39,907.09,930.28],[930.75,931.79,926.03,926.09],[925.3,925.72,922.18,922.79],[923.45,925.31,915.48,921.76],[921.4,924.34,920.8,924.18],[923.26,924.83,923.23,924.14],[924.78,925.11,921.77,922.11],[921.38,938.11,920.45,937.95],[938.15,947.2,937.85,946.7],[947.0,947.3,934.44,934.94]],"pattern":"bearish_engulfing","overlays":{"srLines":[{"price":947,"label":"Resistance","color":"#ef5350"}],"rsi":{"values":[40.0,44.0,48.0,45.0,42.0,45.37,51.63,55.0,51.0,47.0,49.85,55.15,58.0,54.0,50.0,50.37,51.4,52.97,54.97,57.26,59.73,62.27,64.74,67.03,69.03,70.6,71.63,72.0,66.0,60.0,61.3,63.7,65.0,66.0,58.0],"period":14}},"highlightLast":2}},{"module":"Module 5","topic":"Multi-Tool Analysis","layer":2,"id":"M5-MTA-002","status":"LIVE","scenario":"TSLA daily: price approaching resistance (~$258), RSI neutral around 52, small green candle on below-average volume","question":"Price is approaching resistance but RSI is neutral around 52 and volume is below average. How do you read this setup?","options":{"A":"Buy immediately \u2014 price is near resistance so it must be about to break through","B":"This move up lacks conviction. RSI isn't confirming strong momentum and volume is weak. Without those confirmations, this push toward resistance is more likely to stall or fail. Wait for follow-through before committing.","C":"Sell short because the move will definitely fail without volume support behind it","D":"RSI at 52 is bullish enough to confirm the move since it's above the 50 midline"},"correct":"B","correctFeedback":"Not all moves toward resistance are worth trading. This one lacks conviction \u2014 volume is below average and RSI is neutral, meaning momentum isn't behind the move. The strongest pushes through resistance have a volume surge, RSI trending higher, and strong candle bodies. Missing those = watch and wait, don't chase.","incorrectFeedback":"Quality matters. Price approaching resistance is step one, but confirmation from volume and momentum is what makes it tradeable. Without those, you're buying into a move that's more likely to stall. Patience pays.","chart":{"symbol":"TSLA","interval":"D","range":"6","candles":[[235,235.04,233.7,233.92],[234.09,234.44,232.06,232.35],[232.48,232.62,231.07,231.29],[231.11,232.87,228.7,229.73],[229.68,233.29,226.84,233.05],[233.06,236.43,229.03,236.11],[236.02,240.78,235.93,240.3],[240.11,240.15,238.94,239.01],[238.96,241.47,238.69,240.94],[240.96,254.33,239.79,248.3],[248.3,248.31,246.16,246.61],[246.67,247.74,242.88,243.03],[242.86,244.33,234.26,235.1],[235.13,236.96,234.95,236.56],[236.68,237.79,229.41,233.35],[233.45,236.58,233.1,236.11],[236.27,237.17,236.2,236.68],[236.89,236.95,235.89,236.05],[236.27,236.85,234.88,235.13],[235.05,246.19,234.37,246.05],[246.24,246.28,245.75,245.79],[245.56,247.12,242.5,242.94],[243.16,244.36,237.87,238.5],[238.67,240.12,228.08,234.93],[235.06,237.47,234.77,237.03],[237.16,251.08,235.56,245.93],[246.11,246.31,244.98,245.18],[245.42,245.99,245.37,245.94],[245.73,249.95,244.82,249.92],[249.96,249.99,249.16,249.21],[249.14,249.71,244.38,245.12],[245.24,245.45,241.78,241.88],[242.02,244.08,241.98,243.61],[243.4,251.46,242.7,251.35],[251.52,252.6,250.15,250.2],[250.09,253.86,249.48,253.02],[253.14,254.08,252.97,253.88],[254.02,254.45,253.95,254.38],[254.17,255.1,254.08,255.1]],"pattern":"uptrend","overlays":{"srLines":[{"price":257.7,"label":"Resistance","color":"#ef5350"},{"price":230,"label":"Support","color":"#26a69a"}],"rsi":{"values":[52.0,54.07,57.93,60.0,54.0,48.0,51.89,59.11,63.0,58.59,50.41,46.0,49.11,54.89,58.0,54.63,48.37,45.0,49.41,57.59,62.0,58.11,50.89,47.0,49.07,52.93,55.0,54.79,54.22,53.42,52.5,51.58,50.78,50.21,50.0,53.0,56.0,54.0,52.0],"period":14}}}},{"module":"Module 5","topic":"Risk Management","layer":2,"id":"M5-MTA-003","status":"LIVE","scenario":"Scenario: student has $10,000 account, wants to risk 5% per trade on a volatile biotech stock","question":"A student with a $10,000 account wants to risk 5% ($500) per trade on a volatile biotech. What guidance would you give them about position sizing?","options":{"A":"5% per trade is fine for a small account since you need larger positions to grow the account quickly","B":"Risk 10% per trade instead \u2014 with a small account, you need to be aggressive to see meaningful returns","C":"It depends on the strategy and conviction. FTA's sizing rules: day trades are capped at 1-2% of the account; swing trades use the 5-10-15% rule, 'sized for zero' \u2014 you only put up an amount you can afford to lose entirely. 5% ($500) is the lowest swing tier, so it's acceptable ONLY if this is a swing setup and losing the full $500 wouldn't hurt the account or their decision-making. For a day trade, it's 3-5x too big.","D":"Position sizing doesn't matter as long as you have a stop loss in place to limit your downside"},"correct":"C","correctFeedback":"Size it for zero \u2014 that's the rule that keeps you alive. Swing trades: 5-10-15% of the portfolio based on how strongly the setup aligns \u2014 5% for an okay setup, more only when everything lines up. Day trades: 1-2% max, because capital burns fast intraday. On a volatile biotech, stay at the bottom of the range and treat the full amount as an acceptable loss BEFORE you enter. If losing $500 would sting or shake your next decision, size down.","incorrectFeedback":"FTA's position sizing framework: 1-2% of the portfolio for day trades, 5-10-15% for swing trades depending on conviction \u2014 and every position is 'sized for zero,' meaning you only put up what you can afford to lose completely. A volatile name gets the low end of the range. Sizing this way is what lets you survive the losing streaks every trader eventually hits.","chart":{"symbol":null,"candles":null}},{"module":"Module 5","topic":"Risk Management","layer":3,"id":"M5-MTA-004","status":"LIVE","scenario":"Full analysis scenario: AMZN daily with all tools available \u2014 S/R, RSI, candlesticks, and macro context","question":"Walk through how you'd analyze AMZN for a potential trade using everything you've learned. What's your checklist?","options":{"A":"Start with macro context (is the broad market bullish?), then identify S/R levels on the chart, check RSI for momentum and potential divergence, look for candlestick confirmation at key levels, then set your entry, stop, and target based on risk management rules.","B":"Only look at candlestick patterns since they contain all the information you need about buyer/seller dynamics","C":"Just check RSI \u2014 if it's oversold, buy. If it's overbought, sell. Keep it simple and don't overcomplicate the process.","D":"Start with the 1-minute chart for precision entries, then zoom out to confirm with the daily chart afterward"},"correct":"A","correctFeedback":"The complete checklist: (1) Macro \u2014 is the environment favorable? (2) S/R \u2014 where are the key levels? (3) RSI \u2014 what's momentum doing? Any divergence? (4) Candlesticks \u2014 is there a confirming pattern at a key level? (5) Risk management \u2014 entry, stop, target, position size. This is how you layer every module together into a complete trading process.","incorrectFeedback":"This is where it all comes together. You don't use these tools in isolation \u2014 you build a case. Each tool either confirms or contradicts. The more tools that agree, the higher your conviction. And risk management is ALWAYS the final step before execution.","chart":{"symbol":null,"candles":null}},{"module":"Module 5","topic":"Multi-Tool Analysis","layer":3,"id":"M5-MTA-005","status":"LIVE","scenario":"Scenario: your technical analysis says buy, but the macro environment is deteriorating (rising rates, earnings declining)","question":"Your chart setup looks perfect \u2014 bullish divergence at support with a hammer candle. But the macro picture is bearish (rising rates, falling earnings). What do you do?","options":{"A":"Always trust your charts over macro \u2014 technicals are real-time while macro data is lagging and already priced in","B":"Never trade against the macro environment regardless of how good the technical setup looks on your chart","C":"Take the trade but with reduced conviction \u2014 smaller position size, tighter stop, quicker profit target. The technical setup is valid but the macro headwind means you should expect less follow-through.","D":"Wait exactly 30 days for the macro picture to improve before considering any new long positions"},"correct":"C","correctFeedback":"This is the art of trading. A great technical setup in a bad macro environment can still work \u2014 but the odds are lower and the reward may be capped. Reduce size, take quicker profits, and respect that the wind is in your face. You don't need to choose one or the other \u2014 you adjust.","incorrectFeedback":"When technicals and macro conflict, adjust your expectations and risk. The setup may work, but treat it as a lower-probability trade. Smaller size and tighter management account for the macro headwind.","chart":{"symbol":null,"candles":null}},{"module":"Module 5","topic":"Risk-to-Reward","layer":1,"id":"M5-RR-001","status":"LIVE","scenario":"Trade setup diagram: entry at $100, stop loss at $95, price target at $115. R:R calculation shown","question":"A trade has an entry at $100, a stop loss at $95, and a target at $115. What is the risk-to-reward ratio?","options":{"A":"3:1 \u2014 you're risking $5 to potentially make $15. For every dollar of risk, you stand to gain three dollars if the trade reaches your target.","B":"1:3 \u2014 the risk is always listed as the larger number since the stop loss is closer to the entry price","C":"5:15 \u2014 risk-to-reward should always be expressed in raw dollar amounts rather than as a ratio","D":"15:5 \u2014 calculate by dividing the target by the stop loss distance from zero"},"correct":"A","correctFeedback":"Risk = entry to stop ($100 - $95 = $5). Reward = entry to target ($115 - $100 = $15). R:R = $15/$5 = 3:1. This means the trade needs to work only 1 out of every 4 times to break even (a 25% win rate). Higher R:R ratios give you a larger margin of error.","incorrectFeedback":"R:R is the foundation of trade planning. Risk = what you lose if wrong. Reward = what you gain if right. Here: $5 risk, $15 reward = 3:1. This ratio determines how often you need to be right to be profitable \u2014 a 3:1 trade only needs to work 25%+ of the time.","chart":{"symbol":null,"candles":null}},{"module":"Module 5","topic":"Risk-to-Reward","layer":2,"id":"M5-RR-002","status":"LIVE","scenario":"Two trade setups: Trade A has 60% win rate and 1:1 R:R. Trade B has 40% win rate and 3:1 R:R.","question":"Trade A wins 60% of the time with 1:1 R:R. Trade B wins 40% of the time with 3:1 R:R. Which is more profitable over 100 trades, and why?","options":{"A":"Trade A \u2014 a 60% win rate is always more profitable than 40% because winning more often is the only thing that matters","B":"Trade B. Over 100 trades: Trade A = 60 wins \u00d7 $1 - 40 losses \u00d7 $1 = +$20. Trade B = 40 wins \u00d7 $3 - 60 losses \u00d7 $1 = +$60. Trade B makes 3x more despite winning less often. R:R matters more than win rate.","C":"Both are equally profitable since win rate and R:R always offset each other perfectly in all trading systems","D":"Neither is profitable \u2014 you need both a high win rate AND a high R:R to make money in the markets"},"correct":"B","correctFeedback":"This is the most important math in trading. Win rate alone means nothing without R:R context. Trade B wins less often but makes much more per win. The formula: (Win% \u00d7 Avg Win) - (Loss% \u00d7 Avg Loss) = expectancy. Trade B's expectancy is 3x higher. Chase good R:R, not high win rates.","incorrectFeedback":"Most beginners obsess over win rate. But the math proves that a low win rate with a high R:R often crushes a high win rate with a poor R:R. The key metric is expectancy: how much you make on average per trade when you account for both win rate AND R:R together.","chart":{"symbol":"AAPL","interval":"D","range":"6","candles":[[140,141.37,138.41,141.31],[141.25,142.71,140.44,142.63],[142.52,143.25,140.87,141.11],[141.04,146.33,140.46,143.38],[143.42,145.02,143.41,144.47],[144.55,149.63,142.22,149.62],[149.62,150.31,146.61,146.89],[146.98,147.44,144.71,145.18],[145.14,151.87,143.67,151.52],[151.43,155.25,148.1,155.04],[155.01,165.9,154.88,159.71],[159.56,159.67,158.59,158.8],[158.84,161.21,158.05,158.09],[158.0,158.43,154.54,155.07],[155.0,155.63,147.45,153.68],[153.61,161.17,152.91,157.53],[157.48,162.14,156.76,161.29],[161.29,162.1,161.14,162.01],[161.93,166.41,161.74,166.36]],"pattern":"range_sr"}},{"module":"Module 5","topic":"Risk-to-Reward","layer":3,"id":"M5-RR-003","status":"LIVE","scenario":"Scenario: you find a perfect technical setup but the nearest logical stop is $8 away and the realistic target is only $6 away \u2014 a 0.75:1 R:R","question":"You find a beautiful technical setup, but the math gives you a 0.75:1 R:R (risking $8 to make $6). Your stop is at the logical level. What do you do?","options":{"A":"Skip the trade. A negative R:R means you need to be right more than 57% of the time just to break even. No matter how good the setup looks, the math doesn't support it. Discipline means walking away from trades that don't meet your R:R minimum \u2014 even pretty ones.","B":"Move your stop closer to improve the R:R ratio since the math is all that matters for trade selection","C":"Take the trade anyway \u2014 the pattern is too good to pass up regardless of what the R:R calculation shows","D":"Double your position size to compensate for the poor R:R since bigger profits per share offset the ratio"},"correct":"A","correctFeedback":"This is discipline in action. A great-looking pattern with bad R:R is still a bad trade. Moving your stop to 'fix' the R:R creates an arbitrary stop that will get hit by noise. The honest answer: this trade doesn't fit your plan. Wait for a setup where the math works. The market will give you another one.","incorrectFeedback":"Never force a trade to fit your plan by moving the stop. Your stop should be where the thesis breaks \u2014 not where the R:R looks good. If the logical stop creates poor R:R, the trade simply isn't for you. Discipline is saying no to setups that look good but don't do the math.","chart":{"symbol":null,"candles":null}},{"module":"Module 5","topic":"Trade Thesis","layer":1,"id":"M5-TT-001","status":"LIVE","scenario":"Scenario: student wants to buy AAPL because 'it's a good company and the chart looks bullish'","question":"A student's trade thesis is: 'AAPL is a good company and the chart looks bullish.' What's missing from this thesis?","options":{"A":"Nothing \u2014 identifying a good company with a bullish chart is sufficient for a complete trade thesis","B":"The only missing piece is the position size \u2014 entry, stop, and target are optional details for experienced traders","C":"They need to add fundamental analysis with earnings forecasts, revenue projections, and DCF valuations before trading","D":"Specificity. A complete thesis names: the exact entry price and trigger, the stop loss and WHY it's there, the target and what gets you out, and the timeframe. 'Looks bullish' isn't a thesis \u2014 it's a feeling. A thesis is: 'Buy at $185 support on a hammer candle, stop at $182, target $195 resistance, swing trade 1-2 weeks.'"},"correct":"D","correctFeedback":"A trade thesis is your pre-trade checklist. It forces you to define: What triggers the entry? Where does the thesis break (stop)? What's the reward (target)? What's the timeframe? Without these, you're gambling with a hunch. 'Looks bullish' is how you feel. A thesis is how you PLAN.","incorrectFeedback":"Vague theses lead to vague execution. When you define exact levels, you eliminate in-the-moment emotional decisions. Entry, stop, target, and timeframe \u2014 all set before you place the trade. This is what separates a trading plan from a hope.","chart":{"symbol":null,"candles":null}},{"module":"Module 5","topic":"Trade Thesis","layer":2,"id":"M5-TT-002","status":"LIVE","scenario":"NVDA daily chart pulling back to the 20 EMA with a hammer candle forming","question":"This thesis is: buy NVDA at $850 (20 EMA bounce + hammer), stop $838 (below recent swing low), target $880 (prior resistance), R:R 1:2.5, 5-10 day swing. What makes this a GOOD thesis?","options":{"A":"It's too detailed \u2014 simpler theses perform better because they leave room for intuition and adaptability","B":"It would be better with three additional indicators confirming the entry to increase the probability of success","C":"The only thing that makes it good is the R:R ratio \u2014 the entry, stop, and target don't matter as long as the math works","D":"It checks every box: specific entry with a technical trigger (20 EMA + candle confirmation), logical stop (below structure), defined target (prior resistance), favorable R:R (1:2.5), and a timeframe. Every element of the trade is defined BEFORE entry, removing emotional decision-making."},"correct":"D","correctFeedback":"Each component serves a purpose: Entry (WHERE + trigger condition = you don't enter until the setup materializes). Stop (WHERE thesis breaks = automatic risk management). Target (WHERE to take profit = removes greed from the equation). R:R (is the math worth it? Risking $12 for $30 = 1:2.5). Timeframe (how long to give the trade). This is professional-level planning.","incorrectFeedback":"A good thesis is a complete plan that eliminates improvisation. You know exactly what to do if the trade works, and exactly what to do if it doesn't. There are zero decisions to make in the heat of the moment because you made them all in advance.","chart":{"symbol":"NVDA","interval":"D","range":"6","candles":[[820,820.93,819.96,820.81],[821.27,823.87,821.04,823.57],[823.45,824.13,823.43,823.79],[823.16,830.22,822.6,830.2],[829.44,830.47,823.77,824.74],[824.62,825.78,822.62,825.57],[825.81,829.64,825.4,829.62],[830.32,830.44,829.73,829.83],[830.04,839.01,828.04,837.62],[837.37,840.7,836.98,840.13],[840.59,847.17,833.41,842.2],[842.34,842.41,840.77,841.48],[841.75,841.86,838.18,838.29],[838.22,844.56,836.94,843.14],[843.13,843.5,843.06,843.45],[842.63,848.55,841.92,847.99],[847.88,848.72,846.52,846.64],[846.14,855.27,845.81,855.2],[855.65,856.59,851.59,852.03],[852.06,863.31,851.1,859.54],[859.01,859.4,838.26,838.33],[838.77,840.66,838.43,840.52],[839.75,840.61,839.57,840.56],[841.25,847.7,839.43,847.69],[847.42,854.88,847.12,854.62],[854.41,854.92,854.4,854.87],[854.93,858.67,851.82,858.09],[858.51,858.53,857.17,857.27],[858.1,862.38,853.0,862.27],[861.54,880.64,860.31,868.32],[868.32,872.34,864.05,864.25],[863.6,865.08,854.32,861.84],[861.56,861.68,860.65,860.84],[860.96,861.35,855.78,856.63],[854.03,857.03,842.03,856.03]],"pattern":"hammer","overlays":{"lines":[{"values":[820.81,821.07,821.33,822.17,822.41,822.71,823.37,823.99,825.29,826.7,828.18,829.45,830.29,831.51,832.65,834.11,835.3,837.2,838.61,840.6,840.38,840.39,840.41,841.1,842.39,843.58,844.96,846.13,847.67,849.64,851.03,852.06,852.9,853.26,853.52],"color":"#2196f3","label":"20 EMA","width":2}],"srLines":[{"price":838,"label":"Support","color":"#26a69a"}]},"highlightLast":1}},{"module":"Module 5","topic":"Trade Thesis","layer":3,"id":"M5-TT-003","status":"LIVE","scenario":"Scenario: you're in a trade based on a clear thesis. Halfway through, a news headline drops that contradicts your technical setup but price hasn't hit your stop yet.","question":"You have a clear thesis with a defined stop. A negative news headline drops about the stock, but price hasn't hit your stop and technicals haven't changed. What do you do?","options":{"A":"Sell immediately \u2014 news always overrides technical analysis and waiting for your stop means losing more money","B":"Double down \u2014 if the news hasn't moved the price to your stop, it confirms your thesis is stronger than the headline","C":"Evaluate: has the NEWS materially changed the THESIS? If the headline is noise (analyst downgrade, rumor), stick with your plan \u2014 your stop handles the risk. If the news is material (earnings miss, FDA rejection, fraud), the thesis itself may be broken regardless of where price is. Material news can override a technical stop.","D":"Ignore all news completely \u2014 technical traders should never read or consider news under any circumstances"},"correct":"C","correctFeedback":"This is nuanced. Your thesis was built on technical analysis. If the news is noise (opinion, rumor, analyst change), the technicals still hold \u2014 let your stop do its job. But if the news is MATERIAL (the company's fundamentals have genuinely changed), your thesis may be invalidated even before price catches up. Judge the news, not just the headline.","incorrectFeedback":"Not all news is equal. An analyst downgrade or macro headline? Noise \u2014 your stop handles it. An earnings disaster or material legal issue? The foundation of your trade may have changed. The key question: does this news change the REASON I entered? If yes, exit. If no, trust the plan.","chart":{"symbol":null,"candles":null}},{"module":"Module 5","topic":"Choppy vs Trending","layer":1,"id":"M5-CT-001","status":"LIVE","scenario":"Two charts side by side: Chart A shows clean higher highs/lows with price pulling back to a rising 20 EMA. Chart B shows price whipsawing above and below a flat 20 EMA with no clear direction.","question":"Chart A has clean higher highs/lows with price respecting a rising 20 EMA on pullbacks. Chart B has no clear direction with price whipping around a flat 20 EMA. What market conditions do these represent?","options":{"A":"Both charts are trending \u2014 Chart A upward and Chart B sideways, which is just a different type of trend","B":"Both charts are untradeable \u2014 you should only trade during earnings season when direction is clear","C":"Chart B is always about to break out since choppy periods always precede explosive moves higher","D":"Chart A is trending (clear directional movement with price holding above the 20 EMA on pullbacks). Chart B is choppy (no clear direction, price constantly crossing the 20 EMA). The distinction matters because trending and choppy markets require completely different strategies."},"correct":"D","correctFeedback":"This is the most important market assessment you can make: is the market trending or chopping? In Chart A, the 20 EMA acts as dynamic support \u2014 each pullback finds buyers at the EMA. In Chart B, the flat EMA provides no directional edge. Trending = directional strategies work (trend-following, breakouts, pullback entries to the EMA). Choppy = those same strategies will chop you up. Identify the condition FIRST, then choose your tools.","incorrectFeedback":"Before you pick a strategy, pick a condition. In a trending market, the 20 EMA slopes with price and acts as a pullback level. In a choppy market, price crosses the EMA repeatedly with no follow-through. The single biggest improvement most traders can make is learning to identify which environment they're in \u2014 and adjusting (or sitting out) accordingly.","chart":{"symbol":"AAPL","interval":"D","range":"6","candles":[[150,151.52,149.79,151.3],[151.45,156.52,150.59,155.86],[155.87,158.33,153.35,158.07],[158.13,158.15,157.74,157.75],[157.62,162.0,156.47,161.98],[162.04,162.42,161.95,162.38],[162.44,164.64,160.71,160.75],[160.77,161.45,154.66,157.86],[157.79,159.16,157.77,159.11],[159.06,159.44,154.47,154.51],[154.49,160.73,154.33,159.46],[159.35,163.76,159.21,162.92],[162.76,165.57,162.27,165.52],[165.41,167.37,165.41,167.0],[167.08,171.02,164.15,170.82],[170.77,172.66,169.29,169.35],[169.23,170.19,167.14,167.37],[167.29,168.07,163.25,164.16],[164.22,165.13,164.21,164.94],[165.01,169.76,159.52,163.39],[163.26,164.63,163.01,164.4],[164.44,164.73,161.41,162.07],[161.93,162.27,161.4,161.42],[161.4,164.52,160.86,163.89],[163.76,164.76,162.92,163.06],[163.07,165.68,162.33,165.54],[165.43,168.35,165.36,168.09],[168.14,178.23,165.26,178.1],[178.06,178.23,172.43,175.28],[175.34,175.42,173.7,173.93],[173.9,173.98,173.11,173.39],[173.23,173.55,172.03,172.1],[171.99,172.15,171.45,172.14],[172.08,173.81,172.04,173.75],[173.88,174.04,172.07,172.88],[172.87,172.88,172.42,172.47],[172.32,175.53,172.06,174.99],[174.93,176.64,174.62,176.52],[176.68,176.77,175.24,175.91],[175.89,187.03,175.12,186.93]],"pattern":"range_sr","overlays":{"lines":[{"values":[151.3,151.73,152.33,152.85,153.72,154.54,155.13,155.39,155.74,155.62,155.99,156.65,157.49,158.4,159.58,160.51,161.16,161.45,161.78,161.93,162.17,162.16,162.09,162.26,162.34,162.64,163.16,164.58,165.6,166.39,167.06,167.54,167.98,168.53,168.94,169.28,169.82,170.46,170.98,172.5],"color":"#2196f3","label":"20 EMA","width":2}]},"label":"Chart A: Trending"},"chart2":{"symbol":"MSFT","interval":"D","candles":[[165,165.58,164.9,165.53],[165.5,166.2,165.38,166.13],[166.14,166.81,166.11,166.75],[166.69,166.78,166.24,166.32],[166.3,166.94,166.22,166.91],[166.8,167.75,166.71,167.68],[167.83,167.89,167.07,167.47],[167.52,168.33,167.36,168.16],[168.33,168.45,166.13,166.92],[166.8,166.99,162.29,162.63],[162.55,165.16,162.48,164.64],[164.63,166.94,164.6,165.67],[165.52,166.35,164.98,166.25],[166.41,169.71,165.4,167.42],[167.56,167.63,165.79,165.99],[166.01,166.09,165.12,165.32],[165.26,167.25,165.19,166.81],[166.86,166.91,163.12,163.14],[163.06,164.18,162.98,163.65],[163.76,165.96,163.23,165.55],[165.67,166.08,165.29,165.35],[165.37,166.84,165.36,166.2],[166.16,167.84,165.97,166.89],[166.81,167.82,166.58,167.34],[167.44,168.26,166.16,166.41],[166.37,167.03,166.28,166.92],[166.87,166.91,166.51,166.58],[166.59,166.77,163.11,163.12],[163.08,164.22,162.82,164.01],[163.91,165.09,163.8,164.51],[164.59,164.93
