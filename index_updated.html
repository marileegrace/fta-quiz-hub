function toggleOC() {
  var p = document.getElementById("ocPanel");
  var a = document.getElementById("ocArrow");
  if (p.classList.contains("open")) {
    p.classList.remove("open"); a.classList.remove("open");
  } else {
    p.classList.add("open"); a.classList.add("open");
  }
}

function switchExp(el) {
  var btns = document.querySelectorAll(".oc-exp-btn");
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove("active");
  el.classList.add("active");
}

function selScope(t,idx){
  meta.topic=t;
  var chips=document.querySelectorAll(".cp");
  for(var i=0;i<chips.length;i++)chips[i].classList.remove("sl");
  if(t===null)document.getElementById("cp-all").classList.add("sl");
  else document.getElementById("cp-"+idx).classList.add("sl");
}

function startQ(){
  var pool=meta.topic?filterByLayer(MODULES[meta.module][meta.topic]):flatMod(meta.module);
  if(pool.length===0){alert("No questions match your filter. Try selecting more layers.");return}
  qzQ=shuf(pool).slice(0,Math.min(10,pool.length));
  cQ=0;score=0;ansd=false;uAns=[];view="quiz";renderQn();
}

// ========== LIGHTWEIGHT CHARTS ==========
var _activeCharts = [];

function destroyCharts() {
  for (var i = 0; i < _activeCharts.length; i++) {
    try { _activeCharts[i].remove(); } catch(e) {}
  }
  _activeCharts = [];
}

function createChart(containerId, candles, symbol, interval, highlightLast, trendline, overlays, volumeData) {
  var el = document.getElementById(containerId);
  if (!el || !candles || candles.length === 0) return;

  var chart = LightweightCharts.createChart(el, {
    width: el.clientWidth,
    height: el.clientHeight,
    layout: {
      background: { type: "solid", color: "#131722" },
      textColor: "rgba(255,255,255,0.5)",
      fontSize: 11
    },
    grid: {
      vertLines: { color: "rgba(255,255,255,0.04)" },
      horzLines: { color: "rgba(255,255,255,0.04)" }
    },
    crosshair: {
      mode: 0,
      vertLine: { color: "rgba(255,255,255,0.3)", width: 1, style: 2, labelVisible: false },
      horzLine: { color: "rgba(255,255,255,0.3)", width: 1, style: 2, labelBackgroundColor: "#3a3f4b" }
    },
    rightPriceScale: {
      borderColor: "rgba(255,255,255,0.08)",
      scaleMargins: { top: 0.08, bottom: 0.08 },
      minimumWidth: 80
    },
    timeScale: {
      borderColor: "rgba(255,255,255,0.08)",
      timeVisible: false,
      rightOffset: 2,
      visible: false
    }
  });

  var series = chart.addCandlestickSeries({
    upColor: "#26a69a",
    downColor: "#ef5350",
    borderUpColor: "#26a69a",
    borderDownColor: "#ef5350",
    wickUpColor: "#26a69a",
    wickDownColor: "#ef5350"
  });

  // Convert [O,H,L,C] arrays to Lightweight Charts format — consecutive UTC timestamps (no gaps)
  var chartData = [];
  var t0 = 1704067200;
  for (var i = 0; i < candles.length; i++) {
    chartData.push({
      time: t0 + i,
      open: candles[i][0],
      high: candles[i][1],
      low: candles[i][2],
      close: candles[i][3]
    });
  }
  series.setData(chartData);

  // Highlight pattern candles if specified
  if (highlightLast && highlightLast > 0 && chartData.length >= highlightLast) {
    var markers = [];
    var startIdx = chartData.length - highlightLast;
    for (var m = startIdx; m < chartData.length; m++) {
      var d = chartData[m];
      var isUp = d.close >= d.open;
      markers.push({
        time: d.time,
        position: "belowBar",
        color: "#ff9800",
        shape: "arrowUp",
        text: m === startIdx ? "Pattern" : ""
      });
    }
    series.setMarkers(markers);
  }

  // Volume as separate histogram series
  var volSeries = chart.addHistogramSeries({
    priceFormat: { type: "volume" },
    priceScaleId: "vol",
    color: "#26a69a"
  });
  chart.priceScale("vol").applyOptions({
    scaleMargins: { top: 0.85, bottom: 0 },
    visible: false
  });
  var volData = [];
  for (var j = 0; j < chartData.length; j++) {
    var vol = (volumeData && volumeData[j]) ? volumeData[j] : (candles[j][1] - candles[j][2]) * 100000;
    var isUp = candles[j][3] >= candles[j][0];
    volData.push({
      time: chartData[j].time,
      value: vol,
      color: isUp ? "rgba(38,166,154,0.2)" : "rgba(239,83,80,0.2)"
    });
  }
  volSeries.setData(volData);


  // Trendline overlay (straight line: first point to last point only)
  if (trendline && trendline.length >= 2) {
    var lineSeries = chart.addLineSeries({
      color: "#ffeb3b", lineWidth: 2, lineStyle: 0,
      crosshairMarkerVisible: false, priceLineVisible: false, lastValueVisible: false
    });
    var first = trendline[0], last = trendline[trendline.length - 1];
    var lineData = [];
    if (first[0] >= 0 && first[0] < chartData.length) lineData.push({ time: chartData[first[0]].time, value: first[1] });
    if (last[0] >= 0 && last[0] < chartData.length) lineData.push({ time: chartData[last[0]].time, value: last[1] });
    lineSeries.setData(lineData);
  }

  // Overlays: MA lines, Bollinger Bands, Fibonacci, S/R lines
  if (overlays) {
    // MA / EMA lines
    if (overlays.lines) {
      for (var li = 0; li < overlays.lines.length; li++) {
        var lineSpec = overlays.lines[li];
        var maSeries = chart.addLineSeries({
          color: lineSpec.color || "#ff9800", lineWidth: lineSpec.width || 2, lineStyle: 0,
          crosshairMarkerVisible: false, priceLineVisible: false, lastValueVisible: false,
          title: lineSpec.label || ""
        });
        var maData = [];
        for (var mi = 0; mi < lineSpec.values.length; mi++) {
          if (lineSpec.values[mi] !== null && mi < chartData.length) {
            maData.push({ time: chartData[mi].time, value: lineSpec.values[mi] });
          }
        }
        maSeries.setData(maData);
      }
    }
    // Bollinger Bands
    if (overlays.bb) {
      var bbColors = { upper: "rgba(33,150,243,0.4)", middle: "rgba(33,150,243,0.7)", lower: "rgba(33,150,243,0.4)" };
      var bbKeys = ["upper", "middle", "lower"];
      for (var bi = 0; bi < bbKeys.length; bi++) {
        var bk = bbKeys[bi];
        var bbSeries = chart.addLineSeries({
          color: bbColors[bk], lineWidth: bk === "middle" ? 2 : 1, lineStyle: bk === "middle" ? 0 : 2,
          crosshairMarkerVisible: false, priceLineVisible: false, lastValueVisible: false,
          title: bk === "middle" ? "BB Mid" : ""
        });
        var bbData = [];
        var vals = overlays.bb[bk];
        for (var bj = 0; bj < vals.length; bj++) {
          if (vals[bj] !== null && bj < chartData.length) {
            bbData.push({ time: chartData[bj].time, value: vals[bj] });
          }
        }
        bbSeries.setData(bbData);
      }
    }
    // Fibonacci levels
    if (overlays.fib) {
      var fibColors = { "0%": "#ef5350", "23.6%": "#ff9800", "38.2%": "#ffeb3b", "50%": "#4caf50", "61.8%": "#2196f3", "100%": "#ef5350" };
      var fibKeys = Object.keys(overlays.fib);
      for (var fi = 0; fi < fibKeys.length; fi++) {
        var fk = fibKeys[fi];
        series.createPriceLine({
          price: overlays.fib[fk], color: fibColors[fk] || "#888", lineWidth: 1, lineStyle: 2,
          axisLabelVisible: true, title: fk
        });
      }
    }
    // S/R horizontal lines
    if (overlays.srLines) {
      for (var si = 0; si < overlays.srLines.length; si++) {
        var sr = overlays.srLines[si];
        series.createPriceLine({
          price: sr.price, color: sr.color || "#ef5350", lineWidth: 2, lineStyle: 2,
          axisLabelVisible: true, title: sr.label || ""
        });
      }
    }
  }

  // Symbol watermark
  if (symbol) {
    var tf = interval === "W" ? "Weekly" : interval === "5" ? "5min" : "Daily";
    chart.applyOptions({
      watermark: {
        visible: true,
        text: symbol + "  " + tf,
        fontSize: 14,
        color: "rgba(255,255,255,0.12)",
        horzAlign: "left",
        vertAlign: "top"
      }
    });
  }

  _activeCharts.push(chart);

  // Fit content then widen bars to fill the chart
  requestAnimationFrame(function() {
    var spacing = Math.max(8, Math.floor(el.clientWidth / candles.length * 0.85));
    chart.timeScale().applyOptions({ barSpacing: spacing });
    chart.timeScale().fitContent();
  });

  // Handle resize
  var ro = new ResizeObserver(function() {
    chart.applyOptions({ width: el.clientWidth, height: el.clientHeight });
    chart.timeScale().fitContent();
  });
  ro.observe(el);

  // ===== RSI SUB-PANEL =====
  if (overlays && overlays.rsi && overlays.rsi.values) {
    var rsiId = containerId + "_rsi";
    var rsiEl = document.getElementById(rsiId);
    if (rsiEl) {
      var rsiChart = LightweightCharts.createChart(rsiEl, {
        width: rsiEl.clientWidth, height: rsiEl.clientHeight,
        layout: { background: { type: "solid", color: "#131722" }, textColor: "rgba(255,255,255,0.5)", fontSize: 10 },
        grid: { vertLines: { color: "rgba(255,255,255,0.04)" }, horzLines: { color: "rgba(255,255,255,0.04)" } },
        crosshair: { mode: 0, vertLine: { color: "rgba(255,255,255,0.3)", width: 1, style: 2, labelVisible: false }, horzLine: { color: "rgba(255,255,255,0.3)", width: 1, style: 2, labelBackgroundColor: "#3a3f4b" } },
        rightPriceScale: { borderColor: "rgba(255,255,255,0.08)", scaleMargins: { top: 0.05, bottom: 0.05 }, minimumWidth: 80 },
        timeScale: { borderColor: "rgba(255,255,255,0.08)", timeVisible: false, rightOffset: 2, visible: false }
      });

      // RSI line
      var rsiSeries = rsiChart.addLineSeries({
        color: "#a855f7", lineWidth: 2, crosshairMarkerVisible: true,
        priceLineVisible: false, lastValueVisible: false, title: "RSI"
      });
      var rsiData = [];
      for (var ri = 0; ri < overlays.rsi.values.length; ri++) {
        if (overlays.rsi.values[ri] !== null && ri < chartData.length) {
          rsiData.push({ time: chartData[ri].time, value: overlays.rsi.values[ri] });
        }
      }
      rsiSeries.setData(rsiData);
      // Anchor series to force 20-80 range visibility
      var rsiAnchor = rsiChart.addLineSeries({ color: "transparent", lineWidth: 0, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
      if (rsiData.length > 1) { rsiAnchor.setData([{ time: chartData[0].time, value: 20 }, { time: chartData[chartData.length-1].time, value: 80 }]); }

      // Overbought (70), oversold (30), and midline (50) reference lines
      rsiSeries.createPriceLine({ price: 70, color: "rgba(239,83,80,0.5)", lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: "70" });
      rsiSeries.createPriceLine({ price: 30, color: "rgba(38,166,154,0.5)", lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: "30" });
      rsiSeries.createPriceLine({ price: 50, color: "rgba(150,150,150,0.6)", lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: "50" });

      // RSI label
      rsiChart.applyOptions({ watermark: { visible: true, text: "RSI(14)", fontSize: 11, color: "rgba(168,85,247,0.3)", horzAlign: "left", vertAlign: "top" } });

      _activeCharts.push(rsiChart);

      // Sync crosshair between main chart and RSI
      chart.subscribeCrosshairMove(function(param) {
        if (param.time) rsiChart.timeScale().scrollToPosition(chart.timeScale().scrollPosition(), false);
      });

      requestAnimationFrame(function() {
        var rsiSpacing = Math.max(8, Math.floor(rsiEl.clientWidth / candles.length * 0.85));
        rsiChart.timeScale().applyOptions({ barSpacing: rsiSpacing });
        rsiChart.timeScale().fitContent();
      });
      var rsiRo = new ResizeObserver(function() {
        rsiChart.applyOptions({ width: rsiEl.clientWidth, height: rsiEl.clientHeight });
        rsiChart.timeScale().fitContent();
      });
      rsiRo.observe(rsiEl);
    }
  }

  // ===== MACD SUB-PANEL =====
  if (overlays && overlays.macd) {
    var macdId = containerId + "_macd";
    var macdEl = document.getElementById(macdId);
    if (macdEl) {
      var macdChart = LightweightCharts.createChart(macdEl, {
        width: macdEl.clientWidth, height: macdEl.clientHeight,
        layout: { background: { type: "solid", color: "#131722" }, textColor: "rgba(255,255,255,0.5)", fontSize: 10 },
        grid: { vertLines: { color: "rgba(255,255,255,0.04)" }, horzLines: { color: "rgba(255,255,255,0.04)" } },
        crosshair: { mode: 0, vertLine: { color: "rgba(255,255,255,0.3)", width: 1, style: 2, labelVisible: false }, horzLine: { color: "rgba(255,255,255,0.3)", width: 1, style: 2, labelBackgroundColor: "#3a3f4b" } },
        rightPriceScale: { borderColor: "rgba(255,255,255,0.08)", scaleMargins: { top: 0.15, bottom: 0.15 }, minimumWidth: 80 },
        timeScale: { borderColor: "rgba(255,255,255,0.08)", timeVisible: false, rightOffset: 2, visible: false }
      });

      // MACD line (blue)
      var macdLineSeries = macdChart.addLineSeries({
        color: "#2196f3", lineWidth: 2, crosshairMarkerVisible: true,
        priceLineVisible: false, lastValueVisible: false, title: "MACD"
      });
      var macdLineData = [];
      for (var mi = 0; mi < overlays.macd.macdLine.length; mi++) {
        if (overlays.macd.macdLine[mi] !== null && mi < chartData.length) {
          macdLineData.push({ time: chartData[mi].time, value: overlays.macd.macdLine[mi] });
        }
      }
      macdLineSeries.setData(macdLineData);

      // Signal line (orange)
      var sigSeries = macdChart.addLineSeries({
        color: "#ff9800", lineWidth: 1, crosshairMarkerVisible: false,
        priceLineVisible: false, lastValueVisible: false, title: "Signal"
      });
      var sigData = [];
      for (var si2 = 0; si2 < overlays.macd.signalLine.length; si2++) {
        if (overlays.macd.signalLine[si2] !== null && si2 < chartData.length) {
          sigData.push({ time: chartData[si2].time, value: overlays.macd.signalLine[si2] });
        }
      }
      sigSeries.setData(sigData);

      // Histogram (green/red bars)
      var histSeries = macdChart.addHistogramSeries({
        priceFormat: { type: "price", precision: 4 },
        priceLineVisible: false, lastValueVisible: false
      });
      var histData = [];
      for (var hi2 = 0; hi2 < overlays.macd.histogram.length; hi2++) {
        if (overlays.macd.histogram[hi2] !== null && hi2 < chartData.length) {
          histData.push({
            time: chartData[hi2].time,
            value: overlays.macd.histogram[hi2],
            color: overlays.macd.histogram[hi2] >= 0 ? "rgba(38,166,154,0.6)" : "rgba(239,83,80,0.6)"
          });
        }
      }
      histSeries.setData(histData);

      // Zero line
      macdLineSeries.createPriceLine({ price: 0, color: "rgba(255,255,255,0.2)", lineWidth: 1, lineStyle: 2, axisLabelVisible: false, title: "" });

      // MACD label
      macdChart.applyOptions({ watermark: { visible: true, text: "MACD", fontSize: 11, color: "rgba(33,150,243,0.3)", horzAlign: "left", vertAlign: "top" } });

      _activeCharts.push(macdChart);

      requestAnimationFrame(function() {
        var macdSpacing = Math.max(8, Math.floor(macdEl.clientWidth / candles.length * 0.85));
        macdChart.timeScale().applyOptions({ barSpacing: macdSpacing });
        macdChart.timeScale().fitContent();
      });
      var macdRo = new ResizeObserver(function() {
        macdChart.applyOptions({ width: macdEl.clientWidth, height: macdEl.clientHeight });
        macdChart.timeScale().fitContent();
      });
      macdRo.observe(macdEl);
    }
  }
}

function chartHTML(q) {
  if (!q.chart || !q.chart.candles || q.chart.candles.length === 0) return "";
  var isDual = q.chart2 && q.chart2.candles && q.chart2.candles.length > 0;
  if (!window._pendingCharts) window._pendingCharts = [];

  var html = "";
  if (isDual) {
    // Side-by-side layout
    var cidA = "lc_" + Math.random().toString(36).substr(2, 8);
    var cidB = "lc_" + Math.random().toString(36).substr(2, 8);
    var ovA = q.chart.overlays || null;
    var ovB = q.chart2.overlays || null;
    window._pendingCharts.push({
      id: cidA, candles: q.chart.candles, symbol: q.chart.symbol || "",
      interval: q.chart.interval || "D", hl: q.chart.highlightLast || 0,
      tl: q.chart.trendline || null, ov: ovA, vol: q.chart.volume || null
    });
    window._pendingCharts.push({
      id: cidB, candles: q.chart2.candles, symbol: q.chart2.symbol || "",
      interval: q.chart2.interval || "D", hl: q.chart2.highlightLast || 0,
      tl: q.chart2.trendline || null, ov: ovB, vol: q.chart2.volume || null
    });
    html += "<div class='dual-charts'>";
    html += "<div class='dual-col'>";
    if (q.chart.label) html += "<div class='chart-label'>" + esc(q.chart.label) + "</div>";
    html += "<div class='cw cw-dual' id='" + cidA + "'></div>";
    if (ovA && ovA.rsi) html += "<div class='cw-sub cw-sub-dual' id='" + cidA + "_rsi'></div>";
    if (ovA && ovA.macd) html += "<div class='cw-sub cw-sub-dual' id='" + cidA + "_macd'></div>";
    html += "</div><div class='dual-col'>";
    if (q.chart2.label) html += "<div class='chart-label'>" + esc(q.chart2.label) + "</div>";
    html += "<div class='cw cw-dual' id='" + cidB + "'></div>";
    if (ovB && ovB.rsi) html += "<div class='cw-sub cw-sub-dual' id='" + cidB + "_rsi'></div>";
    if (ovB && ovB.macd) html += "<div class='cw-sub cw-sub-dual' id='" + cidB + "_macd'></div>";
    html += "</div></div>";
  } else {
    // Single chart
    var cid = "lc_" + Math.random().toString(36).substr(2, 8);
    var ov = q.chart.overlays || null;
    window._pendingCharts.push({
      id: cid, candles: q.chart.candles, symbol: q.chart.symbol || "",
      interval: q.chart.interval || "D", hl: q.chart.highlightLast || 0,
      tl: q.chart.trendline || null, ov: ov, vol: q.chart.volume || null
    });
    html += "<div class='cw' id='" + cid + "'></div>";
    if (ov && ov.rsi) html += "<div class='cw-sub' id='" + cid + "_rsi'></div>";
    if (ov && ov.macd) html += "<div class='cw-sub' id='" + cid + "_macd'></div>";
  }
  return html;
}

function renderPendingCharts() {
  if (!window._pendingCharts || window._pendingCharts.length === 0) return;
  // Use rAF to ensure container has dimensions before creating chart
  var pending = window._pendingCharts.slice();
  window._pendingCharts = [];
  requestAnimationFrame(function() {
    for (var i = 0; i < pending.length; i++) {
      var p = pending[i];
      createChart(p.id, p.candles, p.symbol, p.interval, p.hl, p.tl, p.ov, p.vol);
    }
  });
}

function renderQn(){
  destroyCharts();
  window._pendingCharts = [];
  var q=qzQ[cQ],tot=qzQ.length,pct=((cQ)/tot*100).toFixed(0);
  var h="<div class=\"qz\"><div class=\"pg\"><div class=\"pgb\"><div class=\"pgf\" style=\"width:"+pct+"%\"></div></div><span class=\"pgt\">"+(cQ+1)+" / "+tot+"</span></div>";
  h+="<div class=\"qc\"><div class=\"qm\"><span class=\"qt tp\">"+esc(q.topic)+"</span><span class=\"qt ly\">Layer "+q.layer+": "+(LN[q.layer]||"")+"</span></div>";
  h+=chartHTML(q);
  var scenLabel=(q.chart&&q.chart.candles&&q.chart.candles.length>0)?"Scenario:":"Chart Setup:";
  h+="<div class=\"scn\"><b>"+scenLabel+"</b> "+esc(q.scenario)+"</div>";
  h+="<div class=\"qx\">"+esc(q.question)+"</div>";
  h+="<div class=\"os\">";
  var letters=["A","B","C","D"];
  for(var i=0;i<4;i++){
    var l=letters[i];
    h+="<div class=\"op\" id=\"o-"+l+"\" onclick=\"pick('"+l+"')\"><span class=\"lt\">"+l+"</span><span>"+esc(q.options[l])+"</span></div>";
  }
  h+="</div><div class=\"fb\" id=\"fb\"></div>";
  // Add options chain reference during Module 6 quiz
  if (meta.module === "Module 6") {
    h += optionsChainHTML();
  }
  h+="</div>";
  h+="<button class=\"nx\" id=\"nxb\" onclick=\"nxt()\">"+(cQ<tot-1?"Next Question":"See Results")+"</button></div>";
  document.getElementById("main").innerHTML=h;
  ansd=false;
  // Render charts after DOM is updated
  setTimeout(renderPendingCharts, 0);
}

function pick(l){
  if(ansd)return;ansd=true;
  var q=qzQ[cQ],ok=l===q.correct;
  if(ok)score++;
  uAns.push({qid:q.id,sel:l,cor:q.correct,ok:ok});
  var letters=["A","B","C","D"];
  for(var i=0;i<4;i++){
    var x=letters[i],e=document.getElementById("o-"+x);
    e.classList.add("ds");
    if(x===q.correct)e.classList.add("ok");
    else if(x===l&&!ok)e.classList.add("no");
    else e.classList.add("dm");
  }
  var fb=document.getElementById("fb");
  fb.className="fb "+(ok?"ok":"no");
  fb.innerHTML="<div class=\"fl\">"+(ok?"Correct!":"Not quite.")+"</div>"+(ok?q.correctFeedback:q.incorrectFeedback);
  fb.style.display="block";
  document.getElementById("nxb").style.display="inline-block";
}

function nxt(){if(cQ<qzQ.length-1){cQ++;renderQn()}else showRes()}

function showRes(){
  view="results";var tot=qzQ.length,pct=Math.round(score/tot*100);
  saveR(meta,score,tot,uAns);
  logToSheet({module:meta.module,topic:meta.topic,score:score,total:tot,answers:uAns});
  var msg="";
  if(pct===100)msg="Perfect score. You crushed it.";
  else if(pct>=80)msg="Strong work. You clearly know this material.";
  else if(pct>=60)msg="Solid foundation. Review the ones you missed and try again.";
  else if(pct>=40)msg="Getting there. Focus on the feedback for missed questions.";
  else msg="Tough module. Review the material and give it another shot.";
  var h="<div class=\"rs\"><h2>"+(meta.topic||MN[meta.module]||meta.module)+"</h2>";
  h+="<div class=\"rs-s\">"+pct+"%</div><div class=\"rs-l\">"+score+" out of "+tot+" correct</div><div class=\"rs-m\">"+msg+"</div>";
  h+="<div class=\"rs-b\"><h3>Question Breakdown</h3>";
  for(var i=0;i<uAns.length;i++){
    var a=uAns[i],q=qzQ[i];
    h+="<div class=\"rr\"><span style=\"font-size:15px\">"+(a.ok?"&#10003;":"&#10007;")+"</span><span style=\"color:var(--tl);min-width:85px\">"+a.qid+"</span><span style=\"flex:1\">"+esc(q.topic)+" (L"+q.layer+")</span>";
    if(!a.ok)h+="<span style=\"color:var(--no);font-size:11px\">You: "+a.sel+" | Answer: "+a.cor+"</span>";
    h+="</div>";
  }
  h+="</div><div class=\"rs-a\"><button class=\"br\" onclick=\"startQ()\">Try Again</button><button class=\"bh\" onclick=\"goHome()\">Back to Modules</button></div></div>";
  document.getElementById("main").innerHTML=h;
}

function openStats(){
  var h=getH(),m=document.getElementById("sModal");m.classList.add("open");
  var tQ=h.length,tA=0,tC=0;
  for(var i=0;i<h.length;i++){tA+=h[i].total;tC+=h[i].score}
  var avg=tA?Math.round(tC/tA*100):0;
  var html="<div class=\"sg\"><div class=\"sx\"><div class=\"n\">"+tQ+"</div><div class=\"l\">Quizzes Taken</div></div><div class=\"sx\"><div class=\"n\">"+tA+"</div><div class=\"l\">Questions Answered</div></div><div class=\"sx\"><div class=\"n\">"+avg+"%</div><div class=\"l\">Average Score</div></div><div class=\"sx\"><div class=\"n\">"+tC+"</div><div class=\"l\">Total Correct</div></div></div>";
  if(h.length){
    html+="<h3 style=\"font-size:13px;color:var(--tl);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px\">Recent Quizzes</h3>";
    var recent=h.slice(-10).reverse();
    for(var i=0;i<recent.length;i++){
      var x=recent[i],d=new Date(x.date).toLocaleDateString("en-US",{month:"short",day:"numeric"});
      html+="<div class=\"hi\"><span style=\"font-weight:600;color:var(--tx)\">"+(x.topic||x.module)+"</span><span style=\"color:var(--gm);font-weight:700\">"+Math.round(x.score/x.total*100)+"%</span><span style=\"color:var(--tl);font-size:10px\">"+d+"</span></div>";
    }
    html+="<button class=\"cl\" onclick=\"if(confirm('Clear all progress?')){localStorage.removeItem('fta_quiz_history');closeSt();updStrk()}\">Clear History</button>";
  }else{
    html+="<p style=\"color:var(--tl);font-size:13px;text-align:center;padding:16px\">No quizzes taken yet!</p>";
  }
  document.getElementById("stC").innerHTML=html;
}
function closeSt(){document.getElementById("sModal").classList.remove("open")}

// Handle window resize to re-render charts
buildSB();renderHome();updStrk();
document.getElementById("sModal").addEventListener("click",function(e){if(e.target===this)closeSt()});

// ========== STUDENT NAME + LOGGING ==========
// Google Apps Script URL — replace with your deployed script URL
var SHEET_URL = "https://script.google.com/macros/s/AKfycbw8s2QlSQAMrM-L6U2BS0hIXY53RXLDv9VkKts52f9BP0Eun51S2aBX1w1EHa1_FSCO/exec";

var studentName = "";

function toTitleCase(s) {
  return s.replace(/\s+/g, " ").trim().toLowerCase().replace(/\b\w/g, function(c){ return c.toUpperCase(); });
}

function showNameModal() {
  var last = "";
  try { last = localStorage.getItem("fta_student_name") || ""; } catch(e) {}
  var overlay = document.createElement("div");
  overlay.className = "nm-overlay";
  overlay.id = "nameModal";
  overlay.innerHTML = '<div class="nm-box">' +
    '<h2>Welcome to FTA Pop Quiz</h2>' +
    '<p>Enter your name to get started. Your quiz results will be tracked so your instructor can follow your progress.</p>' +
    '<input class="nm-input" id="nmInput" type="text" placeholder="Your full name" value="' + last.replace(/"/g, '&quot;') + '" autocomplete="name" />' +
    '<div class="nm-err" id="nmErr"></div>' +
    '<button class="nm-go" id="nmGo" onclick="submitName()">Start Quizzing</button>' +
    '</div>';
  document.body.appendChild(overlay);
  var inp = document.getElementById("nmInput");
  inp.focus();
  inp.select();
  inp.addEventListener("keydown", function(e) { if (e.key === "Enter") submitName(); });
  // Disable button if empty
  function checkEmpty() {
    document.getElementById("nmGo").disabled = inp.value.trim().length < 2;
  }
  inp.addEventListener("input", checkEmpty);
  checkEmpty();
}

function submitName() {
  var raw = document.getElementById("nmInput").value.trim();
  if (raw.length < 2) {
    document.getElementById("nmErr").textContent = "Please enter your name (at least 2 characters)";
    return;
  }
  studentName = toTitleCase(raw);
  try { localStorage.setItem("fta_student_name", studentName); } catch(e) {}
  // Remove modal
  var m = document.getElementById("nameModal");
  if (m) m.remove();
  // Show name in header
  updateHeaderName();
}

function updateHeaderName() {
  var existing = document.getElementById("hdName");
  if (existing) existing.remove();
  if (!studentName) return;
  var span = document.createElement("span");
  span.className = "hd-name";
  span.id = "hdName";
  span.textContent = studentName;
  span.style.cursor = "pointer";
  span.title = "Click to change name";
  span.onclick = function() {
    studentName = "";
    span.remove();
    showNameModal();
  };
  document.querySelector(".hd-r").insertBefore(span, document.querySelector(".hd-r").firstChild);
}

function logToSheet(data) {
  if (!SHEET_URL || SHEET_URL.indexOf("script.google.com") === -1) return;
  try {
    var payload = {
      name: studentName,
      module: data.module,
      topic: data.topic || "All Topics",
      score: data.score,
      total: data.total,
      percent: Math.round(data.score / data.total * 100),
      layer: layerFilter ? layerFilter.join(",") : "All",
      date: new Date().toISOString(),
      details: JSON.stringify(data.answers.map(function(a) {
        return { qid: a.qid, picked: a.sel, correct: a.cor, ok: a.ok };
      }))
    };
    // Use GET via image tag to bypass CORS (Google Apps Script redirects break POST)
    var params = "action=log" +
      "&name=" + encodeURIComponent(payload.name) +
      "&module=" + encodeURIComponent(payload.module) +
      "&topic=" + encodeURIComponent(payload.topic) +
      "&score=" + encodeURIComponent(payload.score) +
      "&total=" + encodeURIComponent(payload.total) +
      "&percent=" + encodeURIComponent(payload.percent) +
      "&layer=" + encodeURIComponent(payload.layer) +
      "&date=" + encodeURIComponent(payload.date) +
      "&details=" + encodeURIComponent(payload.details);
    new Image().src = SHEET_URL + "?" + params;
  } catch(e) { /* silent fail — don't disrupt quiz */ }
}

// Show name modal on load
showNameModal();
