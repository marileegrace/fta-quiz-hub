"incorrectFeedback":"The head in an inverse H&S is always the lowest (deepest) trough. In this pattern, Trough B at $40 is clearly the lowest point, so it's the head. The shoulders (A at $50 and C at $48) are higher than the head.","chart":{"symbol":"AMD","interval":"D","candles":[[65,65.33,63.34,63.58],[63.58,63.59,61.63,61.76],[61.76,62.25,59.76,60.06],[60.11,60.32,58.64,58.96],[59.0,59.31,56.63,56.73],[56.78,56.86,55.88,56.37],[56.41,56.49,54.88,54.98],[54.95,55.52,54.04,54.06],[54.04,54.1,53.54,53.62],[53.63,53.7,52.67,52.73],[52.75,52.92,49.92,49.92],[49.91,52.08,49.49,51.93],[51.91,53.36,51.64,53.13],[53.16,54.27,52.83,53.97],[53.98,55.55,53.62,55.37],[55.42,58.25,55.35,57.87],[57.87,58.19,56.9,56.92],[56.97,57.24,55.43,55.43],[55.48,55.62,55.47,55.59],[55.54,55.65,51.86,51.96],[52.0,52.03,49.64,49.66],[49.69,49.96,44.93,45.72],[45.69,46.02,45.0,46.01],[45.98,46.23,43.42,43.88],[43.84,43.94,42.37,42.79],[42.77,42.98,39.77,40.46],[40.49,41.77,40.42,41.47],[41.44,41.51,41.02,41.07],[41.11,44.04,40.57,44.03],[44.01,47.14,43.91,46.7],[46.69,49.65,46.43,49.18],[49.17,49.77,48.06,48.13],[48.11,55.97,47.72,55.93],[55.95,56.33,54.46,54.53],[54.56,54.92,50.23,50.7],[50.75,52.06,50.2,52.03],[52.02,52.28,49.72,49.8],[49.77,50.19,47.25,47.54],[47.56,48.01,47.31,48.0],[47.95,50.33,47.72,49.91],[49.94,50.34,49.6,50.27],[50.24,51.95,50.11,51.93],[51.89,53.65,51.5,53.4],[53.45,56.65,52.99,56.33],[56.28,57.46,56.25,57.07],[57.12,58.6,56.94,58.26],[58.28,58.35,57.81,57.9],[57.91,60.51,57.47,59.93],[59.88,62.17,59.22,62.13],[62.16,63.11,62.12,62.9],[62.91,63.68,62.37,63.08]]}},{"module":"Module 1","topic":"Head & Shoulders","layer":2,"id":"M1-HS-008","status":"NEW","scenario":"An inverse Head & Shoulders has confirmed on a stock. The head (lowest trough) is at $60, and the neckline is at $75. Price has just broken above the neckline with strong volume. You want to calculate a price target and plan your trade.","question":"What is the measured move price target, and where should you place your stop loss?","options":{"A":"Target $90 (neckline + distance from head to neckline). Stop loss below the right shoulder, or below the neckline if entering after a retest.","B":"Target $135 (double the distance from head to neckline added to the head). Stop loss below the head at $60.","C":"Target $82.50 (halfway between neckline and the measured move). Stop loss at the neckline ($75).","D":"Target $90 (neckline + distance from head to neckline). Stop loss below the head at $60."},"correct":"A","correctFeedback":"The measured move target = neckline + (neckline - head) = $75 + ($75 - $60) = $90. For stop loss placement: if you enter on the initial breakout, place your stop below the right shoulder. If you wait for a pullback and enter on a retest of the neckline as new support, you can place your stop just below the neckline \u2014 a tighter stop that still respects the pattern's structure.","incorrectFeedback":"The measured move formula is: target = neckline + (neckline - head) = $75 + $15 = $90. For stop placement, below the right shoulder is preferred over below the head. The right shoulder stop is tighter, giving you a better risk-to-reward ratio. If price falls below the right shoulder after a neckline break, the pattern is likely failing anyway.","chart":{"symbol":"TSLA","interval":"D","candles":[[80,80.09,79.15,79.28],[79.33,79.57,78.13,78.34],[78.31,78.58,78.04,78.57],[78.51,78.54,78.05,78.11],[78.11,78.88,73.29,73.92],[73.93,74.06,71.82,72.02],[72.06,72.08,71.81,71.83],[71.89,72.06,70.81,70.98],[70.92,71.9,70.91,71.68],[71.7,72.44,69.79,69.8],[69.74,69.75,68.64,68.71],[68.72,68.78,64.82,64.84],[64.89,69.43,64.08,68.55],[68.49,68.76,65.77,65.97],[65.92,73.91,65.46,73.81],[73.77,74.41,71.2,71.45],[71.4,72.38,66.53,67.29],[67.34,67.52,65.78,65.85],[65.86,68.54,65.54,67.5],[67.54,67.85,60.0,60.01],[60.02,65.29,59.34,65.13],[65.09,73.58,64.46,72.7],[72.66,74.6,72.29,73.92],[73.97,74.43,71.78,72.24],[72.31,72.37,70.51,70.67],[70.65,70.84,69.36,69.39], a textbook short entry with a tight stop.","chart":{"symbol":"NVDA","interval":"D","candles":[[158,162.66,157.46,161.97],[162.1,162.11,161.94,161.98],[161.88,162.43,161.52,162.38],[162.25,163.1,162.14,163.08],[162.95,165.06,162.43,164.96],[164.92,165.83,164.71,165.69],[165.83,165.85,164.8,164.95],[165.05,168.86,164.5,168.86],[168.75,170.17,168.16,170.05],[169.9,170.37,165.85,166.61],[166.61,166.7,162.62,163.5],[163.48,164.69,163.09,164.69],[164.66,164.9,159.97,159.98],[159.87,159.96,159.07,159.11],[159.21,159.34,156.31,157.45],[157.32,157.78,155.26,155.87],[155.94,157.58,155.89,157.48],[157.39,162.22,156.41,161.45],[161.42,163.32,161.3,163.1],[163.23,165.49,163.14,164.85],[164.79,166.2,164.68,166.17],[166.13,168.8,165.54,168.49],[168.45,169.26,168.24,169.19],[169.35,175.11,169.21,175.09],[174.93,175.41,174.88,175.39],[175.44,176.18,175.38,176.05],[175.97,176.9,175.93,176.85],[176.92,179.94,176.86,179.91],[179.77,179.79,177.8,178.3],[178.29,178.55,174.69,175.16],[175.24,176.07,169.7,170.49],[170.6,171.47,165.11,165.12],[165.23,165.41,162.67,162.67],[162.61,164.57,162.46,163.85],[163.77,165.3,163.13,165.17],[165.09,165.5,156.91,156.97],[156.89,159.61,156.66,159.37],[159.41,159.46,158.75,159.03],[159.05,161.92,158.5,161.9],[161.96,164.13,161.61,163.89],[163.8,163.98,163.79,163.96],[163.89,164.49,163.22,164.48],[164.54,168.19,164.26,168.15],[168.31,168.39,164.55,165.14],[165.19,165.35,164.42,164.48],[164.55,164.91,160.05,160.07],[159.94,160.76,158.47,158.7],[158.57,159.77,158.51,159.24],[159.24,159.38,156.06,156.06],[155.98,156.09,153.05,153.59],[153.59,154.32,153.39,154.28],[154.4,154.74,150.92,152.09],[152.11,152.16,151.69,151.77],[151.8,151.95,150.22,150.42],[150.38,150.41,150.15,150.18],[150.06,150.12,147.89,147.96],[147.91,149.96,147.89,149.68],[149.59,149.74,147.69,148.09],[148.04,153.05,147.96,153.05]],"volume":[1060357,1456219,1949008,1980341,1366788,2162410,1992996,1295455,1814723,1043576,1211323,1022861,1271135,1948560,1228931,2101170,1079497,2187917,1411960,1 g harder but still failing to push price higher \u2014 which is actually a bearish sign. The pattern is validated by the neckline break, not by shoulder symmetry.","chart":{"symbol":"META","interval":"D","candles":[[153.5,155.53,151.95,155.48],[155.43,156.94,155.17,156.84],[156.93,157.75,156.76,157.61],[157.68,157.92,156.59,156.75],[156.79,159.98,156.78,158.64],[158.55,159.09,158.43,159.08],[159.06,159.21,157.78,158.07],[158.12,158.22,156.62,156.82],[156.91,158.84,156.84,158.7],[158.66,161.99,158.35,161.59],[161.69,166.49,161.39,165.41],[165.3,169.92,165.18,169.88],[169.92,170.03,162.6,164.83],[164.74,168.54,164.05,168.44],[168.44,169.7,155.64,155.73],[155.74,156.49,155.61,156.38],[156.31,160.37,156.07,158.62],[158.49,159.92,158.33,159.7],[159.75,159.77,159.18,159.3],[159.31,161.89,159.12,161.62],[161.65,162.19,159.44,159.59],[159.65,163.4,157.97,162.79],[162.65,163.0,162.58,162.96],[162.87,164.74,162.78,164.31],[164.42,164.68,161.42,163.08],[163.06,165.68,161.1,165.3],[165.23,165.76,162.78,163.22],[163.06,166.68,163.04,165.93],[165.9,166.15,165.87,166.11],[166.07,179.9,165.79,179.81],[179.83,181.6,170.33,172.34],[172.21,173.05,172.13,172.88],[172.96,173.29,155.39,155.48],[155.51,156.68,155.47,156.63],[156.56,156.96,155.96,156.0],[156.02,159.24,155.83,158.61],[158.67,160.63,158.62,160.35],[160.48,162.2,160.12,161.88],[162.0,163.79,161.64,163.49],[163.63,165.74,163.19,165.32],[165.37,165.37,164.64,165.07],[165.15,166.71,164.88,166.67],[166.79,166.92,166.17,166.31],[166.35,168.01,166.31,167.81],[167.77,168.37,158.81,160.76],[160.86,162.24,152.33,154.43],[154.42,155.42,152.75,154.44],[154.57,155.98,150.84,151.07],[151.04,151.44,145.72,148.1],[148.07,149.06,143.45,145.03]]}},{"module":"Module 1","topic":"Head & Shoulders","layer":2,"id":"M1-HS-011","status":"NEW","scenario":"You're tracking a potential Head & Shoulders top. During the left shoulder rally, volume was high. During the head rally (which made a higher high), volume was noticeably lower than the left shoulder. During the right shoulder rally, volume was even lower. Then, as price broke below the neckline, volume surged to the highest level seen in weeks.","question":"What does this volume pattern tell you about the Head & Shoulders formation?","options":{"A":"The declining volume on rallies is concerning \u2014 it suggests the pattern may fail because there's not enough participation","B":"Volume doesn't matter for H&S patterns; only the price structure matters for confirmation","C":"This is the ideal volume signature: declining volume on each successive rally (left shoulder > head > right shoulder) followed by a volume surge on the neckline break confirms strong distribution and validates the pattern","D":"The volume surge on the neckline break is a sign of panic selling and means the stock will quickly recover \u2014 this is actually a buying opportunity"},"correct":"C","correctFeedback":"This is the textbook-ideal volume pattern for an H&S top. Declining volume on each rally shows fading buying enthusiasm \u2014 fewer buyers at each higher price. The surge on the neckline break confirms that sellers have taken control. This sequence (declining rally volume + expanding breakdown volume) is the strongest volume confirmation of an H&S pattern.","incorrectFeedback":"In an H&S top, declining volume on successive rallies is actually a confirming signal, not a weakness. It shows that each push higher attracts fewer buyers \u2014 classic distribution. The volume surge on the neckline break is the final confirmation that sellers have overwhelmed buyers. This declining-then-surging volume sequence is the ideal H&S volume signature.","chart":{"symbol":"AMZN","interval":"D","candles":[[488,488.51,487.92,488.42],[488.23,490.32,488.0,489.94],[490.1,490.87,490.04,490.05],[489.93,490.74,489.92,490.73],[490.91,493.22,490.73,492.43],[492.25,494.1,491.5,494.0],[494.13,496.65,493.96,495.44],[495.85,496.0,494.8,495.01],[494.88,497.9,494.71,497.88],[497.75,499.71,497.37,499.26],[499.6,50 380,1276341,1642760,1529912,1489597,1377716,1086789,1383508,1642021,1624875,1759540,1757647,1359250,1369773,1606995,1653113,1662666,1561121,1274782,1249178,1214434,1044949,1176616,1211095,1129126,1303956,1045170,842431,1053897,1186183,1190046,1327107,1345118,833653,966424,1067757,1181533,1307423,1431088,1080568,1099055,963415,843950,1163464,1381240,4006530,2020421,1792001,1726024,2100111,2191227,2214151]}},{"module":"Module 1","topic":"Head & Shoulders","layer":3,"id":"M1-HS-012","status":"NEW","scenario":"A Head & Shoulders top has confirmed with a neckline break at $145. The head was at $170, giving a measured move target of $120 ($145 - $25 = $120). However, you notice strong historical support at $130 where the stock bounced three times in the past year. A student says: 'The measured move target is $120, so I'll hold my short position through $130 all the way to $120 for the full profit.'","question":"Refer to the scenario above. How would you evaluate this student's plan to hold through the $130 support level to the $120 target?","options":{"A":"The student is correct \u2014 measured move targets are mathematically derived and price will reach them before any meaningful bounce occurs at prior support","B":"The student should move the target to $130 and abandon the $120 target entirely, since support always holds","C":"The student should consider taking partial profits at the $130 support level. Measured move targets are estimates, not guarantees, and strong prior support can cause significant bounces or reversals that erode open profits","D":"The student should ignore both levels and instead set the target at 2x the measured move ($95) because H&S patterns typically overshoot their targets"},"correct":"C","correctFeedback":"Measured move targets are guidelines, not guaranteed price levels. Strong prior support at $130 (tested 3 times) is a real obstacle that could halt or reverse the decline. The smart approach is to take partial profits at $130, then trail a stop on the remaining position. This locks in gains while still allowing profit if price continues to the $120 target. Never assume any target will be hit with certainty.","incorrectFeedback":"Measured move targets are useful estimates, but they are not guaranteed destinations. When a strong support level like $130 (triple-tested) sits between the current price and your target, you need to respect it. Taking partial profits at $130 protects gains while keeping some exposure if price continues lower. Rigid adherence to calculated targets ignores the reality of how support and resistance work.","chart":{"symbol":"MSFT","interval":"D","candles":[[128,131.09,127.97,129.54],[129.66,132.29,129.62,131.06],[131.15,134.65,131.04,132.84],[132.93,136.15,132.53,136.02],[136.05,137.34,133.44,133.72],[133.85,134.57,129.97,130.91],[130.9,135.01,130.69,134.38],[134.36,137.87,133.63,137.04],[136.97,137.11,133.22,133.82],[133.81,134.2,129.74,130.89],[130.95,137.4,130.73,136.39],[136.31,138.37,135.36,138.03],[137.94,139.18,131.79,132.44],[132.33,132.49,130.73,131.5],[131.51,147.6,131.41,147.04],[146.94,153.98,146.71,152.72],[152.76,153.23,144.99,145.0],[145.05,146.0,144.86,145.79],[145.67,151.94,144.54,151.37],[151.29,158.98,150.2,158.08],[158.02,161.37,157.51,161.18],[161.13,162.72,161.0,162.45],[162.34,166.89,162.3,165.0],[165.09,166.23,154.64,156.58],[156.54,157.11,150.02,150.52],[150.58,155.05,148.95,155.02],[155.03,155.64,148.65,149.69],[149.57,149.75,147.71,148.03],[148.16,148.26,147.06,147.1],[147.19,152.78,146.16,151.62],[151.59,152.18,151.5,152.12],[152.21,160.07,152.18,160.06],[160.19,163.08,159.49,163.04],[163.14,163.23,161.54,162.48],[162.56,169.92,161.08,169.67],[169.35,169.74,161.17,161.57],[161.45,161.54,159.21,159.62],[159.72,159.96,158.03,158.1],[158.14,158.46,154.16,155.04],[154.92,156.54,154.77,156.46],[156.51,157.48,146.87,146.89],[146.98,153.46,145.4,153.34],[153.23,155.69,151.3,155.09],[154.97,158.42,154.69,157.82],[157.83,162.97,157.38,162.94],[163.02,163.36,157.34,157.41],[157.41,158.39,152.55,153.11],[152.98,154.15,147.78,148.85],[148.83,149.13,144.1,145.03],[144.9,145.24,138.82,139.73],[139.75,140.72,136.82,138.02],[138.02,138.27,135.18,135.49],[135.6,135.67,132.02,132.03]],"overlays":{"srLines":[{"price":130,"label":"$130 Support","color":"#26a69a"},{"price":145,"label":"Neckline $145","color":"#ff9800"}]}}},{"module":"Module 1","topic":"Head & Shoulders","layer":3,"id":"M1-HS-013","status":"NEW","scenario":"A Head & Shoulders top is forming on a stock that just reported a strong earnings beat and raised forward guidance. The pattern looks textbook with clear left shoulder, head, and developing right shoulder. Student A says: 'The H&S is clear \u2014 I'm shorting the neckline break.' Student B says: 'You should never short a stock with strong fundamentals. The pattern will fail.'","question":"A Head & Shoulders top is forming on a stock that just reported a strong earnings beat and raised forward guidance. Student A says 'The H&S is clear \u2014 I'm shorting the neckline break.' Student B says 'You can't short a stock with great fundamentals, the pattern will fail.' Who has the better analysis, and why?","options":{"A":"Student A is correct \u2014 chart patterns always override fundamentals, and strong earnings are already priced in","B":"Student B is correct \u2014 you should never trade against strong fundamentals. H&S patterns on fundamentally strong stocks always fail","C":"Neither is fully correct. The answer depends on timeframe: short-term technicals can override fundamentals for a swing trade, but shorting against strong fundamentals carries higher risk and warrants smaller position size and tighter risk management","D":"Both are wrong \u2014 you should wait for the next earnings report before making any decision, since patterns don't matter near earnings"},"correct":"C","correctFeedback":"This is a classic technicals-vs-fundamentals tension. Short-term price action can diverge from fundamentals \u2014 even great companies have pullbacks. An H&S on a strong stock might produce a valid short-term trade, but the fundamental tailwind increases the risk of pattern failure. The nuanced approach: if you take the trade, use smaller size, tighter stops, and don't expect the full measured move. Timeframe matters enormously.","incorrectFeedback":"Neither extreme is correct. Charts don't always override fundamentals, and fundamentals don't always override charts. The resolution is timeframe-dependent: a swing trader might successfully short the neckline break for a brief move, but the strong fundamentals create headwinds for the short thesis. The prudent approach is smaller position sizing and tighter stops when trading against the fundamental backdrop.","chart":{"symbol":"AAPL","interval":"D","candles":[[498,502.88,497.31,502.52],[502.77,503.78,501.6,503.73],[503.88,507.2,503.07,506.73],[506.31,517.21,505.13,510.1],[510.57,520.48,509.68,519.4],[519.21,523.6,518.61,523.16],[523.67,529.45,522.11,528.97],[529.25,529.6,525.68,527.65],[528.09,528.55,524.85,524.99],[525.1,527.53,524.95,527.22],[527.15,530.04,527.03,529.45],[529.29,532.32,529.28,530.04],[530.36,530.84,528.32,528.62],[528.62,529.16,524.79,525.45],[525.43,525.76,518.97,519.92],[520.25,520.59,519.06,519.84],[520.16,525.35,510.52,511.05],[510.72,510.84,509.66,510.07],[509.92,511.85,509.5,511.5],[511.35,512.86,503.43,504.89],[505.04,513.05,504.94,512.0],[511.78,515.19,510.95,514.77],[514.57,523.9,513.67,520.5],[520.55,525.58,519.96,520.03],[520.14,535.75,519.94,534.02],[534.25,539.92,533.03,539.64],[539.68,553.63,539.48,547.24],[547.67,548.88,540.13,540.18],[540.46,546.94,540.33,543.12],[542.64,546.82,541.64,546.1],[546.12,554.99,544.94,549.88],[549.66,550.88,548.2,548.27],[547.87,548.33,545.29,545.39],[545.29,546.13,545.06,546.11],[546.38,547.99,535.11,535.18],[535.35,540.61,530.1,530.55],[530.61,533.78,530.32,533.23],[533.55,535.49,523.98,525.65],[526.15,527.01,514.87,514.91],[515.23,516.02,508.04,509.2],[509.7,510.28,505.31,505.74],[505.85,507.16,501.94,503.01],[503.16,509.92,502.4,509.11],[509.29,509.78,505.96,506.72],[506.39,515.11,505.61,515.06],[514.67,522.5,513.39,522.48],[522.02,526.22,521.92,525.97],[526.28,532.31,524.75,524.86],[524.53,524.58,522.35,522.55],[522.97,525.01,522.61,524.81],[524.76,529.12,515.06,515.16],[515.09,515.31,510.75,510.93],[511.38,512.11,506.9,507.62],[507.67,508.03,504.39,505.0],[504.86,509.41,501.37,501.76],[501.89,503.34,501.79,503.23],[503.06,504.28,492.83,492.85]]}},{"module":"Module 1","topic":"Head & Shoulders","layer":3,"id":"M1-HS-014","status":"NEW","scenario":"You identify a Head & Shoulders top on the daily chart of a stock. The pattern looks well-formed with a clear neckline. However, when you zoom out to the weekly chart, the stock is in a strong uptrend, trading well above its rising 200-day moving average. The daily H&S would represent only a minor pullback on the weekly timeframe.","question":"How should you weigh the bearish daily H&S against the bullish weekly trend?","options":{"A":"The daily H&S should be traded aggressively short \u2014 the pattern is clear and confirmed, so the weekly trend doesn't matter","B":"The weekly uptrend dominates. The daily H&S is more likely a correction within the larger uptrend rather than a major top. Expect limited downside and treat any decline as a potential buying opportunity on the higher timeframe","C":"The two timeframes cancel each other out, making the setup untradeable \u2014 skip it entirely and wait for both timeframes to align","D":"Always trade the smallest timeframe because it shows the most recent and therefore most relevant information"},"correct":"B","correctFeedback":"Higher timeframes carry more weight than lower timeframes. A daily H&S within a strong weekly uptrend is more likely a healthy correction than a major reversal. The weekly rising 200-day MA acts as a structural floor. You might see a short-term dip from the daily pattern, but the weekly context suggests limited downside. Multi-timeframe analysis is essential \u2014 always check the bigger picture before trading a pattern.","incorrectFeedback":"When timeframes conflict, the higher timeframe generally wins. A strong weekly uptrend above the 200-day MA is a powerful bullish structure. A daily H&S within that context is likely just a correction, not a major top. The smart approach is to recognize the daily pattern but weigh it against the bullish weekly backdrop, expecting limited downside and looking to buy the dip rather than aggressively shorting.","chart":{"symbol":"GOOGL","interval":"D","candles":[[397,399.51,395.14,399.17],[399.33,399.57,398.2,398.25],[398.24,405.08,398.15,405.05],[404.83,410.44,404.49,409.52],[409.39,413.84,409.01,413.32],[413.69,415.48,413.49,415.02],[415.43,418.41,414.79,418.12],[417.88,422.0,417.53,421.8],[421.85,425.94,420.35,425.02],[425.16,430.35,423.86,429.46],[429.16,429.18,426.19,427.93],[427.82,430.71,426.94,429.91],[429.84,430.37,426.55,426.63],[426.98,427.35,424.76,424.96],[424.64,425.0,421.9,422.0],[421.88,422.15,420.19,420.56],[420.73,421.9,419.4,421.84],[421.98,423.45,413.88,413.89],[413.49,414.85,406.35,407.72],[407.58,408.96,407.36,408.75],[408.74,409.01,401.12,402.03],[402.08,408.54,401.28,407.63],[407.74,415.93,406.87,414.06],[413.71,414.8,412.02,412.06],[411.89,417.81,411.01,416.55],[416.84,417.09,414.05,415.49],[415.18,421.87,414.37,421.86],[422.15,429.35,421.76,428.3],[428.64,428.65,428.16,428.19],[428.04,432.15,427.06,432.15],[431.85,434.69,431.25,434.55],[434.2,436.78,433.7,436.76],[436.85,442.61,436.03,442.1],[442.19,446.1,441.37,445.49],[445.55,449.18,445.22,448.55],[448.73,451.51,448.43,449.9],[450.14,450.19,446.64,447.33],[446.94,447.42,443.9,444.01],[443.94,444.56,443.54,443.99],[444.43,444.45,441.68,441.94],[441.85,442.31,438.48,439.07],[439.37,440.79,435.12,436.15],[435.82,435.97,435.01,435.1],[435.53,436.03,435.47,435.91],[436.09,436.64,427.9,427.96],[427.79,428.36,422.61,423.08],[423.13,425.5,422.91,424.5],[424.11,425.15,417.94,  independent signals pointing the same direction increases the probability that the reversal is real","D":"You should only use one tool at a time. Pick either the H&S pattern or the indicators, but combining them leads to false confidence"},"correct":"C","correctFeedback":"This is a textbook example of confluence. The H&S shows the price structure weakening. The MACD bearish divergence confirms that momentum is declining even as price made new highs. The RSI declining from overbought shows buying pressure fading. Each signal independently suggests bearish reversal, and together they create a higher-probability setup. Confluence \u2014 multiple independent signals confirming the same thesis \u2014 is one of the most powerful concepts in technical analysis.","incorrectFeedback":"When multiple independent technical signals point in the same direction, that's called confluence, and it's extremely valuable. The H&S provides the price structure, MACD divergence confirms weakening momentum, and declining RSI confirms fading buying pressure. These aren't redundant \u2014 they measure different things (price, momentum, relative strength) that all agree. Confluence increases the probability that a setup will work.","chart":{"symbol":"NVDA","interval":"D","candles":[[174,174.54,173.87,174.45],[174.42,175.55,174.16,175.37],[175.47,176.35,175.27,176.04],[176.17,177.99,176.11,177.09],[177.0,177.7,176.55,177.56],[177.5,178.06,177.4,178.0],[177.84,179.31,177.75,178.98],[178.87,179.1,176.98,177.39],[177.48,181.08,177.33,181.04],[181.1,182.0,180.98,181.85],[181.89,184.97,181.77,183.14],[183.04,184.87,183.01,183.9],[184.02,185.35,183.92,185.1],[184.98,185.03,184.74,184.75],[184.71,186.11,184.6,186.09],[186.11,186.13,185.87,185.89],[185.97,186.09,185.13,185.28],[185.36,186.0,181.93,182.92],[182.76,182.82,182.09,182.13],[182.01,182.74,181.96,182.58],[182.69,183.06,179.53,180.0],[180.03,180.38,178.39,178.62],[178.46,178.56,177.8,177.92],[177.79,177.87,176.89,176.96],[177.09,179.41,176.26 wer highs and lower lows consistently for the past two months. Each rally fails at a lower price than the one before, and each selloff finds a new low.","question":"What market structure does this price action represent?","options":{"A":"Uptrend \u2014 the stock is making progress by testing new price levels","B":"Downtrend \u2014 a sequence of lower highs and lower lows defines bearish structure","C":"Consolidation \u2014 the price is just chopping around without direction","D":"Reversal \u2014 two months of movement means it's about to turn around"},"correct":"B","correctFeedback":"Correct. A downtrend is defined by a sequence of lower highs and lower lows. Each failed rally (lower high) and each new low (lower low) confirms sellers remain in control. This is the textbook definition of bearish market structure.","incorrectFeedback":"Focus on the pattern of peaks and valleys. When each peak is lower than the last AND each valley is lower than the last, that's the definition of a downtrend. Consolidation would show roughly equal highs and lows, and an uptrend would show the opposite \u2014 higher highs and higher lows.","chart":{"symbol":"TSLA","interval":"D","candles":[[300,300.06,298.57,298.6],[298.61,298.64,297.77,297.84],[298.08,298.24,296.05,296.08],[296.07,297.44,295.91,297.2],[297.16,298.39,296.78,297.92],[298.2,298.41,291.56,295.29],[295.39,295.44,294.77,294.84],[294.64,294.83,290.88,290.88],[290.88,291.27,286.2,288.98],[288.92,289.73,288.76,289.69],[289.68,289.89,284.96,284.99],[285.17,286.95,283.68,286.84],[286.81,288.49,286.59,288.14],[288.13,290.08,287.96,289.12],[289.21,290.97,288.71,290.9],[291.04,291.08,290.16,290.32],[290.5,293.16,290.45,293.11],[292.87,293.01,291.11,292.12],[291.86,292.43,291.76,292.33],[292.52,292.75,290.09,290.94],[290.89,290.9,288.45,288.92],[289.12,289.78,288.95,289.69],[289.65,289.78,285.74,286.14],[286.03,286.33,286.02,286.26],[286.53,288.79,286.0,287.99],[287.7,288.26,285.01,285.23],[285.09,285.37,285.05,285.35],[285.2,285.52 Range/consolidation \u2014 price is contained between support and resistance with no directional trend","D":"Breakout \u2014 six weeks of compression means price has already broken out"},"correct":"C","correctFeedback":"Correct. When price bounces between defined support ($220) and resistance ($250) without making meaningful higher highs or lower lows, it's in a range or consolidation. There's no trending structure \u2014 just back-and-forth between buyers at the bottom and sellers at the top.","incorrectFeedback":"A trend requires directional progress \u2014 higher highs/higher lows (uptrend) or lower highs/lower lows (downtrend). Here, price stays contained between $220 and $250 with no breakout in either direction. That's the hallmark of a range-bound or consolidating market.","chart":{"symbol":"META","interval":"D","candles":[[235,237.14,233.83,237.04],[236.85,240.52,236.14,240.44],[240.65,244.18,239.89,239.92],[239.89,242.13,239.85,241.72],[241.8,243.53,241.57,243.39],[243.45,246.16,242.88,245.0],[245.17,246.46,244.82,246.43],[246.4,247.34,245.47,245.48],[245.47,249.0,245.06,248.95],[249.04,249.51,245.13,245.95],[246.19,246.57,244.22,244.37],[244.49,245.04,242.3,245.0],[244.77,244.83,243.92,244.42],[244.21,244.34,239.09,241.97],[241.92,242.63,238.05,238.07],[238.3,238.69,232.98,235.66],[235.66,237.61,232.85,237.61],[237.47,239.87,232.05,232.06],[232.0,232.75,227.19,227.63],[227.79,228.6,222.7,223.8],[223.91,224.17,220.1,224.12],[224.32,225.59,220.98,225.42],[225.28,225.48,224.3,224.44],[224.43,228.03,223.24,228.01],[228.07,228.8,228.04,228.66],[228.72,228.87,226.83,227.65],[227.73,234.13,226.96,234.1],[233.94,236.36,233.39,235.88],[235.76,237.44,235.42,237.35],[237.31,241.1,235.83,241.08],[240.98,246.03,240.37,245.38],[245.51,250.02,244.55,249.48],[249.39,251.9,247.88,247.92],[247.71,247.8,245.99,246.94],[247.07,247.29,246.27,246.28],[246.37,246.77,243.9,243.91],[244.06,244.68,241.95,242.0],[242.14,243.05,242.08,243.0],[242.99,243.47,235.74,237.1],[236.9,237.59,234.07,234.19],[234.26,235.07,227.31,228.06],[227.94,230.04,223.6,230.01],[229.96,234.8,226.61,226.64],[226.57,226.97,223.65,224.25],[224.12,224.19,220.72,223.01],[223.07,225.24,220.45,224.82],[224.73,226.09,224.46,225.78],[225.98,227.17,225.82,227.11],[227.03,230.1,227.01,229.53],[229.33,229.81,227.45,227.58],[227.46,233.1,227.38,233.09],[233.1,234.31,232.84,234.04],[233.89,241.33,232.13,239.78],[239.8,243.15,236.51,240.0],[240.19,251.58,238.18,248.96],[249.12,250.92,248.81,250.72],[250.55,255.98,250.01,250.03],[249.97,250.11,248.43,248.5],[248.44,248.77,246.4,246.56],[246.72,247.23,243.97,246.07],[245.92,246.17,242.47,242.97],[242.99,244.77,242.8,243.94],[243.97,244.24,238.98,239.0],[239.12,239.34,236.13,236.8],[236.9,237.45,234.05,234.57],[234.66,236.17,232.67,232.92]]}},{"module":"Module 1","topic":"Market Structure","layer":1,"id":"M1-MS-006","status":"NEW","scenario":"A stock has been in a strong uptrend \u2014 higher highs, higher lows, clean structure. On the latest pullback, price drops below the previous swing low for the first time in months.","question":"What just happened to the market structure?","options":{"A":"Nothing significant \u2014 pullbacks always look scary in uptrends","B":"The trend reversed \u2014 this is a confirmed downtrend now","C":"Break of structure (BOS) \u2014 the first warning the uptrend may be weakening, though it doesn't guarantee reversal","D":"A bear trap \u2014 price always comes back after dipping below a swing low"},"correct":"C","correctFeedback":"Correct. When price in an uptrend breaks below a previous swing low, it's a break of structure (BOS). This is the first warning sign that the uptrend may be weakening because the pattern of higher lows has been violated. It doesn't guarantee a reversal \u2014 the trend could resume \u2014 but the structure is now damaged and you should be on alert.","incorrectFeedback":"An uptrend is defined by higher highs and higher lows. When price breaks below a previous swing low, it breaks that pattern \u2014 that's called a break of structure (BOS). It's not automatically a reversal (that requires further confirmation), but it's also not nothing. The structural damage is a real warning sign that deserves attention.","chart":{"symbol":"AMZN","interval":"D","candles":[[200,202.97,199.82,202.51],[202.59,204.98,202.52,204.11],[204.19,204.21,202.66,202.97],[203.1,204.93,202.99,204.64],[204.65,204.82,203.89,203.98],[203.87,203.87,203.6,203.72],[203.86,215.04,202.77,214.99],[215.17,215.48,213.74,213.77],[213.94,213.94,211.26,211.56],[211.53,211.6,208.62,208.99],[209.19,211.8,209.11,211.66],[211.48,211.58,207.71,207.76],[207.64,209.82,207.37,209.42],[209.42,217.09,209.23,215.55],[215.44,217.16,213.49,217.04],[217.09,224.35,216.66,224.32],[224.32,225.86,223.59,225.61],[225.67,229.76,225.63,227.52],[227.5,230.28,225.26,225.28],[225.49,225.75,224.17,224.18],[224.18,224.29,223.44,223.54],[223.68,224.38,217.67,217.76],[217.67,221.57,217.64,219.36],[219.56,220.7,219.44,220.64],[220.42,222.73,220.11,222.54],[222.7,226.0,218.78,225.35],[225.37,226.91,224.28,224.34],[224.4,227.39,223.92,226.7],[226.77,229.74,226.69,229.73],[229.78,229.95,228.44,228.57],[228.38,229.03,225.44,225.99],[226.21,226.74,223.02,223.74],[223.72,224.35,223.17,224.32],[224.49,225.41,224.23,225.4],[225.62,225.63,225.13,225.23],[225.15,225.21,224.45,224.58],[224.66,226.32,224.47,226.05],[225.94,226.91,210.33,210.33]]}},{"module":"Module 1","topic":"Market Structure","layer":1,"id":"M1-MS-007","status":"NEW","scenario":"","question":"Based on this sequence, is the structure bullish or bearish?","options":{"A":"Bearish \u2014 the $15 drop from $555 to $540 shows selling pressure","B":"Bullish \u2014 the latest resistance level ($560) exceeded the previous resistance level ($555), forming a higher high","C":"Neutral \u2014 you need at least five swing points to determine structure","D":"Bearish \u2014 $560 is too close to $555 to be a meaningful higher high"},"correct":"B","correctFeedback":"Correct. The latest resistance level ($560) is above the previous resistance level ($555) \u2014 that's a higher high, which is the hallmark of bullish structure. The key confirmation to watch next is whether the following pullback holds above $540 (the previous low). If it does, you'd have a higher high AND a higher low, confirming the uptrend.","incorrectFeedback":"Market structure is determined by the relationship between swing highs and swing lows. Here, the second resistance level ($560) is above the first resistance level ($555) \u2014 that's a higher high. A $5 higher high is still a higher high. The next thing to watch is whether the next pullback stays above $540 to confirm a higher low.","chart":{"symbol":"AAPL","interval":"D","candles":[[535,537.51,534.98,536.29],[536.0,536.23,535.07,535.13],[535.06,535.29,533.82,533.96],[533.59,536.72,532.7,536.6],[536.99,539.07,536.87,537.87],[537.82,541.86,537.57,541.38],[541.72,545.95,541.28,545.2],[544.97,545.19,543.16,543.29],[542.77,543.15,538.52,540.75],[540.7,540.96,536.2,538.79],[538.4,538.83,538.35,538.78],[539.25,539.71,536.23,538.28],[537.92,541.24,537.87,540.93],[540.72,540.77,539.41,539.52],[539.37,539.77,537.87,537.99],[537.62,541.36,537.15,540.7],[540.61,541.21,540.58,541.13],[540.77,542.93,540.63,542.48],[542.69,555.38,541.82,555.19],[555.56,556.11,550.27,550.31],[550.14,552.25,549.87,551.35],[551.41,552.27,545.01,545.64],[545.87,548.96,545.28,548.26],[548.44,549.14,543.06,543.1],[542.92,545.21,542.78,544.08],[543.76,545.6,543.59,545.56],[545.67,548.04,543.78,547.59],[547.38,547.48,545.97,546.21],[546.72,549.06,546.2,548.52],[548.49,551.2,548.0,550.71],[551.11,554.15,550.33,553.84],[553.97,554.46,552.11,552.26],[552.76,560.46,552.32,560.4],[560.48,560.51,558.31,558.52],[558.71,559.06,555.01,555.48],[555.73,555.92,554.63,554.81],[554.77,555.15,550.71,551.2],[551.28,551.54,547.17,547.97]]}},{"module":"Module 1","topic":"Market Structure","layer":2,"id":"M1-MS-008","status":"NEW","scenario":"A stock has been in a steady downtrend \u2014 lower highs, lower lows. On the latest pullback, instead of making a new lower low, price makes a higher low. The previous lower high hasn't been broken yet.","question":"How should this higher low change your trading approach?","options":{"A":"Go long immediately \u2014 a higher low confirms the trend has reversed","B":"Ignore it \u2014 one higher low means nothing in a downtrend","C":"Recognize it as the first sign of a potential shift. Watch for price to break above the previous lower high for confirmation. Tighten short stops and begin preparing a long plan.","D":"Double your short position \u2014 the higher low is just a pause before the next leg down"},"correct":"C","correctFeedback":"Correct. A higher low in a downtrend is the first structural clue that sellers may be losing control. But one data point isn't confirmation \u2014 you need price to also break above the previous lower high to truly shift structure. The smart move: tighten stops on existing shorts (protect profits) and start preparing a long plan for if/when confirmation comes.","incorrectFeedback":"A higher low in a downtrend is significant but not conclusive. Going long immediately is premature \u2014 the downtrend isn't confirmed broken until the previous lower high is also exceeded. Ignoring it is dangerous because it's the first warning. The balanced approach: tighten short stops, watch for confirmation (break above previous lower high), and prepare a long plan.","chart":{"symbol":"MSFT","interval":"D","candles":[[300,300.11,298.7,298.76],[299.0,299.87,295.38,295.79],[295.88,296.25,292.84,294.1],[294.21,294.26,293.5,293.56],[293.78,295.04,293.48,294.89],[295.0,295.58,287.98,288.01],[287.84,288.03,285.98,286.83],[286.67,287.05,286.64,287.03],[287.08,287.52,284.91,284.91],[284.69,288.02,283.86,287.54],[287.29,289.91,286.73,289.52],[289.23,293.15,288.95,288.96],[288.86,290.03,288.73,289.96],[289.76,293.2,288.24,292.68],[292.47,296.87,291.9,293.15],[293.34,293.66,292.19,2 tradeable"},"correct":"B","correctFeedback":"Correct. In a range, you have two solid strategies: (1) Trade the range \u2014 buy near $480 support, sell near $530 resistance, with stops placed beyond the range boundaries. (2) Wait for a breakout \u2014 let price break out of the range with conviction, then trade the new trend. Both are valid; the key is having a plan and defined risk.","incorrectFeedback":"Ranges offer clear opportunities if you respect the structure. Buying support and selling resistance works well with stops beyond the range. Or you can wait for a breakout for a potentially larger move. Ranges don't always break in one direction, so assuming an upward breakout is a mistake. And ranges are absolutely tradeable \u2014 they offer some of the clearest risk/reward setups.","chart":{"symbol":"GOOGL","interval":"D","candles":[[505,513.34,501.24,511.98],[511.76,514.87,511.09,514.33],[514.84,517.68,511.88,511.99],[511.58,518.7,511.22,515.82],[515.78,516.34,513.44,513.56],[513.27,520.05,512.44,520.02],[520.35,523.47,518.22,523.16],[522.95,523.0,518.75,519.66],[520.18,528.03,519.96,528.01],[527.61,529.2,516.93,522.93],[523.24,523.33,522.57,522.58],[522.66,524.49,520.85,521.89],[521.5,521.91,518.1,518.2],[517.85,518.78,517.63,518.59],[519.1,519.45,514.03,514.06],[514.12,514.89,510.2,510.61],[510.59,514.09,508.01,508.04],[508.53,509.51,503.48,504.9],[505.29,515.67,497.89,498.25],[498.39,501.21,498.31,501.18],[501.65,501.79,494.9,494.92],[494.48,494.95,492.16,492.39],[492.48,492.65,484.17,489.09],[488.8,489.54,468.03,485.11],[485.16,486.96,480.98,486.7],[486.41,486.53,485.39,485.78],[485.66,490.13,485.51,490.11],[490.33,490.78,490.29,490.75],[490.27,493.04,490.08,492.71],[492.74,500.17,492.43,500.11],[500.22,504.85,497.31,504.66],[504.38,508.8,498.67,499.73],[499.96,510.06,499.47,510.01],[510.49,513.73,507.46,513.63],[513.61,516.71,513.45,516.29],[515.89,520.18,515.17,520.05],[520.35,527.13,519.68,523.75],[523.52,523.81,522.07,522.29],[521.92,529.01,521.65,528.9 he next leg up early.","C":"Wait for the trend to reverse and then buy the reversal back up","D":"Buy only after the stock makes three more higher highs to be absolutely sure"},"correct":"B","correctFeedback":"Correct. In a healthy uptrend, the 20 EMA often acts as dynamic support, catching each higher low as price pulls back. Entering near the 20 EMA gives you a natural stop-loss level (below the swing low), a favorable risk/reward ratio, and entry early in the next potential leg up rather than chasing extended moves.","incorrectFeedback":"Buying at the high gives poor risk/reward \u2014 if price pulls back, you're immediately underwater. Waiting for reversal means missing the entire uptrend. Over-confirming with three more highs leaves too much profit on the table. The sweet spot is buying pullbacks to the 20 EMA, which has been marking the higher lows in this trend. That gives you a logical stop below the swing low and room to ride the next leg.","chart":{"symbol":"AMD","interval":"D","candles":[[160,161.2,159.78,161.09],[161.17,166.7,160.86,165.83],[165.98,167.91,164.85,164.86],[164.79,168.02,164.61,167.76],[167.67,168.05,167.18,168.03],[168.15,170.05,168.02,170.05],[170.11,172.24,169.81,171.42],[171.54,172.6,171.29,172.39],[172.25,181.03,171.56,175.06],[175.16,175.33,172.75,173.02],[173.1,173.33,171.76,172.0],[172.07,172.12,170.42,171.14],[171.26,171.48,169.91,170.04],[169.88,170.32,169.84,170.31],[170.37,170.44,167.91,167.95],[168.07,171.3,167.57,170.93],[170.98,171.2,169.09,169.38],[169.41,173.06,169.26,173.03],[172.91,174.92,172.79,174.86],[174.98,176.35,174.62,176.27],[176.16,188.02,175.96,179.11],[179.17,179.78,179.03,179.71],[179.72,183.09,179.52,182.57],[182.58,185.02,180.44,184.98],[185.14,185.35,183.41,183.42],[183.35,183.57,178.16,181.08],[181.05,181.51,176.47,181.07],[180.95,181.3,178.52,178.79],[178.92,179.01,177.81,178.0],[177.89,177.98,176.58,177.94],[178.12,183.87,177.96,182.7],[182.61,184.09,182.57,183.93],[184.1,185.72,182.89,182.95],[182.9,186.2,182.63,186.04],[185.86,189.38,185.65,188.95],[188.83,191.66,188.39,190.07],[190.15,192.95,189.97,191.32],[191.34,191.39,188.8,190.25],[190.27,195.92,190.07,195.88],[195.78,197.82,195.53,197.37],[197.49,198.42,197.4,198.27],[198.19,201.92,197.84,201.88],[201.96,202.03,200.52,200.84],[200.76,201.47,200.57,201.46],[201.56,202.16,198.86,198.88],[198.79,199.4,195.1,195.62],[195.66,196.17,195.62,196.12],[195.94,196.31,194.28,195.89]],"overlays":{"lines":[{"values":[161.09,161.54,161.86,162.42,162.95,163.63,164.37,165.13,166.08,166.74,167.24,167.61,167.84,168.08,168.07,168.34,168.44,168.88,169.45,170.1,170.96,171.79,172.82,173.98,174.88,175.47,176.0,176.27,176.43,176.57,177.15,177.8,178.29,179.03,179.97,180.93,181.92,182.71,183.96,185.24,186.48,187.95,189.18,190.35,191.16,191.58,192.01,192.38],"color":"#2196f3","label":"20 EMA","width":2}]}}},{"module":"Module 1","topic":"Market Structure","layer":2,"id":"M1-MS-011","status":"NEW","scenario":"A stock is in an uptrend. Previous pullbacks have retraced about 30-40% of each leg up before resuming. The current pullback has already retraced 60% of the latest leg \u2014 noticeably deeper than usual \u2014 but has not yet broken the previous swing low.","question":"What does this deeper-than-normal pullback tell you about your trading approach?","options":{"A":"Nothing \u2014 the pullback hasn't broken structure, so everything is perfectly fine","B":"The trend is over \u2014 sell everything immediately","C":"Momentum may be slowing even though structure is technically intact. Reduce position size and tighten stops to protect against further deterioration.","D":"This is extra bullish \u2014 a deeper pullback means a stronger bounce"},"correct":"C","correctFeedback":"Correct. When pullbacks get deeper than normal, it's a yellow flag even if the higher-low pattern hasn't officially broken. It suggests that buyers aren't stepping in as aggressively as before \u2014 momentum is fading. The structure is still intact, so you don't need to exit entirely, but reducing size and tightening stops is prudent risk management.","incorrectFeedback":"A deeper-than-normal pullback is subtle but important. Structure is technically intact (no lower low yet), so it's not a confirmed reversal. But something has changed \u2014 buyers aren't defending as early as they used to. The smart adjustment is to reduce exposure and tighten stops, acknowledging the shift in character without panicking out of a valid trend.","chart":{"symbol":"NVDA","interval":"D","candles":[[200,203.12,199.87,202.75],[202.57,202.72,200.76,201.01],[201.15,204.66,200.49,203.87],[203.99,211.69,202.02,211.37],[211.43,216.87,211.33,215.8],[215.94,216.5,213.27,213.83],[213.7,214.18,213.27,214.11],[214.19,220.01,213.88,219.98],[220.0,221.15,215.91,216.04],[216.17,216.56,215.4,215.49],[215.33,216.05,208.2,211.59],[211.5,218.98,210.88,217.87],[217.98,223.55,217.18,221.36],[221.21,221.83,217.65,218.24],[218.43,221.71,218.38,221.1],[221.28,223.5,220.79,223.47],[223.49,227.09,220.77,221.09],[221.16,235.72,216.78,235.43],[235.48,236.12,234.39,234.47],[234.56,236.21,220.42,223.38],[223.34,224.94,222.53,224.8],[224.66,236.24,223.62,230.82],[230.82,232.43,230.8,231.51],[231.34,231.51,230.01,230.06],[230.2,230.66,229.73,229.73],[229.72,229.85,228.64,228.83],[228.61,231.57,228.2,230.93],[231.13,250.21,230.7,250.17],[250.2,251.0,246.62,246.99],[247.01,250.22,246.49,249.57],[249.43,249.54,244.35,245.04],[245.01,247.76,244.71,247.25],[247.1,247.45,227.84,227.94],[228.13,231.15,224.82,230.96],[231.1,240.22,231.08,234.83],[234.9,235.03,234.37,234.42],[234.54,238.86,233.91,238.46],[238.57,242.03,237.61,239.92]]}},{"module":"Module 1","topic":"Market Structure","layer":3,"id":"M1-MS-012","status":"NEW","scenario":"You're analyzing a stock on two timeframes. The daily chart shows a clear uptrend \u2014 higher highs and higher lows. But when you zoom into the 4-hour chart, you notice the 4H is currently making lower highs and lower lows within the latest daily pullback.","question":"The daily and 4H structures seem to conflict. Which timeframe should you trust, and how do you reconcile the disagreement?","options":{"A":"The 4H is more recent data, so it overrides the daily. The uptrend is over.","B":"They cancel each other out \u2014 you can't trade when timeframes disagree","C":"The daily chart sets the dominant trend direction. The 4H lower highs/lower lows are the internal mechanics of the daily pullback. Use the higher timeframe for direction and the lower timeframe to time entries.","D":"Ignore both and switch to the weekly chart \u2014 only the highest timeframe matters"},"correct":"C","correctFeedback":"Correct. The higher timeframe (daily) sets the dominant structural direction \u2014 it's in an uptrend. The lower timeframe (4H) is showing the internal structure of the daily pullback, which naturally involves lower highs and lower lows as price retraces. This isn't a conflict \u2014 it's how multi-timeframe analysis works. Use the daily for direction (bullish bias) and the 4H to time your entry (watch for the 4H downtrend to break, signaling the daily pullback may be ending).","incorrectFeedback":"Multi-timeframe analysis has a hierarchy: higher timeframes set direction, lower timeframes reveal entry mechanics. The daily uptrend is dominant. The 4H bearish structure is simply what a pullback looks like when you zoom in. When the 4H structure shifts back to bullish (higher low, break of 4H lower high), that's often the signal that the daily pullback is complete and the next leg up is beginning.","chart":{"symbol":"TSLA","interval":"D","candles":[[120,121.1,120.0,120.85],[120.74,123.74,120.62,122.43],[122.35,123.88,122.13,123.87],[123.91,125.76,123.5,125.43],[125.54,125.82,123.14,123.64],[123.6,128.14,123.15,128.12],[128.19,129.91,127.82,129.77],[129.89,130.1,128.92,129.13],[129.2,133.09,128.8,133.04],[133.03,133.26,129.71,131.09],[131.09,131.26,130.89,131.25],[131.37,131.74,128.07,129.96],[129.85,130.02,129.08,129.24],[129.2,129.34,125.71,126.17],[126.1,127.1,125.75,127.08],[127.18,129.73,127.07,129.42],[129.45,129.46,128.75,128.84],[128.95,131.06,128.77,131.06],[131.04,132.89,130.76,132.88],[132.99,134.19,132.16,134.07],[134.08,136.08,133.89,136.02],[136.01,138.68,135.7,137.69],[137.62,138.46,137.45,138.29],[138.18,142.04,137.93,141.97],[142.11,142.27,140.69,141.02],[141.12,141.37,139.71,140.03],[139.93,141.36,138.85,139.09],[139.2,140.6,137.54,137.76],[137.89,139.02,137.83,138.45],[138.34,138.46,135.92,135.98],[135.96,136.62,135.2,136.58],[136.53,136.68,135.96,135.97],[136.06,138.18,135.91,138.13],[138.25,141.89,138.19,141.09],[141.22,144.27,140.78,143.72],[143.72,150.79,143.1,143.12],[143.2,145.05,141.28,144.87],[144.92,151.02,144.72,147.41],[147.41,152.92,146.9,148.14],[148.03,149.39,147.95,149.32],[149.24,152.66,149.07,152.09],[151.99,153.75,151.59,152.94],[152.93,153.06,152.0,152.16],[152.09,153.56,150.6,150.8],[150.74,150.88,148.49,149.95],[149.8,149.85,148.76,148.99],[148.93,149.34,147.33,147.51],[147.54,147.67,145.77,147.11],[147.1,148.68,145.44,148.39],[148.42,148.6,148.4,148.59],[148.66,150.96,148.15,150.93],[150.81,160.74,149.48,156.21],[156.2,156.89,154.85,154.97],[155.09,159.04,154.93,155.92],[156.07,158.12,155.6,157.93],[158.08,159.82,157.87,159.6],[159.74,161.64,159.53,160.1]]}},{"module":"Module 1","topic":"Market Structure","layer":3,"id":"M1-MS-013","status":"NEW","scenario":"Two students are analyzing the same chart. Student A identifies swing points at every minor zig-zag and concludes the stock is in a downtrend. Student B focuses only on major swing points and concludes the stock is in an uptrend. They disagree about the current market structure.","question":"Is swing point identification purely objective, or is there room for disagreement? How should this be resolved?","options":{"A":"Swing identification is 100% objective \u2014 one of them is simply wrong and needs more practice","B":"It's completely subjective \u2014 there's no right answer, so both are equally valid","C":"It's a mix. Major swing points are generally clear and agreed upon, but minor swings can be debatable. The key is using consistent rules for identifying swings. If they focus on major structure, they should reach the same conclusion.","D":"The disagreement means the chart is untradeable \u2014 skip it and find a clearer setup"},"correct":"C","correctFeedback":"Correct. Swing identification has both objective and subjective elements. Major swing points \u2014 the significant peaks and valleys visible on any reasonable analysis \u2014 should be agreed upon by most traders. Minor swing points are where subjectivity enters. The solution: use consistent, well-defined rules for what constitutes a swing point. When both students focus on major structure with the same rules, they should converge on the same conclusion.","incorrectFeedback":"Market structure analysis isn't perfectly objective, but it's not purely subjective either. Major peaks and valleys are visible to everyone. The ambiguity lives in minor swings. The resolution is consistency \u2014 define your rules for identifying swings and apply them the same way every time. Two analysts using the same rules on major structure should agree on the trend direction.","chart":{"symbol":"META","interval":"D","candles":[[200,200.39,199.98,200.36],[200.22,202.55,197.86,202.1],[202.04,204.73,200.26,203.85],[203.78,204.15,203.72,204.14],[204.29,204.44,203.67,203.79],[203.81,208.14,203.53,208.12],[208.08,210.69,207.75,210.44],[210.27,210.34,209.71,209.95],[209.83,213.26,209.38,213.14],[212.93,213.0,212.24,212.24],[212.34,212.57,212.33,212.55],[212.5,212.9,209.88,209.94],[209.87,210.04,208.33,208.37],[208.31,208.36,206.67,206.83],[206.63,207.14,206.19,207.05],[207.11,209.17,207.03,208.04],[207.97,207.98,207.41,207.53],[207.38,211.3,206.64,210.98],[210.77,213.66,210.77,213.23],[213.42,214.13,213.41,213.98],[214.17,215.9,213.95,215.89],[216.06,218.64,213.67,218.22],[218.03,218.43,217.96,218.37],[218.4,221.92,  a clean uptrend is smart \u2014 it's higher probability than fighting it. But calling any trade 'safe' reveals a dangerous mindset. Trends end without warning, and six months of success doesn't guarantee month seven. The right approach: stay long, use stops, and continuously monitor for the first structural warning signs (break of structure, deeper pullbacks, lower highs). The trend deserves respect, not blind trust.","incorrectFeedback":"A clean six-month uptrend is a strong signal to trade with the trend \u2014 fighting it would be foolish. But 'safe' implies guaranteed outcomes, which don't exist in trading. The trend could end tomorrow. The balanced view: ride the trend with proper stops, but never assume any position is safe. Watch for first signs of structural deterioration (deeper pullbacks, break of swing low) as your early warning system.","chart":{"symbol":"AMZN","interval":"D","candles":[[300,304.9,299.5,303.86],[303.76,306.87,303.67,306.44],[306.59,309.62,304.96,305.01],[304.92,307.62,303.27,307.43],[307.74,312.96,306.81,312.07],[312.28,315.54,309.68,311.87],[311.66,312.53,311.45,312.44],[312.37,314.9,309.08,314.68],[314.55,318.18,314.44,318.13],[317.89,318.24,316.39,316.67],[316.89,317.04,316.56,316.61],[316.69,317.39,313.96,313.98],[313.99,314.12,313.23,313.35],[313.33,313.69,311.53,311.77],[311.99,313.64,309.83,309.87],[309.76,309.95,309.71,309.94],[310.05,310.11,309.18,309.47],[309.27,312.06,309.2,311.97],[311.91,317.55,311.78,314.86],[315.09,315.83,314.51,314.57],[314.28,317.18,313.16,317.14],[317.03,319.53,316.51,319.38],[319.18,321.61,317.61,321.38],[321.11,323.67,318.8,322.96],[322.95,325.88,322.78,325.87],[325.88,328.19,325.38,327.95],[328.13,336.39,327.48,330.01],[330.2,330.26,328.39,328.71],[328.91,329.11,326.08,326.16],[326.16,326.26,325.79,325.88],[325.66,325.78,324.0,324.06],[324.17,324.77,324.17,324.48],[324.18,324.31,321.83,321.89],[321.8,324.39,319.87,323.96],[323.71,327.27,322.9,326.51],[326.33,329.97,325.84,326.94],[327.17,330.0,326.7 , the student raises a fair nuance: single news-driven spikes with extreme volume do have a higher reversal rate than gradual structural breaks. The practical approach is to acknowledge the break, respect the warning, but watch the next 2-3 sessions for follow-through. If price reclaims the broken level quickly, the break may have been a false signal. If it holds below, the structural shift is confirmed.","incorrectFeedback":"Dismissing price moves because of their catalyst is a dangerous habit \u2014 price is price. The break of structure is real whether caused by news, earnings, or organic selling. However, context matters: news-driven moves with extreme volume are more likely to reverse than gradual structural breaks. The right approach: respect the break as real damage, then watch for follow-through over the next 2-3 sessions to see if it holds.","chart":{"symbol":"AAPL","interval":"D","candles":[[180,180.53,179.89,180.53],[180.38,182.28,179.15,182.18],[182.15,185.71,179.42,184.14],[184.05,186.52,183.75,185.48],[185.43,185.44,184.95,185.01],[185.15,187.9,184.79,187.88],[187.98,189.2,186.27,189.17],[189.22,190.58,188.96,190.29],[190.13,192.99,187.26,192.94],[193.03,193.12,192.02,192.11],[192.17,192.34,191.36,191.49],[191.4,191.88,189.57,190.11],[190.03,190.35,188.77,188.94],[189.03,189.56,188.95,189.45],[189.27,189.4,186.88,186.88],[186.82,187.68,186.75,187.17],[187.22,191.37,187.09,190.55],[190.68,193.46,190.06,191.12],[191.16,195.28,190.64,195.07],[195.26,197.7,194.11,197.23],[197.34,198.78,195.95,195.95],[195.98,198.04,195.7,197.69],[197.88,198.57,197.74,198.52],[198.43,201.95,198.19,201.94],[201.79,201.88,199.81,200.01],[200.2,200.22,199.82,199.88],[199.71,200.79,198.42,198.97],[198.79,198.82,198.43,198.49],[198.5,198.56,197.24,197.49],[197.36,198.76,194.24,196.04],[195.93,196.64,195.81,196.59],[196.4,197.3,196.2,197.22],[197.33,198.15,197.21,198.1],[198.26,200.79,198.08,200.25],[200.14,200.21,199.42,199.44],[199.48,203.18,199.28,203.14],[203.19,203.91,203.17 pulse move?","options":{"A":"The move is overextended and about to reverse \u2014 expanding candles mean exhaustion","B":"Increasing buying conviction and healthy impulse with growing momentum \u2014 each day more participants commit","C":"Volume doesn't matter during impulse moves; only price direction matters","D":"Expanding candles indicate a consolidation phase is forming within the uptrend"},"correct":"B","correctFeedback":"Expanding candle bodies with rising volume shows increasing conviction. Each day, more buyers are committing with larger positions. This is the hallmark of a healthy, accelerating impulse \u2014 momentum is growing, not fading. When both size and volume expand together, it confirms genuine directional strength.","incorrectFeedback":"Expanding candles with rising volume actually signal growing strength, not exhaustion. Exhaustion typically shows as large candles on climactic volume followed by reversal. Here, the steady expansion shows progressive conviction building \u2014 a healthy impulse signature.","chart":{"symbol":"GOOGL","interval":"D","candles":[[94,95.05,93.91,94.47],[94.5,96.34,93.71,96.01],[96.1,96.2,95.93,95.95],[95.87,95.91,94.77,94.79],[94.87,94.93,93.31,93.56],[93.62,93.74,92.92,92.95],[92.91,93.24,92.47,93.22],[93.16,95.09,92.96,94.84],[94.85,96.19,94.78,95.08],[95.16,95.29,94.53,94.65],[94.59,94.69,94.57,94.68],[94.68,96.38,91.43,92.05],[92.09,92.44,91.7,92.42],[92.44,100.88,92.07,96.39],[96.34,98.42,95.82,96.03],[96.07,96.19,95.3,95.31],[95.34,95.37,94.94,95.03],[95.0,95.4,92.95,92.97],[92.95,93.53,92.85,93.45],[93.45,93.61,92.37,92.42],[92.36,96.94,89.99,96.92],[96.89,97.06,95.52,95.72],[95.68,95.73,94.78,94.85],[94.86,95.19,93.13,93.98],[94.0,96.46,93.86,95.01],[95.08,95.9,94.89,95.9],[95.84,97.49,95.75,95.97],[96.05,96.06,94.93,95.16],[95.08,95.5,91.13,91.78],[91.74,93.02,90.91,92.93],[92.92,93.6,92.86,93.48],[93.5,93.65,93.46,93.64],[93.58,94.95,93.43,94.95],[94.93,94.98,94.74,94.74],[94.77,94.79,94.54,94.57],[94.55,94. r control.","chart":{"symbol":"AMD","interval":"D","candles":[[505,505.73,504.38,505.64],[505.33,507.61,505.23,506.27],[506.42,507.95,506.33,507.93],[507.5,507.83,504.88,505.23],[505.48,505.53,504.03,504.77],[504.84,505.36,501.96,501.99],[502.19,503.59,501.79,503.53],[503.47,505.49,503.2,505.32],[505.28,506.96,505.2,506.94],[507.11,507.3,503.9,503.99],[504.09,504.43,502.6,502.91],[503.05,504.97,501.04,501.05],[500.98,502.69,500.83,502.59],[502.68,515.45,501.7,509.21],[509.29,509.47,508.88,508.91],[509.32,509.38,505.85,506.31],[506.24,506.71,504.19,504.49],[504.52,504.84,501.02,503.0],[503.02,503.65,502.97,503.55],[503.4,505.53,503.11,504.6],[504.76,506.26,504.75,505.97],[505.47,506.04,501.94,502.56],[502.79,502.79,499.53,500.2],[500.12,500.14,500.04,500.06],[499.99,501.8,499.6,501.41],[501.9,505.91,500.94,505.63],[505.37,509.77,504.43,508.02],[508.06,508.51,506.37,506.48],[506.46,506.64,506.44,506.63],[506.25,507.14,503.91,503.93],[504.16,506.69,501.29,506.54],[506.74,508.18,506.65,507.85],[507.78,508.71,506.94,506.97],[506.72,506.88,504.89,505.2],[505.34,505.56,503.28,503.65],[503.21,503.58,501.67,501.98],[501.91,502.89,501.83,502.79],[502.47,506.35,498.22,505.77],[505.69,506.12,505.66,506.0],[505.52,505.98,503.76,503.97],[503.49,503.59,502.29,502.51],[502.61,502.94,502.42,502.93],[503.24,504.12,503.22,504.02],[504.14,505.03,503.9,504.95],[504.62,505.06,504.51,505.02]],"volume":[800189,951346,969826,870899,791442,625210,775354,761975,780312,1063517,753685,957697,725397,588091,777092,755829,734246,899180,834614,888289,754496,572137,764340,670368,642212,1067639,896067,721535,839340,508486,577886,788730,713930,958445,932792,887437,759976,774155,740178,818756,873910,890805,1032084,790068,765771]}},{"module":"Module 1","topic":"Impulse vs Consolidation","layer":1,"id":"M1-IC-007","status":"NEW","scenario":"A stock falls sharply from $250 to $225 with large bearish candles and heavy volume. Then it slowly grinds upward from $225 to $240 on declining volume, with mixed green and red small candles.","question":"How should you classify the slow grind from $220 to $235?","options":{"A":"A new bullish impulse \u2014 price is rising, so the trend has reversed","B":"A corrective rally, not a new impulse \u2014 the slow pace and declining volume indicate a counter-trend correction while the faster, higher-volume bearish move remains dominant","C":"Consolidation, because any sideways-looking movement is consolidation","D":"An impulse move that is just as strong as the drop, since it recovered more than half the loss"},"correct":"B","correctFeedback":"This is a corrective rally, not a new impulse. Key tells: it's slow (7 days vs 3 days for the drop), volume is declining (fading conviction), and the candles are small and mixed. The faster, higher-volume bearish move is the dominant impulse. Corrections move against the impulse direction with less energy \u2014 exactly what you see here. Don't confuse 'price going up' with 'bullish impulse.'","incorrectFeedback":"Not every price rise is a bullish impulse. Compare the two moves: the drop was fast (3 days), large candles, heavy volume \u2014 that's impulse energy. The rise is slow (7 days), small candles, declining volume \u2014 that's corrective energy. The dominant move is the one with speed, size, and volume behind it.","chart":{"symbol":"NVDA","interval":"D","candles":[[245,246.16,244.85,246.05],[245.9,246.66,244.98,245.12],[245.02,248.12,244.94,248.07],[247.94,247.99,247.5,247.51],[247.61,248.36,246.96,248.28],[248.05,248.15,245.93,245.96],[246.02,247.49,244.08,247.48],[247.61,248.78,247.35,248.78],[248.98,251.29,248.82,250.02],[250.21,250.24,249.6,249.62],[249.75,249.8,249.24,249.49],[249.65,249.72,248.91,248.95],[248.86,248.95,248.86,248.95],[248.84,250.01,248.58,249.8],[249.62,251.61,249.59,251.07],[250.92,250.98,250.54,250.56],[250.56,250.85,247.74,249.04],[249.08,249.3,247.32,247.9],[247.74,248.35,247.58,248.31],[248.28,249.63,246.75,249.39],[249.52,250.05,249.43,250.02],[249.81,250.08 e from $800 to $860. It then begins consolidating near the highs, trading between $845 and $860 with declining volume.","question":"How would you approach trading this consolidation near the highs?","options":{"A":"Sell immediately \u2014 the impulse is over and declining volume means buyers are gone","B":"Set an alert for a breakout above $860 with volume confirmation. Consolidation near highs is a bullish continuation setup. Plan entry above $860, stop below $835-$840, target the impulse distance ($60) projected from the breakout","C":"Buy at $845 with a stop at $800 \u2014 always use the impulse origin as your stop loss","D":"Wait for price to return to $800 before buying \u2014 never buy near highs"},"correct":"B","correctFeedback":"Consolidation near the highs is a bullish signal \u2014 sellers can't push price down despite the big run-up. The setup: alert for breakout above $860 with volume confirmation. Entry above $860, stop below $845 (consolidation low), and target the impulse distance ($60) projected from the breakout point. This keeps risk tight while capturing the next impulse leg.","incorrectFeedback":"When price consolidates near highs after an impulse, it shows buyers are holding their ground \u2014 that's bullish, not bearish. The proper approach is to watch for a breakout above the consolidation range ($860) with volume. Stop goes below the consolidation ($845) for tight risk, and your target uses the impulse distance projected from the breakout.","chart":{"symbol":"NVDA","interval":"D","candles":[[800,807.21,798.78,806.82],[806.62,814.63,805.72,813.22],[813.19,815.47,813.1,815.4],[815.7,815.72,810.22,813.06],[812.5,812.77,810.76,810.85],[811.39,811.81,809.4,809.97],[809.62,816.55,808.8,815.88],[815.57,833.48,794.69,830.91],[831.41,832.81,829.64,829.66],[829.41,829.74,827.72,828.05],[827.79,828.01,826.22,826.25],[825.86,826.45,823.77,824.74],[825.13,830.31,824.47,829.54],[829.73,838.91,828.33,836.85],[836.03,844.72,833.51,844.71],[845.3,845.72,843. g is more sustainable"},"correct":"C","correctFeedback":"Shrinking impulse legs are a classic sign of trend exhaustion. Each successive wave produces less movement, meaning the dominant side (sellers here) is losing steam. The trend is maturing. While it doesn't guarantee an immediate reversal, it's a warning to tighten stops on shorts and start watching for reversal setups. Diminishing impulses + momentum divergence = high-probability exhaustion.","incorrectFeedback":"When each impulse leg gets smaller, it means the driving force is weakening. Think of it like a bouncing ball \u2014 each bounce (impulse) is lower than the last as energy dissipates. Shrinking bearish impulses ($20, $15, $8) show sellers are running out of ammunition. This is a trend maturation signal, not trend health.","chart":{"symbol":"META","interval":"D","candles":[[200,200.07,198.89,199.03],[199.07,199.17,197.7,197.93],[198.05,198.08,197.98,197.99],[198.17,198.19,196.49,197.46],[197.29,198.35,196.29,198.19],[198.19,198.34,196.05,196.07],[195.91,196.17,194.08,194.41],[194.4,194.65,192.05,193.32],[193.39,193.44,191.93,192.11],[192.02,193.88,188.49,188.88],[188.84,188.94,184.72,185.45],[185.55,186.41,185.37,186.11],[186.25,186.34,184.87,184.92],[185.0,185.1,182.92,183.04],[183.12,183.65,179.01,180.03],[179.98,181.21,179.9,180.66],[180.72,182.58,180.29,182.25],[182.38,183.43,182.21,182.9],[182.9,183.13,181.08,181.23],[181.29,181.54,177.15,178.05],[178.06,178.44,175.54,177.04],[176.95,187.21,176.93,181.2],[181.16,183.72,180.73,183.13],[183.13,184.31,182.34,183.94],[183.92,184.1,182.85,183.06],[183.0,183.28,181.79,181.86],[181.81,183.07,178.01,178.02],[177.85,178.05,176.65,176.82],[176.92,177.61,176.92,177.54],[177.37,178.3,172.94,172.95],[172.89,173.1,171.41,171.65],[171.78,171.99,168.82,169.86],[169.92,170.11,168.43,169.11],[169.16,169.32,169.13,169.3],[169.25,169.26,167.06,168.22],[168.38,173.03,168.06,173.01],[173.14,173.7,169.36,169.79],[169.77,170.03,167.41,167.63],[167.51,167.89,166.97,167.11 ative (buy breakout with volume). Stop goes below the flag, and the target is the pole distance from the breakout.","chart":{"symbol":"TSLA","interval":"D","candles":[[175,175.28,174.95,175.25],[175.4,175.83,175.36,175.74],[175.9,176.01,175.83,175.97],[176.01,176.14,175.9,176.12],[176.0,176.1,175.98,176.09],[176.26,178.05,176.14,178.0],[178.07,178.09,177.93,177.95],[177.9,177.97,177.47,177.51],[177.36,177.44,177.05,177.07],[177.1,177.13,176.95,176.98],[176.81,177.03,176.79,177.01],[176.89,177.52,175.82,175.94],[175.79,177.07,174.76,176.99],[176.83,177.94,176.72,177.31],[177.48,178.98,177.36,178.94],[178.78,179.47,178.03,178.14],[178.07,178.08,177.44,177.53],[177.57,177.94,177.48,177.92],[178.08,178.98,177.95,178.91],[178.99,179.2,178.64,178.69],[178.64,179.99,178.53,179.96],[179.97,183.66,179.53,183.05],[183.22,183.23,182.54,182.6],[182.51,184.04,181.03,183.99],[184.02,185.87,183.77,185.65],[185.73,185.74,184.29,184.6],[184.5,188.07,184.47,188.04],[187.89,189.98,187.5,189.63],[189.57,189.66,189.25,189.3],[189.29,191.94,188.99,191.93],[191.92,192.15,190.41,190.69],[190.67,190.89,190.65,190.77],[190.94,191.02,188.98,188.99],[188.95,190.22,188.77,190.12],[190.21,191.81,190.08,191.48],[191.35,193.45,191.05,192.95],[192.76,193.48,188.88,189.25],[189.25,190.06,180.67,184.84],[184.83,187.1,183.99,187.09],[187.19,188.58,185.64,188.4],[188.47,191.61,187.93,191.57],[191.72,191.96,190.94,190.95],[190.85,191.02,187.43,188.16],[188.0,188.4,185.18,185.32],[185.34,185.51,184.8,185.01],[185.19,187.64,184.98,187.49],[187.35,188.06,184.29,184.95],[184.9,189.94,184.8,189.91],[189.79,190.44,184.23,184.47],[184.5,184.58,182.85,183.81],[183.86,184.12,183.8,184.01],[184.16,186.11,183.76,185.84],[185.96,186.03,185.47,185.5],[185.33,187.95,184.8,187.92],[187.84,188.13,184.78,185.48],[185.34,186.19,185.19,186.08],[186.07,186.34,182.94,182.95],[182.9,183.97,182.64,183.8],[183.97,184.7,183.86,184.64],[184.51,186.05,183.38,186.05]],"volume":[1046272,1082027,1137195,1211265,1166256,1169978,74436 ns (3-5 days) show eager buyers who can't wait to buy more. When consolidation suddenly stretches to 15 days, it signals a character change \u2014 the urgency is fading. This is a caution signal, not a reason to add size or panic sell, but rather to respect the shift and adjust your approach.","chart":{"symbol":"AMZN","interval":"D","candles":[[200,202.46,199.79,202.26],[202.2,206.58,202.13,205.9],[206.1,207.68,205.2,207.03],[206.88,214.46,206.49,212.75],[212.84,213.0,210.95,211.71],[211.69,214.02,211.1,214.0],[213.82,218.98,213.48,216.33],[216.42,217.71,216.29,217.47],[217.63,220.89,217.29,219.96],[219.9,220.26,216.85,216.99],[217.12,217.36,215.94,216.16],[216.19,216.24,216.07,216.1],[216.18,216.67,216.18,216.57],[216.63,217.12,216.55,217.07],[217.23,225.03,217.16,221.08],[221.3,226.96,221.1,225.99],[225.83,227.16,225.52,227.02],[227.13,227.9,225.37,226.01],[225.83,230.06,225.33,227.9],[227.7,229.67,227.52,228.98],[229.12,232.21,224.98,231.99],[231.98,235.49,231.81,235.27],[235.3,235.43,234.12,234.32],[234.32,238.12,233.86,238.1],[238.31,238.72,236.69,236.72],[236.86,237.33,234.61,234.7],[234.49,234.6,233.75,233.98],[234.17,237.73,233.39,237.02],[236.96,237.16,236.0,236.16],[236.07,238.9,235.63,238.89],[239.06,239.79,239.04,239.76],[239.89,241.51,239.83,240.67],[240.52,243.16,240.22,243.1],[243.02,249.0,242.06,248.18],[248.31,248.41,247.84,247.85],[247.92,248.12,247.8,248.04],[248.21,249.84,246.36,249.61],[249.59,250.59,248.84,248.9],[248.77,253.17,248.42,253.1],[252.97,253.01,251.12,251.34],[251.18,251.62,247.56,248.05],[248.02,249.05,247.66,249.03],[248.85,253.18,248.48,252.28],[252.22,258.13,246.61,257.12],[257.37,258.98,255.05,255.06],[255.31,255.54,247.2,248.41],[248.55,249.6,244.71,244.95],[244.73,246.9,243.24,246.88],[246.88,250.97,243.83,250.27],[250.04,250.6,250.0,250.36],[250.31,255.01,249.33,253.94],[254.07,254.27,253.62,253.67],[253.52,253.54,253.17,253.18],[253.2,253.44,247.89,247.94],[248.16,248.82,248.14,248.78],[248.69,251.63,248.01,251.15],[251.32,254.04,251.24,252.9],[253.1,253.44,245.06,246.33],[246.45,248.81,236.17,238.43],[238.39,245.98,236.84,245.97],[245.97,248.75,245.41,248.3],[248.4,248.47,246.18,246.63],[246.65,252.0,244.43,251.97],[251.78,252.22,249.88,249.94],[249.96,250.83,249.16,249.24],[249.2,249.31,248.75,248.94],[248.96,250.66,247.53,250.49],[250.62,251.74,250.35,251.71],[251.77,252.27,251.06,251.09]]}},{"module":"Module 1","topic":"Impulse vs Consolidation","layer":3,"id":"M1-IC-012","status":"NEW","scenario":"A stock completed a bullish impulse from $540 to $560 and is currently consolidating between $553 and $560.","question":"A student says: 'I missed the impulse move from $540 to $560, so I shouldn't buy now.' How would you evaluate this student's reasoning?","options":{"A":"The student is correct \u2014 once you miss an impulse, the opportunity is gone and chasing leads to losses","B":"The student should buy at the current price immediately regardless of the consolidation pattern","C":"The consolidation IS the entry opportunity. Impulse-consolidation-impulse is the market's rhythm. Enter near consolidation support (~$553-$554) or on a breakout above $560 with a stop below the consolidation range","D":"The student should wait for price to return to $540 before buying, as that was the impulse origin"},"correct":"C","correctFeedback":"This is one of the most important concepts: you don't trade the impulse \u2014 you trade the consolidation that follows it. Impulse-consolidation-impulse is the market's natural rhythm. The consolidation at $556-$560 IS your entry zone. Buy near support (~$556) for better risk/reward, or buy a breakout above $560 for confirmation. Missing the impulse doesn't mean missing the trade \u2014 the consolidation hands you the opportunity on a silver platter.","incorrectFeedback":"The student has a common misconception. You rarely catch impulse moves from the start \u2014 and you don't need to. The market's rhythm is impulse \u2192 consolidation \u2192 impulse. The consolidation phase IS your entry opportunity. Waiting for consolidation gives you a defined risk level (consolidation support) and positions you for the next impulse leg.","chart":{"symbol":"AAPL","interval":"D","candles":[[540,542.06,539.49,541.84],[541.66,541.79,540.58,540.81],[541.0,547.09,540.47,547.07],[546.85,547.07,545.67,545.87],[545.35,545.39,544.62,544.76],[544.31,545.09,544.14,545.07],[544.6,549.0,543.39,548.93],[548.77,549.67,548.55,549.52],[549.92,553.11,549.84,553.09],[552.86,553.0,551.93,552.02],[551.8,551.89,550.67,551.28],[550.83,550.93,550.77,550.93],[551.41,552.46,550.24,552.42],[552.89,557.5,546.59,557.2],[557.45,561.2,557.23,559.94],[560.26,560.5,558.45,558.57],[558.53,559.43,557.1,557.26],[557.74,559.52,555.18,555.99],[556.3,561.28,556.16,559.17],[559.01,562.33,558.29,561.64],[561.43,562.16,561.08,561.99],[562.54,562.79,555.54,558.33],[557.96,558.05,557.51,557.52],[557.12,557.58,553.26,554.06],[553.77,556.03,553.31,555.79],[555.83,556.36,555.82,556.27],[555.87,560.05,555.34,560.05],[559.85,560.02,556.65,557.11],[556.62,557.32,553.31,554.05],[554.23,555.06,553.68,555.03],[554.57,561.99,554.52,558.66],[558.62,559.81,558.35,559.59],[559.14,562.18,558.75,561.04],[561.37,561.71,553.27,557.86],[558.31,558.41,557.82,557.92],[557.84,558.01,552.96,552.97],[553.23,555.39,553.19,555.27],[555.06,556.38,554.77,556.14],[556.15,559.18,555.88,559.0],[558.99,559.24,557.95,558.05],[557.78,558.18,553.94,554.31],[554.56,556.11,553.15,556.09]]}},{"module":"Module 1","topic":"Impulse vs Consolidation","layer":3,"id":"M1-IC-013","status":"NEW","scenario":"A stock had a bearish impulse on enormous volume. Now it's consolidating in a tight range, but volume has dropped to almost nothing \u2014 well below average.","question":"A student says: 'The low volume worries me. Nobody's interested in this stock anymore.' How would you correct this student's interpretation of the low consolidation volume?","options":{"A":"The student is right \u2014 extremely low volume means the stock is dead and you should avoid it","B":"Low consolidation volume after a high-volume impulse is actually an ideal setup. The absence of counter-trend buying pressure creates a 'volume void' that often precedes the next impulse in the same direction (bearish continuation)","C":"Volume is irrelevant during consolidation \u2014 only price pattern matters","D":"Low volume always means the consolidation will break in the opposite direction of the impulse"},"correct":"B","correctFeedback":"The student has it backwards. After a high-volume bearish impulse, low consolidation volume is actually bullish for the bearish thesis. It means: no significant buying is stepping in to oppose the move. This 'volume void' signals that the path of least resistance remains in the impulse direction. Heavy impulse volume + quiet consolidation = continuation setup. The silence during consolidation is a feature, not a bug.","incorrectFeedback":"Low volume during consolidation doesn't mean 'nobody's interested.' After a high-volume impulse, you want to see quiet consolidation \u2014 it means no opposing force is stepping in. If buyers were genuinely interested in reversing the move, you'd see volume increase during the consolidation. The absence of counter-trend volume is a continuation signal.","chart":{"symbol":"MSFT","interval":"D","candles":[[300,300.45,298.22,298.44],[298.61,298.74,288.06,293.93],[293.66,294.45,287.99,288.03],[287.98,288.22,287.75,288.18],[288.32,288.37,287.85,287.87],[287.99,289.94,287.46,289.91],[290.0,291.28,283.66,284.3],[284.53,289.1,284.35,286.43],[286.19,286.85,274.87,274.9],[275.08,275.94,274.85,275.87],[275.76,277.39,275.61,276.49],[276.43,277.92,276.23,277.9],[278.1,278.59,275.51,276.08],[276.34,276.36,274.52,274.54],[274.47,274.99,267.52,269.99],[269.75,271.47,269.6,271.21],[271.47,271.49,271.18,271.23],[271.16,273.95,270.86,273.92],[273.97,274.05,272.13,272.31],[272.07,272.08,271.22,271.27],[271.29,271.49,266.95,266.99],[266.93,269.74,266.79,268.59],[268. Failed continuations often produce sharp moves because trapped traders from the original impulse are forced to exit, adding fuel to the reversal.","incorrectFeedback":"When a consolidation breaks against the impulse direction, it's not random \u2014 it's a significant character change. The market expected continuation, and instead the opposing side took control. This is one of the strongest reversal signals because trapped traders from the original impulse will be forced to exit, accelerating the new direction. Exit longs and monitor key support levels.","chart":{"symbol":"AMD","interval":"D","candles":[[200,204.77,199.38,204.54],[204.74,212.78,194.25,211.88],[211.89,214.52,209.89,209.92],[209.72,210.04,208.64,208.64],[208.53,208.65,205.69,206.96],[206.88,207.96,206.49,207.96],[207.81,213.51,205.02,213.13],[212.98,219.61,211.91,218.85],[218.87,220.34,218.45,219.99],[220.13,220.33,218.64,219.3],[219.28,219.7,217.63,217.85],[217.9,218.12,217.82,218.07],[217.95,229.6,215.35,228.15],[228.17,233.65,228.14,232.45],[232.47,234.0,230.08,230.08],[230.22,230.4,228.99,229.25],[229.31,230.6,229.06,230.38],[230.55,230.73,225.56,226.07],[226.21,228.87,225.72,228.73],[228.56,230.1,228.44,230.04],[229.83,232.64,229.09,232.01],[231.92,233.02,226.64,227.18],[227.04,228.41,226.7,228.38],[228.37,228.47,223.93,223.99],[224.14,228.03,223.66,227.66],[227.5,227.75,225.44,225.83],[225.89,232.46,225.09,230.04],[230.06,230.44,228.57,228.74],[228.67,228.82,227.5,227.71],[227.91,228.58,224.88,224.92],[225.12,231.01,224.96,230.11],[230.02,233.27,229.41,232.61],[232.56,234.1,230.84,231.01],[231.03,231.05,230.78,230.83],[230.83,231.57,230.66,231.5],[231.43,231.53,226.03,226.04],[226.23,226.64,224.24,224.54],[224.49,224.61,224.43,224.59],[224.55,226.8,221.88,221.91],[221.86,226.26,221.31,224.08],[224.1,224.25,224.06,224.24],[224.24,224.29,223.99,224.1],[224.09,224.52,221.23,221.71],[221.8,222.83,221.7,222.76],[222.86,225.67,218.0,219.09],[218.97,219.01,218.72,218.72],[218.69,218.79,218.07,218.18],[ function buildSB(){

  h+="<div class=\"lf-bar\"><span class=\"lf-label\">Layers:</span>";
  for(var lv=1;lv<=3;lv++){

    h+="<button class=\"lf-btn"+(active?" lf-on":"")+"\" onclick=\"togLayer("+lv+")\">L"+lv+"</button>";
  }
  h+="</div>";
  var mods=Object.keys(MODULES).sort();
  for(var mi=0;mi<mods.length;mi++){
    var m=mods[mi],ts=Object.keys(MODULES[m]).sort(),cnt=flatMod(m).length;
    h+="<div class=\"sbs\"><div class=\"mh\" onclick=\"togMod(this)\"><span class=\"mhn\">"+esc(m)+(MN[m]?" - "+esc(MN[m]):"")+"</span><span class=\"mha\">&#9654;</span></div>";
    h+="<div class=\"tl\">";
    h+="<div class=\"ti\" onclick=\"startFromSB('"+esc(m)+"',null)\">All Topics <span class=\"cn\">"+cnt+"</span></div>";

      h+="<div class=\"ti\" onclick=\"startFromSB('"+esc(m)+"','"+esc(t).replace(/'/g,"&#39;")+"')\">"+esc(t)+" <span class=\"cn\">"+tc+"</span></div>";

    h+="</div></div>";
  }

}

function togMod(el){var a=el.querySelector(".mha");var tl=el.nextElementSibling;a.classList.toggle("op");tl.classList.toggle("op")}
function togLayer(lv){
  if(!layerFilter){
    // Currently showing all — switch to just this layer
    layerFilter=[lv];
  } else if(layerFilter.indexOf(lv)!==-1){
    // Layer is on — turn it off
    layerFilter=layerFilter.filter(function(x){return x!==lv});
    if(layerFilter.length===0) layerFilter=null; // all off = show all
  } else {
    // Layer is off — turn it on
    layerFilter.push(lv);
    layerFilter.sort();
    if(layerFilter.length===3) layerFilter=null; // all 3 on = show all
  }
  saveLayerFilter();
  buildSB();
  if(view==="home") renderHome();
  else if(view==="setup" && meta.module) pickMod(meta.module);
}
